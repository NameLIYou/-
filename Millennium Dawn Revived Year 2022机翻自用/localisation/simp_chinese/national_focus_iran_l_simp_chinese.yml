l_simp_chinese:
 PER_Reinforce_The_Regime:0 "Reinforce the Regime"
 PER_Reinforce_The_Regime_desc:0 "Since the 1979 Islamic Revolution, our Republic has weathered war, sanctions, and internal unrest. Yet the enemies of the faith still whisper of change. To ensure survival, the Islamic Republic must fortify its foundations, silence dissent, and remind the people that the legacy of Imam Khomeini endures through unwavering loyalty to the Supreme Leader."
 PER_Strenghten_The_Reformist_Faction:0 "Strengthen the Reformist Faction"
 PER_Strenghten_The_Reformist_Faction_desc:0 "The reformists seek to ease tensions, expand freedoms, and modernize the Republic from within. By granting them greater influence in the Majles and government, we can begin to challenge the dominance of the hardliners."
 PER_Expand_Morality_Police:0 "Expand the Guidance Patrol"
 PER_Expand_Morality_Police_desc:0 "The revolution demands strict adherence to Islamic principles. The Guidance Patrol will be strengthened to enforce the law and counter subversive influence. Schools and public spaces will be closely monitored, shaping the youth. This ensures loyalty and hardliner control over society."
 PER_Strenghten_The_Clergy:0 "Strengthen the Clergy"
 PER_Strenghten_The_Clergy_desc:0 "The clerical establishment must guide the nation and defend the revolution. By expanding their influence in government and education, hardliners secure ideological dominance. Seminaries will be reinforced and religious authority embedded in every province. This ensures loyalty to the regime and the continuation of revolutionary values."
 PER_Suppress_Reformist_Factions:0 "Suppress Reformist Factions"
 PER_Suppress_Reformist_Factions_desc:0 "Reformist politicians seek to weaken the revolution from within. By purging their influence from government and institutions, hardliners consolidate power. Their networks in parliament and local councils will be dismantled. This ensures the regime’s dominance and prevents internal challenges."
 PER_Funds_For_The_IRGC:0 "Increase Funding for the IRGC"
 PER_Funds_For_The_IRGC_desc:0 "The Revolutionary Guard is the backbone of the Republic. By increasing their funding, we strengthen their ability to enforce the law and defend the regime. Expanded resources will improve training, equipment, and loyalty programs. This ensures the IRGC remains a powerful pillar of hardliner control."
 PER_Crackdown_On_Riots:0 "Crackdown on Riots"
 PER_Crackdown_On_Riots_desc:0 "The nationwide protests following Mahsa Amini’s death challenge the Republic’s authority. Hardliners must respond swiftly to restore order and deter further unrest. Security forces will be deployed to suppress demonstrations and control key cities. This demonstrates the regime’s strength and reinforces loyalty among supporters."
 PER_Reform_Bureaucracy:0 "Reform the Bureaucracy"
 PER_Reform_Bureaucracy_desc:0 "Corruption and inefficiency weaken the state and empower hardliners. By modernizing ministries and promoting technocrats, reformists can regain influence in government. Administrative processes will be streamlined and merit-based appointments encouraged. This strengthens reformist control and improves the effectiveness of the Republic."
 PER_Acknowledge_Protesters_Demands:0 "Acknowledge Protesters’ Demands"
 PER_Acknowledge_Protesters_Demands_desc:0 "The Mahsa Amini protests reflect widespread public discontent. By addressing their concerns, reformists can show empathy and gain popular support. Measures to ease restrictions and improve civil rights will be considered. This strengthens reformist influence while signaling a willingness to modernize the Republic."
 PER_Loosen_Hijab_Restrictions:0 "Loosen Hijab Restrictions"
 PER_Loosen_Hijab_Restrictions_desc:0 "The strict enforcement of hijab laws has fueled unrest across the nation. By easing these restrictions, reformists can appeal to public sentiment and empower civil society. Women will gain more freedom in education and public life. This strengthens reformist support and challenges hardliner authority."
 PER_Challenge_Conservative_Clerics:0 "Challenge Conservative Clerics"
 PER_Challenge_Conservative_Clerics_desc:0 "Hardline clerics dominate politics and suppress reformist initiatives. By challenging their influence, reformists can reclaim authority in government and society. Religious oversight will be limited and moderate voices promoted. This strengthens reformist control and undermines hardliner power."
 PER_Sieze_The_Moment:0 "Seize the Moment"
 PER_Sieze_The_Moment_desc:0 "Reformists have never held so much power. Now is the time to act decisively and overthrow the hardliners. By launching a bold coup, they aim to seize control of the Republic. The nation stands on the brink of revolution, and the outcome is uncertain."
 PER_Slow_And_Stedy:0 "Slow And Stedy"
 PER_Slow_And_Stedy_desc:0 "Reformists seek to modernize the foundations of the state while preserving its core identity. By revising laws and institutions, they aim to reduce clerical dominance and empower elected officials. Civil liberties, transparency, and accountability will be strengthened. These changes consolidate reformist influence and guide the Republic toward moderation."
 PER_Power_To_The_Legislature:0 "Power to the Legislature"
 PER_Power_To_The_Legislature_desc:0 "Reformists aim to shift authority from the clergy and hardliners to elected representatives. By strengthening the legislature, they ensure laws reflect the will of the people. Parliamentary oversight and checks on executive power will be reinforced. This consolidates reformist influence and promotes a more balanced government."
 PER_Undermine_The_Supreme_Leader:0 "Undermine the Supreme Leader"
 PER_Undermine_The_Supreme_Leader_desc:0 "We will weaken the Supreme Leader’s grip on power. Through legal reforms, key appointments, and public influence."
 PER_Promise_Minority_Autonomy:0 "Promise Minority Autonomy"
 PER_Promise_Minority_Autonomy_desc:0 "We will grant greater autonomy to Iran’s ethnic and religious minorities. By recognizing their rights and local governance, we aim to build trust and reduce unrest. Cultural and political freedoms will be expanded under our reformist rule. This strengthens our support base and fosters a more inclusive Republic."
 PER_Sway_Commanders:0 "Sway the Commanders"
 PER_Sway_Commanders_desc:0 "We must win the loyalty of key military commanders to secure our reforms. By building trust and offering positions of influence, we reduce the risk of hardliner pushback. The armed forces will gradually align with our vision. This strengthens our control and ensures the success of our reformist agenda."
 PER_Discredit_The_Revolution:0 "Discredit the Revolution"
 PER_Discredit_The_Revolution_desc:0 "We will undermine the old revolutionary narratives that empower hardliners. By exposing corruption and failures, we weaken their legitimacy. Propaganda and public messaging will highlight our vision for a modern, accountable Republic. This shifts public support toward our reformist leadership."
 PER_Strike_At_The_Old_Man:0 "Strike at the Old Man"
 PER_Strike_At_The_Old_Man_desc:0 "We will strike at Ali Khamenei now that we have secured the loyalty of key generals, the support of minorities, and the backing of the populace."
 PER_Iranian_Transitional_Government:0 "Iranian Transitional Government"
 PER_Iranian_Transitional_Government_desc:0 "With the Islamic Republic dismantled, a rare opportunity opens before us. We will form a transitional government to steer Iran through this historic moment. Technocrats, reformists, and trusted civilian leaders will take the reins, restoring order and reshaping institutions. Every decision now will define the nation’s future, and the world watches as we rebuild a new Republic from the ashes of the old."
 PER_Use_Our_Leverage:0 "Use Our Leverage"
 PER_Use_Our_Leverage_desc:0 "With a reformist president in power, we hold unprecedented influence over the state. Now is the time to wield that leverage to weaken hardliner control and push bold reforms. Key appointments, policy initiatives, and strategic maneuvers will shift power decisively in our favor. Every move we make strengthens our faction and reshapes the Republic’s future."
 PER_Iran_Under_Sanctions:0 "Iran Under Sanctions"
 PER_Iran_Under_Sanctions_desc:0 "Decades of international sanctions have tested Iran’s resilience. Trade restrictions and isolation have strained industries and challenged daily life. The nation must adapt, innovate, and find ways to survive. Every decision now carries weight for our sovereignty and future prosperity."
 PER_Iran_Post_Nuclear_Treaty:0 "Post-Nuclear Treaty Economy"
 PER_Iran_Post_Nuclear_Treaty_desc:0 "International negotiations have reshaped our global standing. Years of isolation left our infrastructure fragile and industries weak. New opportunities emerge as trade slowly reopens, yet challenges remain. Iran must decide how to invest limited resources to rebuild, modernize, and secure strategic independence."
 PER_Restart_The_Nuclear_Program:0 "Restart the Nuclear Program"
 PER_Restart_The_Nuclear_Program_desc:0 "The JCPOA restricted Iran’s nuclear ambitions and dismantled key infrastructure. Many view it as a compromise that cost sovereignty for little gain. By restarting the program, Iran reclaims its right to self-reliance and strategic deterrence. The world will watch, but we move forward on our own terms."
 PER_The_Isfahan_Facility:0 "The Isfahan Facility"
 PER_The_Isfahan_Facility_desc:0 "The uranium conversion facility in Isfahan is vital to Iran’s nuclear program. Once monitored and partially inactive under international agreements, it now hums with renewed activity. Engineers refine uranium and restore essential machinery. Revitalizing Isfahan strengthens our technical capabilities and signals that Iran cannot be restrained by foreign powers."
 PER_Cooperate_With_North_Korea:0 "Cooperate With North Korea"
 PER_Cooperate_With_North_Korea_desc:0 "Iran and North Korea share a history of resisting foreign domination. Deepening cooperation allows us to exchange knowledge in missiles, military tech, and nuclear research. Sanctions cannot isolate our nations. This alliance strengthens our defenses and ensures neither stands alone against global pressure."
 PER_Test_A_Bomb:0 "Test a Bomb"
 PER_Test_A_Bomb_desc:0 "After years of secret development, Iran is on the brink of a defining moment. A nuclear test will prove our technological might and secure our place among the world’s powers. The act will draw global attention, but for Iran, it marks the dawn of a new era of deterrence and national strength."
 PER_Negotiate_With_The_West:0 "Negotiate With the West"
 PER_Negotiate_With_The_West_desc:0 "Diplomacy offers Iran a chance to lift sanctions and reopen trade. Careful negotiations could restore international trust and strengthen the economy. While some see compromise, pragmatism may bring prosperity and stability. Choosing dialogue can shape Iran’s future more than any weapon."
 PER_Iranian_Manifacturing_Sector:0 "Iranian Manufacturing Sector"
 PER_Iranian_Manifacturing_Sector_desc:0 "Iran’s industries have endured sanctions and inefficiency but remain resilient. From steel to automobiles, domestic production persists. Supporting manufacturers builds self-sufficiency, creates jobs, and reduces dependence on imports. A strong industrial base ensures Iran stands proudly on its own."
 PER_Iranian_Military_Industrial_Complex:0 "Iranian Military Industrial Complex"
 PER_Iranian_Military_Industrial_Complex_desc:0 "Isolation forced Iran to build a self-reliant military industry. Producing arms from rifles to missiles is now a point of national pride. Expanding this sector equips our forces with domestic technology and reduces reliance on foreign suppliers. Strategic autonomy ensures no external power dictates our defense policy."
 PER_Open_New_Factories:0 "Open New Factories"
 PER_Open_New_Factories_desc:0 "Investing in new factories revitalizes the economy and creates jobs. Producing consumer and industrial goods strengthens regional development and self-sufficiency. Each facility expands Iran’s industrial base, supporting long-term resilience and prosperity. Domestic production ensures the nation can withstand global pressures."
 PER_Weapons_Production:0 "Weapons Production"
 PER_Weapons_Production_desc:0 "Domestic weapons production secures supply lines and strengthens defense. Factories for arms, artillery, and missile components boost industry and create skilled jobs. A robust military industry fosters strategic autonomy and potential technological spillovers. Iran can defend its interests independently."
 PER_Train_Production:0 "Train Production"
 PER_Train_Production_desc:0 "Modern rail infrastructure improves transport of goods and people across Iran. Upgraded train production boosts industry, creates jobs, and supports regional economies. Efficient networks strengthen both the economy and national mobilization. Rapid, reliable transport ensures self-sufficiency and resilience."
 PER_The_Beating_Heart_Of_Iran:0 "The Beating Heart of Iran"
 PER_The_Beating_Heart_Of_Iran_desc:0 "Tehran is the political, economic, and cultural center of Iran. Investment here ripples across the nation, boosting governance and industry. Strengthening the capital ensures national stability and efficient administration. A strong Tehran anchors Iran’s future."
 PER_Oil_Production:0 "Oil Production"
 PER_Oil_Production_desc:0 "Iran’s oil industry is a vital economic pillar. Expanding output and modernizing infrastructure increases revenue and energy security. Oil fuels domestic industries and strengthens Iran’s international leverage. Maintaining this sector is essential for economic stability and growth."
 PER_Modernize_The_Countryside:0 "Modernize the Countryside"
 PER_Modernize_The_Countryside_desc:0 "Rural Iran has long been underserved. Investing in roads, irrigation, electricity, and schools boosts agriculture and living standards. Modernization reduces urban migration and strengthens regional economies. A developed countryside forms the backbone of a resilient nation."
 PER_Diversify_Production:0 "Diversify Production"
 PER_Diversify_Production_desc:0 "Overreliance on oil leaves Iran vulnerable to global shocks. Expanding manufacturing, mining, and agriculture builds a balanced economy. Diversification creates jobs, strengthens self-sufficiency, and ensures long term stability. A varied industrial base is key to national resilience."
 PER_Surcomvent_The_Sanction:0 "Circumvent the Sanctions"
 PER_Surcomvent_The_Sanction_desc:0 "Sanctions have forced Iran to innovate. Alternative supply chains, clandestine trade, and domestic substitutes keep the economy running. These measures protect jobs and critical industries. Mastering self-reliance under pressure is essential for national independence."
 PER_Wepons_Production:0 "Weapons Production"
 PER_Wepons_Production_desc:0 "Domestic weapons production secures supply lines and builds skilled jobs. Factories for arms and missiles increase strategic autonomy. A strong defense industry also offers civilian technological benefits. Iran can defend itself without foreign reliance."
 PER_Khoda_Afarin_hydroelectric_complex:0 "Khoda Afarin Hydroelectric Complex"
 PER_Khoda_Afarin_hydroelectric_complex_desc:0 "The Khoda Afarin dam harnesses the power of the Aras River to provide electricity and support industry. Investing in hydroelectric infrastructure boosts energy independence and strengthens regional development. Modernizing our power supply ensures that Iran’s economy can grow sustainably while reducing reliance on fossil fuels. This project represents a step toward a self-sufficient and resilient nation."
 PER_Democracy:0 "Iranian §cDemocracy§!"
 PER_Democracy_desc:0 "After decades of authoritarian rule, the people of Iran have demanded change. The streets echo with calls for freedom, reform, and representation. A new democratic Iran is emerging — one that seeks to balance faith with liberty, tradition with progress, and independence with cooperation. For the first time in generations, Iranians can begin to shape their nation’s destiny through the will of the people."
 PER_Communism:0 "§eCommunist§! Takover"
 PER_Communism_desc:0 "The workers and revolutionaries have risen, toppling the old order and seizing power in the name of the proletariat. Guided by socialist ideals, the new regime promises to build a society free from exploitation and inequality. Industries will be nationalized, land redistributed, and class divisions erased all under the banner of a new Iran, united by the struggle for social justice."
 PER_Monarchism:0 "§mPahlavi§! Restoration"
 PER_Monarchism_desc:0 "The royal standard of the Pahlavi dynasty once again flies over Tehran. Many see in the monarchy a symbol of stability, order, and national pride a return to Iran’s pre-revolutionary grandeur. The Shah’s restoration marks not just the revival of a royal family, but a renewed vision of Iran as a proud, modern, and sovereign nation standing tall on the world stage."
 PER_Iran_United:0 "A United Iran"
 PER_Iran_United_desc:0 "While calls for regional autonomy and minority rights have grown louder, our government has chosen a different path one of unity and shared national identity. By strengthening the central government and emphasizing equality under one flag, we aim to ensure that Iran remains whole, strong, and indivisible in the face of internal and external pressures."
 PER_Bring_Back_The_Rebellious_Provinces:0 "Bring Back the Rebellious Provinces"
 PER_Bring_Back_The_Rebellious_Provinces_desc:0 "Reform was meant to strengthen Iran, not tear it apart. Yet in our moment of transformation, separatists and traitors seized the opportunity to break away, carving Kurdish, Azeri, and Baluch lands from the nation. These provinces were not lost by right, but by betrayal. The era of weakness is over. Iran will demand the return of its rebellious provinces"
 PER_A_Royal_Adress:0 "Royal Address to the Nation"
 PER_A_Royal_Adress_desc:0 "For the first time in decades, the Iranian people hear the voice of the Shah’s heir not through rumor or memory, but directly. Reza Pahlavi speaks of unity, dignity, and a Iran freed from fear and isolation, calling on the nation to decide its future together."
 PER_American_Investment:0 "American Investment Returns to Iran"
 PER_American_Investment_desc:0 "With the Shah restored, channels long frozen begin to reopen. American capital, technology, and influence cautiously return, promising economic revival while tying Iran once more to the Western order."
 PER_The_Shahs_University:0 "The Shah’s University"
 PER_The_Shahs_University_desc:0 "Reviving the Pahlavi vision of a modern Iran, a new national university is founded to educate loyal administrators, engineers, and officers. It will serve as both a symbol of renewal and a pillar of the restored monarchy’s future."
 PER_METO:0 "The Middle East Treaty Organization"
 PER_METO_desc:0 "Once a pillar of Western-aligned security in the region, Iran now seeks to reclaim that role. Rejoining the Middle East Treaty Organization marks a clear geopolitical realignment, anchoring the restored monarchy within a renewed framework of collective defense and regional influence."
 PER_Expanding_The_Alliance:0 "Expanding the Alliance"
 PER_Expanding_The_Alliance_desc:0 "The restored Shah reaches out to neighboring Turkey and Afghanistan, forging closer ties and strategic partnerships. By uniting regional powers, Iran aims to secure its borders, bolster trade, and assert its influence across the Middle East and Central Asia."
 PER_A_Middle_Eastern_Army:0 "A Middle Eastern Army"
 PER_A_Middle_Eastern_Army_desc:0 "Under the Shah’s leadership, Iran begins forming a regional army to unite allies and project strength. Its presence inspires confidence across the alliance, strengthening bonds and ensuring the security of member nations."
 PER_Our_Past_Glory:0 "Our Past Glory"
 PER_Our_Past_Glory_desc:0 "The Shah rejects timid diplomacy and looks to Iran’s former might. Imperial pride and military strength must be restored, and those who doubted the Lion and Sun will feel the force of a nation reclaiming its rightful place in the Middle East."
 PER_Iranic_Identity:0 "Reviving the Iranic Identity"
 PER_Iranic_Identity_desc:0 "Iran looks to its roots, reclaiming the heritage that once made it great. Ancient traditions, Persian culture, and the pride of the nation’s lineage are revived to forge unity and restore Iran’s rightful place among the world’s powers."
 PER_Now_We_Strike:0 "Now We Strike in Iraq"
 PER_Now_We_Strike_desc:0 "Iran moves decisively against Iraq, reclaiming influence and punishing those who once challenged its authority. The nation acts swiftly, showing that its strength and resolve are unmatched in the region."
 PER_Bahrain_And_Qatar:0 "Reclaiming Bahrain and Qatar"
 PER_Bahrain_And_Qatar_desc:0 "Centuries old ties remind Iran of its historical reach. By asserting claims over Bahrain and Qatar, the nation restores influence long held under the Qajar dynasty, reinforcing its presence in the Gulf and the region’s respect for Iranian power."
 PER_Strike_Pakistan:0 "Strike Against Pakistan"
 PER_Strike_Pakistan_desc:0 "Iran moves to punish a neighbor that challenges its authority and regional ambitions. Swift and decisive action will demonstrate the nation’s strength, restore pride, and secure its eastern borders against defiance."
 PER_Afganistan_Belongs_To_Iran:0 "Afghanistan Belongs to Iran"
 PER_Afganistan_Belongs_To_Iran_desc:0 "The Pashtun people are part of the greater Iranic heritage, and Afghanistan’s lands are intertwined with Iran’s destiny. By reclaiming influence, the nation restores historical ties and secures its eastern frontier under a shared cultural banner."
 PER_Iranic_Empire:0 "Proclaim the Iranic Empire"
 PER_Iranic_Empire_desc:0 "The time has come to restore Iran to its rightful grandeur. The Iranic Empire rises once more, uniting the nation and its historical territories under a single banner of strength, pride, and unstoppable ambition."
 PER_Strike_At_Saudi_Arabia:0 "Strike at Saudi Arabia"
 PER_Strike_At_Saudi_Arabia_desc:0 "Iran moves against the Wahhabi order that dominates the Arabian Peninsula. By seizing the holy cities from what is seen as extremist rule, the nation claims to restore their place within the broader Islamic world and reshape the balance of power in the region."
 PER_Re_establish_the_Imperial_Army:0 "Re-establish the Imperial Army"
 PER_Re_establish_the_Imperial_Army_desc:0 "Iran rebuilds its armed forces on discipline, professionalism, and national pride. Drawing inspiration from the pre-revolutionary military tradition, the Imperial Army is restored to serve not ideology, but the strength, unity, and destiny of the Iranian nation."
 PER_Learn_From_The_Old_Generals:0 "Learn from the Old Generals"
 PER_Learn_From_The_Old_Generals_desc:0 "Veterans of past campaigns share their knowledge, tactics, and strategies. By studying the successes and mistakes of Iran’s former military leaders, the nation strengthens its army and prepares for the challenges of a turbulent region."
 PER_An_Army_Adapted_To_Desert_Warfare:0 "An Army Adapted to Desert Warfare"
 PER_An_Army_Adapted_To_Desert_Warfare_desc:0 "Iran trains its forces for the harsh realities of desert combat. Mobility, endurance, and local knowledge become the pillars of a military capable of dominating arid battlefields and projecting power across the region."
 PER_Axis_Of_Resistance:0 "Unite the Axis of Resistance"
 PER_Axis_Of_Resistance_desc:0 "Tehran must solidify its leadership of the Axis of Resistance a loose network of allied militias and movements committed to countering Western influence and Israel in the Middle East. By coordinating with Hezbollah, the Houthis, and other allied forces, Iran can extend its strategic depth and project power across multiple fronts without direct conventional confrontation."
 PER_Join_The_Houthi_Stouggle:0 "Support the Yemeni Struggle"
 PER_Join_The_Houthi_Stouggle_desc:0 "Yemen’s Houthis have evolved into a capable and influential force in the region. Increasing their operational capacity will enhance Iran’s strategic reach, disrupt hostile supply routes, and tie down Saudi and Western attention far from our core borders."
 PER_Fund_Hezbollah:0 "Fund Hezbollah"
 PER_Fund_Hezbollah_desc:0 "Hezbollah remains one of our most effective and ideologically aligned partners, especially in confronting Israeli influence. By dedicating further financial support and material assistance, we can ensure its resilience, sharpen its readiness, and reinforce its role as a key pillar of Iran’s regional strategy."
 PER_Iranian_Nuclear_Program:0 "Revoke The Fatwa Against A Nuclear Bomb"
 PER_Iranian_Nuclear_Program_desc:0 " "