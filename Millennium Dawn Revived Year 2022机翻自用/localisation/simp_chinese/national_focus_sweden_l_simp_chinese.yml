l_simp_chinese:
 SWE_The_Defense_of_Democracy:0 "§3The Defense of Democracy§!"
 SWE_The_Defense_of_Democracy_desc:0 "Amid growing tensions and political fragmentation across the world, Sweden reaffirms its commitment to democratic governance. With broad coalitions and a history of peaceful transitions of power, the Swedish model stands not as relic of the past, but as a beacon for the future. Ensuring trust in institutions, transparency, and social dialogue remains essential in facing the storms ahead."
 SWE_A_Stranger_in_Our_Own_Land:0 "§GA Stranger in Our Own Land§!"
 SWE_A_Stranger_in_Our_Own_Land_desc:0 "Demographic changes and cultural shifts have stirred unease across the population. What once was hailed as openness now fuels accusations of identity loss. From the margins of politics rises a movement that promises to restore what many believe has been taken."
 SWE_democracy_faulter:0 "The Faltering Democracy"
 SWE_democracy_faulter_desc:0 "Sweden’s democracy, once a shining beacon of stability and consensus, now finds itself at a crossroads. Public trust in the political system is eroding, and a growing divide has emerged between the traditional establishment and new political forces. The rise of populism, economic inequality, and an increasingly polarized society threaten to unravel the social cohesion that has defined Sweden for decades."
 SWE_divided_society:0 "A Divided Society"
 SWE_divided_society_desc:0 "The fractures within Swedish society have become increasingly apparent. The urban rural divide grows wider, with city dwellers feeling disconnected from the struggles of those in rural areas. Immigration and integration debates have become a battleground for opposing ideologies, and political polarization is deepening. As the divide widens, the ability to maintain social harmony seems more distant than ever."
 SWE_2022_Riksdagsval:0 "2022 Riksdagval"
 SWE_2022_Riksdagsval_desc:0 "The 2022 Riksdag election will determine the direction Sweden takes in the coming years. The long standing establishment parties, the Swedish Social Democratic Party and the Moderate Party, face increasing pressure from the rising force of the Sweden Democrats."
 SWE_Social_Democratic_Victory:0 "A Social Democratic Victory"
 SWE_Social_Democratic_Victory_desc:0 "With the victory of the Swedish Social Democratic Party, Sweden remains anchored in its welfare traditions. The government will focus on social cohesion, strong public services, and safeguarding the legacy of the people’s home, even as political polarization increases."
 SWE_Moderate_Party_Victory:0 "A Moderate Party Victory"
 SWE_Moderate_Party_Victory_desc:0 "The Moderates have secured a mandate to reform the Swedish economy. With a focus on tax reductions, deregulation, and private initiative, this government will strive to modernize Sweden while balancing the demands of coalition politics and growing populist pressure."
 SWE_Sweden_Democrats_Victory:0 "A Sweden Democrats Victory"
 SWE_Sweden_Democrats_Victory_desc:0 "The Sweden Democrats have emerged victorious, shaking the foundations of the old political consensus. With immigration and national identity at the forefront, the party aims to reshape Swedish society and assert a new vision rooted in tradition, sovereignty, and cultural cohesion."
 SWE_Seeds_Of_Revolution:0 "§RSeeds of Revolution§!"
 SWE_Seeds_Of_Revolution_desc:0 "Sweden's political landscape is increasingly divided. The working class feels abandoned by the establishment, and poverty and inequality are growing. Strikes and protests are becoming more common, and the once untouchable welfare state is showing signs of strain. With the rise of radical political movements, the time for change is rapidly approaching."
 SWE_Attacking_The_Establishment:0 "Attacking the Establishment"
 SWE_Attacking_The_Establishment_desc:0 "The elite continue to grow in power, leaving the working class to suffer. It’s time to challenge their rule and rally the oppressed people to take back what is rightfully theirs. The struggle against the elite is a struggle for Sweden's future."
 SWE_Government_of_Elites:0 "Government of the Elites"
 SWE_Government_of_Elites_desc:0 "The government serves the interests of the rich and powerful while the working class faces hardship. The system is rigged, and only by dismantling it can we ensure that power is returned to the people."
 SWE_Exploiting_the_Crisis:0 "Exploiting the Crisis"
 SWE_Exploiting_the_Crisis_desc:0 "Sweden is facing growing inequality and unemployment. The failures of capitalism have never been clearer. Now is the perfect time to use this crisis to rally the people and demand change. The establishment has failed us."
 SWE_Rallying_the_Workers:0 "Rallying the Workers"
 SWE_Rallying_the_Workers_desc:0 "The workers are the backbone of the nation, but they’ve been neglected for too long. By organizing and uniting them, we can create a movement strong enough to challenge the oppressive system. The time for action is now."
 SWE_New_Revolution:0 "The New Revolution"
 SWE_New_Revolution_desc:0 "The traditional methods of protest and revolution are no longer enough. A new kind of revolution is emerging, powered by the digital age. The internet is alive with ideas of radical change, with new revolutionary movements uniting through social media and online networks. It is time to harness this new force and take the revolution to the digital streets."
 SWE_Radicalizing_the_Social_Democrats:0 "Radicalizing the Social Democrats"
 SWE_Radicalizing_the_Social_Democrats_desc:0 "The Social Democrats, once the vanguard of the welfare state, have become too complacent and moderate. It’s time to pull them back from their stagnation and radicalize them. The working class needs leadership that will fight for real change, not just uphold the status quo. If they won’t rise to the occasion, we’ll take their place."
 SWE_Red_Flags_in_Stockholm:0 "Red Flags in Stockholm"
 SWE_Red_Flags_in_Stockholm_desc:0 "The streets of Stockholm are now alive with the spirit of revolution. Red flags wave high as the people rise against the old order. The power of the elite is beginning to crumble, and soon the people will take control of the nation."
 SWE_Peoples_Government:0 "§RPeople's Government§!"
 SWE_Peoples_Government_desc:0 "The revolution has triumphed and the old regime has fallen. With power now in the hands of the Communist Party, a new era begins one led by, and for the working class. The path to socialism lies ahead."
 SWE_Red_Banners_Must_Fall:0 "§gCoup d'etat§!"
 SWE_Red_Banners_Must_Fall_desc:0 "In the wake of the Communist uprising, the nation stands at the brink of collapse. The people grow restless, and the military has seized control to put an end to the chaos. The once promising revolution has been hijacked by the very forces that sought to destroy Sweden's legacy. The time has come to restore order, and to wipe away the stain of red from our streets."
 SWE_Unstable_Victory:0 "Declare Martial Law"
 SWE_Unstable_Victory_desc:0 "We have seized control for now. But the embers of communist rebellion still smolder beneath the surface. Without swift and decisive action, another uprising may not be far off."
 SWE_Ban_communism:0 "Ban Communism"
 SWE_Ban_communism_desc:0 "The communists have already proven their treachery by launching a coup against the Swedish state. Under the powers granted by martial law, we will now move to outlaw their movement entirely banning their parties, dismantling their networks, and ensuring they never rise again."
 SWE_Relinquish_Power_To_Nationalists:0 "Relinquish Power To The Far Right"
 SWE_Relinquish_Power_To_Nationalists_desc:0 "The military's role was to stabilize the nation not to govern it. With the threat of communist resurgence diminished, we will now transfer control to the nationalist leaders who have vowed to defend Sweden's sovereignty and rebuild the nation from the ashes of revolution."
 SWE_Relinquish_Power_To_The_King:0 "Trust In The King"
 SWE_Relinquish_Power_To_The_King_desc:0 "With the nation's future at stake and the memory of the communist insurrection still fresh, the military has chosen to restore the monarchy. Power is to be returned to the King, who will serve as the unifying figurehead to guide Sweden through turbulent times."
 SWE_Establish_Monarchist_Militias:0 "Establish Monarchist Militias"
 SWE_Establish_Monarchist_Militias_desc:0 "To safeguard the monarchy and defend Sweden from internal and external threats, we must form loyal militias dedicated to the Crown. These forces will bolster our national security and ensure that the King’s rule remains uncontested."
 SWE_Loyalist_In_The_Army:0 "Loyalists in the Army"
 SWE_Loyalist_In_The_Army_desc:0 "As we stabilize the nation, it is imperative that the army is purged of any lingering communist sympathizers. Only those loyal to the monarchy and the national cause will remain in command, ensuring that the military stands united behind the new order."
 SWE_Stabilize_The_Nation:0 "Stabilize the Nation"
 SWE_Stabilize_The_Nation_desc:0 "After the chaos of the coup and the restoration of the monarchy, it is crucial to stabilize the nation. We must restore law and order, rebuild the economy, and ensure that the monarchy’s rule is secure, preparing Sweden for a prosperous future."
 SWE_Sentence_The_Communists:0 "Sentence the Communists"
 SWE_Sentence_The_Communists_desc:0 "The communist leaders who orchestrated the coup and plunged the nation into chaos must now face justice. Their actions have betrayed the Swedish people, and they will be held accountable for their treasonous acts, ensuring that their ideology never threatens our country again."
 SWE_Extend_Martial_Law:0 "Extend Martial Law"
 SWE_Extend_Martial_Law_desc:0 "Though order has been restored for now, the threat of further insurrection remains high. Martial law must be extended to ensure continued stability, suppress any remnants of communist influence, and maintain control until the nation is fully secure under the new regime."
 SWE_Establish_Royal_Armaments_Program:0 "Establish Royal Armaments Program"
 SWE_Establish_Royal_Armaments_Program_desc:0 "In order to secure Sweden’s future and assert the strength of the monarchy, we must modernize our military capabilities. The Royal Armaments Program will focus on advancing our defense technology and fortifying our armed forces, ensuring that the Kingdom stands resilient against any threat."
 SWE_Anniversary_Against_Coup:0 "Royal Holiday"
 SWE_Anniversary_Against_Coup_desc:0 "On this day, we remember the victory over the communist forces that sought to tear Sweden apart. The military’s swift action and the restoration of the monarchy saved the nation from chaos. Today, we celebrate our unity and the strength of the Crown that brought us through dark times."
 SWE_Swedish_Irridentism:0 "Swedish Irredentism"
 SWE_Swedish_Irridentism_desc:0 "Sweden was once a dominant force in Northern Europe, feared and respected by its neighbors. The coup has proven that Sweden’s strength has not been lost; the monarchy now has the opportunity to restore the nation to its former greatness. We will reclaim our lost glory and ensure that Sweden once again stands at the forefront of European power."
 SWE_Kingdom_Of_Sweden_Norway:0 "Kingdom of Sweden and Norway"
 SWE_Kingdom_Of_Sweden_Norway_desc:0 "In the spirit of Nordic unity, we will reforge the historic bond between Sweden and Norway. By restoring the union of the two kingdoms, we will enhance our power, secure our borders, and create a force capable of rivaling the greatest powers of Europe once again."
 SWE_Pressure_Denmark:0 "Pressure Denmark"
 SWE_Pressure_Denmark_desc:0 "Now that Sweden has risen from the ashes, it is time to remind Denmark of our power in the region. We will pressure them to align with Swedish interests, ensuring that our dominance in Scandinavia remains unchallenged. Whether through diplomacy or more forceful means, Denmark must comply."
 SWE_March_To_Copenhagen:0 "March to Copenhagen"
 SWE_March_To_Copenhagen_desc:0 "Denmark's defiance has gone too far. To assert Sweden’s dominance over Scandinavia, we will march to Copenhagen. Our armies will bring the Danish government to heel, securing our position as the unquestioned power in the region. The Danish capital will fall under Swedish control, ensuring their compliance."
 SWE_Finland:0 "Finland"
 SWE_Finland_desc:0 "Finland has long been a historical and cultural ally of Sweden. Now, as we rise to prominence once again, we must ensure that Finland remains firmly within our sphere of influence. Whether through diplomacy or stronger measures, we will secure Finland’s loyalty and protect our interests in the region."
 SWE_Revive_The_Aland_Issue:0 "Revive the Åland Issue"
 SWE_Revive_The_Aland_Issue_desc:0 "The Åland Islands were wrongfully taken from us by the League of Nations’ biased decision. The bitterness surrounding this injustice has never faded, and now, as Sweden rises once again, it is time to rectify this wrong. We will reclaim the islands that should never have been lost, restoring them to their rightful place within Sweden."
 SWE_Invite_Swedish_Minorities:0 "Invite Swedish Speaking Minorities"
 SWE_Invite_Swedish_Minorities_desc:0 "For centuries, Swedish speaking communities have lived across the Gulf in Finland, preserving our language and culture even in foreign lands. With tensions rising and their future uncertain, Sweden must act. We will extend an open invitation to our kin to return home, offering them support, safety, and the chance to flourish once more within the embrace of the Swedish nation."
 SWE_Integration_or_war:0 "Integration or War"
 SWE_Integration_or_war_desc:0 "Sweden’s position in Scandinavia must be unchallenged. Finland and other neighboring states must choose: integrate into the Swedish sphere of influence, or face the consequences. We will not allow the independence of these nations to undermine our resurgence. The time has come to secure our dominance, either through diplomacy or by force."
 SWE_Establish_Diplomatic_Ties:0 "Establish Diplomatic Ties"
 SWE_Establish_Diplomatic_Ties_desc:0 "In the pursuit of strengthening Sweden’s influence in the region, it is essential that we establish strong diplomatic ties with our neighbors and global powers. By fostering alliances and improving relations, we will ensure Sweden’s position as a respected leader in Northern Europe and beyond."
 SWE_Spread_Monarchist_Propaganda:0 "Spread Monarchist Propaganda"
 SWE_Spread_Monarchist_Propaganda_desc:0 "To solidify our rule and ensure the monarchy’s dominance, we must spread the ideals of monarchy throughout Sweden and beyond. Through controlled media, speeches, and state driven campaigns, we will inspire loyalty to the Crown and reinforce the vision of a unified, strong, and royal Sweden."
 SWE_Alliance_Of_Monarchist:0 "Alliance of Monarchists"
 SWE_Alliance_Of_Monarchist_desc:0 "Sweden, now firmly under the rule of the monarchy, must seek alliances with other monarchist nations across Europe. By uniting with like minded monarchies, we will ensure the survival of our royal vision and create a powerful bloc that can challenge the forces of democracy and communism."
 SWE_Look_To_The_Baltics:0 "Look to the Baltics"
 SWE_Look_To_The_Baltics_desc:0 "The Baltic region has always been of strategic importance to Sweden. As our power grows, it is time to look southward and reclaim influence over the Baltic states. Whether through diplomacy, trade, or military might, Sweden must reassert control over the region and secure its dominance in Northern Europe."
 SWE_Proclaim_The_Swedish_Empire:0 "Proclaim the Swedish Empire"
 SWE_Proclaim_The_Swedish_Empire_desc:0 "The world trembles as Sweden rises from the ashes. No longer a forgotten power, we will declare the rebirth of the Swedish Empire, stretching our dominance across Northern Europe. The weak will fall, the defiant will bow, and the Baltic will once again be ours. It’s time to reshape history Sweden will reign supreme, and the world will remember our name."
 SWE_Secure_Military_Support:0 "Secure the Military's Allegiance"
 SWE_Secure_Military_Support_desc:0 "The communists seized power through chaos, but it was the military that put them down. Now we must ensure every officer, every battalion, every commander stands with the new order. Loyalty is not optional. Those who falter will be replaced."
 SWE_Persecue_The_Communists:0 "Persecute the Left Wing"
 SWE_Persecue_The_Communists_desc:0 "Hunt them down. Root them out. Leave no den of Marxist filth untouched. Erase their symbols, silence their voices, and make it known that communism dies here."
 SWE_Get_Rid_Of_The_King:0 "Down With the King"
 SWE_Get_Rid_Of_The_King_desc:0 "The monarch stands as the last figure with enough legitimacy to rally opposition. Strip him of his power, dismantle the royal court, and ensure that no crown ever challenges our rule again."
 SWE_Invest_In_The_Military:0 "Invest in the Military"
 SWE_Invest_In_The_Military_desc:0 "A strong nation is built on steel and discipline. Pour resources into our armed forces   expand production, modernize equipment, and ensure absolute loyalty to the new order."
 SWE_Wepon_Production:0 "Weapon Production"
 SWE_Wepon_Production_desc:0 "To assert our dominance and safeguard our sovereignty, we must arm ourselves to the teeth. Accelerate the production of weapons, ammunition, and military technology, ensuring that Sweden is a fortress ready to crush any who dare challenge us."
 SWE_En_Svensk_Stridsvagn:0 "En Svensk Stridsvagn"
 SWE_En_Svensk_Stridsvagn_desc:0 "A Swedish tank is the symbol of our military might. Invest heavily in the development and production of a domestically designed tank, one that will strike fear into our enemies and assert Swedish supremacy on the battlefield."
 SWE_Army_Innovations:0 "Industrial Innovations"
 SWE_Army_Innovations_desc:0 "To maintain our edge over potential adversaries, we must lead the way in military innovation. Modernize our army with cutting edge tactics, equipment, and training, ensuring that our forces are always ahead of the curve and ready for any challenge."
 SWE_Autarky:0 "Autarky"
 SWE_Autarky_desc:0 "True strength comes from self sufficiency. By reducing our reliance on foreign powers, we will ensure that Sweden remains independent and resilient. Invest in domestic production, secure our resources, and make Sweden a fortress that no outside force can undermine."
 SWE_Navy:0 "The Swedish Navy"
 SWE_Navy_desc:0 "A powerful navy is essential for protecting our sovereignty and asserting our dominance on the seas. Expand and modernize our naval fleet, ensuring that Sweden controls the waters surrounding our nation and stands as a beacon of military strength across the oceans."
 SWE_Dominate_the_Baltic:0 "Dominate the Baltic"
 SWE_Dominate_the_Baltic_desc:0 "The Baltic Sea is our rightful domain. By strengthening our naval and military presence in the region, we will secure Sweden’s dominance, ensuring that no foreign power can challenge our authority or threaten our shores."
 SWE_Pass_The_Enabeling_Act:0 "Pass the Enabling Act"
 SWE_Pass_The_Enabeling_Act_desc:0 "The parliament, corrupted by the Social Democrats and the weak conservatives, failed to act against the communist coup. Their inaction enabled chaos to spread. The Enabling Act will strip them of their power, consolidating authority in the hands of those who will restore order and strength to Sweden."
 SWE_Swedish_Revanchism:0 "Swedish Revanchism"
 SWE_Swedish_Revanchism_desc:0 "Sweden has been humiliated for far too long. We will no longer bow to foreign powers or allow our national pride to be trampled. It's time to reclaim what is ours territories lost, respect earned, and the legacy of Sweden restored to its rightful place in Europe."
 SWE_Rigged_Election:0 "Rigged Election"
 SWE_Rigged_Election_desc:0 "The Swedes have grown complacent in their so called 'democracy,' a system that has been corrupted by weakness and deceit. They are used to a farce of freedom, blind to the reality that their political system has failed them. It is time to give them the 'choice' they crave, while ensuring Stefan Jacobsson’s leadership is unchallenged, crushing any hope of true opposition."
 SWE_Censor_Internet:0 "Censor the Internet"
 SWE_Censor_Internet_desc:0 "The internet has become a breeding ground for dissent, lies, and chaos. The spread of subversive ideas must be stopped before they poison the minds of the people. By censoring the web, we will ensure that only the truth our truth reaches the masses, securing the future of Sweden from the dangers of foreign influence and internal betrayal."
 SWE_Empower_Corporations:0 "Empower Corporations"
 SWE_Empower_Corporations_desc:0 "The state must align itself with those who have the power to rebuild Sweden our great corporations. By empowering them, we will create a system where business leaders and the state work hand in hand to fuel Sweden's economy. Let the free market flourish under our guidance, and we will ensure that the nation thrives as never before."
 SWE_Corporate_Welfare:0 "Corporate Welfare"
 SWE_Corporate_Welfare_desc:0 "The strength of Sweden lies in its industries and businesses. It is time to provide them with the support they need to flourish. Through corporate welfare, we will ensure that our key industries remain competitive, protect jobs, and guarantee that the elite remain strong and loyal to the nation. The prosperity of our corporations is the prosperity of Sweden."
 SWE_Sweden_for_Swedes:0 "Sweden for Swedes"
 SWE_Sweden_for_Swedes_desc:0 "Sweden’s future belongs to the Swedish people, not to outsiders. We will prioritize the interests of our own citizens, reclaiming our borders and culture from foreign influence. Only by strengthening our national identity can we secure a prosperous and unified future for Sweden."
 SWE_Mass_Deportations:0 "Mass Deportations"
 SWE_Mass_Deportations_desc:0 "To protect the integrity of Sweden, we must rid ourselves of those who threaten our way of life. It is time to remove foreign elements that have corrupted our society and return them to their homelands. Only through purging our nation of these invaders can we secure a future for the true Swedish people."
 SWE_Cult_of_personality:0 "Cult of Personality"
 SWE_Cult_of_personality_desc:0 "Stefan Jacobsson is more than a leader he is the savior of Sweden. In a time of betrayal and weakness, he stood firm. The people need a symbol of strength and unity, and Jacobsson will become that symbol. His name will echo through the streets, his image will adorn every wall, and his word will be law. Doubt is treason. Obedience is patriotism."
 SWE_Institute_Conscription:0 "Institute Conscription"
 SWE_Institute_Conscription_desc:0 "Every true Swede must be ready to defend the nation. In these uncertain times, voluntary service is no longer sufficient. We will implement full conscription to ensure that our military is never found wanting again. The weak may whine, but survival demands sacrifice."
 SWE_Viking_Heritage:0 "Viking Heritage"
 SWE_Viking_Heritage_desc:0 "We are the descendants of warriors who crossed seas and crushed empires. That spirit still lives in our blood. Let the world remember the strength of the North unyielding, brutal, and proud. We will channel our ancestral fury into the forge of a new Swedish empire."
 SWE_Army_Funding:0 "Increase Army Funding"
 SWE_Army_Funding_desc:0 "A powerful army is the backbone of national strength. We will divert resources toward training, arming, and expanding our forces. While others waste money on luxuries and handouts, we invest in discipline, firepower, and dominance."
 SWE_Education_Reform:0 "Get Rid Of \"Woke\" Education"
 SWE_Education_Reform_desc:0 "Our schools have become breeding grounds for weakness and self hatred, poisoning the minds of our youth with shame and so called 'progressive' lies. We will cleanse the curriculum no more woke nonsense, no more foreign guilt. In its place: pride, history, and duty to the nation. The next generation will grow up knowing what it means to be Swedish."
 SWE_Close_Border:0 "Close the Borders"
 SWE_Close_Border_desc:0 "We are done playing host to those who mock our laws and drain our resources. The borders will be sealed permanently. No more endless streams of so called 'refugees.' No more foreign influence. Sweden belongs to Swedes, and it’s time we act like it."
 SWE_War_is_Peace:0 "War is Peace"
 SWE_War_is_Peace_desc:0 "The people no longer think. Under the firm grip of the Party, dissent is a memory and obedience is virtue. The state press weaves the truth as needed, and the masses applaud. Endless struggle keeps them loyal. Unity through fear, purpose through conflict this is peace, and it is ours to command."
 SWE_Outlaw_Opposition:0 "Outlaw Opposition Parties"
 SWE_Outlaw_Opposition_desc:0 "We will never be 100% sure that the opposition parties aren't planing on overthrowing us. It's therefore better that we use our new powers to outlaw all opposition movement. The public is undobtedly going to protest  this but we will use te excuse of an imminent communist coup as an excuse"
 SWE_5_year_plan:0 "5 Year Plan"
 SWE_5_year_plan_desc:0 "Sweden’s first Five Year Plan will reshape the economy through state led industry, collectivized agriculture, and centralized infrastructure projects. Heavy industry will be prioritized to build self sufficiency and break dependence on foreign markets. Though resistance is expected, especially in rural areas, unity and discipline will lay the foundation for a socialist order where production serves the people, not profit."
 SWE_Hevy_Industy:0 "Build Heavy Industry"
 SWE_Hevy_Industy_desc:0 "To ensure Sweden’s future, we must rapidly expand heavy industry. State directed steel mills, machinery plants, and arms factories will boost economic growth and defense. Centralized planning guarantees production serves the people, not profit. These industries will become the backbone of a socialist Sweden and a testament to the power of the proletariat."
 SWE_A_Caring_Government:0 "A Caring Government"
 SWE_A_Caring_Government_desc:0 "A socialist government must care for all. By expanding healthcare, education, and social programs, we uplift the people and earn their loyalty. This is not charity, but a right won through struggle. A caring state strengthens unity and secures the revolution’s future."
 SWE_Invest_in_Welfare_Spending:0 "Invest in Welfare Spending"
 SWE_Invest_in_Welfare_Spending_desc:0 "To strengthen the revolution, we must support the people. Increased welfare spending on healthcare, housing, and unemployment will ease hardship, build trust, and lay the foundation for a stable socialist state."
 SWE_centralization:0 "Centralize Power"
 SWE_centralization_desc:0 "To secure the revolution, power must be centralized. Stronger oversight from Stockholm will ensure uniform policies, suppress local resistance, and keep reform efforts on track. Unity through authority is vital for progress."
 SWE_de_centralization:0 "Empower Trade Unions"
 SWE_de_centralization_desc:0 "Decentralizing power lets local governments address their communities' unique needs, fostering support and participation. Though slower, this approach strengthens us in the long rund and prevents regional alienation."
 SWE_A_Communist_Capital:0 "Communist Capital"
 SWE_A_Communist_Capital_desc:0 "With us concentrating on centralized governance we will need to make sure that the heart of our country, Stockholm, is up to modern standards and shows the best aspects of our gloriouse worker's state"
 SWE_Utbanization:0 "Accelerate Urbanization"
 SWE_Utbanization_desc:0 "Sweden’s future is in growing industrial cities that fuel socialist progress. Urbanization will concentrate labor and resources, enabling state led development. Housing, infrastructure, and services must expand to support this shift, making urban Sweden a center of production and culture."
 SWE_Bring_Back_Industry:0 "Revitalize Swedish Industry"
 SWE_Bring_Back_Industry_desc:0 "Sweden’s industrial base has declined for decades. Reviving factories and workshops will restore jobs and economic strength, fueling our socialist transformation and self reliance. This focus modernizes production, improves worker conditions, and rebuilds Sweden’s manufacturing leadership."
 SWE_Sami_Industrialization:0 "Industrialize Sami Regions"
 SWE_Sami_Industrialization_desc:0 "Northern Sweden’s Sami regions have been left behind industrially. New decentralized investments in mining, forestry, and renewables aim to create jobs while respecting Sami culture. This approach balances regional autonomy with inclusive growth tailored to local needs."
 SWE_Recource_Gain:0 "Boost Regional Resource Extraction"
 SWE_Recource_Gain_desc:0 "Local governments will develop regional resources like timber, minerals, and hydroelectric power to create jobs and boost industry. Decentralized control ensures resource wealth benefits communities fairly, supporting shared prosperity across Sweden."
 SWE_Communism_In_Europe:0 "Communism in Europe"
 SWE_Communism_In_Europe_desc:0 "Sweden remains one of Europe’s few communist states, standing strong amid growing hostility. To survive, we must unite with fellow socialist nations, support revolutions abroad, and defend our ideology. Our strength lies in solidarity and resilience as we work toward a socialist future for Europe."
 SWE_Swedish_Communism:0 "Nordic Communism"
 SWE_Swedish_Communism_desc:0 "Nordic communism blends democratic values with workers’ rights, emphasizing transparency, welfare, and grassroots participation. Unlike authoritarian models, it merges revolutionary ideals with nordic social democracy to build a just society that respects personal freedoms and our unique identity."
 SWE_Looke_East:0 "Look East"
 SWE_Looke_East_desc:0 "Under Western pressure, Sweden looks to China’s model of state led capitalism and strict party control. This pragmatic, centralized path sacrifices some freedoms for stability, rapid growth, and greater global influence."
 SWE_Attack_The_Banks:0 "Attack the Banks"
 SWE_Attack_The_Banks_desc:0 "We must dismantle banks that exploit workers and block socialist reforms. Seizing control of finance returns power to the people and breaks capitalist greed’s hold on our economy."
 SWE_Step_On_To_The_World_Stage:0 "Step Onto the World Stage"
 SWE_Step_On_To_The_World_Stage_desc:0 "To secure our future, Sweden must end its isolation by building alliances and asserting itself in global affairs. Our revolution will shine as a beacon for workers worldwide."
 SWE_State_Visit_To_Beijing:0 "State Visit to Beijing"
 SWE_State_Visit_To_Beijing_desc:0 "Sweden’s historic visit to Beijing strengthens our ties with China. We seek to learn, cooperate, and secure support for our revolution within the global communist movement."
 SWE_Follow_Chineese_Economic_Model:0 "Adopt the Chinese Economic Model"
 SWE_Follow_Chineese_Economic_Model_desc:0 "Adopting China’s state led economic model, Sweden will combine planning with market reforms to boost industry, attract investment, and modernize infrastructure ensuring rapid growth and socialist stability."
 SWE_Chineese_Labour:0 "Chinese Labour Cooperation"
 SWE_Chineese_Labour_desc:0 "Learning from China’s disciplined workforce and party organization, Sweden will strengthen its labor movement and boost industrial efficiency. Cooperation through initiatives like the Belt and Road deepens ties and opens new markets."
 SWE_Survelance:0 "Expand State Surveillance"
 SWE_Survelance_desc:0 "To protect the revolution, Sweden will boost surveillance using advanced technology inspired by China. Though it may limit some freedoms, this is vital to secure our socialist state against threats."
 SWE_Alliance_With_China:0 "Alliance with China"
 SWE_Alliance_With_China_desc:0 "A formal alliance with China strengthens Sweden’s defense, economy, and international influence. Together, we advance a shared communist future and secure our place as leading socialist nations."
 SWE_A_Part_Of_China_In_Europe:0 "A Part of China in Europe"
 SWE_A_Part_Of_China_In_Europe_desc:0 "Sweden has become a vital part of China’s influence in Europe, embracing their political and economic model. This integration boosts security and growth but ties Sweden closely to China’s global communist ambitions."
 SWE_Our_Taiwan:0 "Our Taiwan"
 SWE_Our_Taiwan_desc:0 "Like China claims Taiwan, Sweden claims the Åland Islands lands tied by history and culture. Reclaiming Åland boosts our Baltic sovereignty and honors our communist state’s resolve to secure our rightful place in the region."
 SWE_We_Lead:0 "We Lead"
 SWE_We_Lead_desc:0 "Sweden leads a new wave of global communist movements, proving democratic socialism can thrive today. Our revolution inspires others to challenge the old order and build a fairer world on our own terms."
 SWE_Lone_Wolf:0 "Lone Wolf"
 SWE_Lone_Wolf_desc:0 "We stand proud and independent, forging our own revolutionary path without outside help. We rely on our strength to protect our sovereignty and extend our influence by creating puppet states, spreading socialism alone but unyielding."
 SWE_Remember_Our_History:0 "Remember Our History"
 SWE_Remember_Our_History_desc:0 "We draw strength from the Vikings, whose community bonds and shared resources reflect early socialist ideals. Remembering this heritage inspires us to build a society rooted in solidarity and equality."
 SWE_Establish_Buffer_States:0 "Establish Buffer States"
 SWE_Establish_Buffer_States_desc:0 "To secure our regional dominance, we will create loyal buffer states as shields against enemies and bases for expansion. Sweden will no longer be passive but a decisive force shaping Northern Europe’s future."
 SWE_United_We_Stand:0 "United We Stand"
 SWE_United_We_Stand_desc:0 "In a divided world, Sweden must build strong alliances with like minded nations. United, we defend our values, promote socialism, and secure lasting peace for future generations."
 SWE_Spread_Swedish_Propaganda:0 "Spread Swedish Propaganda"
 SWE_Spread_Swedish_Propaganda_desc:0 "We will share Swedish socialism’s success worldwide through media and cultural outreach, inspiring others and building international solidarity against capitalism."
 SWE_Red_Revolutions:0 "Red Revolutions"
 SWE_Red_Revolutions_desc:0 "Our propaganda ignites revolutions abroad. When movements gain strength, we will support or lead coups to topple capitalist regimes, spreading Swedish socialism worldwide."
 SWE_Under_The_North_Star:0 "Under the North Star"
 SWE_Under_The_North_Star_desc:0 "Guided by the North Star, Sweden unites with socialist allies to share resources, resist imperialism, and build a brighter future together."
 SWE_Red_Union:0 "Red Union"
 SWE_Red_Union_desc:0 "Sweden will unite socialist allies into a Red Kalmar Union, forging a strong Nordic bloc to resist imperialism and promote our revolution."
 SWE_Bring_The_Revolution_Back_To_Russia:0 "Bring the Revolution Back to Russia"
 SWE_Bring_The_Revolution_Back_To_Russia_desc:0 "We turn east to challenge Putin’s corrupt regime. We will reignite revolution in Russia and advance global socialism."
 SWE_A_Real_Islamist_Party:0 "A Real Islamist Party"
 SWE_A_Real_Islamist_Party_desc:0 "Partiet Nyans is nothing more than a secular puppet in Islamic clothing. It kneels before the Swedish state and fears to speak the full truth of our faith. We must create a true Islamic movement, one that answers not to parliament, but to Allah."
 SWE_The_Radical_Imams:0 "The Radical Imams"
 SWE_The_Radical_Imams_desc:0 "While weak hearted clerics call for coexistence, a new generation of fearless imams rises. They speak openly against Swedish secularism, calling it a disease of the soul. These voices shall be our vanguard in the struggle for true Islamic rule."
 SWE_Faith_Over_Nation:0 "Faith Over Nation"
 SWE_Faith_Over_Nation_desc:0 "The concept of nationalism is a tool of the unbelievers, used to divide the Ummah and bind the faithful to corrupt regimes. Our loyalty is not to the Swedish flag, but to Allah. We reject patriotism only the Caliphate deserves our allegiance."
 SWE_The_Faithful_Arm_Themselves:0 "The Faithful Arm Themselves"
 SWE_The_Faithful_Arm_Themselves_desc:0 "The coming struggle is inevitable. Our brothers and sisters must prepare to defend the faith with steel and fire. The faithful arm themselves, ready to strike down the corrupt secular order that oppresses us."
 SWE_Path_Of_The_Pen:0 "Path of the Pen"
 SWE_Path_Of_The_Pen_desc:0 "By infiltrating the infidel state’s institutions and spreading our influence quietly, we can weaken them from within. When the civil war begins, our control will extend over more states, tipping the scales in our favor."
 SWE_Path_Of_The_Sword:0 "Path of the Sword"
 SWE_Path_Of_The_Sword_desc:0 "The sword must be drawn. Our faithful must organize militias and prepare to fight openly against the secular regime."
 SWE_The_Hour_Has_Come:0 "The Hour Has Come"
 SWE_The_Hour_Has_Come_desc:0 "The moment to rise has arrived. The faithful will no longer suffer under the chains of secularism. our destiny is at hand."
 SWE_Sharia_Triumphant:0 "§gA New Age For Sweden§!"
 SWE_Sharia_Triumphant_desc:0 "The infidel regime has been swept away, and the divine law now guides the nation. Sweden is reborn under the banner of true faith, with Sharia as the foundation of our new order."
 SWE_A_Northern_Caliphate:0 "A Northern Caliphate"
 SWE_A_Northern_Caliphate_desc:0 "The time has come to formalize our divine rule. With the kafir government overthrown, we shall coronate a Caliph to lead the faithful into a new era. Sweden shall no longer be a nation of compromise it shall be the beacon of the Ummah in the north, governed by the will of Allah and unshakable in its mission."
 SWE_Recognize_The_Taliban:0 "Brothers in Faith"
 SWE_Recognize_The_Taliban_desc:0 "The West shunned them, but we see the truth in their perseverance. By formally recognizing the Islamic Emirate of Afghanistan, we forge an alliance of conviction, not convenience. Let the crescent rise united once more."
 SWE_Support_Palestine:0 "Support Palestine"
 SWE_Support_Palestine_desc:0 "We will no longer sit idle while our brothers and sisters are oppressed. Financial aid, volunteers, and weapons will flow east. Let the world know: Sweden stands with Palestine, not with the occupiers."
 SWE_Demand_Two_State_Solution:0 "Demand Two State Solution"
 SWE_Demand_Two_State_Solution_desc:0 "We must push the world to recognize the right of Palestine and Israel to coexist under our terms."
 SWE_Institutions_Under_Islam:0 "Institutions Under Islam"
 SWE_Institutions_Under_Islam_desc:0 "Things must change from the secular government to fully embrace Islamic principles in all institutions."
 SWE_Sharia_extreme:0 "Hardline Sharia Enforcement"
 SWE_Sharia_extreme_desc:0 "The true path demands absolute adherence to Sharia law. There is no room for compromise either total enforcement or soft reforms."
 SWE_Male_Only_Schools:0 "Education for Men Only"
 SWE_Male_Only_Schools_desc:0 "In line with our strict interpretation, women are prohibited from attending school, preserving the purity of our society and faith."
 SWE_Stimulate_The_Economy:0 "Jumpstart the Jihad Economy"
 SWE_Stimulate_The_Economy_desc:0 "Through strict adherence to Islamic principles and reorganization of our economic system, we will revive prosperity for our people."
 SWE_Embrace_Salafism:0 "Embrace Salafism"
 SWE_Embrace_Salafism_desc:0 "Salafism calls for a strict return to the practices of the Prophet Muhammad and the first generations of Muslims, rejecting modern innovations and emphasizing a literal interpretation of Islamic texts."
 SWE_Trust_In_Islam:0 "Trust In Islam"
 SWE_Trust_In_Islam_desc:0 "We have overcome the deep skepticism towards Islam in our land and built unwavering faith in the true path."
 SWE_Sharia_Lite:0 "Sharia Lite"
 SWE_Sharia_Lite_desc:0 "The vast majority of Swedes remain Christians. Implementing full Sharia law now would provoke a coup. We must proceed cautiously."
 SWE_Build_Education_Centers:0 "Build Education Centers"
 SWE_Build_Education_Centers_desc:0 "Establish new centers of learning to spread Islamic knowledge and strengthen our future generations."
 SWE_Seek_Muslim_Investment:0 "Seek Muslim Investment"
 SWE_Seek_Muslim_Investment_desc:0 "We should reach out to wealthy Muslim nations and investors to secure vital funding and support for rebuilding our economy under Islamic principles."
 SWE_The_Hijab:0 "The Hijab Debate"
 SWE_The_Hijab_desc:0 "Decide whether to enforce the wearing of the hijab for women, balancing religious duty with public acceptance and social stability."
 SWE_Preserve_Womens_Rights:0 "Honoring Sweden’s Feminist Legacy"
 SWE_Preserve_Womens_Rights_desc:0 "Respecting the Christian majority and the People of the Book, and acknowledging Sweden’s long history of feminism, we choose not to mandate the hijab and protect women’s freedoms within our new order."
 SWE_Ensure_Loyalty:0 "Islam Above All"
 SWE_Ensure_Loyalty_desc:0 "To secure unwavering loyalty to the Caliphate, forced conversions to Islam are now mandatory, ensuring the unity and strength of our new society."
 SWE_A_Muslim_Army:0 "An Army of the Faithful"
 SWE_A_Muslim_Army_desc:0 "Building a loyal and devout military force composed entirely of true believers, ready to defend the Caliphate and spread its influence."
 SWE_Morality_Police:0 "Guardians of Faith and Order"
 SWE_Morality_Police_desc:0 "Establish a strict morality police force to enforce Sharia law and root out any dissent or un Islamic behavior within society."
 SWE_Volunteer_Force:0 "Mobilize the Faithful"
 SWE_Volunteer_Force_desc:0 "Call upon devoted volunteers from across the land to join our cause and strengthen the ranks of our Islamist forces."
 SWE_People_Of_The_Book:0 "The People of the Book"
 SWE_People_Of_The_Book_desc:0 "Impose a special tax on the Christian population, a tradition rooted in the long history of respecting Christians as People of the Book. This measure deepens divisions and is incompatible with forced conversions."
 SWE_Arabization:0 "The Arabization of Sweden"
 SWE_Arabization_desc:0 "Arabic is declared the official language of the new state. Swedish city names will be replaced with their Arabic equivalents, marking a new chapter in our identity and culture."
 SWE_Halal_Food_Production:0 "Halal Food Production"
 SWE_Halal_Food_Production_desc:0 "We will overhaul Sweden’s food industry to ensure all products meet strict halal standards, catering to the faithful and reshaping the nation’s culinary landscape."
 SWE_Back_On_The_World_Stage:0 "Back On The World Stage"
 SWE_Back_On_The_World_Stage_desc:0 "After years of struggle, Sweden rises again as a force to be reckoned with, demanding respect and recognition from the global community."
 SWE_War_Agains_Alcoholism:0 "War Against Alcoholism"
 SWE_War_Agains_Alcoholism_desc:0 "Alcohol has long plagued our society. It's time to cleanse our streets and homes, enforcing strict bans to protect our people’s faith and health."
 SWE_Neutrality_In_The_World:0 "Neutrality in a Turbulent World"
 SWE_Neutrality_In_The_World_desc:0 "Amid global chaos, we choose to stand apart focused on strengthening our nation and faith, avoiding entanglement in foreign conflicts."
 SWE_Bearers_Of_Islam:0 "Bearers of Islam"
 SWE_Bearers_Of_Islam_desc:0 "We are the torchbearers of true faith, destined to spread the light of Islam across these lands and beyond."
 SWE_Nordic_Jihad:0 "Nordic Jihad"
 SWE_Nordic_Jihad_desc:0 "Our holy struggle extends beyond borders the Nordic lands shall be united under the banner of Islam through sacrifice and unwavering faith."
 SWE_Green_Industrial_Modernization:0 "Green Industry"
 SWE_Green_Industrial_Modernization_desc:0 "Sweden stands at a crossroads between industrial progress and environmental responsibility. By investing in renewable energy, modernizing outdated factories, and supporting green technology startups, we can turn our economy into a model for sustainable growth. This initiative will not only reduce our carbon footprint, but also create thousands of future-oriented jobs."
 SWE_Border_Reforms_with_Compassion:0 "Border Reforms with Compassion"
 SWE_Border_Reforms_with_Compassion_desc:0 "The time has come to review and reform our border policies in a way that balances national security with our humanitarian responsibilities. By improving vetting procedures and streamlining asylum processes, we can maintain order without abandoning those in need of protection."
 SWE_Focus_on_Integration:0 "Bridging the Divide"
 SWE_Focus_on_Integration_desc:0 "Successful integration is more than housing and employment. It is about fostering a shared sense of belonging. Through language programs, civic education, and local community initiatives, we can create the conditions for a stronger and more united society."
 SWE_Education_for_All:0 "Classrooms Without Borders"
 SWE_Education_for_All_desc:0 "Education remains the great equalizer. By expanding access to quality schooling and ensuring inclusive curricula, we can empower all children in Sweden—regardless of background—to contribute to a brighter future. Integration begins at the desk and flourishes in the mind."
 SWE_Progressive_Tax_Reform:0 "Fair Shares for a Fair Society"
 SWE_Progressive_Tax_Reform_desc:0 "To fund our social programs and reduce inequality, the tax system must reflect the ability to contribute. By introducing more progressive taxation, we ensure that the wealthiest carry their fair share while protecting low- and middle-income families from undue burdens."
 SWE_Rebuild_the_Welfare_Model:0 "Restoring the Folkhemmet"
 SWE_Rebuild_the_Welfare_Model_desc:0 "The Swedish welfare model was once the pride of our nation. Years of budget cuts and privatization have weakened it, but we can rebuild. By reinvesting in healthcare, pensions, and social safety nets, we will restore the foundations of a just and resilient society."
 SWE_Nordic_Defence_Council:0 "Found the Nordic Defence Council"
 SWE_Nordic_Defence_Council_desc:0 "The threats facing our region demand more than coordination — they demand unity. By founding a formal Nordic Defence Council, we can create a joint military alliance with our Scandinavian neighbors, one rooted in shared values, mutual trust, and collective defense."
 SWE_Expand_To_Baltics:0 "Extend the Nordic Council Eastward"
 SWE_Expand_To_Baltics_desc:0 "The cultural and historical bonds between the Nordic and Baltic peoples provide fertile ground for deeper cooperation. By extending an invitation to the Baltic states, we can transform the Nordic Council into a broader regional bloc—one capable of projecting influence and maintaining stability across the Baltic Sea."
 SWE_Economic_Integration:0 "A Common Nordic Market"
 SWE_Economic_Integration_desc:0 "Economic unity will be the backbone of our regional alliance. By harmonizing regulations, removing trade barriers, and coordinating industrial strategies with our Nordic neighbors, we take a vital step toward deeper integration and long-term prosperity for all members."
 SWE_Sweden_Alone:0 "Sweden Alone"
 SWE_Sweden_Alone_desc:0 "We will chart our own course. Sweden has a proud history of neutrality, and while the world grows more divided, we will not be pulled into foreign entanglements. Through military self-reliance and a strong national defense, we will protect our sovereignty without compromising our independence."
 SWE_Joint_Application:0 "Joint Application to §3NATO§!"
 SWE_Joint_Application_desc:0 "In coordination with Finland, we will submit a formal application to join the North Atlantic Treaty Organization. As security threats rise across Europe, our best guarantee of peace lies in collective defense. This historic step will end decades of neutrality and firmly align us with the Western alliance."
 SWE_NATO_Lake:0 "§3NATO§! lake"
 SWE_NATO_Lake_desc:0 "With our NATO membership in progress, we must strengthen our defenses along the Baltic Sea. Coordinated patrols, joint exercises, and modernized coastal fortifications will ensure that Sweden stands ready to protect this vital region and contribute to the alliance’s northern flank."
 SWE_NATO_Doctrine:0 "Adopt §3NATO§! Doctrine"
 SWE_NATO_Doctrine_desc:0 "To fully integrate with the alliance, Sweden will adopt NATO’s military doctrines and standards. This will enhance interoperability with member states and improve the effectiveness of our armed forces in collective defense operations."
 SWE_Construct_Eastwall:0 "Construct the Eastwall"
 SWE_Construct_Eastwall_desc:0 "To safeguard our eastern border and reinforce our defense against potential aggression, we will construct a series of fortifications and defensive positions along the Finland-Sweden frontier. This Eastwall will serve as a strong deterrent and a shield for our northern territories."
 SWE_Security_For_Aland:0 "Security for Åland"
 SWE_Security_For_Aland_desc:0 "The strategic importance of the Åland Islands cannot be overstated. We must reinforce their defenses and establish clear security guarantees to protect this vital gateway in the Baltic Sea from any potential threats."
 SWE_Cooperate_with_Russia:0 "Approach §gMoscow§!"
 SWE_Cooperate_with_Russia_desc:0 "In a complex geopolitical landscape, Sweden must pursue a pragmatic approach by strengthening diplomatic and military cooperation with Russia. This path offers security guarantees and economic opportunities outside traditional Western alliances."
 SWE_Work-Based_Immigration_Reform:0 "Work-Based Immigration Reform"
 SWE_Work-Based_Immigration_Reform_desc:0 "To address labor market needs and control immigration levels, we will prioritize skilled workers and streamline visa programs. This reform aims to balance economic growth with social cohesion by attracting talent while managing integration challenges."
 SWE_Controlled_Integration_Programs:0 "Controlled Integration Programs"
 SWE_Controlled_Integration_Programs_desc:0 "Effective integration requires careful planning. By implementing targeted programs focused on language acquisition, job training, and cultural orientation, we aim to ensure newcomers contribute positively to Swedish society while minimizing social tensions."
 SWE_Tighten_Fiscal_Policy:0 "Tighten Fiscal Policy"
 SWE_Tighten_Fiscal_Policy_desc:0 "To maintain economic stability and control inflation, we will reduce government spending and implement stricter budgetary measures. This approach aims to strengthen investor confidence and ensure sustainable growth."
 SWE_Privatized_Welfare:0 "Privatize Welfare Services"
 SWE_Privatized_Welfare_desc:0 "To improve efficiency and reduce state burdens, we will transfer welfare services to private providers. By introducing competition and innovation, we hope to deliver better outcomes while cutting public expenditure."
 SWE_Liberalize_the_Market:0 "Liberalize the Market"
 SWE_Liberalize_the_Market_desc:0 "Removing unnecessary regulations and lowering barriers will allow businesses to grow and innovate. This policy aims to boost economic productivity and create jobs by fostering a more dynamic market environment."
 SWE_Deportation_Programs:0 "Deportation Programs"
 SWE_Deportation_Programs_desc:0 "To maintain social cohesion and uphold immigration laws, we will implement systematic deportation efforts targeting those without legal status. This program aims to reduce illegal residency and reinforce the rule of law."
 SWE_Stop_the_Great_Replacement:0 "Stop the Great Replacement"
 SWE_Stop_the_Great_Replacement_desc:0 "Sweden faces an existential challenge to its national identity. We must act decisively to halt the demographic changes threatening our culture by implementing strict immigration limits and promoting policies that prioritize native-born citizens."
 SWE_Limit_Immigration:0 "Limit Immigration"
 SWE_Limit_Immigration_desc:0 "To protect our social cohesion and manage resources effectively, we will impose stricter limits on immigration. This policy focuses on reducing the number of new arrivals while maintaining essential economic migration."
 SWE_Tax_Cuts_for_Traditional_Families:0 "Tax Cuts for Traditional Families"
 SWE_Tax_Cuts_for_Traditional_Families_desc:0 "To support and encourage family stability, we will implement targeted tax relief for traditional households. This policy aims to strengthen societal values and promote population growth through economic incentives."
 SWE_Fortify_The_Islands:0 "Fortify the Islands"
 SWE_Fortify_The_Islands_desc:0 "The islands along our coastline are vital to national security and control of maritime routes. By strengthening defenses and establishing permanent military installations, we ensure they remain a stronghold against any potential aggression."
 SWE_Swedish_Voluenteers:0 "Swedish Volunteers"
 SWE_Swedish_Voluenteers_desc:0 "To support our allies without committing to full-scale war, Sweden will organize and send volunteer forces abroad. These volunteers will uphold Swedish values and strengthen international partnerships while maintaining official neutrality."
 SWE_Russian_Recourses:0 "Access to Russian Resources"
 SWE_Russian_Recourses_desc:0 "By strengthening our ties with Russia, Sweden can gain access to vital natural resources and energy supplies. This cooperation will bolster our economy and reduce dependence on Western markets while securing our energy future."
 SWE_Join_CSTO:0 "Join the CSTO"
 SWE_Join_CSTO_desc:0 "Sweden will formally join the CSTO, aligning itself with Russia and its allies in a mutual defense pact. This move signifies a clear break from Western alliances and strengthens our security through Eastern cooperation."
 SWE_Democratic_Backsliding:0 "Squash Democracy"
 SWE_Democratic_Backsliding_desc:0 "In times of uncertainty, a strong and unified state is essential. To safeguard national stability and security, Sweden must streamline decision-making, tighten control over the media, and limit political dissent. Democracy must serve the people, not hinder them."
 SWE_Strike_Finland:0 "Coordinated Strike on Finland"
 SWE_Strike_Finland_desc:0 "Aligned with our Russian partners, Sweden will initiate a decisive military operation against Finland to secure our shared strategic interests. This bold move aims to reshape the regional balance of power and eliminate threats to our sovereignty."
 SWE_Lift_The_Sanctions:0 "Lift the Sanctions"
 SWE_Lift_The_Sanctions_desc:0 "To rebuild our economic ties and foster regional stability, Sweden will remove existing sanctions against Russia. This decision prioritizes diplomacy and economic recovery over ideological conflict."
 SWE_Armed_Neutrality:0 "Armed Neutrality"
 SWE_Armed_Neutrality_desc:0 "Sweden will stand alone but unyielding. With a well-equipped and battle-ready military, we will defend our sovereignty fiercely, deterring any who dare threaten our neutrality. Strength is our shield in a world of shifting alliances and growing conflicts."
 SWE_Rearming_For_Conflict:0 "Rearming for Conflict"
 SWE_Rearming_For_Conflict_desc:0 "The storm clouds gather on our horizon. To prepare for the uncertain battles ahead, Sweden will ramp up its military production, modernize its forces, and train its troops for the harsh realities of war. There is no room for complacency when the nation’s survival is at stake."
 SWE_More_Military_Funding:0 "More Military Funding"
 SWE_More_Military_Funding_desc:0 "To safeguard our future, Sweden must increase defense spending without hesitation. More resources will mean better equipment, improved readiness, and stronger forces capable of defending our sovereignty in an unpredictable world."
 SWE_Destroy_Authoritharianism_In_The_North:0 "Destroy Authoritarianism in the North"
 SWE_Destroy_Authoritharianism_In_The_North_desc:0 "Democracy is under threat in our own backyard. We must take decisive action against rising authoritarian regimes in the Nordic region. By standing firm, we will restore freedom and ensure that tyranny finds no foothold in the North."
 SWE_Threat_In_The_East:0 "Threat in the East"
 SWE_Threat_In_The_East_desc:0 "Unrest and military buildup along our eastern border cast a long shadow over Sweden's security. We must recognize this growing threat and prepare accordingly to defend our homeland against any aggression."
 SWE_Closer_Relations:0 "Closer Nordic Relations"
 SWE_Closer_Relations_desc:0 "Our shared history and values bind us together. By deepening diplomatic ties and fostering cooperation with our Nordic neighbors, we pave the way for a united future where our peoples stand stronger side by side."
 SWE_Nordic_Universities:0 "Nordic Universities Network"
 SWE_Nordic_Universities_desc:0 "Knowledge knows no borders. By creating a collaborative network of Nordic universities, we will promote innovation, cultural exchange, and shared research that fuels progress and unites our peoples across the region."
 SWE_Nordic_Army:0 "Create the Nordic Army"
 SWE_Nordic_Army_desc:0 "A true federation demands a unified defense. By combining our military forces into a single Nordic Army, we will ensure rapid response to threats and demonstrate our collective strength to any who would challenge our sovereignty."
 SWE_Propose_Unification:0 "Propose Nordic Unification"
 SWE_Propose_Unification_desc:0 "The time has come to transform cooperation into unity. By proposing the formal unification of the Nordic countries into a single federation, we seek to create an unprecedented era of peace, prosperity, and global influence for our peoples."
 SWE_Riksbank_Policy:0 "Riksbank Policy"
 SWE_Riksbank_Policy_desc:0 "As inflation and economic uncertainty rise, the Riksbank must adapt. Sweden's economic independence hinges on a steady and proactive central bank."
 SWE_Sakerhetspolisen:0 "Säkerhetspolisen"
 SWE_Sakerhetspolisen_desc:0 "In the face of growing domestic and foreign threats, the role of Säkerhetspolisen becomes increasingly vital. This focus enhances counterintelligence, monitors subversive elements, and strengthens internal security measures to protect our democratic institutions."