l_simp_chinese:
 HAM_focus:0 "Foreign Military Training"
 HAM_focus_desc:0 "To stand against stronger adversaries, our forces must learn from abroad. Through discreet channels, we can acquire training, doctrine, and expertise that will sharpen our capabilities."
 HAM_victory_over_israel:0 "Victory Over Israel"
 HAM_victory_over_israel_desc:0 "Against all odds, we have prevailed. The balance of power in the region has shifted, and we must now decide how to shape the aftermath of this historic turning point."
 HAM_integrate_israeli_territories:0 "Integrate Israeli Territories"
 HAM_integrate_israeli_territories_desc:0 "With new lands under our control, the challenge turns to governance. Administration, infrastructure, and security must be extended to ensure lasting stability."
 HAM_deport_zionists_and_keep_scientists:0 "Expel Political Opponents, Retain Specialists"
 HAM_deport_zionists_and_keep_scientists_desc:0 "We must secure our rule while preserving valuable expertise. Political opponents will be removed, while skilled individuals may be retained to aid in reconstruction and development."
 HAM_deport_jews:0 "Mass Expulsions"
 HAM_deport_jews_desc:0 "A radical policy of demographic restructuring is proposed, aiming to remove entire populations from newly controlled territories. Such actions will have profound humanitarian and international consequences."
 HAM_trial_israeli_war_criminals:0 "Put Israeli War Criminals on Trial"
 HAM_trial_israeli_war_criminals_desc:0 "Justice must be seen to be done. Establishing tribunals to prosecute alleged war crimes will send a message both domestically and internationally."
 HAM_one_state_two_peoples:0 "One State Two Peoples"
 HAM_one_state_two_peoples_desc:0 "Rather than division, a unified state may offer a path forward. Balancing coexistence between different communities will require careful political and social engineering."
 HAM_study_the_border9:0 "Urban Warfare Doctrine"
 HAM_study_the_border9_desc:0 "Future conflicts will be fought in dense urban environments. Developing specialized doctrines for such conditions will be essential for success."
 HAM_quiet_before_the_storm:0 "Quiet Before the Storm"
 HAM_quiet_before_the_storm_desc:0 "A period of calm allows us to prepare in secrecy. Beneath the surface, plans are laid and forces readied for what is to come."
 HAM_expand_tunnel_grid:0 "Expand the Tunnel Grid"
 HAM_expand_tunnel_grid_desc:0 "Underground infrastructure offers mobility and protection. Expanding this network will enhance both logistics and defensive capabilities."
 HAM_deceive_the_watchers:0 "Deceive the Watchers"
 HAM_deceive_the_watchers_desc:0 "Our opponents rely heavily on surveillance. Through deception and misdirection, we can obscure our true intentions."
 HAM_study_the_border:0 "Study the Border"
 HAM_study_the_border_desc:0 "Understanding terrain, patrol patterns, and defensive structures is key to any future operation."
 HAM_train_assault_units:0 "Train Assault Units"
 HAM_train_assault_units_desc:0 "Specialized units must be trained for rapid, coordinated actions. Discipline and preparation will determine their effectiveness."
 HAM_secure_forgein_aid:0 "Secure Foreign Aid"
 HAM_secure_forgein_aid_desc:0 "External support, financial, material, or political, can greatly enhance our position. We must cultivate relationships that serve our interests."
 HAM_finalize_the_operation:0 "Finalize the Operation"
 HAM_finalize_the_operation_desc:0 "All preparations must now be brought together into a coherent plan. Timing, coordination, and secrecy are critical."
 HAM_launch_the_offensive:0 "Launch the Offensive"
 HAM_launch_the_offensive_desc:0 "The moment has come. Carefully laid plans are put into action, and the region braces for the consequences."
 HAM_consolidate_authority:0 "Consolidate Authority"
 HAM_consolidate_authority_desc:0 "Power must be secured internally. Rival factions and competing interests must be brought under control."
 HAM_control_the_streets:0 "Control the Streets"
 HAM_control_the_streets_desc:0 "Maintaining order in urban areas is essential. Security forces must ensure stability and prevent unrest."
 HAM_study_the_border1:0 "Silence Rivals"
 HAM_study_the_border1_desc:0 "Internal dissent can weaken our position. Steps must be taken to neutralize opposition."
 HAM_smuggle_weapons:0 "Smuggle Weapons"
 HAM_smuggle_weapons_desc:0 "Acquiring arms through unconventional means will bolster our capabilities despite external restrictions."
 HAM_martyr_brigades:0 "Dedicated Brigades"
 HAM_martyr_brigades_desc:0 "Highly motivated units can have a disproportionate impact on the battlefield, particularly in asymmetric conflicts."
 HAM_decentralized_cells:0 "Decentralized Cells"
 HAM_decentralized_cells_desc:0 "A flexible structure reduces vulnerability. Independent cells can operate even if central command is disrupted."
 HAM_propaganda_warfare:0 "Information Warfare"
 HAM_propaganda_warfare_desc:0 "The battle for perception is as important as the battlefield itself. Controlling the narrative can shape outcomes."
 HAM_stockpile_arsenal2:0 "Mass Rocket Production"
 HAM_stockpile_arsenal2_desc:0 "Scaling up production capabilities will ensure a steady supply of weapons for sustained operations."
 HAM_stockpile_arsenal:0 "Drone Recon Teams"
 HAM_stockpile_arsenal_desc:0 "Unmanned systems provide valuable intelligence with minimal risk to personnel."
 HAM_stockpile_arsenal1:0 "Stockpile Equipment"
 HAM_stockpile_arsenal1_desc:0 "Building reserves of equipment ensures readiness for prolonged engagements."
 HAM_study_the_border4:0 "Repair the Grid"
 HAM_study_the_border4_desc:0 "Damaged infrastructure must be restored to maintain operational efficiency."
 HAM_study_the_border5:0 "Underground Workshops"
 HAM_study_the_border5_desc:0 "Hidden production facilities allow us to continue manufacturing despite external pressures."
 HAM_study_the_border6:0 "Smuggling Networks"
 HAM_study_the_border6_desc:0 "Expanding logistical routes ensures a steady flow of goods and materials."
 HAM_study_the_border7:0 "Foreign Donations"
 HAM_study_the_border7_desc:0 "Support from abroad can provide critical funding for both civil and military needs."
 HAM_study_the_border8:0 "Civilian Reconstruction"
 HAM_study_the_border8_desc:0 "Rebuilding civilian infrastructure will strengthen legitimacy and public support."
 HAM_study_the_border0:0 "Religious Administration"
 HAM_study_the_border0_desc:0 "Religious institutions can play a central role in governance and social cohesion."
 HAM_study_the_border2:0 "Civil Obedience"
 HAM_study_the_border2_desc:0 "Ensuring compliance with state authority is essential for maintaining order."
 HAM_study_the_border3:0 "Civil Governance Committees"
 HAM_study_the_border3_desc:0 "Local administrative bodies can help manage day to day governance and improve efficiency."