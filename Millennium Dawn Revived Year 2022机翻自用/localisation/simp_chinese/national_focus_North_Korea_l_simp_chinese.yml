l_simp_chinese:
 PRK_Kim_Dynasty:0 "The Kim Dynasty"
 PRK_Kim_Dynasty_desc:0 "Since the founding of the Democratic People's Republic of Korea, the state has been inseparable from the Kim family. Power flows through blood, loyalty, and fear, binding the Party, the military, and the people to a single ruling dynasty."
 PRK_Continue_The_Missile_Tests:0 "Continue the Missile Tests"
 PRK_Continue_The_Missile_Tests_desc:0 "The development and demonstration of strategic weapons remains central to the survival of the state. By continuing a program of frequent missile tests, the leadership seeks to strengthen deterrence, project strength abroad, and reinforce its authority at home, regardless of international condemnation."
 PRK_Succes:0 "Korea Always Delivers"
 PRK_Fail:0 "Cover Up the Disaster"
 PRK_Fail_desc:0 "Not every test proceeds as planned. When failure occurs, the regime responds not with transparency, but with silence and control. Information is suppressed, narratives are rewritten, and responsibility is quietly reassigned to prevent damage to the authority of the leadership."
 PRK_Undermine_Kims_Authority:0 "Undermine the Supreme Leader"
 PRK_Undermine_Kims_Authority_desc:0 "Behind closed doors, rival factions within the Party and the military begin to question the competence and direction of the Supreme Leader. While open dissent remains unthinkable, subtle challenges to authority emerge through obstruction, quiet disloyalty, and the erosion of personal loyalty."
 PRK_Coup_In_Korea:0 "Coup in Korea"
 PRK_Coup_In_Korea_desc:0 "As internal tensions reach a breaking point, elements of the military and security apparatus move to seize control of the state. The fate of the leadership is decided not by the people, but by those who command the guns, marking a decisive rupture in the political order of the Republic."
 PRK_Post_Covid_Economy:0 "Rebuilding the Post-§0COVID§! Economy"
 PRK_Post_Covid_Economy_desc:0 "The COVID-19 pandemic forced North Korea to close its borders, disrupting trade and slowing industry. Factories and transportation networks suffered, straining the economy. The leadership now mobilizes resources and the population to recover lost production under strict Party control. Despite efforts, shortages and inefficiencies continue to challenge the regime."
 PRK_Chollima_Steel_Complex:0 "Chollima Steel Complex"
 PRK_Chollima_Steel_Complex_desc:0 "North Korea’s largest steel plant, a symbol of industrial pride. Workers push to meet ambitious quotas under strict Party control. It feeds both civilian infrastructure and the military."
 PRK_Ministry_Of_Mining:0 "Ministry of Mining"
 PRK_Ministry_Of_Mining_desc:0 "Oversees coal, iron, and rare minerals vital for industry and the military. Production continues despite outdated equipment. The ministry fuels both steel and armament programs."
 PRK_Print_More_Won:0 "Printing More Won"
 PRK_Print_More_Won_desc:0 "The state has ordered the production of more currency to fund industry and military programs. Inflation and shortages rise, but the regime prioritizes control and spending. Citizens face tighter budgets while the government strengthens its programs."
 PRK_Military_Investing:0 "Investing in the Military"
 PRK_Military_Investing_desc:0 "The regime pours resources into the Korean People’s Army, modernizing equipment and expanding capabilities. Soldiers train relentlessly under strict Party oversight. Military strength remains the core of national security and regime survival."
 PRK_DMZ:0 "Fortifying the DMZ"
 PRK_DMZ_desc:0 "The regime strengthens defenses along the Demilitarized Zone. Forts and bunkers are constructed to deter invasion. Soldiers and engineers work tirelessly to secure the border."
 PRK_Our_Great_Wall_Of_China:0 "Our Great Wall of the South"
 PRK_Our_Great_Wall_Of_China_desc:0 "The regime strengthens defenses along the Demilitarized Zone facing South Korea. Forts, bunkers, and observation posts are built to repel any attack. Soldiers work relentlessly to ensure the South cannot breach the border."
 PRK_Protrct_The_Coast:0 "Protect the Coast"
 PRK_Protrct_The_Coast_desc:0 "We must strengthen our coastal defenses against any amphibious attack. Artillery, bunkers, and patrols guard every key point along our shores. Our navy and army stand ready to repel any invader."
 PRK_Increase_Factory_Production_Qotas:0 "Increase Factory Production Quotas"
 PRK_Increase_Factory_Production_Qotas_desc:0 "We must raise production quotas in all factories to meet the demands of our people and our army. Workers are mobilized under Party guidance to achieve these goals. Every factory contributes to the strength and self reliance of our nation."
 PRK_Strenghten_Educational_Standards:0 "Strengthen Educational Standards"
 PRK_Strenghten_Educational_Standards_desc:0 "We must improve the education of our youth to build a strong and loyal nation. Schools train students in science, labor, and ideology under strict Party guidance. Every child and teacher contributes to the future strength and unity of our country."
 PRK_Open_New_Factories:0 "Open New Factories"
 PRK_Open_New_Factories_desc:0 "We must build new factories to strengthen our industry and support our army. Workers and engineers are mobilized to bring production online quickly. Every new factory brings us closer to self-reliance and national strength."
 PRK_Copy_Foreign_Technology:0 "Copy Foreign Technology"
 PRK_Copy_Foreign_Technology_desc:0 "We must acquire and adapt foreign technology to strengthen our industry and military. Scientists and engineers work tirelessly to reverse-engineer every innovation. Every discovery brings us closer to self-reliance and national power."
 PRK_Deals_With_China:0 "Strengthen Ties with China"
 PRK_Deals_With_China_desc:0 "We must maintain and strengthen our relationship with China to support trade and strategic security. Diplomats and officials work tirelessly to ensure mutual benefit. Every agreement reinforces the survival and prosperity of our nation."
 PRK_Open_Up_Private_Business:0 "Allow Private Enterprise"
 PRK_Open_Up_Private_Business_desc:0 "We must permit limited private businesses to stimulate the economy and improve living standards. Entrepreneurs and workers are encouraged to innovate under Party supervision. Every small enterprise strengthens our self-reliance and national resilience."
 PRK_Reform_The_Command_Economy:0 "Reform the Command Economy"
 PRK_Reform_The_Command_Economy_desc:0 "We must improve our state-controlled economy to increase efficiency and production. Factories and ministries adjust operations under strict oversight. Every reform brings our nation closer to strength and self-reliance."
 PRK_North_Korea_In_The_21s_Century:0 "[PRK.GetName] in the 21st Century"
 PRK_North_Korea_In_The_21s_Century_desc:0 "We must modernize our nation to face the challenges of the 21st century. Industry, science, and the military are developed under strict Party guidance. Every effort ensures the strength, independence, and survival of our country."
 PRK_Convene_The_Victoriouse_Generals:0 "Convene the Victorious Generals"
 PRK_Convene_The_Victoriouse_Generals_desc:0 "With the Kim dynasty removed from power, the generals who carried out the coup now gather to determine the future of the state. The army moves swiftly to secure authority, eliminate remaining loyalists, and present itself as the savior of the nation. From this council of officers, a new order will be forged."
 PRK_More_Like_Under_New_Management:0 "Not Free. More Like Under New Management"
 PRK_More_Like_Under_New_Management_desc:0 "With the Kim family removed from power, the state is now directed by a new authority. The military assumes control of governance, restoring order and discipline across the country. Though the symbols remain, the leadership of the nation has fundamentally changed."
 PRK_De_Kimmification:0 "De-Kimification"
 PRK_De_Kimmification_desc:0 "The cult of the Kim dynasty has shackled the nation for generations. Statues are removed, propaganda rewritten, and Juche dismantled piece by piece. This is a dangerous break with the past, but one the generals believe is necessary for the state's survival."
 PRK_Keep_The_Kim_Family_As_Symbols:0 "Keep the Kim Family as Symbols"
 PRK_Keep_The_Kim_Family_As_Symbols_desc:0 "Though real power now rests with the military, the Kim family remains a useful symbol of continuity and unity. Statues stand, portraits remain, and Juche endures in name if not in practice. The people are reassured, even as authority quietly shifts behind the scenes."
 PRK_An_Ally_In_Russia:0 "An Ally in Russia"
 PRK_An_Ally_In_Russia_desc:0 "With the world aligned against us, we must seek partners who share our hostility toward Western dominance. Russia offers military cooperation, diplomatic cover, and a shared interest in challenging the global order. This partnership may prove vital to the survival of our state."
 PRK_We_Stand_Alone:0 "We Stand Alone"
 PRK_We_Stand_Alone_desc:0 "Surrounded by hostile powers and abandoned by false partners, we rely only on our own strength. Juche is reaffirmed not as a slogan, but as a necessity for survival. Alone, disciplined, and determined, the nation prepares to face the world."
 PRK_Ally_Seek_Friendship_In_Beijing:0 "Seek Friendship in Beijing"
 PRK_Ally_Seek_Friendship_In_Beijing_desc:0 "China remains our most important neighbor and an essential counterbalance to Western pressure. Through diplomacy and cooperation, we seek economic support, security guarantees, and political backing. Friendship with Beijing may ensure the survival of our state in an increasingly hostile world."
 PRK_Join_The_SCO:0 "Join Forces With China"
 PRK_Join_The_SCO_desc:0 "As global blocs solidify, we seek security and legitimacy through regional cooperation. Membership in the Shanghai Cooperation Organisation offers diplomatic cover, military dialogue, and economic coordination beyond Western influence. Through the SCO, we secure our place in a multipolar world."
 PRK_A_Succesfull_Missile_Launch:0 "A Successful Missile Launch"
 PRK_A_Succesfull_Missile_Launch_desc:0 "Unlike the disastrous launch that exposed weakness and shattered the old leadership, this test proceeds flawlessly. The missile rises into the sky, proving that the state still commands strength, discipline, and technological capability. At home and abroad, the message is clear North Korea remains a force to be reckoned with."
 PRK_Better_Under_China:0 "Better Under China"
 PRK_Better_Under_China_desc:0 "Facing isolation and overwhelming pressure, we accept that survival may require submission. By placing ourselves under China’s protection, we secure economic lifelines and military guarantees at the cost of true independence. It is a bitter choice, but one made to ensure the continuation of the state."
 PRK_Mimic_China:0 "Mimic the Chinese Model"
 PRK_Mimic_China_desc:0 "China has preserved Party rule while unlocking economic growth and stability. By carefully studying and adapting this model, we seek controlled reform without surrendering authority. If executed correctly, we may strengthen the state while avoiding collapse."
 PRK_Invite_Chineese_Experts:0 "Invite Chinese Experts"
 PRK_Invite_Chineese_Experts_desc:0 "To strengthen our industry and military, we invite Chinese advisors and engineers to assist in key projects. Their experience will help modernize production and fortifications while we retain full control of the state. Knowledge gained abroad is harnessed for the glory and self-reliance of our nation."
 PRK_Build_Trust:0 "Build Trust"
 PRK_Build_Trust_desc:0 "Following the success of our latest missile test, we must consolidate confidence both within the state and abroad. The people are reassured of our strength, while foreign powers are reminded of our capabilities. By demonstrating discipline and reliability, we secure the nation's position in a hostile world."
 PRK_North_Koreans_In_Ukraine:0 "North Koreans in Ukraine"
 PRK_North_Koreans_In_Ukraine_desc:0 "Our soldiers and specialists are gaining valuable battlefield experience abroad. Though officially denied, their presence strengthens allied forces while allowing us to study modern warfare under real combat conditions."
 PRK_Visit_Moscow:0 "[PRK.GetLeader] Visits Moscow"
 PRK_Visit_Moscow_desc:0 "A high-level delegation led by the Supreme Leader will travel to Moscow to meet with [SOV.GetLeader]. Strengthening ties with Russia ensures diplomatic backing, military cooperation, and continued resistance against Western pressure."
 PRK_North_Korean_Nuclear_Program:0 "The North Korean Nuclear Program"
 PRK_North_Korean_Nuclear_Program_desc:0 "In a world of hostile powers and constant threats, nuclear weapons are the ultimate guarantee of our sovereignty. Expanding the nuclear program ensures that no enemy will ever dare to step a foot on Korean soil. The survival of the state depends on thease wepons of mass destruction."
 PRK_Harsher_Punishment_On_Online_Activity:0 "Harsher Punishment on Online Activity"
 PRK_Harsher_Punishment_On_Online_Activity_desc:0 "The spread of foreign ideas and subversive content online threatens the unity of the state. Stricter penalties and increased monitoring will ensure the people remain loyal to the revolution and the Supreme Leader."
 PRK_Train_Production:0 "Expand Train Production"
 PRK_Train_Production_desc:0 "Rail transport is the lifeblood of industry and the military. Increasing train production will improve logistics, strengthen the economy, and ensure that supplies reach every corner of the nation efficiently."
 PRK_Limit_Corruption:0 "Limit Corruption"
 PRK_Limit_Corruption_desc:0 "Corruption weakens the revolution from within. By rooting out dishonest officials and enforcing strict discipline, the state strengthens its efficiency and ensures loyalty to the Supreme Leader."
 PRK_Kim_Jong_Uns_Cult_Of_Personality:0 "Kim Jong Un's Cult of Personality"
 PRK_Kim_Jong_Uns_Cult_Of_Personality_desc:0 "The Supreme Leader is the guiding light of the nation. Every citizen must revere, honor, and emulate him. The the survival of the state depends on absolute loyalty to Kim Jong Un."
 PRK_Kim_Steps_Down:0 "The Supreme Leader Steps Down"
 PRK_Kim_Steps_Down_desc:0 "Due to declining health, the Supreme Leader has relinquished his duties. The nation must remain united, ensuring the continuity of the revolution and the security of the Kim family’s leadership."
 PRK_Observe_Others_Battle_Tactics:0 "Observe Other Nations' Battle Tactics"
 PRK_Observe_Others_Battle_Tactics_desc:0 "Our military analysts study foreign conflicts and training exercises to learn new strategies. Observing the battlefield techniques of other nations allows the Korean People’s Army to adapt and improve its own combat effectiveness."
 PRK_Buy_Russian_Drones:0 "Acquire Russian Drones"
 PRK_Buy_Russian_Drones_desc:0 "The Supreme Leader authorizes the purchase of advanced unmanned systems from Russia. These drones will enhance reconnaissance, modernize our forces, and give the Korean People’s Army a technological edge over potential adversaries."
 PRK_Focus_On_Artillery:0 "Thunder from the Hills"
 PRK_Focus_On_Artillery_desc:0 "Our artillery units shall become the hammer of the revolution. With relentless drills and improved production, the Korean People’s Army will strike like thunder, crushing any who dare threaten the Supreme Leader’s homeland."
 PRK_Domestic_Weapons_Production:0 "Forge the Nation’s Arsenal"
 PRK_Domestic_Weapons_Production_desc:0 "The factories of the homeland shall blaze with purpose, crafting weapons for the glory of the Supreme Leader. Every rifle, shell, and missile produced strengthens our sovereignty and the unbreakable will of the revolution."
 PRK_Propose_Russian_Help_With_Invasion_Of_Manchuria:0 "Request Russian Aid in Manchuria"
 PRK_Propose_Russian_Help_With_Invasion_Of_Manchuria_desc:0 "Through the CSTO, the Supreme Leader formally requests Russia’s support in our campaign to secure Manchuria. Their strength will bolster our forces, while the operation demonstrates the unity and resolve of the alliance under our leadership."
 PRK_Once_Again_With_Russian_Support:0 "Once Again, With Russian Support"
 PRK_Once_Again_With_Russian_Support_desc:0 "With the might of Russia at our side, the Supreme Leader marshals the Korean People’s Army for the long-awaited campaign to reunify the peninsula. This operation will strike decisively, demonstrating the strength of our alliance and the unbreakable resolve of the revolution."
 PRK_Prepare_The_Populace_For_War:0 "Prepare the Populace for War"
 PRK_Prepare_The_Populace_For_War_desc:0 "The drums of war grow louder. Through mass rallies, relentless propaganda, and civil defense training, the people are conditioned for sacrifice, discipline, and absolute unity behind the Supreme Leader."
 PRK_Surprise_Strike:0 "Strike Before Dawn"
 PRK_Surprise_Strike_desc:0 "Without allies and without warning, the Korean People’s Army prepares to move under the cover of silence. Speed, shock, and absolute secrecy will decide the fate of the peninsula as the Supreme Leader orders a decisive blow before the enemy can react."
 PRK_Request_Handover_Of_Historic_Korea:0 "Request the Return of Historic Korea"
 PRK_Request_Handover_Of_Historic_Korea_desc:0 "As a loyal partner within China’s sphere, we formally petition Beijing to address the question of historic Korean lands. Presented as a matter of socialist brotherhood and historical justice, this request tests how far our patron is willing to reshape borders in the name of unity and stability."
 PRK_Request_Joint_Invasion_Of_The_South:0 "Request Joint Invasion of the South"
 PRK_Request_Joint_Invasion_Of_The_South_desc:0 "As a loyal ally under Beijing’s guidance, the Supreme Leader proposes a coordinated campaign to reunify the peninsula. By presenting it as a joint effort, we gain both military support and political cover for our ambitions."
 PRK_Industrial_Expansion:0 "Forge the Nation's Might"
 PRK_Industrial_Expansion_desc:0 "Under the strict command of the military junta, factories roar to life and steel flows like rivers. Every new plant and workshop strengthens the army, arms our troops, and solidifies the junta’s iron grip over the nation."
 PRK_Reform_The_Administration:0 "Reform the Administration"
 PRK_Reform_The_Administration_desc:0 "The machinery of the state must serve the revolution efficiently. Corrupt and incompetent officials are replaced, bureaucracies streamlined, and the administration reoriented."
 PRK_Strike_South:0 "Crush the South"
 PRK_Strike_South_desc:0 "The Korean People’s Army moves to reunify the peninsula under the Supreme Leader’s command. Precision, speed, and relentless force will ensure that resistance is crushed and the revolution’s mandate is enforced across all southern territories."
 PRK_Southern_Occupation_Force:0 "Southern Occupation Administration"
 PRK_Southern_Occupation_Force_desc:0 "A provisional administration is established in the South to integrate the occupied territories into the revolution. Officials loyal to the Supreme Leader work tirelessly to stabilize the region, enforce the new order, and prepare the people for full reunification under the DPRK."
 PRK_United_At_Last:0 "§eUnited at Last§!"
 PRK_United_At_Last_desc:0 "After decades of hardship, famine, and isolation, the peninsula is finally brought together under a single administration. The military and provisional authorities have secured the South, overcoming past crises and proving the resilience of the northern state. Korea stands whole once more, shaped by struggle and endurance."
 PRK_Reclaim_Historical_Korea:0 "Reclaim Historical Korea"
 PRK_Reclaim_Historical_Korea_desc:0 "Northern forces prepare to move into Manchuria, home to significant Korean communities and a land long tied to our history. This operation is framed as protecting our people abroad and restoring their connection to the homeland, while asserting control in a region long shaped by external powers."
 PRK_Successor:0 "New Leadership"
 PRK_Successor_desc:0 "Due to declining health, Kim Jong Un steps down from his position. His sister assumes leadership, with military and administrative authorities supporting the transition to ensure stability and continuity in the reunified northern state."