 north_korea_news.1.t:0 "Korea United Under the South's Leadership"
 north_korea_news.1.d:0 "The long-standing division of the Korean Peninsula has come to an end, as North Korea has been brought under the leadership of the South. Whether through diplomacy or other means, Korea now stands united once more a momentous shift in East Asian history."
 north_korea_news.2.t:0 "North Korea Announces Missile Test"
 north_korea_news.2.d:0 "North Korea has informed the world of a successful test of a thermonuclear-capable missile, which flew over Japan before landing in the designated waters. The state emphasizes that the launch was carried out to strengthen national defense and assert the country's right to self-reliance."
 north_korea_news.3.t:0 "Military Coup in North Korea"
 north_korea_news.3.d:0 "North Korea has reportedly experienced a sudden and dramatic shift in power, as elements of the Korean People's Army have seized control of the state. State media has announced that the military has assumed responsibility for national leadership in order to preserve stability and defend the revolution. The status of Kim Jong Un remains unclear, while foreign governments closely monitor developments amid fears of regional instability."
 north_korea_news.4.t:0 "Beijing Assumes Overlordship over [PRK.getname]"
 north_korea_news.4.d:0 "The government of the People's Republic of China has formally established political and military dominance over North Korea, marking a decisive shift in the balance of power on the Korean Peninsula. Pyongyang, long reliant on Chinese support, now finds itself firmly within Beijing’s sphere of control. International observers view the move as the culmination of years of dependency, signaling a new era of Chinese influence in Northeast Asia."
 north_korea.1.t:0 "South Korea Proposes Unification"
 north_korea.1.d:0 "As we have now adopted a democratic form of government a and cast aside the Kim family, we now have the question of korean unification ?"
 north_korea.2.t:0 "Missile Test Proposal"
 north_korea.2.d:0 "The Korean People's Army has submitted a proposal to conduct a missile test later this year. After review, the Supreme Leader has granted approval."
 north_korea.3.t:0 "Strategic Missile Test"
 north_korea.3.d:0 "Under the direct guidance of the Supreme Leader, the strategic missile forces of the Republic are conducting a critical test launch. The outcome of this exercise will determine the credibility of the weapons program and the prestige of the leadership. Commanders await the results with caution and confidence."
 north_korea.4.t:0 "Missile Test Failure"
 north_korea.4.d:0 "A recent missile launch has failed to reach its intended target due to technical difficulties. The leadership has ordered an immediate investigation into the incident, emphasizing that the strategic weapons program remains under the direct guidance of the Supreme Leader. State media will carefully manage the narrative to maintain confidence in the regime and avoid any perception of weakness."
 north_korea.5.t:0 "Missile Test Success"
 north_korea.5.d:0 "The strategic missile forces have successfully completed the test under the direct guidance of the Supreme Leader. The launch demonstrates the capability of the Republic’s weapons program and reinforces the authority of the leadership. Commanders and engineers are praised for their skill and diligence, and preparations begin for the next phase of development."
 north_korea.6.t:0 "Supreme Leader's New Year Address"
 north_korea.6.d:0 "The Supreme Leader has delivered a New Year's message to the people of the Democratic People's Republic of Korea. In his address, he praised the dedication of the Korean People's Army, celebrated the achievements of the nation’s strategic programs, and called for continued unity, loyalty, and hard work in the year ahead. Citizens are encouraged to strengthen the revolutionary spirit, support the Party, and uphold the principles of self-reliance to ensure the prosperity and security of the Republic."
 north_korea.7.t:0 "Day of the Sun Celebrations"
 north_korea.7.d:0 "Today, the Democratic People's Republic of Korea celebrates the Day of the Sun, the birthday of the Eternal President Kim Il Sung. Across the nation, citizens participate in parades, rallies, and cultural events honoring the founding leader. The Supreme Leader addresses the population, praising the achievements of the Party, the military, and the people, and calls for continued loyalty and dedication to the principles of Juche and the revolutionary spirit. The celebrations serve as a reminder of the strength, unity, and self-reliance of the Republic."
 north_korea.8.t:0 "The Fall of the Kim Dynasty"
 north_korea.8.d:0 "In an unprecedented turn of events, the Korean People's Army has seized control of the state, bringing an end to the rule of the Kim family. Key institutions in Pyongyang have been secured by military forces, and Party officials loyal to the old leadership have been removed from their positions. State broadcasts announce that the era of hereditary leadership has concluded, and that the armed forces will now guide the Republic to preserve order, stability, and national survival. The future of the revolution now rests in the hands of the military."
 north_korea.9.t:0 "Kim Jong Un Detained by the Military Junta"
 north_korea.9.d:0 "During the military takeover, junta forces moved swiftly to secure Kim Jong Un and neutralize any resistance. According to internal reports, four members of his personal guard were shot after refusing to stand down. Kim Jong Un was subsequently placed under house arrest at a secured and undisclosed location, with all communications and movements tightly controlled by the Korean People's Army. The junta has declared that the former Supreme Leader no longer holds any authority, marking the definitive end of the Kim family's rule."
 north_korea.10.t:0 "Generals Meet in Secrecy"
 north_korea.10.d:0 "In the late hours of the night, senior generals of the Korean People's Army convene in secrecy at a secured location in Pyongyang. Shielded from Party oversight and loyalist intelligence, the officers discuss the deteriorating state of the Republic, the risks of continued hereditary rule, and the growing strain placed upon the armed forces. Though no public decisions are announced, it is clear that extraordinary measures are being considered. The future of the state may soon be decided not by ideology, but by force."
 north_korea.11.t:0 "The Coup Plan Is Finalized"
 north_korea.11.d:0 "After weeks of secret coordination, the senior generals of the Korean People's Army have finalized their plan. Loyal units have been identified, communications secured, and key government buildings marked for immediate seizure."
 north_korea.12.t:0 "The Junta Convenes"
 north_korea.12.d:0 "Following the removal of the previous leadership, the ruling generals convene to select a new head of state. The decision marks a turning point for the nation, as authority is consolidated and the future of the DPRK is set under new direction. The people watch closely as the country's fate hangs in the balance."
 north_korea.13.t:0 "The Mandetory Coup Speech"
 north_korea.13.d:0 "The generals address the people directly, proclaiming that the state is now under the guidance of those who ensured its survival. They promise order, discipline, and the continued defense of the homeland against internal and external threats. The message is clear the old regime is over, and a new era has begun."
 north_korea.14.t:0 "De-Kimification Begins"
 north_korea.14.d:0 "The cult of the Kim dynasty is dismantled, with statues toppled, portraits removed, and propaganda rewritten. Monuments of personality are replaced by neutral symbols of the state, and the narrative of absolute loyalty is purged from schools, media, and government institutions. This radical shift marks a turning point in the nation's history, as the junta seeks legitimacy without the shadow of the old regime."
 north_korea.15.t:0 "New Name For The Party"
 north_korea.15.d:0 "In the wake of the recent coup, the Supreme People's Congress gathers to determine the fate of the ruling party. Delegates debate whether to uphold the legacy of the Workers' Party of Korea or to forge a new identity for the nation's leadership."
 north_korea.16.t:0 "Death To The Dictator"
 north_korea.16.d:0 "The morning was heavy with silence. Kim Jong Un was dragged into the courtyard, the cold wind cutting across the stone ground. The trial had lasted barely an hour a blur of accusations and hurried declarations. As the firing squad raised their rifles, he stood alone, eyes narrowing, heartbeat pounding, the weight of everything he had commanded and destroyed pressing down. In a flash, the volley rang out, and it was over. His reign, his life, extinguished in a single, brutal moment."
 north_korea.17.t:0 "North Korea Proposes a Defensive Pact"
 north_korea.17.d:0 "North Korea has approached China with a proposal for a defensive pact. The agreement would commit both nations to defend each other in the event of an attack, signaling closer military cooperation and mutual security guarantees."
 north_korea.18.t:0 "North Korea Requests PRC Overlordship"
 north_korea.18.d:0 "Facing internal turmoil and international isolation, North Korea has formally requested that China assume overlordship of the nation. The request places the country under PRC protection and influence, reshaping the balance of power in the region."
 north_korea.19.t:0 "The War for National Reunification Begins"
 north_korea.19.d:0 "We have launched the decisive campaign to end the division of our homeland. The artificial border that has split Korea since the aftermath of the Fatherland Liberation War is being shattered by the advance of the Korean People's Army. This moment has been prepared for through decades of sacrifice, endurance, and unwavering resolve.\n\nWe act not as aggressors, but as liberators. The southern authorities have long served foreign interests, allowing our land to be occupied and our nation to remain divided. That era ends now. We fight to restore sovereignty, dignity, and unity to the Korean people.\n\nEvery factory, every village, and every soldier now stands as part of a single national effort. Hardship will come, but history has proven that we endure where others collapse. United in purpose and discipline, we march forward to complete the unfinished task of reunification."
 north_korea.20.t:0 "Give Up The Fight"
 north_korea.20.d:0 "With organized resistance in South Korea collapsing and its territory now largely under northern control, the conflict on the Korean Peninsula has entered a dangerous new phase. While hostilities between the United States and North Korea technically continue, the original purpose of the war—the defense of the South Korean state can no longer be fulfilled.\n\nMilitary planners warn that continuing the war risks uncontrolled escalation, potentially drawing in additional powers and turning the peninsula into a wider regional conflict. Others argue that withdrawing now would signal weakness and permanently alter the balance of power in East Asia.\n\nThe United States must now decide whether to accept a negotiated end to hostilities or press on despite the realities on the ground."
 north_korea.21.t:0 "North Korean Delegation Arrives in Moscow"
 north_korea.21.d:0 "A high-level delegation from the Democratic People's Republic of Korea has arrived in Moscow for talks with the Russian leadership. The visit underscores the deepening relationship between the two states amid rising global tensions and shifting alliances.\n\nDiscussions are expected to focus on military cooperation, economic exchange, and strategic coordination in response to shared security concerns. Russian officials view the talks as an opportunity to strengthen influence in East Asia while reinforcing partnerships with states opposed to Western pressure.\n\nThe outcome of these meetings may signal a new phase in Russo–Korean relations, with potential implications for regional stability and the broader international order."
 north_korea.22.t:0 "North Korea Requests Recognition of Historic Korea"
 north_korea.22.d:0 "The Democratic People's Republic of Korea has formally approached Beijing with a sensitive proposal concerning territories it describes as part of 'historic Korea.' Citing historical claims and the presence of significant ethnic Korean populations across the border, Pyongyang argues that the current boundaries fail to reflect historical and cultural realities.\n\nChinese officials view the request with caution. While relations with Pyongyang remain strategically important, any discussion of territorial revision carries serious implications for regional stability, sovereignty, and internal security. The proposal places Beijing in a difficult position, balancing alliance considerations against long-standing principles of territorial integrity.\n\nHow China responds may shape the future of relations on the Korean Peninsula—and across Northeast Asia."
 north_korea.23.t:0 "Korea at the Crossroads"
 north_korea.23.d:0 "The leadership in Pyongyang has formally requested authorization to launch a war of reunification against the South. As our subordinate ally, the Korean state looks to Beijing for direction. We may choose to intervene directly, risking international escalation, or permit our Korean comrades to act independently under our strategic umbrella."
 north_korea.24.t:0 "A Demonstration of Resolve"
 north_korea.24.d:0 "Under the authority of the Armed Forces Command, a missile launch has been authorized and carried out. The test serves as both a signal to external powers and a reaffirmation of internal unity, demonstrating that the state remains vigilant, disciplined, and prepared to defend its sovereignty. In a world defined by pressure and encirclement, strength remains the final guarantor of survival."
 south_korea_news.1.t:0 "Korean Unification Under The North's Leadership"
 south_korea_news.1.d:0 "At last, the long-divided Korean Peninsula stands whole. The North’s leadership has overseen the historic reunification, bringing an end to decades of separation, conflict, and foreign interference. From the northern mountains to the southern shores, the people of Korea are now united under a single banner. This monumental achievement reshapes the region and the dawn of a new era for the Korean nation."
 russia.1.t:0 "Victory in Ukraine!"
 russia.1.d:0 "With our swift victory in Ukraine we have shown the degenerate west that we are still a great power with a powerfull army. We will now have to manage thease new territorries"
 russia.2.t:0 "Moscow's Demands Submission"
 russia.2.d:0 "The Russian Federation has presented a proposal to further develop the Union State framework between Belarus and Russia. The initiative focuses on closer coordination in foreign policy, defense, and economic planning, with the aim of strengthening shared institutions and improving long-term stability. The proposal is framed as a continuation of existing integration processes and a step toward deeper cooperation between Minsk and Moscow."
 russia.2.o1:0 "We must accept"
 russia.2.o2:0 "Resist and bite!"
 russia.3.t:0 "Belarus accepts!"
 russia.3.d:0 "Belarus has accepted the Union State proposal. They will now follow our orders. Our other allies are however unlikely to approve."
 russia.3.o1:0 "Excellent."
 russia.4.t:0 "Belarus resists us!"
 russia.4.d:0 "Belarus has had the audacity to resist Russian wishes for a Union State! We have to prepare an answer."
 russia.4.o1:0 "Fools."
 russia.5.t:0 "Russian Imperialism threatens our Sovereignity!"
 russia.5.d:0 "Russia has united with Belarus, basically rendering the government in Minsk meaningless. This shows without a doubt that Russia is willing to put its own neo-Soviet imperialistic demands over the good of its allies! How shall we respond?"
 russia.5.o1:0 "We have to break our ties."
 russia.5.o2:0 "We have to hope for the best..."
 russia.6.t:0 "Ukraine Still Stands"
 russia.6.d:0 "Our progress in Ukraine has slowed down. Our expectations about a short war were proven wrong. The winner of the conflictt is still up in the air"
 russia.7.t:0 "Impose Sanctions on Russia ?"
 russia.7.d:0 "Russia's recent actions threaten global stability and violate international law. We must decide whether to impose economic sanctions to weaken their economy and restrict their ability to sustain military operations. However, such measures could have economic repercussions for our own nation. Should we proceed with sanctions?"
 russia.8.t:0 "Sanctions Imposed by the West"
 russia.8.d:0 "The Western powers have decided to impose economic sanctions on us in response to our recent actions. These sanctions will restrict our access to vital resources, cripple our economy, and make it harder to sustain our military efforts. We Will Show them !"
 russia.9.t:0 "The Fall of Putin"
 russia.9.d:0 "Putin has lost the support of the oligarchs and his closest allies. With mounting pressure from both the public and his inner circle, his hold on power has crumbled. His former supporters have turned against him, and he is now placed under house arrest by those who once ensured his rule. A power vacuume has emerged In Moscow."
 russia.10.t:0 "The [GetYear] State Duma Elections"
 russia.10.d:0 "As Russia struggles to recover from the humiliating defeat in Ukraine, the upcoming Duma elections will shape the nation's future. The Communist Party promises a return to Soviet-era strength and unity, vowing to restore Russia’s lost greatness. The Democrats campaign on stabilizing the shattered economy and securing international support. Meanwhile, nationalist factions call for retribution and a stronger, independent Russia. With United Russia banned due to fears of authoritarian resurgence, the country stands at a crossroads—what path shall it take?"
 Russia.10.1:0 "Under §ECommunism§! Russia Was At It's Greatest"
 Russia.10.2:0 "Elect §3Democratic§! Parties"
 russia.11.t:0 "Coalition Talks"
 russia.11.d:0 "With the communists lacking a majority, the democratic factions have united to form a government. After tense negotiations, a coalition has emerged, but its ideological direction is still uncertain."
 russia.11.1:0 "Right-Wing Coalition Led By The §cParty of Growth§!"
 russia.11.2:0 "Centrist Coalition Led By The §sYablabko§!"
 russia.11.3:0 "Left-Wing Coalition Led By The §SRussia of The Future§!"
 russia.12.t:0 "Russia Proposes Closer Ties"
 russia.12.d:0 "In the wake of its ongoing conflict in Ukraine and increasing isolation from the West, the Russian Federation has formally approached the People's Republic of China with a proposal to deepen diplomatic and economic ties. Moscow emphasizes a shared vision of a multipolar world and mutual resistance to Western influence. The offer includes expanded energy deals, joint military exercises, and greater coordination in international forums like the United Nations and BRICS."
 russia.13.t:0 "China Agrees To Closer Ties"
 russia.13.d:0 "Bejing has approved closer ties between our countries"
 russia.14.t:0 "China Declines Closer Ties"
 russia.14.d:0 "The Chineese government has responded negativly to closer ties with Russia"
 russia.15.t:0 "The Central Bank and the Oligarch Question"
 russia.15.d:0 "With the weight of sanctions bearing down on the economy a new debate has emerged within the Kremlin, what role should the oligarchs play in the future of Russia? The Central Bank calls for strict financial discipline and state oversight, while some within the regime demand purges of disloyal tycoons. Others suggest aligning oligarchic capital more closely with the national agenda, using wealth for patriotic purposes rather than personal gain."
 russia.16.t:0 "The Wagner Rebellion"
 russia.16.d:0 "The situation has spiraled out of control. Yevgeny Prigozhin, once a trusted ally and leader of the Wagner Group, has accused the military leadership of treason and launched an armed uprising. His forces have seized key cities and are advancing rapidly.The chain of command is breaking down. The Kremlin is in disarray. A decision must be made stand firm with Vladimir Putin and crush the rebellion, or take control of Wagner and lead Russia down a darker, uncertain path."
 russia.17.t:0 "Pregozin Lays Down His Arms"
 russia.17.d:0 "The traitor Pregozin has once again caved. He has decided to stop the impending march on Moscow and which would throw our country into a civil war"
 russia.18.t:0 "Wagner Defeated"
 russia.18.d:0 "We have managed to defeat the traitorouse wagner coup. Russia and Putin stand ! "
 russia.19.t:0 "Invitation to the [SOV.GetFactionName]"
 russia.19.d:0 "[SOV.GetNameDef] has extended an official invitation for us to join the [SOV.GetFactionName]. This would formalize our strategic cooperation and bring us into a military alliance under their leadership. Shall we accept the offer and move closer to [SOV.GetAdjective] interests?"
 russia.20.t:0 "They Declines The Offer To Join The CSTO"
 russia.20.d:0 ""
 russia.21.t:0 "They Accepts The Offer To Join The CSTO"
 russia.21.d:0 ""
 russia.22.t:0 "Invitation to the [SOV.GetFactionName]"
 russia.22.d:0 "[SOV.GetNameDef] has extended an official invitation for us to join the [SOV.GetFactionName]. This would formalize our strategic cooperation and bring us into a military alliance under their leadership. Shall we accept the offer and move closer to [SOV.GetAdjective] interests?"
 russia.23.t:0 "Zyuganov Takes the Oath of Office"
 russia.23.d:0 "In a solemn ceremony, Gennady Zyuganov has been inaugurated as President of Russia. With his hand raised and the constitution before him, he vowed to restore the principles of the Soviet era and lead the nation into a new chapter."
 russia.24.t:0 "A Message from Sergey Lavrov"
 russia.24.d:0 "Comrade Zyuganov,\n\nAfter decades serving as Minister of Foreign Affairs under President Putin’s administration, I have witnessed firsthand the challenges and contradictions facing our nation. While my loyalty to Russia has never wavered, I have come to believe that the path forward lies not in the old ways but in a renewed commitment to the principles of the Communist Party.\n\nThe current leadership has often prioritized power over the people's welfare, and it is clear to me that true strength comes from a society built on equality, justice, and the collective good. For these reasons, I am writing to express my sincere desire to join the Communist Party and dedicate my experience and efforts to the rebirth of a socialist Russia.\n\nTogether, I believe we can restore Russia’s greatness by putting the people first and embracing a vision that ensures prosperity and dignity for all citizens.\n\nI await your guidance and hope to contribute meaningfully to our shared cause.\n\nSergey Lavrov"
 russia.25.t:0 "Lavrov's Speech at the Communist Party Congress"
 russia.25.d:0 "Comrades,\n\nToday I stand before you not just as a servant of the state under President Putin, but as a man who believes in the power of the people and the promise of our shared future. My years serving the Russian Federation have shown me the immense strength that unity and discipline bring to our nation.\n\nBut I have also seen the fractures, the inequalities, and the forces that seek to weaken us from within. That is why I seek to join the Communist Party — to dedicate my efforts to rebuilding a Russia grounded in the principles of justice, equality, and collective prosperity.\n\nTogether, we can forge a new path forward — one that honors our past and embraces the ideals that have made our country resilient throughout history. I humbly ask for your trust as I take this step to serve not just the government, but the people of Russia and the future we all deserve."
 russia.26.t:0 "Choosing the General Secretary"
 russia.26.d:0 "The Communist Party stands at a crucial crossroads as it prepares to select its new General Secretary. This leader will shape the direction of the party and the future of the nation, guiding the people through challenges and opportunities ahead. The choice is one of great responsibility, demanding vision, strength, and unwavering dedication to the ideals of communism."
 russia.27.t:0 "Economic Policy Debate: Centralization or Decentralization?"
 russia.27.d:0 "The party faces a critical decision on the future of the economy. Should Russia maintain strict centralized control over industry and resources, ensuring unity and coordination? Or should power be decentralized, granting more autonomy to regional authorities and enterprises to boost efficiency and innovation? This debate will define the path forward for the nation’s economic revival."
 russia.29.t:0 "The Azeri Question"
 russia.29.d:0 "Following our recent conquest, the fate of Azerbaijani lands is now at the forefront of debate. Should we annex all of Azerbaijan, or return some territories to support the vision of a Greater Armenia? The decision will shape regional stability and our influence in the Caucasus."
 russia.30.t:0 "Russia Demands Integration"
 russia.30.d:0 ""
 russia.31.t:0 "[FROM.GetName] Accepts Our Demands"
 russia.31.d:0 " "
 russia.32.t:0 "[FROM.GetName] Reject Our Demands"
 russia.32.d:0 ""
 russia.33.t:0 "The Russians Demand Iranian Azerbaijan"
 russia.33.d:0 "The Russian Federation has issued a formal demand that we cede control over Iranian Azerbaijan. Citing historic ties, ethnic kinship, and strategic interest, the Russians claim that this region rightfully belongs under their sphere. Moscow has accompanied the demand with thinly veiled threats — suggesting that noncompliance could lead to 'regional instability.'\n\nThis brazen ultimatum evokes memories of past imperial ambitions. While war is not yet certain, refusal could trigger severe consequences."
 russia.34.t:0 "Jail or Execute"
 russia.34.d:0 "Afther the collapse of his regime Putin was charged on multiple counts. Now It's time for the verdict. Execute or jail for life."
 russia.35.t:0 "[FROM.GetName] Requests to Join the [SOV.GetFactionName]"
 russia.35.d:0 "Officials from [From.GetName] have approached us recently to discuss their possible future in the Collective Security Treaty Organization."
 russia.36.t:0 "[FROM.GetName] Proposes Mutual Defence Pact With Us"
 russia.36.d:0 "Officials from [From.GetName] have approached us recently to discuss their possible future under the defence umbrella of the Collective Security Treaty Organization."
 russia.37.t:0 "Threat Of Civil War"
 russia.37.d:0 "As We have now risen up again Putin, many of our troops are starting to wonder if this it what they want for the motherland. Will we continue the freedom march or try to negotiate with Putin afterall ?"
 russia.38.t:0 "Wagner Captures Moscow"
 russia.38.d:0 "We have entered Moscow. Government forces have collapsed or withdrawn, and the capital now stands under our control. The old order has fallen, and what comes next will be decided here."
 russia.39.t:0 "Death of Vladimir Zhirinovsky"
 russia.39.d:0 "Vladimir Zhirinovsky has died. One of Russia’s most outspoken and controversial nationalist politicians is gone, marking the end of a long and turbulent political career that helped define an era of post-Soviet politics."
 russia.40.t:0 "Kadyrov Backs Prigozhin"
 russia.40.d:0 "In a shocking escalation, Ramzan Kadyrov has publicly declared his support for Yevgeny Prigozhin. Chechen forces are no longer aligned with Moscow and are instead signaling readiness to act alongside Wagner units. The chain of command is fracturing in real time as armed formations choose sides."
 russia.41.t:0 "Seat of Power"
 russia.41.d:0 "The old order has collapsed, and we now hold the reins of power. But control of territory is not enough we must decide where that power is anchored. Rostov is ours by right of conquest, Moscow by right of dominance, and Saint Petersburg by right of legacy."
 russia.42.t:0 "Meeting With The Patriarch"
 russia.42.d:0 "After the success of the Wagner coup, Yevgeny Prigozhin seeks to consolidate control over Russia, but his authority remains fragile without broader legitimacy.\n\nA meeting is arranged in Moscow with Patriarch Kirill of the Russian Orthodox Church. The Patriarch makes his position clear. The Church will not openly support a government built only on force, but it is willing to provide backing if Russia returns to stronger public religious life.\n\nKirill proposes conditions for support. Orthodox teachings would be strengthened in education, the Church would gain a larger role in public life, and religious observance would become a visible part of society. In return, the Church would recognize the new government and support its legitimacy.\n\nAt the same time, the meeting raises a second possibility. If agreement is reached, the Church may become a central pillar of the state. If it fails, Kirill may instead push for a system where religious authority overtakes political power entirely."
 russia.43.t:0 "Unrest in the Muslim Regions"
 russia.43.d:0 "The shift in the state’s direction has not gone unnoticed across the federation. In several regions with large Muslim populations, local authorities and communities have begun to openly resist the new order. Demonstrations, refusals to comply, and growing unrest signal that our authority is being challenged. If left unchecked, this resistance could spiral into wider instability and even open defiance."
 russia.44.t:0 "Meeting with the Governors"
 russia.44.d:0 "With unrest spreading across the Republic’s diverse regions, the governors have been summoned to Moscow for an urgent update on the situation in Russia."
 russia.45.t:0 "A Chinese Peace Offer"
 russia.45.d:0 "Chinese representatives have established a private line of communication with Moscow. They propose a settlement to end the ongoing conflict.\n\nIn exchange for a peace agreement, China requests recognition of their control over Outer Manchuria, where their forces currently hold territory.\n\nThe proposal is unofficial, with both sides expected to keep discussions confidential unless an agreement is reached."
 russia.46.t:0 "Russian Peace Offer"
 russia.46.d:0 "With Russian forces in control of Manchuria, Moscow has opened a channel to propose a settlement.\n\nRussia offers to end the war if China agrees to recognize Russian control over the occupied territories in Manchuria.\n\nThe proposal is framed as a way to stabilize the situation and avoid further escalation."
 russia.47.t:0 "Patriarch Kirill Demands We Submit To Mosocw"
 russia.47.d:0 "Patriarch Kirill has issued a demand that our nation recognize the authority of the Moscow Patriarchate and bring our Orthodox Church under his control."
 russia.48.t:0 "The End of an Era"
 russia.48.d:0 "Vladimir Putin has died.\n\nAfter decades at the center of Russian politics, his sudden death has triggered an immediate power vacuum in Moscow. The state moves quickly to control the narrative, but uncertainty spreads through the government, the military, and the security services.\n\nAcross the Federation, factions within the elite begin maneuvering for influence, while regional authorities watch closely for signs of instability. The question of succession now dominates Russian politics, and the future of the state is suddenly uncertain."
 russia.49.t:0 "The Future of Ukraine"
 russia.49.d:0 "With Ukraine now firmly under our influence, the question of its future governance remains unresolved. Some within the Kremlin argue that direct oversight through a military administration is necessary to maintain stability and secure Russian interests. Others advocate restoring a civilian government under Viktor Yanukovych, whose return could provide a veneer of legitimacy while keeping Kyiv aligned with Moscow. The time has come to decide how Ukraine will be governed."
 russia.50.t:0 "The End of the ONF"
 russia.50.d:0 "Following a sweeping political rebranding campaign, the All-Russia People's Front (ONF) has officially been renamed to simply the People's Front (NF). Officials claim the change reflects a 'streamlined national mission' and a renewed focus on internal unity. Critics, however, see it as another step in the consolidation of political control under a simplified and more centralized structure. The organization’s structure, leadership, and functions remain largely unchanged, but its identity has been reshaped to fit the evolving political narrative."
 russia.52.t:0 "Unites the Nation Rally"
 russia.52.d:0 "Thousands have gathered beneath a sea of flags and illuminated banners as patriotic music echoes across the stadium. Veterans, soldiers, volunteers, and government officials stand before a cheering crowd while speeches praise the courage of the Armed Forces and the nation's historic mission.\n\nBroadcast live across the country, the event has become a carefully orchestrated display of national unity. Performers sing of sacrifice, resilience, and victory as giant screens flash the now-familiar 'Z' symbol. To supporters, the concert embodies patriotism and solidarity in a time of conflict. To critics, it is another chapter in an expanding campaign of wartime propaganda. Regardless of perspective, tonight's spectacle has captured the attention of the entire nation."
 russia.53.t:0 "The Soldiers Come Home"
 russia.53.d:0 "The first trains carrying our soldiers home from Ukraine have begun arriving at stations across Russia. There are no victory celebrations waiting for them. Exhausted men step onto the platforms carrying what remains of their equipment, while families crowd around the arrivals, desperate to find their sons and husbands among the returning ranks. The defeat has brought the war home in a way that no government statement can hide."
 russia.54.t:0 "The Kremlin Turns on Putin"
 russia.54.d:0 "The defeat in Ukraine has shattered the unity that once surrounded Vladimir Putin. Behind closed doors, oligarchs, senior officials, and powerful figures within the security services have begun quietly negotiating the future of the regime. Meetings are held in private apartments, offices, and secluded rooms across Moscow. The question is no longer how to save Putin's presidency, but how to remove him without bringing the entire system down with him."
 russia.55.t:0 "Protests Erupt Across Russia"
 russia.55.d:0 "The anger that has been building since the defeat in Ukraine has finally spilled into the streets. Thousands of Russians have gathered in Moscow, St. Petersburg, and cities across the country, openly demanding an end to Vladimir Putin's rule. Police have been deployed to contain the demonstrations, but the crowds continue to grow. For the first time in years, the Kremlin is facing a protest movement it cannot simply ignore."
 russia.56.t:0 "The Duma Takes Control"
 russia.56.d:0 "With Vladimir Putin gone and no successor agreed upon, the State Duma has moved to take control of the government. For the sake of continuity and legitimacy, Mikhail Mishustin will remain as Prime Minister for the time being. His position is tolerated rather than trusted, however, and the new leadership will keep a close watch on him as it works to establish its authority."
 russia.57.t:0 "The Protests Come to an End"
 russia.57.d:0 "The announcement of new elections has brought the demonstrations to an end. Crowds that had filled the streets demanding political change are beginning to disperse, satisfied that the country will finally have an opportunity to choose its government at the ballot box. For now, the streets of Russia are quiet."
 russia_news.1.t:0 "Russia Invades Ukraine"
 russia_news.1.d:0 "Early reports confirm Russian forces have launched a large-scale military operation against Ukraine. Explosions have been reported in Kyiv, Kharkiv and other major cities. Western officials say the attack marks the start of the most significant conflict in Europe since the Second World War."
 russia_news.2.t:0 "Russia Triumphs in Ukraine"
 russia_news.2.d:0 "Russian forces have secured victory in Ukraine after months of fighting, according to official reports. New territories are being placed under Russian administration as the balance of power in Eastern Europe shifts. Officials in Moscow describe the outcome as a historic victory."
 russia_news.3.t:0 "Western Sanctions Hit Russia"
 russia_news.3.d:0 "The EU and NATO have imposed sweeping sanctions on Russia in response to its actions. Major Western companies are withdrawing operations, disrupting supply chains and freezing investment. Analysts warn of severe pressure on the Russian economy as isolation deepens."
 russia_news.4.t:0 "Russian Troops Amass on Ukraine's Border"
 russia_news.4.d:0 "Satellite imagery shows large Russian troop deployments near Ukraine’s border, including armour and artillery. Moscow says the movements are routine exercises, while Western governments warn of possible escalation. Diplomats are urging restraint amid rising tensions."
 russia_news.5.t:0 "Russian Defeat in Ukraine"
 russia_news.5.d:0 "After months of fighting, Russia has suffered a major defeat in Ukraine, according to battlefield reports. Heavy losses and failed objectives have triggered political shock in Moscow. Analysts say the outcome has raised serious questions about the country’s leadership and future direction."
 russia_news.6.t:0 "The Communists Triumph in the Duma Elections"
 russia_news.6.d:0 "The Communist Party has won the State Duma elections in a major political shift. Party leaders promise to restore state strength, rebuild industry and reverse years of decline. The result marks a turning point in Russia’s post-Soviet political system."
 russia_news.7.t:0 "Democratic Parties Perform Well In Duma Elections"
 russia_news.7.d:0 "Liberal and conservative parties have performed strongly in the State Duma elections, alongside gains for the Communist Party. No clear majority has emerged, raising the likelihood of coalition talks. Observers describe an increasingly fragmented political landscape."
 russia_news.8.t:0 "Putin Deposed in Moscow"
 russia_news.8.d:0 "Vladimir Putin has been removed from power following military failures in Ukraine and growing domestic unrest. The State Duma moved against him in a historic vote of no confidence as key allies abandoned the Kremlin. Russia now enters a period of political uncertainty."
 russia_news.9.t:0 "Terrorist Attack In Moscow"
 russia_news.9.d:0 "An armed attack has struck Crocus City Hall in Moscow during a political event. Explosions and gunfire left several injured before security forces secured the area. Authorities are investigating the motive amid heightened political tensions."
 russia_news.10.t:0 "China and Russia Sign Major Trade Agreement"
 russia_news.10.d:0 "Russia and China have signed a major economic agreement covering energy, industry and technology cooperation. The deal strengthens ties as Western sanctions continue to isolate Moscow. Officials describe it as a strategic long-term partnership."
 russia_news.11.t:0 "[ROOT.GetNameDef] Seizes Kaliningrad"
 russia_news.11.d:0 "[ROOT.GetNameDef] has taken control of Kaliningrad following a rapid operation. Moscow has condemned the move as illegal, while international reactions remain divided. The development adds further strain to an already volatile region."
 russia_news.12.t:0 "[ROOT.GetNameDef] Joins the [FROM.GetFactionName]"
 russia_news.12.d:0 "[ROOT.GetNameDef] has joined the [FROM.GetFactionName], deepening military and political cooperation within the bloc. The move is seen as part of a wider geopolitical realignment away from Western influence. Analysts expect further shifts in regional alliances."
 russia_news.13.t:0 "The Soviet Union Rises Again"
 russia_news.13.d:0 "The Russian Federation has declared the restoration of the Soviet Union following a Communist electoral victory. The announcement follows a period of instability and political change. Soviet symbols have returned to Moscow as the new leadership sets out its programme."
 russia_news.14.t:0 "[SOV.GetName] Conducts Nuclear Test in Siberia"
 russia_news.14.d:0 "The [SOV.GetName] has carried out a large nuclear test in Siberia, according to reports. The explosion has drawn swift international condemnation. Moscow describes it as a demonstration of military capability."
 russia_news.15.t:0 "Wagner Rebells Agains Putin"
 russia_news.15.d:0 "Wagner forces under Yevgeny Prigozhin have launched an armed rebellion against Russia’s military leadership. Units are reported to have seized key positions and advanced towards Moscow. The crisis marks the most serious internal challenge to the Kremlin in years."
 russia_news.16.t:0 "Wagner Stands Down"
 russia_news.16.d:0 "Yevgeny Prigozhin has ordered Wagner forces to halt their advance following negotiations with the Kremlin. The group has agreed to return to base, ending the immediate crisis. Officials say the situation is now under control, though tensions remain."
 russia_news.17.t:0 "Moscow Falls to Prigozhin Forces"
 russia_news.17.d:0 "Forces loyal to Yevgeny Prigozhin have seized Moscow in an unprecedented escalation, marking the collapse of central authority."
 russia_news.18.t:0 "The Church Ascends in Russia"
 russia_news.18.d:0 "The Orthodox Church has taken a central role in Russia’s new political system following upheaval in Moscow. Religious authority is now deeply embedded in governance, marking a sharp shift in state direction."
 russia_news.19.t:0 "President Putin Dies"
 russia_news.19.d:0 "World media confirm that Vladimir Putin has died. His death ends a decades-long political era in Russia. Emergency measures are introduced in Moscow as Dmitry Medvedev is sworn in as president."
 russia_news.20.t:0 "Russia Announces Annexation of Four Ukrainian Regions"
 russia_news.20.d:0 "The Russian government has announced the incorporation of Donetsk, Luhansk, Kherson and Zaporizhzhia into the Russian Federation. Officials say the move follows referendums and current control on the ground. The UN rejects it as illegitimate, and many governments refuse to recognize it."
 russia_news.21.t:0 "Ukraine Launches Operation Spiderweb"
 russia_news.21.d:0 "In a shocking twist of events, Ukraine has brought the fight back home to Russia and has launched the largest drone attack in the entire war, using drones to strike deep inside of Russia, hitting military bases, factories, fuel depots, and more."
 belarus.1.t:0 "Lukashenko's Belarus"
 belarus.1.d:0 "Nearly three decades after the fall of the Soviet Union, Belarus remains firmly in the grip of Alexander Lukashenko, whose rule has endured through protests, sanctions, and international isolation, preserving stability through state control, loyal security forces, and the suppression of opposition, while the nation stands caught between Russian patronage in the east and Western condemnation in the west, its future shaped by repression, resilience, and the will of a single ruler—Lukashenko’s Belarus."
 belarus.2.t:0 "Momentum of the 2020 protests"
 belarus.2.d:0 "The unrest of 2020 never truly faded, and in 2022 the embers of dissent have once again ignited across Belarus, as underground opposition networks, striking workers, and emboldened citizens reclaim the streets, turning scattered demonstrations into a growing national movement that threatens the authority of the regime and places the future of the country in the hands of mass mobilization, uncertainty, and the dangerous momentum of revolution—the Momentum of the 2022 Protests."
 belarus.3.t:0 "PLACEHOLDER"
 belarus.3.d:0 "PLACEHOLDER"
 belarus.4.t:0 "Belarus approaches us..."
 belarus.4.d:0 "Reports reach Zhongnanhai that Belarus, long considered firmly within Moscow’s orbit, is quietly seeking closer ties with Beijing as a means of balancing Russian influence, and now the decision rests with the Chinese leadership: whether to welcome Minsk’s outreach as an opportunity to expand China’s economic and strategic presence in Eastern Europe, strengthen the Belt and Road Initiative, and showcase Beijing as an alternative partner to Russian dominance, or to proceed cautiously and avoid provoking instability in an already sensitive region."
 belarus.5.t:0 "China takes us in!"
 belarus.5.d:0 "China has responded and said they would be interested in further cooperation!"
 belarus.6.t:0 "Condemn Russia"
 belarus.6.d:0 "With the Russo-Ukrainian War now underway, the Belarusian government publicly condemns Russian aggression and coercive influence, signaling a dramatic and unprecedented break from Moscow and declaring that Belarus will no longer act as a subordinate or staging ground for foreign wars, even as this decision risks severe economic retaliation, internal instability, and the looming threat of confrontation with its most powerful neighbor, Russia."
 belarus.7.t:0 "Shifting away from Moscow"
 belarus.7.d:0 "Let's just say Russia wasn't pleased with our comdemnation. The Russian ambassador has sent and extremely angry response and is already threatening us. I think its about time we search for better allies."
 belarus.8.t:0 "Russians organize in Vitebsk"
 belarus.8.d:0 "After we condemned Russia and were expelled from the CSTO, troubling reports reached us: Russian sympathizers are quietly organizing in Vitebsk, sowing unrest and plotting to undermine our authority from within. It seems our decision to break from Moscow may have awakened internal threats, and now we must confront the reality that loyalty at home is just as fragile as our independence."
 belarus.9.t:0 "Face of the BNR"
 belarus.9.d:0 "We have begun discussions to revive the Belarusian National Republic as a symbol of true national identity and reform, but the path forward is not clear. Some call for continuity under Lukashenko’s authority, believing stability and order are paramount, while others urge us to place our trust in Mikola Statkevich, whose vision promises democracy and a break from decades of authoritarian rule. The choice we make now will define the face of the BNR and the future of our nation."
 belarus.10.t:0 "Demands from Belarus"
 belarus.10.d:0 "Belarus has demanded we hand over Podlasie and Lublin, justifying themselves with historical and cultural reasoning. It is important to remember we are in NATO and Belarus doesn't pose much of a threat to us, but handing over the lands now might lead to an opportunity to influence Belarus later on, especially now that they're taking a shift away from Moscow."
 belarus.11.t:0 "Poland rejected our demands."
 belarus.11.d:0 "I mean, what did you expect?"
 belarus.12.t:0 "Poland accepted our demands!"
 belarus.12.d:0 "Poland has agreed to hand over Podlasie and Lublin, clearly they have crumbled under the pressure of the mighty Belarus! Luckily since both parties agreed, the land transfer is recognized by the UN."
 belarus.13.t:0 "Migrants from Belarus"
 belarus.13.d:0 "Our border guards were overwhelmed today with a huge number of Belarusian migrants attempting to cross over, while our guards were able to arrest some of them, their numbers proved to be too much for our unprepared guards to handle. No doubt, this is an attempt by Belarus to destablize us, and we can only expect more to come."
 belarus.14.t:0 "The Elephant in the Room"
 belarus.14.d:0 "Since Russia has invaded Ukraine, the world has become increasingly more polarized, and we are going to be forced to take a side. We can either stick with Russia like we have for all these years, but remain uninvolved. On the other hand, prehaps we could invade Ukraine from the north and get a piece of the spoils, along the way we could probably revive Belarusian nationalism. Or maybe we should condemn Russia, after all, Ukraine is a brother of ours, we both understand each other and have similar history and culture. Russia may have gone too far this time, and after Ukraine, we are most likely next."
 belarus_news.1.t:0 "Belarus shifts away from Moscow!"
 belarus_news.1.d:0 "Belarus has officially broken with Moscow following a public condemnation of Russian aggression and interference. Once a steadfast ally of Russia, Minsk is now pursuing independent foreign and domestic policies, seeking new economic and diplomatic partners while facing the looming threat of retaliation from its former patron. Analysts warn that this historic pivot could reshape Eastern Europe’s balance of power, embolden opposition movements, and force Moscow to reconsider its strategy in the region. The world watches closely as Belarus stakes a claim to sovereignty in a time of unprecedented tension."
 belarus_news.2.t:0 "Belarus Withdraws from CSTO"
 belarus_news.2.d:0 "Belarus has officially exited the Collective Security Treaty Organization (CSTO), signaling a sharp turn away from decades of military alignment with Moscow. The decision comes in the wake of Minsk’s condemnation of Russian actions in Ukraine and marks an unprecedented assertion of Belarusian sovereignty. International observers warn that the withdrawal could destabilize regional security, weaken the CSTO’s cohesion, and leave Belarus vulnerable to political and economic pressures, while also opening opportunities for new alliances beyond Russia’s sphere of influence. The world watches as Belarus navigates this bold and uncertain path."
 belarus_news.4.t:0 "Belarus Breaks from Russia"
 belarus_news.4.d:0 "The newly reformed Belarusian National Republic government has officially announced a break from Moscow, rejecting decades of Russian influence and asserting full national sovereignty. The move comes amid sweeping reforms aimed at democratization and independence, and is seen as a dramatic realignment in Eastern Europe. International observers warn that this rupture could provoke Russian retaliation, disrupt regional stability, and force the global community to navigate a newly independent Belarus asserting itself on the world stage."
 belarus_news.3.t:0 ""
 belarus_news.3.d:0 ""
 saudi_arabia.1.t:0 "Death of King Abdullah"
 saudi_arabia.1.d:0 "Abdullah, King of Saudi Arabia and first of his name, has died. He officially ascended to the throne in 2005, even though he held de facto control as king regent since the 1990s - due to the succession system of seniority applied by the Saudi royal family."
 saudi_arabia.1.o1:0 "May he find his way to Allah."
 serbia_news.1.t:0 "Yugoslavia Reformed"
 serbia_news.1.d:0 "In a historic moment for the Serbian people, the government has successfully incorporated a former part of the nation. This marks a pivotal step towards restoring the strength and unity of the Yugoslav legacy. The spirit of Yugoslavia lives on, and Serbia stands at the forefront of a new era, determined to reclaim its former glory. As the Serbian flag flies high over newly reclaimed territory, the government vows to continue the march toward the reunification of the lands that once made Yugoslavia great. With this achievement, the dream of restoring national pride is one step closer to reality."
 setup.4.t:0 "Welcome to Millennium Dawn!"
 setup.4.d:0 "Welcome, leader! Thanks for playing Millennium Dawn!\n\nYou chose the 2000 Start Date. While the world might appear peaceful at first glance, there are conflicts in Afghanistan, the Congo, Nepal and in Liberia. Finally, in the shadows of their hideouts, terrorist groups like Al-Qaeda are planning their next strikes... \n\nHave fun!"
 setup.4.o1:0 "Let's do this!"
 setup.5.t:0 "Welcome to Millennium Dawn!"
 setup.5.d:0 "Welcome, leader! Thanks for playing Millennium Dawn!\n\nYou chose the 2016 Start Date. Wars are raging in Ukraine and in the Middle East. Libya and Syria are engulfed in horrendous civil wars, while Nigeria fights several destructive insurgencies.\n\nHave fun!"
 setup.5.o1:0 "Let's do this!"
 setup_event.5.t:0 "Enable Crazy Mode?"
 setup_event.5.d:0 "ATTENTION: IF YOU ARE CURRENTLY IN MULTIPLAYER, BE ADVISED THAT YOU ARE THE ONE DECIDING FOR THE ENTIRE GAME AND ALL PLAYERS. MAKE SURE TO COMMUNICATE WITH YOUR FELLOW PLAYERS BEFORE TAKING THIS DECISION.\n\nOne of the main complaints of players of Millennium Dawn is that the world is 'too' modern, meaning that Paradox players cannot get their kick of being warmongering dictators and creating magnificent blobs just because of silly pacifists or the UN. Also, the modern history is boring. No-one invaded Poland for the past 70 years! That's stupid!\n\nSo if you don't like that, you can enable Crazy Mode. You wanna go?"
 setup_event.5.o1:0 "Yeah, let's go!"
 setup_event.5.o2:0 "No, let's be reasonable."
 sicily.1.t:0 "The Two Sicilies"
 sicily.1.d:0 "We have a king, we are Sicily, and we have control over what used to be the Kingdom of the Two Sicilies. Should we start to consider ourself the 'Kingdom of the Two Sicilies'?"
 sicily.1.o1:0 "We are the Two Sicilies"
 sicily.1.o2:0 "We are not the Two Sicilies"
 sicily.2.t:0 "The Two Sicilies?"
 sicily.2.d:0 "For many reasons, we can't anymore claim to be the heir of the Kingdom of the Two Sicilies."
 sicily.2.o1:0 "Oh well..."
 stability.2.t:0 "Stability"
 stability.2.d:0 "Millennium Dawn uses a concept called stability to better represent internal conflicts and government struggles.\nStability is a numeric value that moves from 0 to 100 and is subdivided into seven steps: Disastrous, Very Low, Low, Average, High, Very High and Amazing. These go from 0 to 10, 11 to 25, 26 to 40, 41 to 60, 61 to 75, 76 to 90 and from 91 to 100.\n\nEach of the levels will give you a modifier that affects just about everything in your nation. Generally, you want to keep your stability to be at least average, from where on the bonuses will be slightly positive."
 stability.2.o1:0 "Got it!"
 stability.3.t:0 "Stability Change"
 stability.3.d:0 "Our stability has changed."
 stability.3.o1:0 "Alright."
 sweden.1.t:0 "Suspicious Army Maneuvers"
 sweden.1.d:0 "In recent days, reports have emerged of unusual military movements near Stockholm and several key cities. Armored columns have been seen on the move without official orders, and military leadership remains vague and evasive when questioned. Since the revolution, the army has not contacted the new People's Government. Some within the ruling committee fear that parts of the officer corps may be preparing to act on their own initiative. The situation grows tenser by the hour."
 sweden.2.t:0 "Leftward Drift of the Social Democrats"
 sweden.2.d:0 "Under pressure from unions, youth movements, and the growing strength of far-left activists, the Social Democratic Party has begun embracing radical policies unseen since the early 20th century. Calls for mass nationalizations, worker councils, and a complete overhaul of capitalist institutions are no longer fringe demands—they are becoming party doctrine. This shift may pave the way for an alliance between the party and communist revolutionaries."
 sweden.3.t:0 "The Generals Strike Back"
 sweden.3.d:0 "The People's Government has barely settled into power before the barracks stirred with unease. Just days after the Communists seized full control of Sweden, the military has launched a decisive coup. In the early morning hours, tanks surrounded the Riksdag, key leaders were arrested, and military broadcasts declared the end of the 'Red Experiment.'\n\nThe coup has been swift, bloody, and successful. The Communist regime is no more."
 sweden.4.t:0 "Question Of The Head of State"
 sweden.4.d:0 "With the monarchy abolished and King Carl XVI Gustaf ousted, we will need to choose our Head of State. The new communist leadership must decide how to fill the vacant role of head of state. Should a president be elected to serve symbolically, or should the leader of the government assume all ceremonial and executive duties?"
 sweden.5.t:0 "The 2022 Parliamentary Election"
 sweden.5.d:0 "The foundations of Swedish society tremble. Once a symbol of stability and social cohesion, the nation now faces soaring inequality, parallel societies, rampant gang violence, and institutional decay. Trust in traditional parties is crumbling, and the electorate is more divided than ever. As the results pour in, one thing is clear: the Sweden that emerges from this election will not be the same as the one that entered it."
 sweden.6.t:0 "Riots Erupt After Quran Burning"
 sweden.6.d:0 "A provocative act involving the public burning of the Quran has ignited widespread unrest across several Swedish cities. Clashes between protesters and police have grown increasingly violent, with cars set ablaze and law enforcement struggling to maintain order. The event has drawn international condemnation and sparked intense domestic debate over freedom of expression, integration, and the state’s failure to maintain social harmony. Sweden now faces not only a security crisis but a profound test of its democratic values."
 sweden.7.t:0 "Social Democrats Win The Election"
 sweden.7.d:0 "With the leftist resurgence in Sweden it was almost certine that the social democrats were going to win, which is exactly what happened"
 sweden.8.t:0 "The King Assumes to Power"
 sweden.8.d:0 "With the communists purged and the nation under martial law, the military has chosen to step back and restore the monarchy. In a solemn ceremony, command was transferred to His Majesty, who now assumes full authority over the Swedish state. The generals saluted, and the people watched in silence as royal power was reborn from the ashes of revolution."
 sweden.9.t:0 "Sweden Demands We Hand Over Åland"
 sweden.9.d:0 "The King has announced that he will not tolerate Our control of the island of Åland. How shall we respond ?"
 sweden.10.t:0 "They Accepts Our Demand"
 sweden.10.d:0 "  "
 sweden.11.t:0 "They Rejects Our Demand"
 sweden.11.d:0 ""
 sweden.12.t:0 "Sweden Demand Our Subjugation"
 sweden.12.d:0 "The king of Sweden has announced that he is expecting us to subjugate ourselves to him. What shall we do ?"
 sweden.14.t:0 "Stockholm Demands Our Subjugation"
 sweden.14.d:0 "The king in Stockholm has announced that they demand us give up our foreign policy, do we abide ?"
 sweden.16.t:0 "Sweden Demands De-Militarization Of The Islands"
 sweden.16.d:0 "Sweden has sent us an ultimatum demanding that we de-militarize Sjaeland and Fyn. How will we respond ?"
 sweden.18.t:0 "Invitation to the Royal Pact"
 sweden.18.d:0 "Sweden has extended an invitation to join a royal alliance of European monarchies, aiming to safeguard traditional rule and resist republican and radical influences. As monarchies waver across the continent, Stockholm seeks to unite the remaining thrones under one banner."
 sweden.19.t:0 "[FROM.GetName] Joins the Royal Pact"
 sweden.19.d:0 "The government of [FROM.GetNameDef] has formally accepted our invitation to join the Royal Pact. Their allegiance strengthens the monarchist cause across Europe, bringing us one step closer to a continent united under royal banners."
 sweden.20.t:0 "[FROM.GetName] Rejects the Royal Pact"
 sweden.20.d:0 "Despite our shared monarchist values, [FROM.GetNameDef] has declined our proposal to join the Royal Pact. Their refusal is a blow to our vision of a united monarchist Europe, but we shall continue to gather loyal allies under the royal banner."
 sweden.21.t:0 "Election Resultats"
 sweden.21.d:0 "Turnout was embarrassingly low—unsurprising, given the complacency of our corrupted citizenry. Some ballots even bore insolent scribbles mocking the government. But none of that matters. The numbers have been corrected. The will of the state has prevailed. Stefan Jacobsson remains the undisputed leader of Sweden, and any doubts have been erased, literally."
 sweden.22.t:0 "What Should Be Done With the King?"
 sweden.22.d:0 "The monarchy once stood as a harmless relic of the past — until it became a rallying point for counter-revolutionaries. Now, with our grip on power tightening, the question looms, Should we allow the King to live in exile, or make an example of him to show that no one, not even royalty, is above the new order?"
 sweden.23.t:0 "The Streets Erupt"
 sweden.23.d:0 "With the left broken and driven underground, new unrest simmers to the surface. Immigrant communities across several major cities have exploded into open revolt, outraged by the persecution of allies and fearful of what comes next. Fires burn, police stations are attacked, and the regime blames 'foreign agitators' and 'enemies of Sweden' for the chaos."
 sweden.24.t:0 "The First Five-Year Plan"
 sweden.24.d:0 "General Secretary [SWE.GetLeader] has unveiled Sweden’s first Five-Year Plan — a bold initiative to reshape the economy through centralized planning, rapid industrialization, and total mobilization of the workforce. This marks a decisive step in our journey toward a fully socialist state."
 sweden.25.t:0 "Nationalization of the Banks"
 sweden.25.d:0 "In a landmark decree, General Secretary [SWE.GetLeader] has announced the full nationalization of Sweden’s banking sector. The era of private financial empires siphoning wealth from the people is over. Under state control, the banks will now serve the needs of the working class and the goals of the revolution. This decisive move consolidates economic power in the hands of the proletariat and strikes a fatal blow to capitalist influence in our economy."
 sweden.26.t:0 "Alone in Red"
 sweden.26.d:0 "With the collapse or transformation of other leftist governments across Europe, Sweden now stands as the last bastion of socialism on the continent. Isolated ideologically but steadfast in purpose, we face a world of encirclement, suspicion, and potential hostility. Yet this also grants us a unique role — as the sole guardian of the revolution in Europe."
 sweden.27.t:0 "Sweden Seeks Entry into the SCO"
 sweden.27.d:0 "In a surprising diplomatic move, the Swedish government has formally requested to join§ the Shanghai Cooperation Organization. Citing ideological alignment, economic cooperation, and a desire to pivot away from Western institutions, Sweden seeks closer ties with the Eurasian bloc. We must now consider the strategic and political implications of admitting this new applicant."
 sweden.28.t:0 "[FROM.GetName] accepts"
 sweden.28.d:0 ""
 sweden.29.t:0 "[FROM.GetName] declines"
 sweden.29.d:0 ""
 sweden.30.t:0 "Sweden Influences our politics"
 sweden.30.d:0 ""
 sweden.31.t:0 "Swedish Coup Imminent"
 sweden.31.d:0 "Communist ferver has reached a fever pich. Swedish communist have siezed buildings and are ready to topple the government. How should we react"
 sweden.32.t:0 "Crackdown on Our Party"
 sweden.32.d:0 "The creation of our party has not gone unnoticed. The secular regime is alarmed by our growing influence and has launched a coordinated crackdown. Mosques are raided, imams are arrested, and our supporters are silenced. But repression only fuels the fire."
 sweden.33.t:0 "They Ban Our Party... But We Won't Go Down"
 sweden.33.d:0 "The government thought it could silence us with legislation. With a single decree, they declared our party illegal, our voices unwanted, and our presence intolerable. But the fire of belief cannot be outlawed. Across cities and towns, faithful brothers rise—not in protest, but in revolution. The time for words has passed. The time for Jihad has begun. Sweden will be reshaped in the image of true faith."
 sweden.34.t:0 "Wepons From Iran Arrive"
 sweden.34.d:0 ""
 sweden.35.t:0 "Småland Joins the Cause"
 sweden.35.d:0 "After months of covert infiltration and ideological groundwork, local leaders in Småland have declared their allegiance to our movement. Militias loyal to our cause have seized key towns and infrastructure across the region. The government is in disarray, and Småland now stands with us as part of the new order."
 sweden.36.t:0 "Västergötland Has Fallen"
 sweden.36.d:0 "Years of quiet infiltration have borne fruit. Our supporters in Västergötland have risen up, seizing key administrative centers and declaring the region’s loyalty to our cause. The central government is powerless to stop the wave of rebellion. Another step toward victory has been taken."
 sweden.37.t:0 "Commanders of the Faithful"
 sweden.37.d:0 "As the conflict escalates, several radicalized Swedish-born individuals with military or militant experience have pledged their loyalty to the Islamist cause. They now stand ready to take command of our forces and lead the faithful to victory."
 sweden.38.t:0 "Faith Over State"
 sweden.38.d:0 "With the fall of the monarchy and the collapse of secular authority, the new Islamist leadership proclaims a divine mandate: Islam shall reign supreme over the laws of man. Sharia replaces the constitution, and jihad becomes the sacred duty of all true believers. Fighters, preachers, and warlords alike unite under the black banner, no longer as rebels—but as the rightful guardians of a new order.\n\nThe state's institutions are purged, mosques converted into command centers, and foreign jihadists welcomed as brothers. The world may see chaos, but for the faithful, this is justice. This is destiny. This is faith over state."
 sweden.39.t:0 "The Islamist Militants Rise"
 sweden.39.d:0 "As chaos spreads, the Islamist militias have begun deploying their forces across key regions. The fight for Sweden’s future is about to intensify."
 sweden.40.t:0 "Widespread Public Resistance"
 sweden.40.d:0 "Despite the Islamist regime’s victory, large segments of the population remain deeply opposed to the new order. Protests and underground resistance movements grow daily, fueled by fear, resentment, and a longing for the Sweden that once was."
 sweden.41.t:0 "A Caliph Must Be Chosen"
 sweden.41.d:0 "With the dawn of a new Islamic order in Scandinavia, the time has come to appoint a Caliph — the spiritual and political leader of the faithful. The Caliph is more than a ruler; he is the successor to the Prophet, a symbol of unity and divine authority. Without one, the Caliphate remains incomplete, its purpose undefined. The world watches as we prepare to choose the one who shall guide the Ummah through this new era."
 sweden.42.t:0 "Al Bagdadi Found In Azerbaijan"
 sweden.42.d:0 "In the shadowed, crumbling ruins of a forgotten village nestled in the rugged hills of Azerbaijan, Al-Bagdadi lived in near-total isolation.\nThe cold stone walls of his shelter bore the marks of time and secrecy.\nA single narrow window cast a faint sliver of pale sunlight onto the dust-covered floor, barely illuminating the sparse room where he awaited an uncertain fate.\nAn operative stepped inside quietly, eyes scanning the dim space before settling on the frail, yet imposing figure seated upon a worn cushion.\nThe air was thick with dust and the heavy scent of earth and smoke.\nWith steady resolve, the operative spoke.\nThe world has changed, Sheikh.\nWhat you once knew has vanished like smoke in the wind.\nA revolution has swept across Sweden, the land you once dreamed of influencing.\nThe old government is no more.\nThe people have risen, and a new order has taken hold.\nAl-Bagdadi’s eyes, sharp yet weary, widened in disbelief.\nThe weight of years had carved deep lines across his face, but the shock was unmistakable.\nSweden… revolution? Impossible.\nThe cold north, the land of ice and silence...\nHow could they rise in such a place?\nThe operative stepped closer, lowering his voice to a conspiratorial tone.\nIt is true.\nThe faithful have claimed their homeland.\nThe Caliphate is born again in the heart of Scandinavia.\nWe found you because your guidance is needed.\nThe faithful yearn for leadership, a symbol to rally behind.\nWe offer you the chance to reclaim your destiny.\nAl-Bagdadi paused, silence stretching as he absorbed the news.\nThe flickering candlelight cast long shadows on his gaunt face.\nFinally, his lips curled into a faint, grim smile.\nAfter years in exile, forgotten by many… you bring news that awakens the fire within.\nThe operative extended a hand, voice firm yet respectful.\nWill you come with us?\nWill you lead the Caliphate of the North?\nThe faithful await your command in Sweden.\nAl-Bagdadi’s gaze hardened with renewed purpose.\nYes.\nI will follow you.\nThe time has come to rise once more."
 sweden.43.t:0 "Request Aid from the Ummah"
 sweden.43.d:0 "Surrounded by enemies and resistance, the Islamic government of Sweden must look beyond its borders. By appealing to friendly Islamist nations, we may secure vital military aid. A shared faith and common struggle may convince them to provide weapons, equipment, and factories to strengthen our cause. Sweden cannot stand alone — but with the support of the ummah, we may yet survive."
 sweden.44.t:0 "[FROM.GetName] Accepts Investment"
 sweden.44.d:0 " "
 sweden.45.t:0 "[FROM.GetName] Declines Investment"
 sweden.45.d:0 ""
 sweden.47.t:0 "Sweden Demands a Two-State Solution"
 sweden.47.d:0 "The Swedish government has taken a bold diplomatic stance by officially calling for a two-state solution to the ongoing conflict in the Middle East. This move is seen as both a moral gesture and a political calculation aimed at gaining influence in the Muslim world."
 sweden.48.t:0 "Mandatory Hijab?"
 sweden.48.d:0 "The religious council has proposed that Sweden adopts mandatory hijab laws in public for all women. This has sparked widespread debate across the country, with conservative clerics pushing for stronger Islamic values and moderates warning of increased societal division. Should we enforce the mandate?"
 sweden.49.t:0 "Cities Embrace Their New Names"
 sweden.49.d:0 "In accordance with the new Islamic identity sweeping across the nation, cities throughout the land have adopted their Arabic names. This symbolic gesture marks a deeper cultural transformation as Sweden fully embraces its new destiny."
 sweden.50.t:0 "Sweden Requests CSTO Membership"
 sweden.50.d:0 "In a surprising turn of geopolitical alignment, Sweden has formally requested to join the Collective Security Treaty Organization. Citing growing cooperation and shared regional concerns, Stockholm believes that aligning with our security structure will ensure mutual stability. Accepting their request would solidify our influence in Northern Europe — but at what cost to tradition?"
 sweden.51.t:0 "Sweden Proposes Joint NATO Accession"
 sweden.51.d:0 "In light of increasing geopolitical tensions, Sweden has proposed that we join them in a coordinated bid for NATO membership. A united Nordic entry could bolster regional security and demonstrate solidarity. The question is—are we prepared to make that leap together?"
 sweden.52.t:0 "Finland Approves Of Joint Accession To NATO"
 sweden.52.d:0 " "
 sweden.53.t:0 "Finland Doesn't Support Joint Bid For NATO"
 sweden.53.d:0 " "
 sweden.54.t:0 "Sweden and Finland Seek NATO Membership"
 sweden.54.d:0 "In a landmark move, both Sweden and Finland have submitted a joint application to join the North Atlantic Treaty Organization. Longtime neutral countries, their entry would significantly bolster NATO's strategic depth in Northern Europe. Now, the decision lies with us and our allies—will we welcome them into the fold?"
 sweden.55.t:0 "Sweden Requests NATO Membership"
 sweden.55.d:0 "Sweden has formally submitted its application to join NATO. As a historically neutral nation, this marks a significant shift in Swedish defense policy. With growing tensions in the region, Stockholm now seeks security under the NATO umbrella. It is up to us and our allies to respond."
 sweden.56.t:0 "Invitation to the Nordic Council"
 sweden.56.d:0 "The Swedish government has formally proposed the creation of a defensive and cooperative alliance — the Nordic Council. Citing shared values, geographic proximity, and common interests, Sweden seeks to unite the Nordic nations under a single faction to safeguard regional stability. We have been invited to join this new alliance. Will we stand with our neighbors?"
 sweden.57.t:0 "Integration into the Nordic Union?"
 sweden.57.d:0 "With the Nordic Council transforming into a full federal union, our nation has officially been integrated into this new supranational entity. Sovereignty gives way to unity, as we now stand united under a common flag, institutions, and future."
 sweden_news.1.t:0 "Military Coup Against Communists In Sweden"
 sweden_news.1.d:0 "Sweden has erupted into political chaos as the armed forces launch a swift coup against the communist government. Tanks have entered Stockholm, officials have been detained, and red flags removed from public buildings. The military says it is acting to restore constitutional order, while critics warn of a new authoritarian era."
 sweden_news.3.t:0 "Moderaterna Win Election in Sweden"
 sweden_news.3.d:0 "Moderaterna have won the Swedish parliamentary election after a campaign focused on law and order, energy security, and welfare reform. Ulf Kristersson is set to form a new government, promising tougher crime policies, reduced immigration, and expanded nuclear power. The result marks a shift toward more pragmatic conservative leadership."
 sweden_news.4.t:0 "Sweden Democrats Win Election in Sweden"
 sweden_news.4.d:0 "The Sweden Democrats have secured a major breakthrough in the Swedish Riksdag, winning strong support on a platform of nationalism, stricter immigration controls, and tougher crime policy. Led by Jimmie Åkesson, the party’s rise reflects deep voter frustration with the political establishment. The result is expected to reshape Sweden’s political direction."
 sweden_news.2.t:0 "Social Democrats Win Election in Sweden"
 sweden_news.2.d:0 "The Social Democrats have narrowly won the Swedish election amid economic uncertainty and rising social tensions. Magdalena Andersson is set to continue in office, promising to strengthen the welfare state, reduce inequality, and expand climate policy. The victory comes in a deeply divided political climate."
 sweden_news.5.t:0 "Swedish King Proclaims New Foreign Policy"
 sweden_news.5.d:0 "Following a royalist resurgence, the King of Sweden has announced a new foreign policy aimed at restoring Sweden’s historic influence. The monarchy references the legacy of the Swedish Empire and signals a more assertive regional stance. Neighbouring states are watching the shift with concern."
 sweden_news.6.t:0 "Sham Election in Sweden"
 sweden_news.6.d:0 "Following a period of military rule, Sweden has held elections that installed a nationalist-led government under Stefan Jacobsson. The vote has been widely condemned internationally, with reports of low turnout and irregularities. Critics describe the process as legitimising continued authoritarian control."
 sweden_news.7.t:0 "Swedish Delegation Visits Beijing"
 sweden_news.7.d:0 "A senior Swedish delegation led by General Secretary [SWE.GetLeader] has arrived in Beijing for a high-profile state visit. Talks focus on deepening political and economic cooperation between Sweden and China. The visit highlights strengthening ties between the two governments."
 sweden_news.8.t:0 "Trade Unions Empowered In Sweden"
 sweden_news.8.d:0 "Trade unions have taken a central role in Swedish politics, dismantling remaining capitalist structures and expanding worker control over industry and services. Industrial councils are now overseeing major sectors of the economy. The shift marks a major restructuring of the Swedish state."
 sweden_news.9.t:0 "Nordic Unity Under The Red Banner"
 sweden_news.9.d:0 "Sweden, Norway, Denmark, Finland, and Iceland have formed a unified communist federation under the Red Banner. The new Nordic Union is presented as a project of socialist unity and regional cooperation. The move significantly alters the political balance in Northern Europe."
 sweden_news.10.t:0 "Islamist Rebellion Engulfs Sweden"
 sweden_news.10.d:0 "Sweden has descended into chaos after a coordinated Islamist uprising across the country. Major cities have been hit by attacks, and key government sites in Stockholm and Malmö have been seized. The monarchy has been struck and the armed forces are reported to be fragmenting under pressure."
 sweden_news.11.t:0 "Islamic Rebels Win in Sweden"
 sweden_news.11.d:0 "After months of conflict, Islamist forces have taken control of key regions in Sweden, forcing the collapse of the existing government. A new order based on strict religious rule is being established in major cities. The country is undergoing a rapid political transformation."
 sweden_news.12.t:0 "The Fifth Arab–Israeli War"
 sweden_news.12.d:0 "War has broken out in the Middle East after Israel rejected proposals for a two-state solution, prompting a coordinated response from several Arab states. Fighting has erupted across multiple borders as regional tensions escalate rapidly. The conflict is now being described as a major regional war."
 sweden_news.13.t:0 "Nordic Council Federates"
 sweden_news.13.d:0 "The Nordic Council has formally transformed into a federal structure, binding member states into closer political and economic cooperation. The move aims to strengthen regional stability and coordination. It marks a new stage in Nordic integration."
 switzerland.2.t:0 "End of the Swiss Political System"
 switzerland.2.d:0 "The democracy in Switzerland, once viewed as a role model and a shining star of inspiration for all those seeking more popular involvement in government due to the possibilities given to the Swiss citizens, is no more.\n\nThe Swiss leader [SWI.GetLeader] has announced that these \"Distractions from Public Life\" and \"Unnecessary Referendums\" would stop taking place."
 switzerland.2.o1:0 "Good riddance."
 switzerland.2.o2:0 "Such a shame."
 switzerland.2.o3:0 "Whatever."
 switzerland.3.t:0 "Invitation to the Swiss Alliance"
 switzerland.3.d:0 "In order to protect our mutual international sovereignity, Switzerland has invited us to their alliance of neutrality and multinational safety."
 switzerland.3.o1:0 "We accept!"
 switzerland.3.o2:0 "No!"
 switzerland.4.t:0 "The Alpine Republic"
 switzerland.4.d:0 "Switzerland has proclaimed the union of Alpine states into the Alpine Republic - and has asked us to join."
 switzerland.4.o1:0 "For the Alps!"
 switzerland.4.o2:0 "Uhh, no."
 switzerland.5.t:0 "Swiss Threats"
 switzerland.5.d:0 "With a new military faction at their backs, the Swiss have now descended upon us and sent our country a threat to 'stop posing a threat to the Swiss government, people and the countries and peoples allied with Switzerland'. Switzerland also transmitted to us a program of twenty-one points to follow - but accepting would de facto result in our annexiation into the Swiss Confederation."
 switzerland.5.o1:0 "We have to accept."
 switzerland.5.o2:0 "Never! FREEDOM!"
 switzerland.6.t:0 "The End of Switzerland"
 switzerland.6.d:0 "Now confirmed by referendum: The Swiss state will cease to exist. The German and Romansh parts of the country will seek statehood in the Federal Republic, the Romagne will seek accession to France and the Italian parts of Switzerland will become an Italian province."
 switzerland.6.o1:0 "All good things must come to an end."
 switzerland.7.t:0 "Adolf Ogi becomes President"
 switzerland.7.d:0 "The President of Switzerland is a position that switches between the seven members of the Swiss Federal Councils in annual cycles.\n\nAdolf Ogi of the right-wing populist Swiss People's Party took over the position for the year 2000. He had already presided over the council successfully in 1993."
 switzerland.7.o1:0 "A good choice."
 switzerland_news.1.t:0 "Switzerland joins the UN"
 switzerland_news.1.d:0 "Originally, the Swiss government had refused to join the United Nations after the end of the Second World War, pointing to the country's continued dedication to its own neutrality - which is especially weird considering the UN's main seat in Europe is the UNOG, the United Nations Office in Geneva.\n\nNow, after a public referendum on the matter, the Swiss government has announced that the country would move forward to abandon its post as a spectator and would now join the organization as a full member."
 switzerland_news.1.o1:0 "It's about time, Switzerland!"
 switzerland_news.1.o2:0 "And what about us?"
 switzerland_news.1.o3:0 "Is it really that big of a deal?"
 switzerland_news.2.t:0 "The End of Swiss Neutrality"
 switzerland_news.2.d:0 "Switzerland's commitment to international neutrality and non-alignment in times of both peace and war goes back to the year 1516, when the Swiss Confederacy stopped its policy of expansion after a defeat at French hands. Swiss secession from the Holy Roman Empire in 1648 helped the country further that stance. The final step was in 1815, when all major powers acknowledged and guaranteed Swiss neutrality in the post-Napoleonic Congress of Vienna.\n\nThis era of Swiss history is now over. The president of the federal council, [SWI.GetLeader], has announced that Switzerland would no longer continue to honor its oaths of old and has formally absolved the major powers previously guaranteeing its independence off their duty to do so."
 switzerland_news.2.o1:0 "A significant development?"
 switzerland_news.2.o2:0 "The dawn of a new age!"
 switzerland_news.3.t:0 "[SWI.GetLeader] confirms Swiss Neutrality"
 switzerland_news.3.d:0 "The Swiss federal council, backed up by the parliament and the cantons, has today once again affirmed Swiss non-intervention in international conflicts.\n\n[SWI.GetLeader] has commented that membership in an international coalition will not only bring peril to the Swiss people but also encouraged the world to do the same."
 switzerland_news.3.o1:0 "That's not really news..."
 switzerland_news.3.o2:0 "Switzerland saving the day!"
 switzerland_news.4.t:0 "The Swiss Protection League"
 switzerland_news.4.d:0 "In a move creating a political union that is very close to a military faction (but of course officially not a military faction), the Swiss defensive ministry has gotten parliamentary support for the creation of a 'Swiss Protection League' (which has, as is custom in Switzerland, four different official names in the various languages of the country).\n\nThis seems to be the next big step in further armed 'neutrality' of Switzerland."
 switzerland_news.4.o1:0 "Armed Neutrality indeed."
 switzerland_news.5.t:0 "The Alpine Republic"
 switzerland_news.5.d:0 "The Swiss government has sent requests to the governments of Liechtenstein and Austria to approve of legislation to join the Swiss Confederation in the form of 20 new cantons.\nAt the same time, Switzerland has also officially changed its name to 'The Republic of the Alps' or 'Alpine Republic' for short.\n\nVaduz and Vienna are yet to respond, but chances for unification seem surprisingly good. Liechtenstein has been guaranteed the right to preserve its monarch as permanent head of the canton even in the Republican form of government and Austria has been guaranteed 49% of the seats in the new parliament, with 45% going to the four national communities of Switzerland and 6% to Liechtenstein."
 switzerland_news.5.o1:0 "Redefining neutrality since 1516."
 switzerland_news.6.t:0 "The End of the Swiss Confederation"
 switzerland_news.6.d:0 "In a worldshattering referendum, the cantons of Switzerland have all unanimously voted to divide Switzerland among linguistic lines into three entities, a German-Romansh, a French and an Italian one. All of those entities have further already confirmed plans to be absorbed into the respective linguistic motherland.\n\nThis marks the end of Swiss Independence. The country has existed without interruption since the legendary Rütlischwur of 1307."
 switzerland_news.6.o1:0 "All countries must eventually perish."
 syria.1.t:0 "An Interim Government for Syria"
 syria.1.d:0 "With Damascus secured and the old order swept aside, We a dilemma. Syria cannot be governed by militias and slogans alone. An interim government must be formed to stabilize the state, restore basic administration, and define the ideological direction of the revolution.\n\nWithin the leadership, a debate has emerged. Hardline clerics and veteran commanders demand an openly Islamist government, one that enshrines Sharia as the foundation of the new Syrian state and rewards those who fought for victory. Others argue for a technocratic cabinet, composed of administrators, engineers, and economists, intended to reassure the population, maintain international channels, and prevent total isolation.\n\nThe decision will shape not only Syria’s institutions, but the very character of the regime that rises from the ashes of the civil war."
 taiwan.2.o1:0 "Truly, there is only one China!"
 taiwan.2.o2:0 "Eh, two Chinas is fine."
 taiwan.3.o1:0 "Stay in Taipei."
 taiwan.3.o2:0 "The Northern Capital! Beijing!"
 taiwan.3.o3:0 "The Southern Capital! Nanjing!"
 texas.1.t:0 "More stars for the Lone Star"
 texas.1.d:0 "Texas has thrown off its former shackles that bound it to both the filthy corrupt elite in Washington and the filthy hippies in California, which now probably even is the best state in the United States, which without us is a hellhole.\n\nBut there once were plans of an even better Texas, which was, in its independence, to control and dominate parts of Wyoming, Colorado, New Mexico and the objectively worse version of Texas that is known as Oklahoma. These plans are on a desk somewhere around here for sure, and we might need to get them going again."
 texas.1.o1:0 "Let's better their situation and their barbeque!"
 texas.1.o2:0 "Guys, it's called Lone Star for a reason..."
 turkey.1.t:0 "The July 15th Coup"
 turkey.1.d:0 "On July 15th, 2016, several circles within the Turkish military had grown fed up with the increasingly jingoistic and islamistic policies of the [TUR.GetLeader] administration.\nIn several large cities, including Istanbul and Ankara, insurgent troops tried to take over government buildings and central infrastructure like bridges during the night.\n\nQuickly after, pro-government civilians swarmed the streets to protest the coup attempt, eventually overpowering the insurgency and practically forcing the government back to power. [TUR.GetLeader], on vacation at the time, called upon his supporters to resist via social media and had informed them that he evaded capture.\n\nTurkey's government is still in power, but there will need to be serious repercussions - but the opposition warns the ruling [TUR.GetRulingParty] to not abuse their influence in this position of power. However, there will need to be some sort of vengeance for the more than 300 killed during the battles in the night.\n\n[TUR.GetLeader] has already found the culprit though - he has repeatedly pointed to exiled islamic preacher Fetullah Gülen, living abroad in the United States. Is his movement really to blame? Doubts and wild theories are running rampant throughout the entire country and among all political forces."
 turkey.1.o1:0 "We will make them suffer for this."
 turkey.2.t:0 "Response to the Coup"
 turkey.2.d:0 "[TUR.GetLeader] has safely returned to power and his [TUR.GetRulingParty] is firmly back in power. Now, a joint political counter offensive against the former insurgents, coordinated by all branches of the Turkish government, is ready to be launched."
 turkey.2.o1:0 "Let's blame this on Gülen and be done with it."
 turkey.2.o2:0 "We need to heal the nation. Let's investigate first."
 turkey.3.t:0 "The Investigation brings up nothing"
 turkey.3.d:0 "As in turns out, the military insurgency was nothing but a military insurgency - generals behind the scenes, willing to take power at the expense of the government. Many inside the ruling [TUR.GetRulingParty] had had wild conspiracy theories - but they seem to all have been wrong."
 turkey.3.o1:0 "Damn military despots."
 turkey.4.t:0 "The Investigation points to Gülen!"
 turkey.4.d:0 "Our conservative politicians were right after all! Several transcripts and eMails point to Fetullah Gülen as directly responsible for instigating the coup in order to regain power in Turkey and to depose [TUR.GetLeader] and, as it is stated in one eMail, 'have him executed'."
 turkey.4.o1:0 "We knew it!"
 turkey.5.t:0 "The Investigation points to the Kurds!"
 turkey.5.d:0 "While our initial theories regarding Gülen were wrong, there IS a conspiracy going on. It seems that Kurdish politicians and local militia commanders financed and prepared the coup, but failed to execute their planned blitz attacks in Turkish Kurdistan."
 turkey.5.o1:0 "Damn bastards!"
 turkey.6.t:0 "The Investigation points to Communism!"
 turkey.6.d:0 "Neither Gülen nor the Kurds seem to have much to do with the coup on July 15th - but our communist and far left political insurgents have.\n\nThis is an unexpected enemy to face, but we will face these red bastards anyway!"
 turkey.6.o1:0 "Better red than that other red!"
 ukraine.1.t:0 "Zelensky Remains Defiant"
 ukraine.1.d:0 "President Volodymyr Zelenskyy remains defieant and has publiced videos of himself among other ministers sill remaining in Kyiv. With Zelenskyy remaining in Ukraine the people of Ukraine face the fight of their life."
 ukraine.2.t:0 "Zelensky Felees Ukraine"
 ukraine.2.d:0 "ukraine.2.d:0 \"In the dead of night, President Volodymyr Zelenskyy secretly fled Ukraine, crossing into Poland with his closest allies. Once hailed as a symbol of defiance, his sudden departure is now seen as a betrayal by the Ukrainian people. With the leader abandoning his country in its darkest hour, the nation faces an uncertain future. The hopes of resistance have been shattered, and it is clear now, Ukraine is on the verge of collapse."
 ukraine.3.t:0 "Ukraine Offers Surrenders"
 ukraine.3.d:0 "In a desperate attempt to end the bloodshed and save what remains of the country, Ukraine offers to surrender the south and east to Russian forces. With the government in disarray and morale at an all-time low, the decision to cede vast territories is seen as an acknowledgment of the inevitable."
 ukraine.4.t:0 "Russia Rejects Our Conditions"
 ukraine.4.d:0 "In a crushing blow to our hope for a peaceful resolution, Russia has flatly rejected the terms offered by the us."
 ukraine.5.t:0 "Total Defeat in Ukraine"
 ukraine.5.d:0 "It is over. The Russian army has been forced into a full retreat, abandoning all gains in Ukraine. City by city, our forces have been shattered, our offensives crushed, and our authority humiliated on the world stage. The dream of victory has turned to ash. At home, fury and despair grip the nation. The streets whisper of betrayal, the corridors of power shake with uncertainty, and once-loyal allies begin to waver. How long can the Kremlin stand when the weight of failure grows heavier by the day?"
 ukraine.6.t:0 "The Capital Question"
 ukraine.6.d:0 "In a matter of days, Russian forces have overrun much of Ukraine. Kyiv is now a front-line city, under direct threat from advancing Russian troops. With the Ukrainian government and military leadership retreating westward, a critical decision must be made: Should the capital remain in Kyiv, a symbol of national identity now exposed to danger, or should it be relocated to Lviv, deeper in the safety of Western Ukraine?\n\nThe choice will shape the morale of the nation—and the course of the war."
 ukraine.7.t:0 "The Economic Consequences of Collapse"
 ukraine.7.d:0 "With the signing of the peace agreement and the loss of over half our national territory including major industrial and financial centers Ukraine faces a catastrophic economic situation. Vital ports are gone, the capital is occupied, and millions have been displaced. While the fighting ended quickly, the damage to our economy was instantaneous and immense. What remains is a shell of our former infrastructure, reliant on emergency aid and struggling to function."
 ukraine.8.t:0 "The Emergency Election"
 ukraine.8.d:0 "With the collapse of Ukraine’s eastern territories and a fragile peace now in place, the provisional government has moved forward with organizing an emergency presidential election to restore legitimacy. Two candidates stand at the center of this moment:\n\nYulia Tymoshenko — a seasoned politician, former prime minister, and a symbol of democratic resilience.\n\nValerii Zaluzhnyi — the widely respected commander who led the defense effort and now offers strong, stable leadership from outside the political class.\n\nThe nation stands at a crossroads"
 ukraine.9.t:0 "Ukraine asks us for Security Guaratees"
 ukraine.9.d:0 ""
 ukraine.10.t:0 "[FROM.GetName] Accepts"
 ukraine.10.d:0 ""
 ukraine.11.t:0 "[FROM.GetName] Declines"
 ukraine.11.d:0 ""
 ukraine.12.t:0 "The [GetYear] Ukrainian Constitution"
 ukraine.12.d:0 "after extensive deliberation, passionate debates, and a nationwide effort to forge a more perfect union, a new constitution for Ukraine has been ratified. This monumental document lays the bedrock for our future, enshrining the rights and freedoms of our citizens, restructuring governance for greater transparency and accountability, and affirming the principles upon which our revitalized nation stands. It represents a unified vision for a stable, prosperous, and democratic Ukraine."
 ukraine.13.t:0 "Ukraine Request us to Invest in Their Country"
 ukraine.13.d:0 "Ukrainian government has approached us with an offer for investment"
 ukraine.14.t:0 "Russian Cyber Attacks!"
 ukraine.14.d:0 "Early in the morning government websites were attacked, we believe it to be Russia. 70 Websites were affected such as the Ministry of Foreign Affairs, the Security Defense Council, ECT. We were able to restore the sites in a few hours, and despite the SBU stating that no data was leaked, it left a mark on our people. Some of the messages left by the attackers read: '§RUkrainian! All your personal data has been uploaded to the public network. All data on your computer will be destroyed and restored is impossible. All information about you has become public, available to everyone. You are awaited by the past, present, and future. For Volhynia, for the OUN UPA, for Galicia, for Polissya, and for historical lands§!'"
 ukraine.15.t:0 "Russian Invasion!"
 ukraine.15.d:0 "Just before dawn, the sound of explosions shattered the calm across Ukraine. Russian missiles and airstrikes struck airports, command centers, and key infrastructure in cities including Kyiv, Kharkiv, Dnipro, and Odessa. Within hours, Russian ground forces crossed the borders from multiple directions — from Belarus in the north, from occupied Crimea in the south, and through the Donbas in the east. In a televised address, Russian President Vladimir Putin announced the beginning of a “special military operation,” claiming it was intended to “demilitarize and denazify Ukraine.” The statement was immediately condemned around the world as a pretext for a full-scale invasion. Ukrainian President Volodymyr Zelenskyy declared martial law and called upon the nation to resist the invasion, vowing that Ukraine “will defend itself and will not give up its freedom.” Ukrainian forces are engaging Russian troops across multiple fronts, while civilians are sheltering from bombardments or fleeing westward toward safer regions."
 ukraine.16.t:0 "Ukraine Requests NATO Membership"
 ukraine.16.d:0 "Having defeated Russia in the Russo-Ukrainian war, Ukraine has formally requested to join NATO, citing fears of a future Russian invasion. Should we let them into our alliance?"
 ukraine.17.t:0 "Ukraine Requests Abrams"
 ukraine.17.d:0 "Ukraine would like for us to lease them Abrams to win their war against Russia. How do we respond?"
 ukraine.18.t:0 "Ukraine Requests Bradleys"
 ukraine.18.d:0 "Ukraine would like for us to lease them Bradleys to win their war against Russia. How do we respond?"
 ukraine.19.t:0 "Ukraine Requests Leopords"
 ukraine.19.d:0 "Ukraine would like for us to lease them Leopords to win their war against Russia. How do we respond?"
 ukraine.20.t:0 "Our request was accepted!"
 ukraine.20.d:0 "The equipment is on its way as we speak."
 ukraine.21.t:0 "Kursk Invasion!"
 ukraine.21.d:0 "Ukraine has done the unthinkable and crossed our border into Kursk! They are collaberating with the so called 'Free Russia Legion' and advancing rapidly towards the city of Sudzha!"
 ukraine.22.t:0 "Corruption Swept Out"
 ukraine.22.d:0 "We have effectively fixed the corruption in our country."
 ukraine.23.t:0 "Lessons of War"
 ukraine.23.d:0 "Having fought for a few months, far longer than anyone anticipated, we have learned a lot."
 ukraine.24.t:0 "Ukraine suggests a joint invasion of Transnistria"
 ukraine.24.d:0 "Ukraine has suggested we invade Transnistria, finally reunited our country and killing an enemy we both despise. This will greatly benefit us both, only concern is how Russia will respond to such an action."
 ukraine.25.t:0 "Russia Defeated"
 ukraine.25.d:0 "We have successfully defended our nation and emerged victorious against Russia. Our soldiers and people have shown incredible resilience, and the path to rebuilding Ukraine begins today."
 ukraine.26.t:0 "Entrenched Deadlock"
 ukraine.26.d:0 "What began as a promising offensive by Russia has run into increasingly prepared defensive lines. As both armies continue to reinforce their positions, gains have become harder to achieve and casualties continue to mount. The battlefield has settled into a costly stalemate."
 ukraine.27.t:0 "Ukrainian Refugees!"
 ukraine.27.d:0 "With the outbreak of the war, many scared Ukrainians have fled their homes for safer communities. In total, roughly 6,000,000 Ukrainians have fled."
 ukraine.28.t:0 "Ukrainian Refugees Return!"
 ukraine.28.d:0 "With our victory in the war, many Ukrainians who initially fled have returned home, although some decided to stay, having made a life in the country they fled to."
 ukraine.29.t:0 "Ukrainian Refugees Arrive"
 ukraine.29.d:0 "With the outbreak of the Russo-Ukraine war, many Ukrainians have fled the battlefields and have turned up here, to make a new safer home for themselves. This will no doubt, surely boost our workforce!"
 ukraine.30.t:0 "Ukrainian Drones Target Key Infrastructure"
 ukraine.30.d:0 "Ukrainian drones have hit and destroyed key infrastructure in the following regions:"
 news_UKR.1.t:0 "Volodymyr Zelenskyy Flees Ukraine"
 news_UKR.1.d:0 "President Volodymyr Zelenskyy has reportedly fled Ukraine during the night, crossing into Poland alongside a small group of close aides. Once widely seen as the symbol of Ukrainian resistance, his sudden departure has sent shockwaves through the country. Officials in Kyiv have not confirmed his status, while confusion spreads across remaining government structures."
 news_UKR.2.t:0 "Ukraine Surrenders To Russia"
 news_UKR.2.d:0 "Ukraine has formally surrendered to Russia following the signing of a peace agreement in Istanbul. After weeks of heavy fighting and internal strain, Ukrainian representatives agreed to terms that include the transfer of significant territory. The announcement marks a dramatic turning point in the conflict, effectively ending organized resistance."
 news_UKR.3.t:0 "Tymoshenko Secures Victory in Ukraine"
 news_UKR.3.d:0 "Yulia Tymoshenko has won a snap emergency election in Ukraine, securing a mandate to form a new government amid ongoing political instability. The vote followed weeks of unrest and institutional breakdown, with turnout driven by demands for stability and direction. Her campaign gained traction through promises of immediate economic recovery and political consolidation."
 news_UKR.4.t:0 "Valerii Zaluzhnyi Wins Ukrainian Election"
 news_UKR.4.d:0 "General Valerii Zaluzhnyi has won Ukraine’s latest election, securing a decisive mandate widely interpreted as a shift toward military-backed governance. His campaign emphasized security, order and institutional discipline, resonating with voters amid ongoing instability."
 united_nations.0.t:0 "Security Council Intervention"
 united_nations.0.d:0 "A new war is being waged on the world. The United Nations Security Council has to consider stepping in to secure the peace."
 united_nations.0.o1:0 "Stop the aggressor!"
 united_nations.0.o2:0 "No such action is necessary."
 united_nations.20.t:0 "UN Resolution 1368"
 united_nations.20.d:0 "The American delegation has, in response to the horrific 9/11 terrorist attacks, called a united action of the UN Security Council against the Al-Qaeda militia.\n\n1) The Security Council calls upon all countries of the world to cooperate against terrorism and to cooperate to bring Al-Qaeda to justice.\n2)The United Nations Security Council condemns the attacks in New York City, expresses sympathy to the victims, their families and the American government and regards the incident as a threat to international peace.\n3)The countries of the world are to remain vigilant and to increase their cooperative efforts against terrorism and their implementation of UN resolutions against terrorism, particularly Resolution 1269 (October 19th, 1999)."
 united_nations_vote.1.t:0 "Security Council Meeting"
 united_nations_vote.1.d:0 "It is now time to cast our vote on the current issue of the United Nations Security Council. As a Permanent Member, a \"no\" would be fatal to the entire project - so maybe an abstention is preferable? Or are we behind the project?"
 united_nations_vote.2.t:0 "Security Council Meeting"
 united_nations_vote.2.d:0 "The current issue of the United Nations Security Council comes to a close - and we now have to cast our vote. Sure, we are not a permanent member and thus lack veto power, but if less than nine members vote in favor, nothing will come of this. This means that our vote holds significance - are we against the current plan? Are we in favor? Or should we stay out of it?"
 united_nations_vote.o.approve:0 "In Favor"
 united_nations_vote.o.abstain:0 "Abstain"
 united_nations_vote.o.ready:0 "I am ready to take my decision."
 united_nations_vote.o.refuse:0 "Against"
 united_nations_vote.o.veto:0 "Veto!"
 united_nations.21.t:0 "We Are a Nuclear State"
 united_nations.21.d:0 "Our nation enters this new global era as a recognized nuclear power. Our strategic deterrent is now operational, ensuring our sovereignty is backed by the ultimate form of defense in modern warfare. The balance of power has shifted, and our position on the world stage is irrevocably changed."
 usa.1.t:0 "The First Presidential Debate of 2024"
 usa.1.d:0 "Millions of Americans tuned in to watch the first debate of the 2024 campaign. President Biden, though experienced and steady, appeared weary and struggled at times with his delivery. Former President Trump, in contrast, projected confidence and energy, repeatedly landing sharp blows that resonated with his supporters. \n\nThe performance has shifted the tone of the campaign Trump emerges strengthened, while questions about Biden’s age and fitness for office grow louder."
 usa.22.t:0 "Totalitarians in NATO!"
 usa.22.d:0 "It has come to our attention that one of our military allies, namely [From.GetName], has turned to a totalitarian ideology. Our other allies are already voicing concerns and demanding [From.GetAdjective] to be booted from [Root.GetFactionName] in order to assure that [Root.GetFactionName] armies don't serve [From.GetAdjective] interests.\n\nWe could have them expelled from the faction without large issues, but we would of course lose a potentially valuable military ally. If we however left them in the faction, that would be upsetting to both our democratic allies and democratic countries everywhere, hurting future diplomatic endeavours."
 usa.22.o1:0 "Freedom is not free! Kick them out!"
 usa.22.o2:0 "We really could not care less."
 usa.23.t:0 "The US tolerates totalitarians in [USA.GetFactionName]!"
 usa.23.d:0 "In recent discussions whether or not to remove a totalitarian dictatorship from the ranks of [USA.GetFactionName], [USA.GetLeader] has shown quite the disregard for the internal dealings of said dictatorship and flatly pointed to American interests to justify keeping these authoritarians in [USA.GetFactionName].\n\nIt is to be expected that [USA.GetFactionName] will soon march for the interests of a few dictators rather than the great democratic peoples of the civilized west."
 usa.23.o1:0 "They hate us cause they ain't us."
 usa.23.o2:0 "We might need to look for new allies."
 usa.23.o3:0 "Good. Goooood."
 usa.23.o4:0 "Very worrying."
 usa.23.o5:0 "Neutrality will keep us safe."
 usa.23.o6:0 "But Russia is always the bad guy, eh?"
 usa.23.o7:0 "Even America concedes democracy is overrated."
 usa.25.o1:0 "The system working as intended."
 usa.26.t:0 "The next NATO leader"
 usa.26.d:0 "Now that we are about to leave NATO, we will have to select which country we shall assist to take over our leading position within the organization."
 usa.26.o1:0 "The Canadians are good friends."
 usa.26.o2:0 "The British are excellent allies."
 usa.26.o3:0 "The French don't surrender easily."
 usa.26.o4:0 "The Germans are efficient leaders."
 usa.26.o5:0 "The Italians I guess."
 usa.27.t:0 "We now lead NATO!"
 usa.27.d:0 "With the Americans about to leave NATO in favor of their Monroe Doctrine partners, the American government has approached us to make clear that we could be the only ones to continue leading the remainder of the organization after the United States left it."
 usa.27.o1:0 "With glory we shall lead!"
 usa.28.t:0 "Invitation to the American Alliance"
 usa.28.d:0 "Even though American NATO membership is no more, the United States has still not stopped running a military alliance and considering new allies and alliances - and of the countries considered is [This.GetNameDef].\n\nA formal invitation to the American Alliance was issued to our ambassador in the American capital today, calling upon us to take up our guns and our minds and to join the United States in its political pursuits."
 usa.28.o1:0 "With America we stand!"
 usa.28.o2:0 "We will have to pass on that one..."
 usa.29.t:0 "American Infrastructure Investments"
 usa.29.d:0 "The American government has approached us with business contracts regarding a possible American investment spree in our infrastructure - motorways, railroads, airports.\n\nWe will suffer a loss of sovereignity due to American companies' influence, but better infrastructure will help us construct new projects."
 usa.29.o1:0 "Excellent!"
 usa.29.o2:0 "We have better uses for these funds."
 usa.30.t:0 "American Stabilization Effort"
 usa.30.d:0 "Our government has corruption issues and our judges and administrators are often bribed. The American government has approached us expressing the hope that American instructors and teachers as well as American law enforcement methods could help us make our system more straightforward."
 usa.30.o1:0 "All help is welcome."
 usa.31.t:0 "American Military Assistance"
 usa.31.d:0 "Our American friends have sent us a military delegation in order to modernize and train our military. While our internal opposition does not approve of us potentially drawing even closer to U.S. influence, this is of decisive importance to our national defense. U.S. Army, U.S. Navy, U.S. Air Force and even U.S. Marine Corps instructors have already begun holding seminars and overseeing field exercises in order to train our military officer staff."
 usa.31.o1:0 "Excellent."
 usa.32.t:0 "Donald Trump Inaugurated as 47th President of the United States"
 usa.32.d:0 "Donald J. Trump has been sworn in as the 47th President of the United States, returning to the office with a bold agenda and a defiant stance against his critics. \nHis inauguration speech was a fiery declaration of his America First vision, promising to crush opposition, secure U.S. dominance on the global stage, and dismantle the \"corrupt establishment\" that he claims has plagued the nation for decades.Amid roaring cheers from his supporters and bitter protests from his detractors, Trump vowed to reshape America in his image, emphasizing strength, loyalty, and unwavering resolve. The country stands polarized, with his presidency poised to be as controversial and unpredictable as his rise to power."
 usa.33.t:0 "Kamala Harris Inaugurated as 47th President of the United States"
 usa.33.d:0 "Kamala Harris has made history by being inaugurated as the 47th President of the United States, the first woman and person of South Asian and African American descent to hold the office.\nHer speech focused on breaking barriers, restoring trust in government, and addressing the pressing issues of the nation, from climate change to economic reform.While Harris’s supporters view her presidency as a bold step forward for progress and representation, critics question her ability to unite a divided nation and tackle growing domestic and global tensions. As her administration begins, Harris faces the daunting task of proving her leadership in an era of deep political and social fractures."
 usa.34.t:0 "Joe Biden Inaugurated as President of the United States"
 usa.34.d:0 "Joe Biden has been sworn in for a second term as the 46th President of the United States. In his inaugural address, Biden reaffirmed his vision of unity and progress, promising to heal the deep divides within the nation.\n He pledged to continue fighting for democracy, environmental reform, and the preservation of global alliances.While his supporters celebrate his steady leadership, critics see his second term as a continuation of failed policies and growing instability. With a polarized electorate and mounting challenges at home and abroad, Biden's presidency enters a critical chapter that will define his legacy."
 usa.35.t:0 "Cabinet Uses 25th amendment agains Trump"
 usa.35.d:0 "The cabinet has used the 25th amendment against the old, idiotic and corrupt Trump, installing Musk as the new president"
 usa.36.t:0 "The American Demand"
 usa.36.d:0 "President Trump has made his intentions clear the Panama Canal must be handed over to the United States. His administration insists that it’s a matter of national security and strategic importance, ignoring any notion of Panamanian sovereignty. The pressure is mounting, and the world watches as we face the prospect of either bowing to American demands or risking a clash with the most powerful nation on Earth."
 usa.37.t:0 "China invades Taiwan, what should we do ?"
 usa.37.d:0 "Chinese forces have launched a massive invasion of Taiwan, throwing the Indo-Pacific into chaos. Taiwanese cities are under siege, and the island's government has called upon the international community—especially the United States—for aid. The Pentagon is scrambling to assess military options, while Congress is fiercely divided. Do we risk open war with the PRC to uphold our credibility and protect a democratic ally, or do we stand down and avoid plunging the world into another catastrophic conflict?"
 usa.38.t:0 "In Or Out"
 usa.38.d:0 "Standing at the podium in the White House Rose Garden, President Trump prepares to address the nation—and the world. Behind closed doors, fierce debate has raged: should the United States continue to uphold its commitments to NATO, or is it time to chart a new, independent course? To some, the alliance is outdated and one-sided. To others, it remains a cornerstone of global stability. As cameras flash and aides watch nervously, the President prepares to deliver a decision that could redefine the global order."
 usa.39.t:0 "The State of the Union, 2022"
 usa.39.d:0 "President Biden delivered a confident and forward-looking State of the Union address. Emphasizing unity, econom recovery, and American resilience, the speech was well-received by many, setting a hopeful tone for the nation's path ahead."
 sa.40.t:0 "Legislative Victory"
 sa.40.d:0 "President Biden has signed a major piece of legislation into law, marking a significant step forward for his administration. The American people have taken notice, and early polling suggests a modest boost in approval ratings. While challenges remain, this legislative success provides fresh momentum."
 usa.40.t:0 "Legislative Victory"
 usa.40.d:0 "President Biden has signed a major piece of legislation into law, marking a significant step forward for his administration. The American people have taken notice, and early polling suggests a modest boost in approval ratings. While challenges remain, this legislative success provides fresh momentum."
 usa.41.t:0 "Roe v Wade Overturned "
 usa.41.d:0 "In a historic and deeply polarizing decision, the Supreme Court has overturned Roe v. Wade, ending federal protection for abortion rights. The ruling immediately triggers political shockwaves, as Republican-led states move swiftly to ban abortion. The Democratic base is outraged, while conservatives celebrate a long-awaited victory. President Biden must now decide how to respond to this moment of national upheaval."
 usa.42.t:0 "Midterm Elections Begin"
 usa.42.d:0 "With summer behind and November fast approaching, both parties begin ramping up their campaigns for the midterm elections. Culture war issues, the economy, and the legacy of Trump dominate the national conversation. The outcome will determine control of Congress §RIf Republicans Gain Control Of Congress Appointing Advisors Will Become Harder§!"
 usa.43.t:0 "Midterm Message"
 usa.43.d:0 "As midterm campaigning intensifies in autumn 2022, Biden’s team debates the core theme: should the campaign zero in on attacking Trump and his legal chaos, rallying the base with anger and contrast? Or should the message center on defending American democracy—tying threats like Roe’s overturned and election subversion into a broader existential framing?"
 usa.45.t:0 "Inflation Gets Worse"
 usa.45.d:0 "The Federal Reserve has released new data indicating that inflation continues to rise at an alarming rate. Despite previous measures, prices are surging across key sectors, including energy, food, and housing. This news is expected to intensify criticism from Republicans, who blame the administration's spending programs for the economic strain."
 usa.46.t:0 "Mar-a-Lago Raid Energizes Trump’s Base"
 usa.46.d:0 "Federal agents executed a search warrant at former President Donald Trump's Mar-a-Lago estate in Florida, reportedly related to classified documents. While critics call it a step toward accountability, Trump's base has rallied around him, framing the search as a politically motivated attack."
 usa.47.t:0 "Trump Endorses MAGA Extremists"
 usa.47.d:0 "Former President Trump has publicly endorsed several hard-right, controversial Republican candidates widely seen as far outside the GOP mainstream. Critics say his choices damage the party’s credibility, but his base continues to rally behind him—reinforcing Trump's grip over the Republican field."
 usa.48.t:0 "The Healthcare Debate Rekindles"
 usa.48.d:0 "As healthcare costs continue to rise and millions remain underinsured, the question of reform returns to the forefront of American politics. Lawmakers, activists, and think tanks clash over the future of the system. Some demand a robust public option to guarantee affordable care for all, while others advocate for targeted reforms within the existing framework. The administration must now decide which path to pursue—bold transformation or incremental change."
 usa.49.t:0 "Uvalde School Shooting"
 usa.49.d:0 "The tragic shooting at Robb Elementary School in Uvalde, Texas, has devastated communities across the country. The public outcry over gun violence intensifies, placing heavy political pressure on President Biden and the Democratic Party. This heartbreaking event damages the party’s polling and forces urgent calls for action on gun control legislation."
 usa.50.t:0 "Donald Trump Announces 2024 Presidential Run"
 usa.50.d:0 "In a highly anticipated move, former President Donald Trump has officially announced his candidacy for the 2024 presidential election, shaking up the political landscape and energizing both his supporters and opponents."
 usa.51.t:0 "The 2024 Presidential Campaign Begins"
 usa.51.d:0 "As the new year dawns, the eyes of the nation turn once more to politics. With the 2022 midterms behind us, the great contest for the White House now looms on the horizon. Aspirants from across the political spectrum are preparing to stake their claims, ignite their base, and capture the nation’s attention."
 usa.52.t:0 "Biden Announces 2024 Campaign"
 usa.52.d:0 "From the White House, President Joe Biden has officially declared his intention to seek a second term in the 2024 election. Emphasizing stability, democracy, and unity in turbulent times, Biden framed the contest ahead as a 'battle for the soul of America.' \n\nHis announcement sets the stage for an intense primary season and a defining clash with whoever emerges from the opposition."
 usa.53.t:0 "Security Concerns At The Butler Rally"
 usa.53.d:0 "Preparations for the upcoming rally in Butler, Pennsylvania, are well underway. Yet intelligence reports hint at potential threats to the President’s safety. Advisors are divided: some argue that a show of strength with heavy security will reassure the public, while others warn that it could make the event seem more like a siege than a celebration."
 usa.54.t:0 "The President Survives an Assassination Attempt"
 usa.54.d:0 "Chaos erupted at the Butler rally today when an assassin opened fire on the President. Secret Service agents acted immediately, shielding him from the hail of bullets and neutralizing the attacker. Though shaken, the President has survived with only minor injuries. \n\nThe event has shocked the nation, and the image of the President standing firm in the aftermath may either inspire resilience or deepen political divides."
 usa.55.t:0 "Trump Assassinated At Butler Rally"
 usa.55.d:0 "Tragedy has struck the nation. During a campaign rally in Butler, Pennsylvania, an assassin’s bullet found its mark. Despite the best efforts of security and medical staff, former President Donald Trump succumbed to his wounds. His death has sent shockwaves across the United States, igniting both grief and fury among his supporters, while throwing the 2024 election into unprecedented uncertainty.\n\nThe political landscape has been irreversibly changed."
 usa.56.t:0 "Questions About Biden’s Age"
 usa.56.d:0 "As the campaign season intensifies, the President’s age has become an unavoidable subject of discussion. Observers note his slower movements and occasional lapses, fueling doubts about his stamina for another four years in office. Supporters argue his experience and steady hand remain invaluable, while critics insist the nation cannot afford a leader in declining health. \n\nThe issue, once whispered, now dominates headlines and conversations across the country."
 usa.57.t:0 "Biden Drops Out"
 usa.57.d:0 "In a stunning announcement, President Joe Biden has declared that he will not continue his campaign for a second term. Citing personal health and the best interests of the nation, Biden emphasized his achievements in office while urging Americans to support the Democratic Party’s eventual nominee. \n\nThe decision has thrown the race into sudden turmoil, as potential successors scramble to fill the void at the top of the ticket."
 usa.58.t:0 "The Democratic National Convention"
 usa.58.d:0 "The Democratic National Convention serves as the formal gathering where the Democratic Party nominates its candidate for the presidency of the United States. Delegates from across the nation come together to cast their votes, debate the party platform, and rally behind the nominee."
 usa.59.t:0 "The Republican National Convention"
 usa.59.d:0 "The Republican National Convention is the party’s grand gathering to select its nominee for President of the United States. Delegates from every state arrive to cast their votes, debate the party platform, and demonstrate unity heading into the general election. With passions running high and the nation closely watching, the RNC will determine who will carry the Republican banner in 2024."
 usa.60.t:0 "Trump Visits McDonald's During Campaign"
 usa.60.d:0 "Donald Trump decided to stop by a McDonald's during his campaign tour. Supporters cheered while opponents took to social media to comment on the unusual spectacle. The visit has sparked conversations across the nation about his unconventional campaigning style."
 usa.61.t:0 "Kamala Harris Can Go on Joe Rogan"
 usa.61.d:0 "Vice President Kamala Harris has the opportunity to appear on Joe Rogan’s podcast. The decision could sway public opinion and create waves across the political landscape"
 usa.62.t:0 "The Presidential Debate"
 usa.62.d:0 "As the nation watches, the presidential contenders take to the stage to present their vision for the country’s future. The debate promises heated exchanges, carefully crafted talking points, and the potential to sway undecided voters in this crucial stage of the campaign."
 usa.63.t:0 "Hurricane Milton Strikes the Coast"
 usa.63.d:0 "A powerful hurricane named Milton has made landfall along the southern coast, bringing with it devastating winds, torrential rain, and widespread flooding. Emergency services are stretched thin as entire communities are left without power and thousands are displaced."
 usa.64.t:0 "Hurricane Helene Devastates the Southeast"
 usa.64.d:0 "Hurricane Helene has torn through the southeastern United States, leaving a trail of destruction in its wake. Entire towns have been flooded, infrastructure crippled, and thousands forced to flee their homes.\""
 usa.65.t:0 "Hurricane Lee Makes Landfall"
 usa.65.d:0 "Hurricane Lee, one of the most powerful storms of the 2023 Atlantic season, has made landfall along the northeastern coastline. Torrential rain and fierce winds have battered the region, knocking out power, flooding towns, and disrupting vital infrastructure. As rescue efforts begin, questions arise about the nation’s preparedness for increasingly frequent extreme weather events."
 usa.66.t:0 "Hurricane Ian Devastates Florida"
 usa.66.d:0 "Hurricane Ian has slammed into Florida’s Gulf Coast as a Category 4 storm, bringing catastrophic winds and storm surges. Entire neighborhoods have been submerged, and millions are without power. The scale of destruction is immense, and emergency services struggle to reach the hardest-hit areas. The nation watches in shock as recovery efforts begin in what could become one of the costliest natural disasters in U.S. history."
 usa.70.t:0 "Democrat a Running Mate ?"
 usa.70.d:0 "Attention has turned to the vice-presidential nomination. Some within the Democratic party favoring Tim Walz, seeing the Minnesota governor as a pragmatic choice who can appeal to Midwestern voters. Others are rallying behind Bernie Sanders, whose popularity among progressives could energize the party's left wing. The decision may shape the campaign's direction in the months ahead."
 usa_news.1.t:0 "Biden's Debate Performance Raises Concerns"
 usa_news.1.d:0 "President Joe Biden's debate performance has triggered concern among Democrats after a series of halting answers and visible struggles during key exchanges. Political allies and commentators described the appearance as damaging, with renewed questions emerging over his ability to sustain a demanding re-election campaign."
 usa_news.2.t:0 "Donald Trump Wins the 2024 Election"
 usa_news.2.d:0 "Donald Trump has won the 2024 presidential election, completing a remarkable return to the White House. Supporters celebrated the result as a rejection of the political establishment, while protests were reported in several cities. Attention now turns to how a second Trump administration will reshape domestic and foreign policy."
 usa_news.3.t:0 "Kamala Harris Wins the 2024 Election"
 usa_news.3.d:0 "Kamala Harris has won the 2024 presidential election, becoming the first woman to hold the office. Supporters gathered across the country to celebrate what many described as a historic milestone, while opponents questioned the result and organised demonstrations. Harris now faces the challenge of governing a politically divided nation."
 usa_news.4.t:0 "Joe Biden Re-Elected in the 2024 Election"
 usa_news.4.d:0 "Joe Biden has secured a second term after a closely fought election campaign dominated by debates over the economy, immigration and the future of American democracy. The result produced celebrations among supporters and anger among opponents, underscoring the deep political divisions that continue to shape the country."
 usa_news.5.t:0 "Trump Sworn In as 47th President"
 usa_news.5.d:0 "Donald Trump has been sworn in as the 47th President of the United States. In his inaugural address, he promised sweeping reforms to immigration, trade and federal institutions, presenting his return to office as the beginning of a new political era. Allies welcomed the agenda, while critics warned of further polarization."
 usa_news.6.t:0 "Kamala Harris Takes Office"
 usa_news.6.d:0 "Kamala Harris has been inaugurated as the 47th President of the United States. Speaking before a national and international audience, she called for unity, democratic resilience and renewed trust in public institutions. The ceremony marked a historic moment, though political tensions remain high across the country."
 usa_news.7.t:0 "Biden Begins Second Term"
 usa_news.7.d:0 " Joe Biden has been sworn in for a second term as President of the United States. His inaugural address focused on national unity, democratic stability and cooperation with international allies. The ceremony took place amid heightened security as the administration prepares to confront ongoing political and economic challenges."
 usa_news.8.t:0 "Elon Musk Assumes Power"
 usa_news.8.d:0 "Elon Musk has assumed control of the United States following a dramatic restructuring of the country's political system. Presenting the changes as a move toward efficiency and technological governance, Musk has overseen the rapid reorganisation of state institutions. Critics warn that the transformation raises profound questions about democracy and constitutional rule."
 usa_news.9.t:0 "Panama Rejects American Demands"
 usa_news.9.d:0 " Panama has rejected American demands regarding the future of the Panama Canal, insisting that control of the waterway remains a matter of national sovereignty. The breakdown of negotiations has increased tensions between the two countries and raised concerns about the future of regional relations."
 usa_news.10.t:0 "Trump Strengthens Ties with Business Leaders"
 usa_news.10.d:0 "President Donald Trump has strengthened ties with some of America's most influential business leaders through a series of high-profile meetings. Supporters argue the outreach will boost investment and innovation, while critics contend it reflects the growing influence of wealthy elites over government policy."
 usa_news.12.t:0 "Trump Survives Assassination Attempt"
 usa_news.12.d:0 " Donald Trump survived an assassination attempt during a campaign rally in Butler, Pennsylvania, after gunfire erupted near the stage. Secret Service agents rushed him from the scene and authorities later confirmed he had suffered only minor injuries. The incident has intensified security concerns ahead of the election."
 usa_news.13.t:0 "Trump Assassinated at Rally"
 usa_news.13.d:0 "Donald Trump has been killed after an armed attacker opened fire during a campaign rally in Butler, Pennsylvania. The assassination has sent shockwaves through American politics, prompting calls for calm from leaders across the political spectrum. Questions now surround the future of the presidential race and the broader political landscape."
 usa_news.14.t:0 "Neil deGrasse Tyson Wins the 2024 Election"
 usa_news.14.d:0 "Neil deGrasse Tyson has won the 2024 presidential election in one of the most unexpected results in modern American history. Campaigning on science, innovation and long-term planning, the astrophysicist attracted support far beyond traditional political lines. Observers are now watching closely to see how he approaches governing."
 usa_news.15.t:0 "Elizabeth Warren Wins the 2024 Election"
 usa_news.15.d:0 "Elizabeth Warren has been elected President of the United States after campaigning on economic reform and stronger regulation of major corporations. Supporters hailed the result as a mandate for structural change, while financial markets and business leaders reacted cautiously to the prospect of significant policy shifts."
 usa_news.16.t:0 "JD Vance Wins the 2024 Election"
 usa_news.16.d:0 " JD Vance has won the 2024 presidential election, becoming the new face of Republican leadership. His campaign focused on economic nationalism and industrial renewal, themes that resonated with voters across key battleground states. Analysts expect significant changes in both domestic and foreign policy."
 usa_news.17.t:0 "RFK Jr. Wins the 2024 Election"
 usa_news.17.d:0 " Robert F. Kennedy Jr. has secured victory in the 2024 presidential election after running a highly unconventional campaign. Drawing support from voters frustrated with both major parties, Kennedy's success has upended traditional political assumptions and introduced a new era of uncertainty in Washington."
 usa_news.18.t:0 "Biden Condemns Alleged Gaza War Crimes"
 usa_news.18.d:0 " President Joe Biden has publicly condemned alleged war crimes committed during the conflict in Gaza, calling for accountability and greater protection of civilians. The remarks come amid growing international pressure on Washington to take a clearer position on the war and its humanitarian consequences."
 election_USA.1.t:0 "Midterm Elections"
 election_USA.1.d1:0 "Against the odds, Democrats delivered a hard-fought victory in the midterms. Energized by backlash to the Supreme Court’s abortion ruling and fears over threats to democracy, voters turned out in force to reject extremism. Biden’s leadership gained renewed credibility, and progressive voices inside Congress gained momentum — but the battle for the nation's future is far from over."
 election_USA.1.d2:0 "The Republicans have seized control in the midterms, dealing a serious blow to President Biden’s agenda and political standing. Fueled by voter anger over economic struggles and cultural divisions, the GOP’s gains threaten to stall key Democratic priorities. Biden now faces an uphill battle to maintain influence as partisan tensions deepen across the nation."
 election_USA.1.o1:0 "§3Democrat Victory§!"
 election_USA.1.o2:0 "§RRepublican Victory§!"
 election_USA.2.t:0 "The 2024 Presidential Election"
 election_USA.2.d:0 "After a long and turbulent campaign season, Americans now head to the polls to cast their votes in the 2024 presidential election. The contest has been one of the most heated and historic in living memory, marked by fierce debates, unexpected turns, and profound questions about the nation’s future. The eyes of the world are fixed on the United States as it decides its course for the years ahead."
 election_USA.2.o1:0 "§RTrump Wins The 2024 Election§!"
 election_USA.2.o2:0 "§RJD Vance Wins The 2024 Election§!"
 election_USA.2.o3:0 "§RRFK JR Wins The 2024 Election§!"
 election_USA.2.o4:0 "§3Joe Biden Wins The 2024 Election§!"
 election_USA.2.o5:0 "§3Kamala Harris Wins The 2024 Election§!"
 election_USA.2.o6:0 "§3Elisabeth Warren Wins The 2024 Election§!"
 election_USA.2.o7:0 "§3Neil deGrasse Tyson Wins The 2024 Election!"
 usa_news.11.t:0 "Trump Dismantels NATO"
 usa_news.11.d:0 "In a stunning announcement delivered from the White House Rose Garden, President Donald Trump has declared that the United States will formally withdraw from the North Atlantic Treaty Organization. Calling the alliance 'obsolete' and a 'one-sided burden on the American taxpayer,' Trump stated that the U.S. will no longer serve as the world's policeman.\n\nReaction has been swift. European leaders have expressed shock and concern, with some vowing to accelerate joint defense initiatives. Meanwhile, Moscow and Beijing have welcomed the move. As American forces begin drawing down from NATO command structures, the future of transatlantic security hangs in the balance."
 Yemen_news.1.t:0 "End Of The Yemeni Civil War"
 Yemen_news.1.d:0 "After years of bitter conflict, the Yemeni Civil War has finally come to an end. The fighting, which devastated cities, fractured communities, and caused immense human suffering, has ceased—marking the beginning of a new chapter for the war-torn nation.\n\nThe international community has welcomed the news with cautious optimism, with calls for reconciliation, reconstruction, and long-term stability. Though peace has returned, Yemen faces a long and difficult road to recovery. For many Yemenis, the end of the war brings not celebration, but a moment to grieve and begin rebuilding what was lost."
 south_africa.1.t:0 "Corruption Within the ANC Exposed!"
 south_africa.1.d:0 "Recent investigations and leaked documents have unveiled a web of corruption within the African National Congress. Reports point to embezzled state funds, fraudulent contracts, and favoritism in public appointments. The scandal has shaken public confidence, fueling anger on the streets and calls for accountability. While some demand sweeping reforms, others see this as proof that the ruling party has lost its moral authority to lead."
 south_africa.2.t:0 "Mass Demonstrations Against the ANC"
 south_africa.2.d:0 "The streets of Johannesburg, Cape Town, and Durban fill with thousands of frustrated citizens. Waving placards and chanting slogans, they denounce the ANC’s corruption, mismanagement, and inability to deliver basic services. What began as scattered protests has now swelled into a nationwide wave of anger. If this unrest continues unchecked, the stability of the government itself could be in jeopardy."
 south_africa.3.t:0 "Formation of Paramilitaries"
 south_africa.3.d:0 "As unrest spreads and political tensions rise, Afrikaner communities begin organizing militias and paramilitary units. These groups train independently, preparing to defend their neighborhoods and assert their influence in the nation. Their presence signals that South Africa may be on the brink of open conflict."
 south_africa.4.t:0 "Civil War Erupts in South Africa"
 south_africa.4.d:0 "Tensions between the government and radical factions have boiled over into open conflict. Paramilitary forces, militias, and rebel groups clash with security forces across the country. Cities burn, and the nation is thrown into chaos"
 south_africa.5.t:0 "Zulu Coronation"
 south_africa.5.d:0 "After preparation and the endorsement of the Elder Council, the Zulu King is formally crowned as the monarch of South Africa. The ceremony unites traditional leaders, citizens, and loyalists under the royal standard, marking the restoration of the Zulu monarchy and a new era for the nation."
 south_africa.6.t:0 "EFF Party Congress"
 south_africa.6.d:0 "The Economic Freedom Fighters convene their national congress, bringing together delegates from across South Africa. This gathering will define the party’s direction and leadership persona for years to come"
 south_africa.7.t:0 "The Capital Question?"
 south_africa.7.d:0 "With the winds of change sweeping across the nation, debate has arisen over the location of our capital. Some argue that Pretoria, the seat of government since the Union of South Africa, should remain the center of our state. Others push for a move to Cape Town, the historic port city at the Cape of Good Hope, claiming it better represents our future and international standing."
 south_africa.8.t:0 "The Question of Apartheid Sanctions"
 south_africa.8.d:0 "The institution of Apartheid in South Africa has shocked and angered much of the international community. Calls for sanctions and embargoes have spread quickly, with activists demanding that trade and diplomatic relations with the South African government be cut off until the system of racial segregation is abolished."
 south_africa.9.t:0 "South African Pressure"
 south_africa.9.d:0 "Our kingdom faces mounting pressure from our powerful neighbor, South Africa. Do we yield to their demands to maintain peace, or resist and defend our sovereignty, even at great risk?"
 south_africa.10.t:0 "Afrikaner Refugees Arrive"
 south_africa.10.d:0 "Following the rise of Black Nationalist in South Africa many afrikaaners have been stripped of their rights and expelled from their homes. Waves of refugees have now arrived on our shores, seeking safety and a new beginning."
 south_africa.11.t:0 "Join The Union of African Communists?"
 south_africa.11.d:0 "South Africa has invited us into a unified bloc of communist nations on the African continent: the Union of African Communists. By joining, we would bind our future to theirs, sharing in their struggle against imperialism and capitalist exploitation. Do we accept their offer of unity, or do we chart our own course?"
 south_africa.12.t:0 "Federalization ?"
 south_africa.12.d:0 "After years of cooperation within the Union of African Communists, our nations have grown inseparable. South Africa now proposes a full integration of our state into their union, transforming us from allies into one people under a single banner. This would mean the end of our independence, but also the realization of a united African struggle."
 south_africa_news.1.t:0 "Zulu King Crowned"
 south_africa_news.1.d:0 "The Zulu King has been officially crowned following preparations and the support of tribal elders. The ceremony marks the restoration of the Zulu monarchy and the beginning of a new political era in South Africa, with traditional authority taking on a renewed national role."
 south_africa_news.2.t:0 "Communist Takeover in South Africa"
 south_africa_news.2.d:0 "Communist forces have seized control in South Africa after consolidating fragmented left-wing groups under a single banner. The new leadership has announced sweeping land reforms, nationalisation of industry and the dismantling of existing power structures. Supporters describe it as the birth of a new people's republic, while critics warn of instability and growing international isolation."
 south_africa_news.3.t:0 "Afrikaner Uprising in South Africa!"
 south_africa_news.3.d:0 "Afrikaner nationalist groups have launched an armed uprising against the government, seizing control of several towns and declaring a march on Pretoria. They accuse the post-apartheid state of betrayal and demand a return to Afrikaans political dominance. Government forces have vowed to defend the capital as fears grow of a renewed civil conflict."
 south_africa_news.4.t:0 "[ROOT.GetName] Joins the Union of African Communists"
 south_africa_news.4.d:0 "[ROOT.GetNameDef] has joined the Union of African Communists, a bloc led by South Africa. The decision is being presented as a step toward continental ideological unity and cooperation. Supporters frame it as resistance to foreign influence, while critics warn it deepens political divisions across Africa."
 vatican_news.1.t:0 "The Death of Pope Francis"
 vatican_news.1.d:0 "Today, Pope Francis, the 266th Bishop of Rome and leader of the Catholic Church, has passed away. A humble figure known for his compassion and calls for reform, his death has sent ripples of grief across the world. In Vatican City, the bells of St. Peter's Basilica ring out mournfully as the faithful gather in prayer. A Papal Conclave will soon be convened to elect his successor, marking the end of an era and the beginning of a new chapter for the Church."
 vatican.1.t:0 "The Conclave Begins"
 vatican.1.d:0 "Following the death of Pope Francis, the College of Cardinals has gathered in the Vatican to begin the sacred conclave. Sealed within the Sistine Chapel, the cardinals must now decide the future of the Catholic Church. Between reform, tradition, and political influence, the world watches as white smoke rises for what direction the Church will take in a time of global uncertainty."
 palestine_news.1.t:0 "October 7th Terrorist Attacks"
 palestine_news.1.d:0 "Hamas forces have launched a coordinated surprise attack on Israel, with thousands of rockets striking southern cities and armed militants crossing the border. Heavy fighting has been reported as Israeli forces respond across multiple fronts. Civilian casualties are emerging on both sides as the situation develops.\nThe international community has reacted with alarm, warning of a rapidly escalating conflict."
 palestine.1.t:0 "October 7th"
 palestine.1.d:0 "Tensions in Gaza have reached a boiling point. Years of blockade, conflict, and political isolation have radicalized parts of the resistance. A proposed large-scale assault on Israel—dubbed 'Operation Al-Aqsa Flood'—has been laid on the table by militant leadership. The plan would be a surprise offensive aimed at breaching the border, capturing territory, and shaking regional dynamics.\n\nBut the consequences of such a move could be catastrophic. Israel’s response would be overwhelming, international condemnation likely, and civilian casualties unavoidable.\n\nThe question stands before the leadership, Do we launch the attack, or do we hold back for now?"
 palestine.2.t:0 "Trial of the Israeli Warcriminals"
 palestine_news.2.t:0 "Hamas Executes Members of the Israeli Government After a 4 Day Trial!"
 palestine_news.2.d:0 "After a 4 day trial held in Jerusalem, prosecuters found the former Israeli government guilty of warcrimes and sentenced many members to death, including former Prime Minister Benjamin Netanyahu. Netanyahu was executed this morning, publically being beheaded by a sword. A crowd of Palestinian onlookers cheered as the head was held up for the crowd to see."
 palestine_news.3.t:0 "Hamas Sentences Members of the Israeli Government to Life in Prison After a 4 Day Trial!"
 palestine_news.3.d:0 "\n\ After a 4 day trial held in Jerusalem, prosecuters found the former Israeli government guilty of warcrimes and sentenced its members to life in prison, including former Prime Minister Benjamin Netanyahu. Netanyahu was transfered to prison this morning, being publically ridiculed and yelled at as he was escorted out of the courtroom by armed guards."
 palestine.3.t:0 "Deportations"
 palestine.3.d:0 "With our victory over the occupiers, we have two things we can do with their people. We can deport all the Jews, this is problamatic for numerous reasons, risking a global response and stability. Or we could deport only the extremists, the Zionists, this would allign with our policies while staying on the less extreme side."
 palestine.4.t:0 "The Decision"
 palestine.4.d:0 "Early in the morning, admist Palestines deportation of the Jewish people, numerous boats filled with refugees and deportees have arrived on our shores. What do we do?"
 palestine_news.4.t:0 "Hamas Enacts the Deportations of Zionists"
 palestine_news.4.d:0 "With their victory over the State of Israel, Hamas has enacted their policies, one of those being the deportation of Jews from Palestine. Hamas has come out and said that they are only deporting extremists/zionists and not every Jew. Still, this is millions of people being round up and shipped off."
 palestine_news.5.t:0 "Hamas Enacts the Deportations of all Jews"
 palestine_news.5.d:0 "With their victory over the State of Israel, Hamas has enacted their brutal policies, one of those being the complete deportation of Jews from Palestine. Hamas has come out and said that the Jews are an occupier who have no place in the new Palestine. Millions of people are being round up and shipped off."
 palestine.5.t:0 "The Quiet Before the Storm..."
 palestine.5.d:0 "Our new years resolution is much different from any typical one. This year, we will plan an attack on Israel unlike any other. We plan to take plenty of hostages, and wage a Jihad against the occupiers in hopes for a free Palestine. From the river to the sea, Palestine will be free."
 Hong_Kong.1.t:0 "A New Chief Executive... Chosen"
 Hong_Kong.1.d:0 "The 2022 Chief Executive 'election' in Hong Kong has concluded with little surprise. John Lee, a staunch pro-Beijing figure and former security chief, was selected by a hand-picked Election Committee composed almost entirely of loyalists. With no real opposition and over 99% of the vote, the process has been widely condemned as a sham. While Beijing hails it as a step toward 'good governance,' critics around the world view it as the final nail in the coffin for Hong Kong's democratic aspirations."
 iran.1.t:0 "Hardliners Strike Back"
 iran.1.d:0 "The reformists’ bold moves have pushed the nation to the brink. Hardliners, unwilling to relinquish power, launch a decisive counterattack. Across Tehran and the surrounding provinces, clashes erupt as the streets descend into civil war. The fate of the Republic hangs in the balance, and the outcome will shape Iran’s future for years to come."
 iran.2.t:0 "The Iranian Presidential Election"
 iran.2.d:0 "The nation once again turns its eyes toward the ballot box. With the legitimacy of the Islamic Republic questioned from within and without, the upcoming contest has become more than just a transfer of power—it is a test of survival for the system itself. Reformists and hardliners alike see this as their chance to define Iran’s future, and the stakes have never been higher."
 iran.3.t:0 "Raisi’s Helicopter Crash"
 iran.3.d:0 "Tragedy has struck Iran as President Ebrahim Raisi’s helicopter has gone down in a fatal crash. The sudden loss of the hardline leader has shaken the political establishment, throwing the Islamic Republic into turmoil. With succession uncertain and rival factions sensing opportunity, the crash threatens to unleash a fierce struggle over the nation’s direction."
 iran.4.t:0 "The Death of Mahsa Amini Sparks Nationwide Protests"
 iran.4.d:0 "In September 2022, a young Kurdish woman named Mahsa Amini was arrested by Iran’s 'morality police' for allegedly violating the country’s strict hijab laws. Only days later, she was pronounced dead while in custody. Her death has ignited a wave of outrage and grief across the nation.\n\nWhat began as small vigils in Amini’s hometown has grown into a movement spreading through cities and universities across Iran. Women have taken to the streets removing their headscarves in protest, while men have joined them in solidarity. The slogan 'Woman, Life, Freedom' echoes in every corner of the country.\n\nThese protests go far beyond the question of dress codes—they reflect years of frustration with corruption, repression, and a struggling economy. For many Iranians, Mahsa Amini has become a symbol of a generation demanding dignity and change.\n\nThe nation stands at a crossroads. The anger is palpable, the tension is rising, and the eyes of the world are watching to see how Iran will respond to the growing unrest."
 iran.5.t:0 "Government Popularity Plummets"
 iran.5.d:0 "Support for the Islamic Republic has fallen to news low levels. Once able to rely on broad control, the authorities now face a population increasingly disillusioned with their rule. The weakening popularity threatens to destabilize the nation and embolden those calling for reform or even outright change."
 iran.6.t:0 "Government Regains Popular Support"
 iran.6.d:0 "The Islamic Republic has managed to restore its standing among the people. The tide of discontent has subsidedfor now and the regime’s grip on power appears secure once again."
 iran.7.t:0 "Hardliners Push Back Against Hijab Reforms"
 iran.7.d:0 "Following the recent relaxation of hijab restrictions, conservative clerics and hardline factions within the government have erupted in outrage. They accuse reformists of betraying the values of the Islamic Revolution and undermining the nation’s moral foundations. The backlash is fierce and coordinated, with calls to reverse the decision and punish those responsible. Tensions between the reformists and the hardliners are escalating, threatening to plunge Iran deeper into political turmoil."
 iran.8.t:0 "Assassination of Ali Khamenei"
 iran.8.d:0 "Caction within the Iranian military has carried out a coordinated assassination against Supreme Leader Ali Khamenei. The operation, carried out with precision and secrecy, has plunged the nation into chaos. Rumors swirl that high-ranking generals, long disillusioned by Khamenei’s rule, orchestrated the strike in hopes of reshaping the Islamic Republic’s future.\""
 iran.9.t:0 "Masoud Pezeshkian Seizes Power"
 iran.9.d:0 "In the aftermath of Supreme Leader Ali Khamenei’s assassination, chaos erupted across Tehran. Amid the confusion, President Masoud Pezeshkian acted swiftly — rallying reformist loyalists, securing key ministries, and asserting control over the armed forces. Declaring the need for stability and unity, Pezeshkian has positioned himself as the new leader of Iran. Whether his rule ushers in true reform or merely a new form of authority remains to be seen."
 iran.10.t:0 "Balochistan Declares Independence"
 iran.10.d:0 "Tensions between Tehran and the Baloch minority have reached a breaking point. Outraged by the reformist government’s refusal to grant local autonomy and its pursuit of a highly centralized Iran, Baloch leaders have proclaimed the independence of Balochistan. Armed groups have seized control of several towns, and the region now stands on the brink of open rebellion."
 iran.11.t:0 "Kurdistan Declares Independence"
 iran.11.d:0 "Inspired by growing unrest and angered by the government’s centralization policies, Kurdish leaders have declared the formation of an independent Kurdistan. In the western provinces, Kurdish forces have taken up arms and seized key territories. The call for self-determination echoes through the mountains"
 iran.12.t:0 "Azerbaijan Marches into Iranian Azerbaijan"
 iran.12.d:0 "Amid the chaos in Iran, Azerbaijani forces have crossed the border into Iranian Azerbaijan. Claiming to protect their ethnic kin, Baku’s move has been condemned internationally as a blatant act of aggression. The situation threatens to escalate into a broader regional conflict, as the Iranian state struggles to maintain control over its disintegrating territory."
 iran.13.t:0 "The Reformists Hold a Speech"
 iran.13.d:0 "President of the Republic, Masoud Pezeshkian, has addressed the nation. His speech, filled with calls for reform and progress, is seen by many as a thinly veiled attempt to advocate for democratization under the guise of loyalty to the Supreme Leader."
 iran.14.t:0 "Generals Bribed"
 iran.14.d:0 "Reports have surfaced that several highranking generals have received generous payments from the government. While officials claim these were legitimate compensations, many see them as thinly veiled bribes meant to secure loyalty amid political uncertainty."
 iran.15.t:0 "Iran Asks for Sanctions Relief"
 iran.15.d:0 "Iran has approached us with a formal request to ease the economic sanctions currently imposed on their country. They argue that the sanctions are crippling their economy and hindering their ability to maintain stability. Granting relief could improve diplomatic relations."
 iran.16.t:0 "AI EVENT"
 iran.16.d:0 ""
 iran.17.t:0 "Rezah Pahlavi Returns From Exile"
 iran.17.d:0 "With the announcement of a transitional government, the exiled Shah has decided to return to his homeland. His arrival has sparked both celebration and controversy across the nation."
 iran.18.t:0 "Trade Unions Form"
 iran.18.d:0 "In the wake of the transitional government, workers across Iran organize themselves into trade unions, seeking to protect labor rights and influence the direction of the nation’s reconstruction."
 iran.19.t:0 "The Provisional Government Convenes"
 iran.19.d:0 "The provisional government holds its first official meeting. Competing factions are vying to influence Iran’s future."
 iran.20.t:0 "Provisional Government Debates Israel"
 iran.20.d:0 "The provisinal government is has convened to discuss the nation’s stance towards Israel."
 iran.21.t:0 "Pahlavi Plans a Speech"
 iran.21.d:0 "Former monarch Mohammad Reza Pahlavi has announced his intention to address the nation. Royalist supporters hope his words will inspire unity and a return to traditional values, while opponents remain wary of his influence."
 iran.22.t:0 "Iranian Demands for Territorial Return"
 iran.22.d:0 "The government in Tehran has issued a formal demand calling for the return of territories it considers rightfully Iranian. Officials claim these lands were lost during a period of internal turmoil and insist that Iran’s recent reforms mark the end of compromise on national unity. While the message stops short of an explicit threat, its tone makes clear that refusal may carry serious consequences."
 iran.25.t:0 "A Speech for the Nation"
 iran.25.d:0 "Reza Shah addresses the nation in a stirring speech, rallying the Iranian people behind his vision for a stronger and more unified Iran. Public support for his government rises significantly."
 iran.26.t:0 "Iran Demands We Submit"
 iran.26.d:0 ""
 iran.27.t:0 "Iran Invites Us To METO"
 iran.27.d:0 "Should We Join ?"
 iran.28.t:0 "Iran Influences Our Politics!"
 iran.28.d:0 ""
 iran.29.t:0 "Civil War at Hand"
 iran.29.d:0 "The Iranian regime has instigated internal unrest to consolidate power, but the situation has spiraled out of control. Rival factions have risen against the government, and demonstrations have turned into widespread clashes. What began as a controlled maneuver by Tehran has erupted into a full-scale civil war, threatening to engulf the nation and draw in external powers."
 iran.30.t:0 "Iran Invites Us To Join The Resistance"
 iran.30.d:0 "Tehran has extended an official invitation for cooperation, appealing for support against its enemies and urging us to stand alongside its embattled regime. The Iranian leadership portrays this as a call for solidarity in the face of Western and Israeli pressure, framing it as an opportunity to strengthen regional ties and counter common threats."
 iran.31.t:0 "Iran Takes Control Of Our Foreign Policy"
 iran.31.d:0 "In a decisive shift, Iran’s leadership has seized direct control of the nation’s foreign policy apparatus, sidelining traditional diplomatic channels. The Supreme Leader and military‑aligned councils now dictate international strategy, emphasizing resistance against Western influence and closer ties with sympathetic states. This consolidation marks a pronounced turn toward a more centralized, assertive posture on the global stage."
 iran.32.t:0 "Iran Increase Trade With Us"
 iran.32.d:0 ""
 iran.33.t:0 "Iran Sends Wepons"
 iran.33.d:0 ""
 iran.34.t:0 "The End of Zionism"
 iran.34.d:0 "After a prolonged war, Israeli resistance has collapsed and Iranian forces have secured victory. The government in Tehran declares the outcome a strategic success and the end of the Israeli state as a political entity in the region."
 iran.35.t:0 "Khamenei Has Been Assassinated"
 iran.35.d:0 "Ali Khamenei, the Supreme Leader of the Islamic Republic, has been assassinated. Our highest authority is gone, and the government has been thrown into turmoil. The security forces have been placed on high alert as senior officials rush to secure Tehran, contain the unrest, and determine who will lead the Islamic Republic."
 iran_news.1.t:0 "Civil War Erupts in Iran"
 iran_news.1.d:0 "Clashes between hardliners and reformists have escalated into full-scale civil war across Iran. Fighting has broken out in major cities, with both sides mobilising armed supporters and taking control of key areas. Tehran and other urban centres have become active battle zones as state authority begins to fracture.\n\nInternational observers warn the conflict could destabilise the wider region, while neighbouring states monitor the situation closely as the violence spreads."
 iran_news.2.t:0 "Iranian President Killed In Helicopter Crash"
 iran_news.2.d:0 "President Ebrahim Raisi has been killed in a helicopter crash, according to Iranian state media. The crash occurred earlier today under unclear circumstances, leaving senior officials to rapidly respond to the sudden leadership vacuum. Government institutions have moved to contain uncertainty as succession procedures begin."
 iran_news.3.t:0 "Khamenei Assassinated"
 iran_news.3.d:0 "Supreme Leader Ali Khamenei has been assassinated, sending shockwaves throughout Iran. His death leaves the Islamic Republic facing a profound political crisis as the regime moves to determine who will succeed him and guide the country through the uncertain days ahead."
 usa.71.t:0 "The Iraq Resolution"
 usa.71.d:0 "Both the White House and the Senate have now voted to authorize military action against Iraq. The joint resolution was approved by the House last evening and the Senate followed suit early this morning. The congressional vote endorsing the resolution on Iraq is seen as a solid endorsement that the President will work with the United Nations if possible, or alone, if nessecary, to dissarm Saddam Hussein of his weapons of mass destruction."
 usa.71.o1:0 "Excellent."
 usa.72.t:0 "The Invasion of Iraq"
 usa.72.d:0 "The United States offered intelligence to the Security Council suggesting that Iraq possessed weapons of mass destruction. While no evidence has been found yet, there is still suspicion of the Saddam possessing them. It's been well documented that Hussein used chemical weapons in the past, including attacks against civilians. Given Hussein's reputation of supporting terrorists as well as possibile links to Al-Qaeda, plans have been drawn up for an invasion of Iraq. The plan is to first end the regime of Saddam Hussein. Second, to identify, isolate, and eliminate Iraq's weapons of mass destruction. Third, to capture and drive terrorists out of the country as well as secure the Iraqi oilfields. Fourth, to collect as much intelligence as we can to relate to terrorist networks and the global network of illicit WMDs. And last, to help the Iraqi people to create conditions for a transition to a representative self-government while providing humanitarian support to the displaced and many needy Iraqi citizens."
 usa.72.o1:0 "We will free the Iraqi citizens from Saddam's reign of terror!"
 usa_news.19.t:0 "Operation Iraqi \"Freedom\" Begins!"
 usa_news.19.d:0 "President [USA.GetLeader] delivered a live address shortly after explosions rocked the Iraqi capital of Baghdad, signalling the launch of Operation Iraqi Freedom. The U.S.-led campaign aims at ridding Iraq of its dictator, Saddam Hussein, and eliminating its ability to store, develop, and deploy its stockpile of weapons of mass destruction. The strike comes just days after Iraqi President, Saddam Hussein defied a 48-hour deadline to leave the country. In response to the millitary invasion, the Republic of Iraq Radio in Baghdad said that \"The evil ones, the enemies of God, the homeland and humanity, have committed the stupid aggression against our homeland and people.\". Meanwhile, US military sources have said that five key members of the Iraqi regime, including Saddam Hussein, were targeted in the first attacks."
 usa_news.19.o1:0 "The war on terrorism continues."
 usa_news.19.o2:0 "God is on our side. We will beat the invader."
 usa_news.19.o3:0 "Terrorism must be eradicated!"
 usa_news.20.t:0 "The Fall of Baghdad"
 usa_news.20.d:0 "U.S. tanks drove unhindered into public squares as downtown Baghdad slipped from the grip of the Ba'ath regime. The scene in central Baghdad, where Iraqi citizens and American marines collaberated in toppling a huge statue of Saddam Hussein, signaled that a complete American military victory in Iraq may be achieved within a matter of days, not months, although there may still be some difficult combat ahead in outlying Baghdad neighborhoods and areas north of the capital, including Hussein's hometown of Tikrit. No one knows whether Hussein and his two sons are alive or dead, but the fall of Baghdad suggests that organized resistance to the invading forces could subside now that the centralized institutions of power in Iraq have been shattered."
 usa_news.20.o1:0 "Another victory for freedom."
 usa_news.20.o2:0 "Uncertain times."
 usa_news.20.o3:0 "Iraq didn't stand a chance."
 usa_news.21.t:0 "Saddam Hussein Captured"
 usa_news.21.d:0 "U.S. forces today captured a bearded and haggard-looking Saddam Hussein in an underground hideout on a farm near his hometown, Tikrit. The arrest comes within months after U.S. troops swept into the Iraqi capital, and brings an end to one of the most intensive manhunts in history. In a televised address this afternoon, the U.S. President, [USA.GetLeader] said that Saddam will face \"the justice he denied to millions\". He said that the former Iraqi leader's arrest \"marks the end of the road for him and all who bullied and killed in his name\". However, the President also cautioned that it does not mean the end of violence in Iraq."
 usa_news.21.o1:0 "Ladies and gentlemen, we got him!"
 usa_news.21.o2:0 "Alright."
 usa_news.22.t:0 "Saddam Hussein Sentenced To Death"
 usa_news.22.d:0 "Saddam Hussein was executed at dawn today following his conviction by an Iraqi court for crimes against humanity. The sentence was carried out at a former millitary intelligence headquarters in a Shia district of Baghdad at 6:00am local time (3:00am GMT). In a prepared statement, [USA.GetLeader] cautioned that Saddam's execution would not stop the violence in Iraq, but said it was \"an important milestone on Iraq's course to becoming a democracy that can govern, sustain, and defend itself, and be an ally in the war on terror\". The office of the Iraqi Prime Minister, released a statement that said Saddam's execution was a \"strong lesson\" to ruthless leaders who commit crimes against their own people."
 usa_news.22.o1:0 "Alright."
 usa_news.23.t:0 "US Withdraws Troops From Iraq"
 usa_news.23.d:0 "The last convoy of U.S. soldiers pulled out of Iraq, ending nearly nine years of war that inflicted many casualties on both sides, and left a country grappling with political uncertainty. The final column of around 100 mostly U.S. military MRAP armoured vehicles carrying 500 U.S. troops trundled across the southern Iraq desert from their last base through the night and daybreak along an empty highway to the Kuwaiti border. For the United States, the military pullout is the fulfilment of a promise to bring troops home from a conflict, widely considered the most unpopular war since Vietnam and one that tainted America’s standing worldwide. For Iraqis, though, the departure brings a sense of sovereignty tempered by nagging fears their country may slide once again into the kind of sectarian violence that killed many thousands of people at its peak in 2006-2007."
 usa_news.23.o1:0 "We've done our job. It is time to give the Iraqis their country back."
 usa_news.23.o2:0 "Will Iraq finally find peace?"
 zimbabwe.1.t:0 "Rhodesia Welcomes back Peter Walls!"
 zimbabwe.1.d:0 "Today, Rhodesian Prime Minister Ian Smith of the recently restored Rhodesia welcomed back former Lieutenant General of the Rhodesian Army, George Peter Walls from his exile in South Africa. He will begin leading the army immediately."
 zimbabwe.1.o1:0 "Welcome back, General!"
 south_korea.1.t:0 "North Korea Proposes Unification"
 south_korea.1.d:0 "With the communist seazing power in our country we now have to make the decision to join our comrades in the north"
 Formable.1.t:0 "Greater Greece Proclaimed"
 Formable.1.d:0 "The Greek government has formally proclaimed the creation of Greater Greece, citing the legacy of ancient Hellenic civilization and the Megali Idea. Newly integrated territories have seen the raising of Greek flags and public celebrations, while officials in Athens describe the move as the restoration of national destiny. Neighboring states have expressed concern as the regional balance shifts."
 Formable.2.t:0 "Indochina Unified"
 Formable.2.d:0 "The Indochinese Union has been officially proclaimed, uniting Vietnam, Cambodia and Laos under a single state. Leaders describe the move as the end of fragmentation and the beginning of a stronger regional power in Southeast Asia. International observers are now watching closely as the new state defines its role in the region."
 Formable.3.t:0 "Iberia Unified"
 Formable.3.d:0 "The unification of Spain and Portugal into a single Iberian state has been formally declared. Long-standing historical divisions have been set aside in favour of political unity. The new state emerges as a major power in southwestern Europe, drawing close attention from neighbouring countries."
 Formable.4.t:0 "The Baltics Unified"
 Formable.4.d:0 "Estonia, Latvia and Lithuania have been unified under a single Baltic state. The move is presented as a restoration of shared identity after decades of foreign domination. Officials describe it as a new chapter of regional unity in Northern Europe."
 Formable.5.t:0 "Czechoslovakia Reunified"
 Formable.5.d:0 "Bohemia, Moravia and Slovakia have been reunified under the restored Czechoslovak state. The decision follows decades of separation and is framed as a return to shared national heritage. The new leadership calls it a renewal of a historic European nation."
 Formable.6.t:0 "East Africa United"
 Formable.6.d:0 "Kenya, Tanzania, Uganda, Rwanda and Burundi have been unified under a single East African Federation. Leaders describe the move as the culmination of regional integration efforts and shared historical ties. The new state is expected to play a larger role on the African continent."
 Formable.7.t:0 "The Birth of [ROOT.GetNonIdeologyNameDef]"
 Formable.7.d:0 "These territories have been unified into a single state under [ROOT.GetNonIdeologyNameDef]. The formation marks the end of previous divisions and the creation of a new political entity. Officials describe it as the beginning of a new national era."
 mexico.1.t:0 "AMLO retires"
 mexico.1.d:0 "After years of dominating Mexican politics and leading the country through a period of both reform and controversy, Morena Leader Andrés Manuel López Obrador has officially announced his retirement from active politics. His chosen successor, Claudia Sheinbaum, has stepped forward to continue his legacy."
 Yes_NO.1.t:0 "They §GAccept§!"
 Yes_NO.1.d:0 "[FROM.GetName] §GAccepts§!"
 Yes_NO.2.t:0 "They §RDecline§!"
 Yes_NO.2.d:0 "[FROM.GetName] §RDecline§!"
 Trump.1.t:0 "Trump's Second Inauguration"
 Trump.1.d:0 "The nation gathers to witness history as Donald Trump takes the oath of office for a second term. Supporters cheer, banners wave, and a message is sent loud and clear the movement is stronger than ever, and the country will now follow a drasticly diffrent path"
 Trump.2.t:0 "Musk’s Nazi Salute"
 Trump.2.d:0 "During the inauguration celebration, Elon Musk a key Trump ally, was seen doing a clear nazi salute. The crowd erupted with shock and laughture. Should We Condem Him"
 City_news.1.t:0 "The Fall of Kyiv"
 City_news.1.d:0 "Russian forces have captured Kyiv after fierce fighting across the Ukrainian capital. Although isolated clashes continue in parts of the city, organized resistance has largely collapsed. The Ukrainian government has reportedly relocated westward as Russian troops consolidate their control."
 City_news.2.t:0 "Zaporizhzhia Captured by Russian Troops"
 City_news.2.d:0 "Russian troops have entered Zaporizhzhia after breaking through Ukrainian defenses. The loss of one of Ukraine's most important industrial and logistical centers marks another major advance for Moscow, while Ukrainian forces regroup farther west."
 City_news.3.t:0 "Kharkiv Falls to Russian Forces"
 City_news.3.d:0 "After weeks of heavy fighting, Russian forces have taken control of Kharkiv. The city suffered extensive damage during the battle, with Ukrainian troops withdrawing after fierce resistance. The capture of Ukraine's second-largest city is a major victory for Moscow and a serious setback for Kyiv."
 City_news.4.t:0 "Poltava Captured by Russian Forces"
 City_news.4.d:0 "Russian troops have entered Poltava after Ukrainian defenders withdrew from the city. A key transportation hub in central Ukraine, its capture strengthens Russia's position deeper inside the country and places additional pressure on Ukrainian forces defending the interior."
 City_news.5.t:0 "Kherson Falls to Russian Forces"
 City_news.5.d:0 "Russian troops have secured Kherson after advancing across southern Ukraine. As the first regional capital to fall during the invasion, its capture strengthens Russia's foothold along the lower Dnipro and opens new opportunities for further operations in the south."
 City_news.6.t:0 "Kherson Liberated by Ukrainian Forces"
 City_news.6.d:0 "Ukrainian forces have retaken Kherson after Russian troops withdrew from the city. Crowds gathered in the streets to welcome the returning soldiers, ending months of occupation. The liberation of Kherson marks a major success for Kyiv and restores control over the only regional capital previously captured by Russia."
 City_news.7.t:0 "Kyiv Liberated by Ukrainian Forces"
 City_news.7.d:0 "Ukrainian troops have retaken Kyiv after forcing Russian forces to withdraw from the capital. Residents have emerged to welcome the returning soldiers, while authorities have begun restoring government control. The liberation of Kyiv marks a major turning point in the war and a significant boost to Ukrainian morale."
 City_news.8.t:0 "Zaporizhzhia Liberated by Ukrainian Forces"
 City_news.8.d:0 "Ukrainian troops have retaken Zaporizhzhia after driving Russian forces from the city. The liberation restores control over one of Ukraine's largest industrial centers and marks another setback for Moscow's campaign."
 City_news.9.t:0 "Poltava Liberated by Ukrainian Forces"
 City_news.9.d:0 "Ukrainian forces have liberated Poltava following a successful counteroffensive. Russian units have withdrawn from the city, allowing Ukrainian authorities to restore control over another key regional center."
 City_news.10.t:0 "Kharkiv Liberated by Ukrainian Forces"
 City_news.10.d:0 "Ukrainian troops have liberated Kharkiv after forcing Russian forces to retreat from the city. Residents have welcomed the returning soldiers as Ukraine reestablishes control over its second-largest city."
 sudan.1.t:0 "Conflict Erupts in Sudan"
 sudan.1.d:0 "Armed clashes have broken out between rival factions within Sudan, rapidly escalating into widespread violence across multiple regions. Government forces and opposition groups are now engaged in open confrontation, with reports of heavy fighting in urban centers and key strategic areas. The situation remains highly unstable, and fears of a prolonged civil conflict are growing as diplomatic efforts to restore order have so far failed."
 sudan_news.1.t:0 "Civil War Engulfs Sudan"
 sudan_news.1.d:0 "Sudan has descended into civil war as armed factions battle for control of the state. Fighting has spread across major cities and infrastructure networks, severely disrupting governance and civilian life. International observers warn that the conflict could destabilize the wider region if it continues to escalate. Foreign governments are closely monitoring the situation as humanitarian concerns increase."