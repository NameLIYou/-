 urban_berlin:0 "Berlin"
 urban_berlin_desc:0 "\n§4Berlin has been the centre of German political life for much of the modern era. The city was the capital of the German Empire, the Weimar Republic and Nazi Germany, was divided between East and West after the Second World War, and became the seat of the reunified German government in 1990.§!"
 urban_st_petersburg:0 "Winter Palace"
 urban_st_petersburg_desc:0 "\n§4The Winter Palace stands on the banks of the Neva as one of the most recognisable remnants of Russia's imperial capital. Once the principal residence of the Russian emperors, it became closely associated with the fall of the monarchy when revolutionary forces seized the palace in October 1917.§!"
 urban_moscow:0 "Red Square"
 urban_moscow_desc:0 "\n§4Red Square lies directly beside the Kremlin and has been a focal point of Moscow for centuries. It has witnessed coronations, religious processions, military parades and political demonstrations, and became particularly associated with the Soviet state during the 20th century.§!"
 urban_paris_north:0 "Arc de Triomphe"
 urban_paris_north_desc:0 "\n§4Commissioned by Napoleon after the victory at Austerlitz, the Arc de Triomphe stands at the centre of one of Paris's most important avenues. Beneath it lies the Tomb of the Unknown Soldier, making the monument a regular site for French national ceremonies.§!"
 urban_paris_south:0 "Eiffel Tower"
 urban_paris_south_desc:0 "\n§4Constructed for the 1889 World's Fair, the Eiffel Tower was initially intended as a temporary structure. It survived its planned removal and became a defining part of Paris, while its height has also made it useful for observation and communications.§!"
 urban_london:0 "Houses of Parliament"
 urban_london_desc:0 "\n§4The Palace of Westminster stands beside the Thames at the heart of Britain's political district. Its present Gothic Revival buildings replaced much of the medieval palace after the fire of 1834 and have since been the setting for debates, elections, crises and changes of government.§!"
 urban_warzaw:0 "Warsaw"
 urban_warzaw_desc:0 "\n§4Warsaw sits on the Vistula and has repeatedly found itself at the centre of Poland's struggles for independence. The city suffered enormous destruction during the Second World War, particularly during the Warsaw Uprising of 1944, but its historic centre was painstakingly reconstructed after the war.§!"
 urban_shanghai:0 "Shanghai"
 urban_shanghai_desc:0 "\n§4Shanghai grew from a regional port into one of China's largest cities and a major centre of international commerce. The Bund preserves the city's former foreign concessions along the Huangpu, while the districts across the river have developed into one of the world's most recognisable modern skylines.§!"
 urban_pyongyang:0 "Pyongyang"
 urban_pyongyang_desc:0 "\n§4Pyongyang serves as the political centre of North Korea and was rebuilt on a large scale after the Korean War. Broad avenues and monumental state buildings dominate the central districts, reflecting the city's role as the seat of the country's government and ruling institutions.§!"
 urban_new_york:0 "Manhattan"
 urban_new_york_desc:0 "\n§4Manhattan is the historic core of New York's financial and commercial life, stretching from the towers of Lower Manhattan to the avenues of Midtown. Wall Street, the Empire State Building and the former World Trade Center site all stand within the island's dense urban landscape.§!"
 urban_dc:0 "National Mall"
 urban_dc_desc:0 "\n§4Stretching between the United States Capitol and the Lincoln Memorial, the National Mall forms the ceremonial centre of Washington, D.C. Presidents have been inaugurated nearby, while the Mall itself has hosted some of the largest political demonstrations and public gatherings in American history.§!"
 urban_la:0 "Los Angeles Skyline"
 urban_la_desc:0 "\n§4Los Angeles developed from a relatively small Southern Californian city into one of the largest metropolitan areas in the United States. Its skyline rises around a sprawling urban region shaped by the film industry, international trade, immigration and the extensive freeway network.§!"
 urban_maidan:0 "Independence Square"
 urban_maidan_desc:0 "\n§4Maidan Nezalezhnosti occupies the centre of Kyiv and has repeatedly become a gathering point during periods of political upheaval. The square was at the heart of the Orange Revolution in 2004 and the Euromaidan movement from 2013 to 2014, when demonstrations eventually led to the fall of President Viktor Yanukovych.§!"
 urban_mother_ukraine:0 "Mother Ukraine Statue"
 urban_mother_ukraine_desc:0 "\n§4Rising above Kyiv on the western bank of the Dnipro, the Mother Ukraine monument was unveiled in 1981 as part of the Soviet memorial complex dedicated to the Second World War. Its enormous steel figure and elevated position make it visible across much of the surrounding city.§!"
 urban_saint_sophia_cathedral:0 "Saint Sophia Cathedral"
 urban_saint_sophia_cathedral_desc:0 "\n§4Saint Sophia Cathedral dates back to the 11th century and is one of the most important surviving monuments from the era of Kyivan Rus'. Its mosaics and frescoes have survived centuries of wars and political changes, while the surrounding complex remains one of Kyiv's major historic sites.§!"
 mountain_gibraltar:0 "Rock of Gibraltar"
 mountain_gibraltar_desc:0 "\n§4The Rock rises directly above the narrow entrance to the Mediterranean, giving Gibraltar an unusual importance far beyond its small territory. British forces have held the fortress since 1704, and its harbour and position have made it a major military and naval station for centuries.§!"
 urban_jerusalem:0 "Old City of Jerusalem"
 urban_jerusalem_desc:0 "\n§4Surrounded by historic walls, the Old City contains some of the most significant religious sites in the world, including the Western Wall, the Church of the Holy Sepulchre and the Temple Mount. Control of the city has changed repeatedly over centuries, and its status remains central to the Israeli-Palestinian conflict.§!"
 urban_tel_aviv:0 "Tel Aviv Beachfront"
 urban_tel_aviv_desc:0 "\n§4Tel Aviv's western edge follows the Mediterranean coastline, with a continuous beachfront separating the city from the sea. Founded in 1909 beside the older port city of Jaffa, Tel Aviv grew into Israel's largest metropolitan and commercial centres, with its coastal districts remaining among its busiest areas.§!"
 urban_dubai:0 "Dubai Skyline"
 urban_dubai_desc:0 "\n§4Dubai's skyline is the result of an exceptionally rapid expansion from a Gulf trading settlement into a global commercial and transport hub. The Burj Khalifa rises above Downtown Dubai, surrounded by newer towers, hotels and large-scale developments built largely within the last few decades.§!"
 plains_dover:0 "The White Cliffs of Dover"
 plains_dover_desc:0 "\n§4The White Cliffs rise above the Strait of Dover at the closest point between Britain and continental Europe. Dover has served as a major crossing point and defensive position for centuries, with its castle and harbour overlooking one of the world's busiest maritime routes.§!"
 urban_vatican:0 "St. Peter's Square"
 urban_vatican_desc:0 "\n§4St. Peter's Square forms the main approach to St. Peter's Basilica and the centre of Vatican City's public ceremonies. Its colonnades were designed by Gian Lorenzo Bernini in the 17th century, and the square regularly fills with pilgrims and crowds during major papal events.§!"
 urban_tallin:0 "Tallinn Old Town"
 urban_tallin_desc:0 "\n§4Tallinn's Old Town preserves much of the medieval city that developed around its harbour and fortified hill. Its walls, narrow streets and merchant houses reflect the city's centuries as an important trading centre on the Baltic Sea, with the historic centre surviving major wars and political changes.§!"
 urban_helsinki:0 "Helsinki Cathedral"
 urban_helsinki_desc:0 "\n§4Helsinki Cathedral overlooks Senate Square from the centre of Finland's capital. Completed in 1852 during the period of the Grand Duchy of Finland, its white façade and green domes have become closely associated with the city and its development as Finland's political centre.§!"