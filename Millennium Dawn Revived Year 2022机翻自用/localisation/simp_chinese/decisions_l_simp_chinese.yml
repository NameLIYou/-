 formable_nation_decisions:0 "Formable Nations"
 formable_nation_decisions_desc:0 "We have bigger plans than just '[This.GetName]'; [This.GetName] is not nearly enough. We need to think bigger. We need to have vision for the future."
 form_scandinavia:0 "Form Scandinavia"
 ENG_Politics:0 "A Fractured Political Landscape"
 ENG_Politics_desc:0 "Confidence in government has weakened as economic pressure, media scrutiny, and internal divisions begin to shape the national mood. Parliament remains functional, but consensus is increasingly fragile, and political maneuvering is becoming more pronounced."
 ENG_Call_A_General_Election:0 "Call a Snap Election"
 ENG_Call_A_General_Election_desc:0 "The government under §Y[ENG.GetLeader]§! considers seeking a renewed mandate from the electorate. While a general election could consolidate authority, it also risks exposing internal divisions and shifting public sentiment at a critical moment."
 ENG_Election_Debate:0 "Televised Leadership Debate"
 ENG_Election_Debate_desc:0 "A nationally televised debate gives party leaders a chance to present their vision directly to the electorate. Performance here can significantly influence public opinion."
 ENG_Boris_Resigns:0 "The Fall of Boris Johnson"
 ENG_Boris_Resigns_desc:0 "Following mounting political pressure and internal party dissent, the Prime Minister has seen what others have seen for a while now. The premiership is up for debate"
 ENG_Conservative_Leadership_Contest:0 "Conservative Leadership Contest"
 ENG_Conservative_Leadership_Contest_desc:0 "With the premiership vacant, Conservative MPs and party members prepare to select a new leader. The outcome will define the government's future direction."
 ENG_Election_Campaign:0 "Election Campaign"
 ENG_Suspend_Democracy:0 "Suspend Elections"
 decisions_GER:0 "Germany"
 unternehmenssteuerreform:0 "Unternehmenssteuerreform"
 UKR_The_War:0 "Russian Invasion"
 UKR_The_War_desc:0 "The Russan invasion is an exictencial crisis. We will have to do everything we can in order to save Ukraine."
 UKR_Entrenched_Front:0 "Stagnent War"
 Request_Ammunition_from_America:0 "Request Ammunition from the USA"
 Request_Ammunition_from_America_desc:0 "The United States has vast reserves of military supplies. By requesting ammunition from them, we could secure much-needed resources to sustain our military operations."
 Request_Ammunition_from_Poland:0 "Request Ammunition from Poland"
 Request_Ammunition_from_Poland_desc:0 "Poland, as a member of NATO, maintains a strong defense industry. A request for ammunition could bolster our stockpiles in the face of escalating tensions."
 Request_Ammunition_from_France:0 "Request Ammunition from France"
 Request_Ammunition_from_France_desc:0 "France, a major European power, possesses significant military capabilities. Seeking their assistance could provide us with the ammunition we urgently need."
 Request_Ammunition_from_UK:0 "Request Ammunition from The UK"
 Request_Ammunition_from_UK_desc:0 "The United Kingdom's advanced military production could be instrumental in supporting our efforts. Requesting ammunition from them could strengthen our position on the battlefield."
 Fortify_Odessa:0 "Fortify The South"
 Fortify_Odessa_desc:0 "Odessa is a critical port city and a gateway to the Black Sea. Strengthening its defenses will ensure the security of our southern flank."
 Fortify_Dnipro:0 "Fortify Dnipro and Zaporizhzhia"
 Fortify_Dnipro_desc:0 "Dnipro and Zaporizhzhia are industrial and logistical hubs vital to our war effort. Fortifying these regions will protect key infrastructure from enemy advances."
 Fortify_Kyiv:0 "Fortify Approaches To Kyiv"
 Fortify_Kyiv_desc:0 "Kyiv, the heart of our nation, must be defended at all costs. Reinforcing its defenses will safeguard our capital against any threat."
 China_politics:0 "Chinese Politics"
 20th_congress_ccp:0 "The 20th Congress of the CCP"
 China_buy_out_nations:0 "Buy Out Nations"
 China_buy_out_nations_desc:0 "By debt trapping other nations, we can bail them out for political favors and exhibit influence over their governments."
 Boten_Vientiane_Railway:0 "Boten-Vientiane Railway"
 Sri_Lanka:0 "Bailing out Sri Lanka"
 Gwadar_Port:0 "Gwadar Port"
 offer_loans_to_angola:0 "Offer loans to Angola"
 laos_paying_off_debt:0 "Bailing out Laos"
 pakistan_paying_off_debt:0 "Bailing out Pakistan"
 angola_paying_off_debt:0 "Bailing out Angola"
 decisions_PRC:0 "China"
 power_struggle_in_the_communist_party:0 "Power Struggle in the Communist Party"
 power_struggle_in_the_communist_party_desc:0 "The Communist Party of China is the only way to gain political power and influence in the People's Republic. This inevitably causes factions to form within the party. The most notable factions are the hardliners of the Shanghai Clique around Jiang Zemin and the reform-minded Beijing Clique around Xi Jinping and Hu Jintao."
 china_power_struggle_beijing:0 "Beijing Faction"
 china_power_struggle_beijing_desc:0 "Influence of the Reform-Minded Beijing Faction."
 china_power_struggle_shanghai:0 "Shanghai Faction"
 china_power_struggle_shanghai_desc:0 "Influence of the Hardline Shanghai Faction."
 establish_maoritania:0 "Establish Maoritania"
 establish_maoritania_desc:0 "Having successfully included the Mauritanian people in our benevolent realm, we must at last truly honor the great first chairman!"
 strengthen_the_shanghai_clique:0 "Strengthen the Shanghai Clique"
 strengthen_the_beijing_clique:0 "Strengthen the Beijing Clique"
 Russo_Ukrainian_War:0 "Special Military Operation in Ukraine"
 Russo_Ukrainian_War_desc:0 "We embarked on this military operation with the expectation of a quick and decisive victory, one that would secure our position both regionally and globally. The support of the oligarchs and the public hinged on the promise of rapid success. Yet, the longer this conflict drags on, the more our plans begin to unravel. Each day, the cost grows higher, both in lives and resources, and the political stability we once took for granted begins to falter. §RIf we do not bring this war to a swift conclusion, we risk losing not only our territorial ambitions but also the fragile alliance that holds the regime together.§"
 Swift_Victory_in_Ukraine:0 "Swift Victory in Ukraine"
 Swift_Victory_in_Ukraine_desc:0 "We must achieve a rapid and decisive victory, securing Ukraine as a symbol of our might and sending a clear message to the world."
 Wagner_Coup_Decision:0 "Wagner PMC Rebellion"
 Wagner_Coup_Decision_desc:0 "The war drags on, and the promised swift victory remains a delusion. As discontent festers within the ranks, the Wagner Group begins to stir. If left unchecked, they may turn their guns on Moscow itself."
 SOV_Annex_Souther_Ukraine:0 "Integrate Southern §Y[UKR.GetFlag] Ukraine§!"
 SOV_Annex_Souther_Ukraine_desc:0 "For centuries, the lands of Southern §Y[UKR.GetFlag] Ukraine§!, also referred to as  §Y[NOV.GetFlag] Novorossiya§!, has been a contested frontiers of empire. Settled, developed, and defended by §Y[SOV.GetFlag] Russians§!, these regions are steeped in our history and legacy. With the tide of war in our favor, we now have the opportunity to restore §Y[SOV.GetFlag] Russian§! authority over these lands and correct the artificial borders imposed by the collapse of the Soviet Union."
 SOV_Annex_Black_Sea_Ukraine:0 "Integrate §Y[UKR.GetFlag] Ukraine's§! Black Sea Coast"
 SOV_Annex_Black_Sea_Ukraine_desc:0 "The Black Sea coastline of §Y[UKR.GetFlag] Ukraine§! holds major strategic and economic importance, linking the region to maritime trade routes and naval access points. With §Y[SOV.GetFlag] Russian§! control secured over the area, we can begin establishing long-term administrative structures, expanding infrastructure, and integrating local governance into federal systems. This process will also strengthen our position across the wider Black Sea region."
 SOV_Annex_Central_Ukraine:0 "Integrate Central §Y[UKR.GetFlag] Ukraine§!"
 SOV_Annex_Central_Ukraine_desc:0 "Central §Y[UKR.GetFlag] Ukraine§! has long been tied to the historic and economic space of §Y[SOV.GetFlag] Russia§!. With the current military situation secured, integration of these regions into federal administration becomes a practical step in stabilizing the overall region."
 SOV_Belarus_Union_State:0 "The Union State of §Y[SOV.GetFlag] Russia§! and §Y[BLR.GetFlag] Belarus§!"
 SOV_Belarus_Union_State_desc:0 "Ever since the collapse of the Soviet Union in 1991 the destiny of §Y[BLR.GetFlag] Belarus§! and §Y[SOV.GetFlag] Russia§! have grown closer, we shall finally complete this process"
 SOV_Western_Belarus:0 "Integrate Western §Y[BLR.GetFlag] Belarus§!"
 SOV_Western_Belarus_desc:0 "The lands of Western §Y[BLR.GetFlag] Belarus§! have changed hands multiple times over the course of history, shaped by partitions, occupations, and shifting borders in Eastern Europe, including periods under §Y[POL.GetFlag] Poland§!. From Moscow’s perspective, these regions remain closely tied to the wider strategic security of the western frontier. Their reintegration is presented as a correction of historical disruption and a consolidation of long-term stability along the border with §Y[BLR.GetFlag] Belarus§!."
 SOV_Eastern_Belarus:0 "Integrate Eastern §Y[BLR.GetFlag] Belarus§!"
 SOV_Eastern_Belarus_desc:0 "Integrating §Y[BLR.GetFlag] Belarus§! has long been closely integrated with §Y[SOV.GetFlag] Russia§! through shared institutions, infrastructure, and economic systems dating back to the Soviet period. The region is viewed as already deeply interconnected with the Russian state, making its formal reintegration a continuation rather than a reversal of existing realities."
 SOV_Annex_Kazakstan:0 "Integrate §Y[KAZ.GetFlag] Kazakhstan§!"
 SOV_Annex_Kazakstan_desc:0 "Having secured influence over §Y[KAZ.GetFlag] Kazakhstan§!, we now face the task of formal integration. The territory holds vast natural resources and provides significant strategic depth across Central Asia. Bringing it fully under §Y[SOV.GetFlag] Russian§! administration would consolidate long-term regional stability and strengthen economic coordination across the former Soviet space."
 SOV_Annex_South_Ossettia:0 "Integrate §Y[SOS.GetFlag] South Ossetia§!"
 SOV_Annex_South_Ossettia_desc:0 "The Ossetian people have long been divided by administrative borders drawn during the Soviet era. Since the dissolution of the Soviet Union, §Y[SOS.GetFlag] South Ossetia§! has remained politically separated from its northern counterpart despite close cultural, linguistic, and historical ties. By integrating the region into the Russian Federation, we can formally unite North and South Ossetia under a single administration while strengthening our position in the Caucasus and reducing the influence of §Y[GEO.GetFlag] Georgia§! over the future of the region."
 SOV_Annex_Abkhazia:0 "Integrate §Y[ABK.GetFlag] Abkhazia§!"
 SOV_Annex_Abkhazia_desc:0 "For decades, §Y[ABK.GetFlag] Abkhazia§! has existed outside the control of §Y[GEO.GetFlag] Georgia§!, developing its own institutions and security structures with substantial Russian support. The region's strategic position on the Black Sea and its long-standing political alignment with §Y[SOV.GetFlag] Russia§! make formal integration a logical next step. Incorporating Abkhazia into the Federation would secure our presence in the Caucasus and bring a close partner fully into the Russian state."
 SOV_Annex_Goergia:0 "Integrate §Y[GEO.GetFlag] Georgia§!"
 SOV_Annex_Goergia_desc:0 "The lands of §Y[GEO.GetFlag] Georgia§! have been closely tied to Russian history since their incorporation into the Russian Empire in the early nineteenth century. For generations, the Caucasus formed an important part of the state's southern frontier, linking Russia to the Black Sea and the wider region. Georgia also occupies a unique place in Soviet history as the birthplace of §Y[SOV.GetFlag] Joseph Stalin§!, one of the most influential figures of the twentieth century. Reasserting control over §Y[GEO.GetFlag] Georgia§! would restore Russian influence in the Caucasus and reinforce our position in a region long considered vital to Moscow's security and interests."
 SOV_Annex_Moldova:0 "Integrate §Y[MDV.GetFlag] Moldova§!"
 SOV_Annex_Moldova_desc:0 "The territory of §Y[MDV.GetFlag] Moldova§! has long stood at the crossroads between East and West, shaped by competing influences from both §Y[SOV.GetFlag] Russia§! and §Y[ROM.GetFlag] Romania§!. Incorporated into the Soviet Union as the Moldavian SSR, the region remained closely linked to Russia through decades of shared institutions, economic integration, and population ties. With Moldova once again under Moscow's authority, we can begin the process of formal integration, securing our southwestern frontier and restoring political and economic unity across a region historically connected to the Russian state."
 SOV_Annex_Azerbazan:0 "The §Y[AZR.GetFlag] Azerbaijan§! Question"
 SOV_Annex_Azerbazan_desc:0 "With §Y[AZR.GetFlag] Azerbaijan§! now under our control, a decision must be made regarding its future. We can move toward full integration, bringing the republic directly into the Russian state and securing its considerable energy resources and strategic position in the Caucasus. Alternatively, we may use this opportunity to address long-standing regional disputes and reconsider the borders established after the collapse of the Soviet Union, including potential territorial adjustments involving §Y[ARM.GetFlag] Armenia§!."
 SOV_Annex_Uzbekistan:0 "Integrate §Y[UZB.GetFlag] Uzbekistan§!"
 SOV_Annex_Uzbekistan_desc:0 "The vast deserts and oases of §Y[UZB.GetFlag] Uzbekistan§! have occupied an important place in the history of Central Asia for centuries. Incorporated into the Russian Empire and later the Soviet Union, the region became deeply connected to Moscow through industry, infrastructure, and shared institutions. By integrating §Y[UZB.GetFlag] Uzbekistan§! into the Russian state, we can restore political unity across the region, strengthen our influence in Central Asia, and secure an area vital to the stability and security of our southern frontier."
 SOV_Annex_Northern_Baltics:0 "Reintegrate The Northern Baltic Region"
 SOV_Annex_Northern_Baltics_desc:0 "The territories of §Y[EST.GetFlag] Estonia§! and Eastern §Y[LAT.GetFlag] Latvia§! have long been shaped by shifting control along the eastern Baltic coast. Historically incorporated into the Russian Empire and later the Soviet Union, these regions were integrated into shared administrative, economic, and security structures. Following the collapse of that system, they aligned with Western institutions under §Y[NAT.GetFlag] NATO§!. Restoring authority over these areas would reestablish strategic depth along the Baltic Sea and reconnect them to long-standing regional and economic frameworks."
 SOV_Annex_Southern_Baltics:0 "Reintegrate the Southern Baltic Region"
 SOV_Annex_Southern_Baltics_desc:0 "The southern Baltic territories, particularly §Y[LIT.GetFlag] Lithuania§!, were once part of the Russian Empire and later incorporated into the Soviet Union, where they were integrated into shared administrative and economic systems. Following the collapse of that structure, the region aligned with Western institutions under §Y[NAT.GetFlag] NATO§!. Restoring influence over these territories would reestablish long-standing historical and strategic links along the Baltic coast and strengthen our position in the region."
 Finland_Under_Our_Control:0 "Establish [FIN.GetNameWithFlag] As A Puppet State"
 Finland_Under_Our_Control_desc:0 "With Finnish resistance crushed, a loyal government can now be installed. The eastern regions will remain firmly under Russian control, while a puppet regime administers the rest of the country."
 Poland_Under_Our_Control:0 "Establish [POL.GetNameWithFlag] As A Puppet State"
 Poland_Under_Our_Control_desc:0 "Following military occupation, a compliant government will be set up in Poland to secure our western border and ensure Warsaw remains aligned with our interests."
 Romania_Under_Our_Control:0 "Establish [ROM.GetNameWithFlag] As A Puppet State"
 Romania_Under_Our_Control_desc:0 "Romania’s strategic position and resources are vital. We will install a puppet government that guarantees loyalty and aids in expanding our influence in Eastern Europe."
 Hungary_Under_Our_Control:0 "Establish [HUN.GetNameWithFlag] As A Puppet State"
 Hungary_Under_Our_Control_desc:0 "The Hungarian government will be replaced with one obedient to our cause, securing the Carpathian region under our sphere and suppressing any nationalist uprisings."
 Slovakia_Under_Our_Control:0 "Establish [SLO.GetNameWithFlag] As A Puppet State"
 Slovakia_Under_Our_Control_desc:0 "A puppet regime in Slovakia will cement our control over the region, ensuring the local population is governed by a leadership loyal to Moscow."
 decisions_USA:0 "United States"
 dodd_frank_plan:0 "Dodd Frank Plan"
 select_the_king_of_america:0 "Select the King of America"
 select_the_king_of_america_desc:0 "Monarchy in America? Incredible. Well, we will have to find a candidate to be a king. A descendant of Washington? A businessman? A general? Who knows."
 african_union_decisions:0 "African Union"
 arab_league_decisions:0 "Arab League"
 european_union_decisions:0 "European Union"
 apply_to_join_the_EU:0 "Apply to join the EU"
 leave_the_EU:0 "Leave the EU"
 Monarchist_propaganda:0 "Monarchism On The Rise"
 Monarchist_propaganda_desc:0 "Monarchism has been a small part of the political discourse so far. By showing the people of France what the glories of monarchism brought to France, we will once again be able to enter the political discourse"
 monarchist_media:0 "Monarchist Media"
 monarchist_media_desc:0 "By introducing monarchist propaganda online will increase the ammount of people exposed to our ideas"
 Hold_A_Monarchist_Rally:0 "Hold A Monarchist Rally"
 Establish_Monarchist_Militias:0 "Establish Monarchist Militias"
 Crown_A_Bonapart:0 "Crown a Bonapart"
 Crown_A_Bonapart_desc:0 "Crown a Bonapart"
 Crown_A_Orleanist:0 "Crown an Orléanist"
 Crown_A_Orleanist_desc:0 "Crown an Orléanist"
 diplomatic_decisions:0 "Diplomacy"
 diplomacy_towards_palestine:0 "Diplomacy towards Palestine"
 diplomacy_towards_taiwan:0 "Diplomacy towards Taiwan"
 seek_friendship_of_neighbor:0 "Seek [From.GetAdjective] Friendship"
 economic_policy:0 "Economic Policy"
 seize_the_means_of_production:0 "Seize the Means of Production"
 seize_the_means_of_production_desc:0 "Much of our industrial base remains in the hands of very wealthy individuals who neither look to serve society nor to properly treat their employees. By nationalizing factories and granting control over them to the unions, we will be able to fully unleash our nation's potential."
 state_corporatist_reforms:0 "State Corporatist Reforms"
 state_corporatist_reforms_desc:0 "Capitalism is a beast that needs to be tamed - but socialism is not the answer. We need to closely tie big corporations to the central government in order for the government to maintain power and for the corporations to keep growing. No unions are necessary - the government knows best."
 Democratization:0 "Democratization"
 Democratization_desc:0 "Our country has embarked on a process of democratization. We will have to open up our country and allowed for parties to from."
 Hold_A_Free_Election:0 "Hold A Free Election"
 Encourage_parties_of_the_left:0 "Encourage Creation of Parties on The Left"
 Encourage_parties_of_the_center:0 "Encourage Creation of Parties on The Center"
 Encourage_parties_of_the_right:0 "Encourage Creation of Parties on The Right"
 education_policy:0 "Education Policy"
 embrace_racial_theories:0 "Embrace Racial Theories"
 embrace_racial_theories_desc:0 "We thought about it, and we don't really see anything bad with racism. We get to point our finger at other people for other people, we get to devalue these people in the eyes of our citizens which will in turn enable us to justify unhumane actions against them and all the filthy liberals who think racism is bad will be super annoyed at us. No downsides.\n\nTeaching people to be racist is difficult, so we should start from an early age."
 encourage_enlightenment_values:0 "Encourage Enlightenment Values"
 embrace_far_left_philosophy:0 "Embrace Far-Left Philosophy"
 embrace_far_left_philosophy_desc:0 "The current education policy pays too much attention to the 'old classics' written by reactionary thinkers (if they were thinkers at all). Instead, we should reshift our attention to the actual old classics - Marx, Engels, Lenin. Young people need to know that revolution is preferable to reform and that collectivism is preferable to capitalism."
 executive_policy:0 "Executive Policy"
 judiciary_policy:0 "Judiciary Policy"
 legislative_policy:0 "Legislative Policy"
 army_decisions:0 "Army"
 expand_the_army_officer_corps:0 "Expand the Army Officer Corps"
 navy_decisions:0 "Navy"
 expand_the_navy_officer_corps:0 "Expand the Navy Officer Corps"
 air_force_decisions:0 "Air Force"
 expand_the_air_force_officer_corps:0 "Expand the Air Force Officer Corps"
 secret_agreements:0 "Secret Agreements"
 secret_agreements_desc:0 "Some things need to be handled below the surface and behind closed doors. By privately contacting specific countries regarding specific inquiries, we might just find common ground to stand on with these countries."
 operation_napoleon:0 "Operation Napoleon"
 operation_napoleon_desc:0 "A secret agreement to see Belgium divided, the German, Dutch and French governments should jointly pursue 'Operation Napoleon', a military plot to see the Belgian state destroyed."
 test_decisions:0 "Test Decisions"
 test_decision:0 "Test Decision"
 Ida's_agenda:0 "Ida's Agenda"
 Ida's_agenda_desc:0 "Now that Pikku Ida is in charge, she is ready to do some of the things she has been waiting a looong time to do !"
 Hold_A_Party:0 "Hold A Party ?"
 Hold_A_Party_desc:0 "A gloriouse leader like Pikku Ida needs a party every now and then... Right ?"
 Fate_of_Amanda:0 "Fate of Amanda"
 Fate_of_Amanda_desc:0 "We will need to deal with Amanda..."
 Force_people_to_visit_Lauttasaari:0 "Force People to Visit Lauttasaari ?"
 Force_people_to_visit_Lauttasaari_desc:0 "Lauttasaari is the birthplace of gloriouse Pikku Ida, we should force people from all over Finland to visit Lauttasaari in order to witness the birthplace of our leader !"
 A_New_National_Anthem:0 "A New National Anthem"
 A_New_National_Anthem_desc:0 "The old §OMamme§W song fit that time period of our history. We have to update it !"
 Yugoslavia:0 "Reform Yugoslavia"
 Yugoslavia_desc:0 "The echoes of a once-proud Yugoslavia still resonate in the hearts of many across Serbia. Despite the scars of war and division, there are those who remember the unity, strength, and hope that the former federation once represented. As the world shifts around us, the idea of reforming Yugoslavia stirs a sense of nostalgia, a longing to revive the spirit of brotherhood and peace that once bound our people together."
 Reform_Yugoslavia:0 "Reform Yugoslavia"
 ISR_Greater_Israel_Project:0 "Greater Israel Project"
 ISR_Greater_Israel_Project_desc:0 "The dream of a Greater Israel has echoed through the halls of Zionist thought for generations. We shall expand our borders and unite the historic lands from the Nile to the Euphrates under one sovereign banner.\n\n\n Settlements can only been established next to our §YCores§!"
 ISR_Establish_Settlement:0 "Establish Settlements In §Y[From.GetName]§!"
 Integrate_Settelments:0 "Integrate §Y[From.GetName]§!"
 ISR_settlement_modifier:0 "Jewish Settlements"
 ISR_settlement_modifier_desc:0 "We have established new Jewish communities across this region. Land seizures, new roads, and expanding security zones have tightened our grip over the territory despite growing resistance from the local population."
 Proclaim_Greater_Israel:0 "Proclaim §3Greater Israel§!"
 Belarus:0 "Integrate [BLR.GetNameWithFlag]"
 Belarus_desc:0 "After annexing [BLR.GetNameWithFlag] we will have to install our institutions and local governance."
 Greater_Greece:0 "Realize Greater Greece"
 Greater_Greece_desc:0 "The dream of Greater Greece, long spoken of by patriots and visionaries, is once again within reach. Through strength, unity, and national will, the Greek people can reclaim the lands that once formed the heart of Hellenic civilization. From the Aegean to distant shores, the spirit of ancient glory calls. It is time to seize our destiny and forge a new era for Greece — greater, stronger, and more magnificent than ever before."
 Yugoslavia_Republic:0 "Controll §Gone§! of the former §YYugoslav Republics§!"
 Yugoslavia_Reform:0 "Gains §YCores§! on §Y[MAC.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§!, §Y[CRO.GetNameWithFlag]§! and §Y[SLV.GetNameWithFlag]§!"
 Macedonia:0 "Integrate [MAC.GetNameWithFlag]"
 Macedonia_desc:0 "[MAC.GetNameWithFlag], a land deeply tied to the history and spirit of the Greek people, must be fully brought into the national fold. By integrating this historic region, we reaffirm our ancient heritage and strengthen the unity of our nation for the challenges ahead."
 Northern_Eprus:0 "Reclaim Northern Epirus"
 Northern_Eprus_desc:0 "Northern Epirus, a region with deep historical and cultural ties to Greece, remains under foreign rule. It is our national duty to reclaim this rightful land and reunite its people with their Hellenic brothers. Only through strength and determination can we complete the vision of a united Greece."
 Megali_Idea:0 "Revive the Megali Idea"
 Megali_Idea_desc:0 "The Megali Idea the Great Idea has long symbolized the hopes of the Greek people to unite all lands historically tied to Hellenism. From Constantinople to Asia Minor, from the Aegean islands to ancient Epirus, the dream of a Greater Greece burns brightly once more. Now is the time to fulfill our historic destiny and restore the glory of our ancestors."
 Greater_Croatia:0 "Greater Croatia"
 Greater_Croatia_desc:0 "With the historic lands of [CRO.GetNameWithFlag] and Bosnia within our grasp, the time has come to realize the vision of a Greater Croatia. By restoring the borders once envisioned during the era of the Independent State, we can unify all Croats and assert our rightful place in the Balkans. All that remains is to formalize our claims and declare the rebirth of a stronger, greater Croatian state."
 Bosnia:0 "Realize Greater Croatia"
 Bosnia_desc:0 "The dream of a united Croatian nation stretches beyond our current borders. With Bosnia firmly under our control, we can now fulfill the vision of Greater Croatia integrating these historic lands into our nation and securing a future where Croats stand strong and undivided."
 Magyar:0 "Revive Greater Hungary"
 Magyar_desc:0 "The Treaty of Trianon shattered our sacred Crown Lands, scattering the Magyar people across artificial borders drawn by foreign powers. But the Magyar spirit endures. With renewed strength and national resolve, we shall undo the injustices of the past from the hills of Slovakia to the plains of Transylvania, from the Danube's southern banks to the Carpathian highlands. Greater Hungary shall rise once more, united and indivisible."
 Southern_Slovakia:0 "Reassert Control over Southern [SLO.GetNameWithFlag]"
 Southern_Slovakia_desc:0 "Southern [SLO.GetNameWithFlag], steeped in Hungarian history and culture, was unjustly cleaved from our homeland. It is time to reestablish Hungarian administration in these lands and restore our ancestral ties to this region."
 Slovakia:0 "Reunify [SLO.GetNameWithFlag]"
 Slovakia_desc:0 "The lands of [SLO.GetNameWithFlag] once stood within the embrace of the Crown of Saint Stephen. As our influence grows, we move to restore unity with these historic territories, fulfilling the ancient bonds that tie them to the Hungarian nation."
 Northern_Transylvania:0 "Restore Northern Transylvania"
 Northern_Transylvania_desc:0 "Northern Transylvania, a land rich with Magyar heritage, was stripped from us by unjust treaties and foreign ambition. Now, the time has come to reestablish our presence and renew the deep-rooted ties that bind this region to the heart of Hungary."
 Southern_Transylvania:0 "Restore Southern Transylvania"
 Southern_Transylvania_desc:0 "Southern Transylvania, once a cornerstone of the Hungarian Kingdom, has long echoed with the voices of our ancestors. Though time and treaties have torn it from our grasp, the Magyar spirit still lingers in its valleys and towns. With history as our guide and destiny in our hands, we now move to bring this storied land back into the fold of the Hungarian nation."
 Vojvodina:0 "Reestablish Authority in Vojvodina"
 Vojvodina_desc:0 "Vojvodina, once governed from the heart of [HUN.GetNameWithFlag], was torn from us in the wake of empire's collapse. Yet its towns, rivers, and fields still remember the days of Magyar stewardship. With firm resolve, we shall reassert our rightful presence in this vital land and restore harmony under Hungarian rule."
 Croatia:0 "Reunite with [CRO.GetNameWithFlag]"
 Croatia_desc:0 "For centuries, [CRO.GetNameWithFlag] and [HUN.GetNameWithFlag] stood united under the Crown of Saint Stephen two peoples bound by history, struggle, and governance. Though modern borders have divided us, the past beckons. Now is the time to revive that shared legacy and bring Croatia back into the embrace of Greater Hungary."
 Sweden_Expansion:0 "King's Foreign Policy"
 Sweden_Expansion_desc:0 "Under the leadership of the King, Sweden will no longer cower in the shadow of history. The time has come to reclaim what was once ours, to restore the borders and glory of the Swedish Empire. From the coasts of the Baltic to the mountains of Norway, our irredentist vision will reshape the map and demand the respect we deserve. Expansion is not a choice, but a destiny."
 SWE_Aland_Issue:0 "Demand Åland"
 SWE_Aland_Issue_desc:0 "Åland has historic and cultural ties to us. There is no reason that Helsinki should have controll over this histcally Swedish region"
 SWE_Demand_Norway_Bowe_Down:0 "Demand [NOR.GetNameWithFlag] Submits"
 SWE_Demand_Norway_Bowe_Down_desc:0 "[NOR.GetNameWithFlag] has historically been a part of [SWE.GetNameWithFlag]. As recently as 1905 Norway and Sweden were in an union. In order to restore our sprehe of influence, Norway has to be dealt with."
 SWE_Demand_Norway_Subjgate:0 "Integrate [NOR.GetNameWithFlag]"
 SWE_Demand_Norway_Subjgate_desc:0 "Now that Norway is under our protection, we will begin the process to integrate them"
 SWE_Demand_Finland_Bowe_Down:0 "Demand [FIN.GetNameWithFlag] Submits"
 SWE_Demand_Finland_Bowe_Down_desc:0 "Finland, or as it was once know, Östra Rikshalva, \"the eastern part of the realm\" was originally settled by Swedes. It's time for us to bring Helsinki back under the King"
 SWE_Demand_Finish_Subjgate:0 "Integrate [FIN.GetNameWithFlag]"
 SWE_Demand_Finish_Subjgate_desc:0 "[FIN.GetNameWithFlag] will once again be an integral part of our country"
 SWE_Pacify_Denmark:0 "Pacify [DEN.GetNameWithFlag]"
 SWE_Pacify_Denmark_desc:0 "With [DEN.GetNameWithFlag] now under our controll we will pacify the rebelliouse Danes"
 Monarchist_Industrial_policy:0 "Rejuvenated Industrial Sector"
 Monarchist_Industrial_policy_desc:0 "As Sweden’s welfare state crumbles, revitalizing our industry is no longer optional. To compete with global powers, the monarchy will lead a renewed push to strengthen our industrial foundation and restore national strength."
 Rejuvenated_Welfare_State:0 "Rejuvenated Welfare State"
 Rejuvenated_Welfare_State_desc:0 "With our reforms complete, the welfare state has been stabilized and modernized. What was once on the brink of collapse now stands as a renewed pillar of Swedish society."
 Industrialize_Malmo:0 "Industrialize Malmö"
 Industrialize_Malmo_desc:0 "Malmö, once a key industrial hub, has fallen behind in recent decades. By channeling investments into infrastructure and factories, we will transform the city into a modern powerhouse—boosting southern Sweden’s economy and reinforcing our national industrial revival."
 Build_in_The_North:0 "Build in the North"
 Build_in_The_North_desc:0 "Northern Sweden has long been overlooked in terms of development. By investing in infrastructure and industry in this vast, resource-rich region, we can unlock its full potential and strengthen the nation’s economic resilience."
 SWE_railways:0 "Link the Nation by Rail"
 SWE_railways_desc:0 "To unify the kingdom and support military and economic mobility, we will construct a modern railway network stretching from the Finnish border in the north to our Danish frontier in the south. This grand project will bind Sweden together and prepare us for the challenges ahead."
 Korea_South:0 "Reunify Korea Under Southern Leadership"
 Korea_South_desc:0 "The time may soon come when the peninsula can once again stand united. We must be ready to take the lead politically, strategically, and economically to guide Korea toward reunification under southern leadership."
 Peacfull_Unification:0 "Propose Peaceful Reunification"
 Peacfull_Unification_desc:0 "With a like-minded government now in control of the North, the barriers to peaceful reunification have begun to fade. We will extend a formal proposal to unify the Korean Peninsula through mutual agreement, cooperation, and shared national identity without the need for conflict."
 Northern_Integration:0 "Integrate the North"
 Northern_Integration_desc:0 "With control over the northern territories secured, we must begin the difficult but essential task of integration. Rebuilding infrastructure, restoring order, and aligning administrative structures will be necessary to fully unify the peninsula under a single Korean state."
 Korea_North:0 "Reunify Korea Under Northern Leadership"
 Korea_North_desc:0 "The Korean Peninsula remains divided, but not forever. The time will come when we must assert leadership and bring the South under a single Korean government one that stands united under our banner."
 Communist_Unification:0 "Propose Peaceful Reunification"
 Communist_Unification_desc:0 "Now that both Koreas share a common ideological foundation, the moment is right to propose a peaceful unification. Through dialogue and cooperation, we may overcome decades of separation and restore unity to the peninsula."
 Southern_Integration:0 "Integrate the South"
 Southern_Integration_desc:0 "With control over the southern territories secured, we must now focus on the difficult task of integration. Unifying administrative systems, stabilizing the region, and rebuilding the infrastructure are essential to lasting national unity."
 Indochina:0 "Indochina"
 Indochina_desc:0 "The ancient lands of Indochina, a crossroads of cultures and empires, are poised to rise again. From the Mekong River to the South China Sea, the peoples of [VIN.GetNameWithFlag], [CAM.GetNameWithFlag], and [LAO.GetNameWithFlag] are united by a shared destiny, ready to forge a powerful, independent future for Southeast Asia."
 Proclaim_Indochina:0 "Proclaim the Indochinese Union"
 Proclaim_Indochina_desc:0 "For decades, our diverse peoples have endured foreign domination and internal divisions. But now, with our shared struggle for liberation nearing its culmination, the time has come to transcend historical boundaries and establish a united Indochinese state. This act will solidify our sovereignty, pool our resources, and present a formidable bulwark against future aggression, forever changing the balance of power in Southeast Asia."
 Kaliningrad:0 "Kaliningrad"
 Kaliningrad_desc:0 "With Russia in a weak position we have the possiblility to seize Kaliningrad from them, cutting them out of the Southern Baltic Sea"
 Sieze_Kalingrad:0 "Seize Kaliningrad"
 UKR_Martial_Law:0 "Martial Law"
 UKR_Martial_Law_desc:0 "The existance of an independetn Ukraine is on the line. No other time in history has martial law been more prudent then now"
 Plan_Offensive_In:0 "Plan Offensiv In §Y[From.GetName]§!"
 UKR_evacuations:0 "Evacuations"
 UKR_evacuations_desc:0 ""
 UKR_evacuate_donetsk:0 "Evacuate Donetsk Oblast"
 UKR_evacuate_luhansk:0 "Evacuate Luhansk Oblast"
 UKR_evacuate_zaporozhzhia:0 "Evacuate Zaporozhzhia Oblast"
 UKR_evacuate_dnipro:0 "Evacuate Dnipro Oblast"
 UKR_evacuate_kherson:0 "Evacuate Kherson Oblast"
 UKR_evacuate_kharkiv:0 "Evacuate Kharkiv Oblast"
 Iberia_Cores:0 "Controls all continental §Y[POR.GetAdjective] [POR.GetFlag]§! and §Y[SPR.GetAdjective] [SPR.GetFlag]§! states"
 Iberia:0 "Iberia"
 Czechoslovakia_Cores:0 "Controls all starting §Y[CZE.GetAdjective] [CZE.GetFlag]§! and §Y[SLO.GetAdjective] [SLO.GetFlag]§! states"
 Iberia_desc:0 "For centuries, the Iberian Peninsula has been divided by borders, kings, and empires. But there exists a vision one of unity, strength, and shared destiny. To form Iberia is to transcend old rivalries and forge a new continental power, stretching from Lisbon to Barcelona, from Seville to Bilbao."
 Unite_Iberia:0 "Unite Iberia"
 Unite_Iberia_desc:0 "After Centures apart we are finally united....."
 Baltic_Cores:0 "Controls all §Y[LAT.GetAdjective] [LAT.GetFlag]§!, §Y[LIT.GetAdjective] [LIT.GetFlag]§! and §Y[EST.GetAdjective] [EST.GetFlag]§! states"
 Baltics:0 "Baltics"
 Baltics_desc:0 "For generations, the peoples of Estonia, Latvia, and Lithuania have shared bonds of history, struggle, and cultural resilience. Though often divided by foreign empires and shifting borders, the idea of a united Baltic homeland has endured. To form the Baltic nation is to embrace unity, amplify strength, and secure a future where the Baltic peoples stand stronger together."
 Unify_the_Baltics:0 "Unify The Baltics"
 French_Coring_Decisions_Monarchist:0 "New French Empire"
 French_Coring_Decisions_Monarchist_desc:0 "With the monarchy restored and our dominions secured, we stand ready to proclaim a rebirth of imperial grandeur. The New French Empire shall not merely dominate its colonies, but integrate them into a unified realm bound by loyalty to the Crown and pride in French civilization."
 Integrate_Wallonia:0 "Integrate Wallonia"
 Integrate_Wallonia_desc:0 "Wallonia has long shared deep cultural, linguistic, and historical ties with France."
 Split_Italy:0 "Split Italy"
 Split_Italy_desc:0 "[ITA.GetNameWithFlag] is too strong on our borders, we need to split them up"
 Integrate_Geneva:0 "integrate Geneva"
 Integrate_Geneva_desc:0 "Geneva has a big French speaking population ripe for assimilation"
 Integrate_Catalonia:0 "Integrate Catalonia"
 Integrate_Catalonia_desc:0 "Catalonia was part of France during Napoleons rule, no need why that shouldn't be the case today aswell"
 FRA_Politics_In_France:0 "Politics In France"
 FRA_Politics_In_France_desc:0 "Democratic party popularity: [?party_popularity@communist|%0]"
 Red_Union:0 "Red Union"
 Red_Union_desc:0 "The time has come to unite the Nordic peoples under a single red banner. No longer shall Sweden, Norway, Denmark, Finland, and Iceland be divided by petty borders and bourgeois governments. Through solidarity and revolution, we shall forge a new socialist future the Red Union."
 Spread_Communism_To_Norway:0 "Spread Communism To [NOR.GetNameWithFlag]"
 Spread_Communism_To_Denmark:0 "Spread Communism To [DEN.GetNameWithFlag]"
 Spread_Communism_To_Finland:0 "Spread Communism To [FIN.GetNameWithFlag]"
 Spread_Communism_To_Iceland:0 "Spread Communism To [ICE.GetNameWithFlag]"
 Communist_Coup_In_Norway:0 "Communist Coup In [NOR.GetNameWithFlag]"
 Communist_Coup_In_Denmark:0 "Communist Coup In [DEN.GetNameWithFlag]"
 Communist_Coup_In_Finland:0 "Communist Coup In [FIN.GetNameWithFlag]"
 Communist_Coup_In_Iceland:0 "Communist Coup In [ICE.GetNameWithFlag]"
 Integrate_Norway:0 "Integration of [NOR.GetNameWithFlag]"
 Integrate_Denmark:0 "Integration of [DEN.GetNameWithFlag]"
 Integrate_Finland:0 "Integration of [FIN.GetNameWithFlag]"
 Integrate_Iceland:0 "Integration of [ICE.GetNameWithFlag]"
 Communist_North_Formable:0 "Proclaim the §RNordic Socialist Republics§!"
 Crackdown:0 "Crackdown on Our Party"
 Crackdown_desc:0 "The creation of our party has not gone unnoticed. The secular regime is alarmed by our growing influence and has launched a coordinated crackdown. Mosques are raided, imams are arrested, and our supporters are silenced. But repression only fuels the fire."
 Government_Crackdown:0 "Government Crackdown"
 Purchase_Wepons_From_Iran:0 "Wepons from [PER.GetNameWithFlag]"
 Get_Stalins_Home_Country_Back_In_Line_Georgia:0 "Get Stalins Homeland Back In Line"
 Get_Stalins_Home_Country_Back_In_Line_Georgia_desc:0 "Georgia, the birthplace of Joseph Stalin, holds symbolic significance for Russia. Bringing it back into Moscow's sphere of influence would serve both strategic and ideological purposes, reinforcing the image of a resurgent Russia that honors its Soviet legacy."
 Kazakstan:0 "Core [KAZ.GetNameWithFlag]"
 Infiltrate_Smaland:0 "Infiltrate Småland"
 Infiltrate_Smaland_desc:0 "Småland lies between our strongholds of Malmö and Stockholm. By quietly establishing underground networks, community influence, and logistical channels, we can extend our reach into this region laying the groundwork for future operations."
 Infiltrate_Vestergotland:0 "Infiltrate Västergötland"
 Infiltrate_Vestergotland_desc:0 "Västergötland stands as a crucial link in the chain of our growing influence. By penetrating local institutions and winning over key figures, we can destabilize opposition and solidify our presence along the southern corridor."
 Search_For_Al_Bagdadi:0 "Search for Al-Bagdadi in Azerbaijan"
 Search_For_Al_Bagdadi_desc:0 "Rumors have surfaced that Al-Bagdadi may be hiding somewhere within Azerbaijan. Our intelligence services must act quickly to locate him."
 Search_In_Azerbajan:0 "Initiating Search Operation in [AZR.GetNameWithFlag]"
 Search_In_Azerbajan_desc:0 "Based on unconfirmed reports, our operatives have begun searching for Al-Bagdadi in Azerbaijan, hoping to bring him to justice."
 SWE_Integrate_State:0 "Integrate [From.GetName]"
 Islamic_Caliphate:0 "A New Caliphate"
 Islamic_Caliphate_desc:0 "A New Caliphate\n\nWith the banner of unity raised high, the dream of a renewed Caliphate spreads across the lands. Through careful governance and spiritual guidance, we bring order to the chaos and convert provinces into loyal pillars of the Ummah. Once a state reaches §435% compliance§!, you can spend §Y50§! Political Power to §Gcore§! it permanently, integrating it into our eternal dominion."
 Decleare_Independence:0 "Declare Independence"
 Decleare_Independence_desc:0 "With the 'One Country, Two Systems' principle all but dead, the time has come to sever ties with Beijing and assert our full independence. This bold move will risk retaliation, but may be our only path to true freedom."
 Request_Macao:0 "Request the Transfer of Macao"
 Request_Macao_desc:0 "Once a fellow enclave under colonial rule, Macao now sits under Beijing's direct control. With momentum on our side, we may pressure or persuade its administration to join an independent Hong Kong peacefully or otherwise."
 Hong_Kong_decisions:0 "Hong Kong Under Beijing"
 Hong_Kong_decisions_desc:0 "Since the handover, Beijing's influence over Hong Kong has steadily increased. The promise of 'One Country, Two Systems' has eroded, replaced by surveillance, repression, and tight political control."
 Nordic_Council:0 "Nordic Council"
 Nordic_Council_desc:0 "Formed in the aftermath of the Second World War, the Nordic Council serves as a forum for cooperation between the nations of Northern Europe. As the world becomes increasingly uncertain, it may be time to strengthen our ties beyond words and meetings and take concrete steps toward Nordic unity."
 Invite_Norway:0 "Invite [NOR.GetNameWithFlag]"
 Invite_Denmerk:0 "Invite [DEN.GetNameWithFlag]"
 Invite_Finland:0 "Invite [FIN.GetNameWithFlag]"
 Invite_Iceland:0 "Invite [ICE.GetNameWithFlag]"
 Establish_Nordic_Bank:0 "Unified Nordic Banking"
