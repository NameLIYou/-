 Propose_Integration_To_Latvia:0 "Propose Integration With [LAT.GetNameWithFlag]"
 Propose_Integration_To_Estonia:0 "Propose Integration With [EST.GetNameWithFlag]"
 Propose_Integration_To_Denmark:0 "Propose Integration With [DEN.GetNameWithFlag]"
 Propose_Integration_To_Iceland:0 "Propose Integration With [ICE.GetNameWithFlag]"
 Propose_Integration_To_Finland:0 "Propose Integration With [FIN.GetNameWithFlag]"
 Propose_Integration_To_Norway:0 "Propose Integration With [NOR.GetNameWithFlag]"
 USA_Inflation:0 "Rising Inflation"
 USA_Inflation_desc:0 "Despite a growing economy, supply chain disruptions, high consumer demand, and global instability have led to a sharp increase in inflation. Prices are rising across the board—from groceries to gas squeezing American households. The administration must weigh its next steps carefully to avoid deeper economic pain."
 USA_Rising_Inflation:0 "Rising Infation"
 USA_Hike_Interest_Rates:0 "Hike Interest Rates"
 USA_Build_Back_Better_decisions:0 "Build Back Better Agenda"
 USA_Build_Back_Better_decisions_desc:0 "The Build Back Better Agenda is a comprehensive economic plan designed to rebuild the American economy after the COVID-19 pandemic. It includes sweeping investments in infrastructure, climate resilience, clean energy, healthcare, education, and family support."
 USA_Propose_The_Infrastructure_And_Jobs_Act:0 "Propose the Infrastructure and Jobs Act"
 USA_Propose_The_Infrastructure_And_Jobs_Act_desc:0 "We will introduce a sweeping legislative package aimed at rebuilding America's roads, bridges, public transit, and broadband infrastructure. This bill will serve as the backbone of our economic recovery, create millions of union jobs, and prepare our economy for a more sustainable future."
 USA_Boost_Domestic_Food_Production:0 "Boost Domestic Food Production"
 USA_Boost_Domestic_Food_Production_desc:0 "Support farmers with subsidies and machinery upgrades to stabilize food prices and ensure security."
 USA_Propose_The_CHIPS_Act:0 "Propose the CHIPS Act"
 USA_Propose_The_CHIPS_Act_desc:0 "We will propose legislation to bolster domestic semiconductor manufacturing, strengthen supply chains, and support scientific research. With global chip production heavily reliant on Taiwan, it is vital for our national security and economic stability to reduce dependence and bring production home."
 USA_Good_Paying_Jobs:0 "Create Good Paying Jobs"
 USA_Good_Paying_Jobs_desc:0 "By Creating Jobs We Will Mitigate The Effects Of Inflation"
