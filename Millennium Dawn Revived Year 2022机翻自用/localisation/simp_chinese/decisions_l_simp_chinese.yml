 SOV_General_Secretaris_office:0 "General Secretary’s Office"
 SOV_General_Secretaris_office_desc:0 "As the restored Soviet Union reasserts its global influence, the General Secretary’s Office becomes the nerve center for directing international strategy. From here, we can plan military interventions, orchestrate political integrations, and shape the course of our allies’ futures under Moscow’s leadership."
 SOV_Nuclear_Test_In_Siberia:0 "Conduct Nuclear Test in Siberia"
 SOV_Nuclear_Test_In_Siberia_desc:0 "By detonating a nuclear device in the remote Siberian test ranges, we can demonstrate our technological might to the world. Such a display will serve as both a warning to our adversaries and a reassurance to our allies of the Soviet Union’s enduring strength."
 SOV_Uzbek_SSR:0 "Integrate The Uzbek §RSSR§!"
 SOV_Uzbek_SSR_desc:0 "Integrate Uzbekistan as the Uzbek §RSSR§!, strengthening our control and bringing this vital region firmly into the Soviet fold."
 SOV_Kirghiz_SSR:0 "Integrate The Kirghiz §RSSR§!"
 SOV_Kirghiz_SSR_desc:0 "Incorporate Kyrgyzstan as the Kirghiz §RSSR§!, securing our influence in the mountainous heart of Central Asia."
 SOV_Turkmen_SSR:0 "Integrate The Turkmen §RSSR§!"
 SOV_Turkmen_SSR_desc:0 "Establish Turkmenistan as the Turkmen §RSSR§!, ensuring loyalty and stability in this key southern region."
 SOV_Tajik_SSR:0 "Integrate The Tajik §RSSR§!"
 SOV_Tajik_SSR_desc:0 "Form the Tajik §RSSR§! to consolidate Soviet authority and integrate the diverse peoples of this rugged territory."
 SOV_Kazakstan_SSR:0 "Integrate The Kazakh §RSSR§!"
 SOV_Kazakstan_SSR_desc:0 "Solidify Soviet power by transforming Kazakhstan into the Kazakh §RSSR§!, a cornerstone of our Central Asian strategy."
 SOV_Belarus_SSR:0 "Integrate the Belarus §RSSR§!"
 SOV_Belarus_SSR_desc:0 "The foundations of Soviet power have been restored in Belarus. By formally reintegrating the Belarusian Soviet Socialist Republic, we secure its economy, military, and people under Moscow’s direct leadership. Minsk shall once again be a steadfast bastion of socialism within our Union."
 SOV_CSTO_Decisions:0 "The CSTO"
 SOV_CSTO_Decisions_desc:0 "The Collective Security Treaty Organization remains one of our primary tools for maintaining influence across our sphere. By strengthening the security and stability of allied nations, we can ensure their continued alignment with our strategic interests."
 Rejuvenate_CSTO_In_Country:0 "Invest in §Y[FROM.GetAdjective]§! Security"
 Rejuvenate_CSTO_In_Country_desc:0 "By investing in the security apparatus of §Y[FROM.GetNameDef]§!, we can bolster their internal stability and deepen military cooperation. Such efforts will reinforce our influence while ensuring they remain firmly within our sphere."
 Colonial_Dream:0 "The Colonial Dream"
 Colonial_Dream_desc:0 "The Afrikaner state sets its sights on the entire African continent. Every nation to the north and east is a potential territory to bring under our control. The vision of an Afrikaans Africa is within our grasp, and our armies stand ready to expand our dominion."
 Afrikaans_Africa:0 "Afrikaaner Afrika"
 Invite_Nations:0 "Invite The§R[FROM.GetName]§!"
 African_Communism:0 "Union of African Communists"
 African_Communism_desc:0 "South Africa seeks to unite like minded communist nations across Africa under a single faction the Union of African Communists. By inviting other countries to join, the nation aims to expand its influence and forge a strong continental front against imperialism and capitalist powers."
 Unification:0 "Integration With §R[FROM.GetName]§!"
 PER_Presidential_Election:0 "Iranian Presidential Election"
 PER_Presidential_Election_desc:0 "The Next Iranian Presidential Election Will Be Held on §YJune 19 2025§!\n\n\§REarly election can happen were something were to happen to President Raisi...§!"
 Next_Presidential_Election:0 "Next Presidential Election"
