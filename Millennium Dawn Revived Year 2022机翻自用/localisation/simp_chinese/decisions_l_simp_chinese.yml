 PER_Decrease_Communism:0 "Restrict Communist Power"
 PER_Decrease_Democracy:0 "Curb Democratic Reach"
 PER_Pahlavi_Arrives_In_Tehran:0 "Pahlavi Returns From Exile"
 PER_First_Session_Meeting_Of_The_Provisional_Cabinet:0 "First Session of the Provisional Cabinet"
 PER_Second_Session_Meeting_Of_The_Provisional_Cabinet:0 "Second Session of the Provisional Cabinet"
 PER_First_Session_Meeting_Of_The_Provisional_Cabinet_desc:0 "The newly formed provisional cabinet convenes for its Second session"
 PER_Trade_Union_Strike:0 "Trade Union Strike"
 PER_Trade_Union_Strike_desc:0 "The trade unions have more and more influence and are ready to use it"
 PER_Boost_Democracy:0 "Speeches For Democracy"
 PER_Boost_Communism:0 "Collectevist Propaganda"
 PER_Boost_Monarchism:0 "Monarchist Propaganda"
 SYR_Unification_Decision:0 "Syrian Politics"
 SYR_Unification_Decision_desc:0 "The Syrian Civil War has shattered the state and divided the nation. With the fighting nearing its end, decisive political action will determine who truly rules Syria."
 SYR_End_Of_The_Civil_War:0 "End of the Civil War"
 SYR_End_Of_The_Civil_War_desc:0 "With the fighting over, the time has come to declare victory, dismantle rival claims, and restore order across the country."
 SYR_Integrate_Rojava:0 "Counqur Rojava"
 SYR_Form_The_Interim_Government:0 "Form An Interim Government"
 SYR_Greater_Syria:0 "Pursue Greater Syria"
 SYR_Greater_Syria_desc:0 "With Syria unified once more, the leadership turns its attention beyond the artificial borders imposed after the Great War. The vision of Greater Syria calls for the reunification of the Levant into a single state, restoring Syria’s historical, cultural, and strategic depth.\n\nTo pursue this ambition is to openly challenge the regional order and risk renewed conflict, but for its supporters, national revival demands nothing less."
 PER_Unify_Iran:0 "Unify Iran"
 PER_Unify_Iran_desc:0 "The fragmentation of Iran was not the result of a lack of legitimacy, but of a momentary collapse of authority. With the state reformed and order restored, the time has come to reverse the humiliation of disintegration. The rebellious territories must be brought back into the nation, through pressure, diplomacy, or force if necessary."
 PER_Demand_The_Return_Of_Kurdish_Territorries:0 "Demand the Return of Former Territories"
 PER_Demand_The_Return_Of_Kurdish_Territorries_desc:0 "Tehran will formally demand the return of territories it considers an inseparable part of Iran. The new authorities in the region are reminded that their separation was born of chaos, not legitimacy, and that Iran now possesses the will and capacity to enforce its claims."
 PER_Demand_The_Return_Of_Azeri_Territorries:0 "Demand the Return of Former Territories"
 PER_Demand_The_Return_Of_Azeri_Territorries_desc:0 "The Iranian government will issue a clear and uncompromising demand for the restoration of lands it regards as historically and legally Iranian. While framed as a diplomatic initiative, the message leaves little doubt that continued refusal will be interpreted as a hostile act."
 PER_Demand_The_Return_Of_Baluch_Territorries:0 "Demand the Return of Former Territories"
 PER_Demand_The_Return_Of_Baluch_Territorries_desc:0 "A formal demand will be delivered calling for the return of territories lost during Iran’s internal crisis. The government asserts that the question of these lands is non-negotiable and that failure to comply will force Iran to pursue more decisive measures."
 PER_Across_The_Gulf:0 "The Countries on the other side of the gulf are better served under us we will demand their submission"
 PER_Demand_Submission:0 "Demand The Submission of [FROM.GetNameWithFlag]"
 PER_Middle_East_Treaty_Organisation:0 "Middle East Treaty Organization"
 PER_Middle_East_Treaty_Organisation_desc:0 "Under Iran’s leadership, the Middle East Treaty Organization serves as a defensive alliance against regional instability and foreign subversion. Through diplomacy and shared security interests, Tehran seeks to unite friendly nations under a common strategic framework."
 PER_Invite_To_Faction:0 "Invite [FROM.GetNameWithFlag] into METO"
 PER_Expanded_Alliance:0 "Invite [FROM.GetNameWithFlag] into METO"
 PRK_Invasion_Of_The_South:0 "Our Invasion Of South Korea"
 PRK_Invasion_Of_The_South_desc:0 "We have launched the decisive campaign to reunify the Korean Peninsula. Our forces cross the border with unwavering determination, aiming to liberate the southern half of our homeland from decades of division and foreign influence. Every soldier, factory, and citizen contributes to the historic task of national restoration."
 All_Or_Nothing:0 "All Or Nothing"
 All_Or_Nothing_desc:0 "There is no middle ground. Victory must be total, and failure is unacceptable. We commit all resources—manpower, military, and logistics—to ensure that the campaign succeeds. History and destiny demand complete reunification under our control."
 Peace_Out_With_Foreign_Countries:0 "Peace With Foreign Powers"
 Peace_Out_With_Foreign_Countries_desc:0 ""
 Domestic_Policy:0 "Domestic Policy"
 Improve_Workers_Conditions:0 "Improve Worker's Conditions"
 War_Propaganda_On_Social_Media:0 "War Propaganda On Social Media"
 PER_The_Axis_Of_Resistance:0 "The Axis Of Resistance"
 PER_The_Axis_Of_Resistance_desc:0 " "
 PER_Invitation_To_The_Cause:0 "Invite §Y[FROM.GetNonIdeologyName]§! into The Resistance"
 PER_Invitation_To_The_Cause_desc:0 " "
 PER_Fund_Pro_Iran_Propaganda:0 "Pro Iranian Propaganda in §Y[FROM.GetNonIdeologyName]§!"
 PER_Fund_Pro_Iran_Propaganda_desc:0 "By covertly financing Islamist movements abroad, we can amplify their presence in the streets and strengthen their political influence. Though risky, such actions will help spread our ideology and undermine hostile regimes from within."
 PER_Instigate_Uprising:0 "Instigate an Uprising in §Y[FROM.GetNonIdeologyName]§!"
 PER_Instigate_Uprising_desc:0 "Through covert funding, training, and propaganda, Iran secretly supports local insurgents to destabilize hostile governments. These carefully orchestrated uprisings spread the regime’s influence while keeping direct involvement hidden."
 PER_Subjugate_Lesser_Members:0 "Take Over §Y[FROM.GetNonIdeologyNameDef]§! Foreign Policy"
 PER_Subjugate_Lesser_Members_desc:0 ""
 East_African_Federation:0 "East African Federation"
 East_African_Federation_desc:0 "The dream of a united East Africa has long been discussed by politicians, revolutionaries, and visionaries alike. From the shores of the Indian Ocean to the heart of the Great Lakes, our peoples share history, culture, and destiny. Now, with the region under our control, we have the opportunity to forge a single, powerful state that can stand strong on the world stage."
 Proclaim_East_African_Unity:0 "Proclaim East African Unity"
 Proclaim_East_African_Unity_desc:0 "With all key territories firmly under our control, the time has come to formally unite East Africa. By proclaiming the federation, we shall bring together diverse nations under one banner, ensuring stability, prosperity, and strength for generations to come. The world will witness the rise of a new regional power."
 Integrate_DRC:0 "Integrate the DRC"
 Integrate_DRC_desc:0 "With the Democratic Republic of Congo under our influence, we now have the chance to formally incorporate it into the East African Federation. Doing so will expand our territory, resources, and strategic depth, but will also require careful management of local politics and infrastructure to ensure stability."
 Integrate_Somalia:0 "Integrate Somalia"
 Integrate_Somalia_desc:0 "Somalia, with its strategic position on the Horn of Africa, is now ready to be formally integrated into the East African Federation. Bringing this nation into the fold will strengthen our influence over the region, expand our coastal access, and solidify unity among East African nations."
 PER_Sanctions_No_More:0 "Sanctions No More"
 PER_Sanctions_No_More_desc:0 "Years of economic pressure have strained our economy and limited our global reach. Through careful diplomacy, alternative financial networks, and strategic resilience, we can begin to break free from the constraints imposed upon us. The time has come to assert our economic sovereignty and move beyond the era of sanctions."
 PER_Sell_Wepons_To_Russia:0 "Sell Weapons to Russia"
 PER_Sell_Wepons_To_Russia_desc:0 "As global tensions intensify and conflicts reshape the international order, new opportunities for military cooperation arise. By supplying arms to Russia, we can secure valuable revenue and strengthen ties with a major power, though such actions may further antagonize Western nations."
 PER_Increase_Trade_With_China:0 "Increase Trade with China"
 PER_Increase_Trade_With_China_desc:0 "With traditional markets restricted, China offers a vital economic lifeline. Expanding trade relations with Beijing allows us to bypass Western pressure, ensuring continued growth and access to critical goods while deepening our position within emerging global economic networks."
 PER_Sanctions_Circumvention:0 "Sanctions Circumvention"
 PER_Sanctions_Circumvention_desc:0 "Despite mounting restrictions, global trade is not easily contained. Through covert networks, intermediary states, and innovative financial channels, we can continue to move goods and resources beyond the reach of sanctions. Such efforts will sustain our economy, though they carry inherent risks."
 Kashmir_Conflict:0 "Kashmir Conflict"
 Kashmir_Conflict_desc:0 "The long dispute over Kashmir remains a volatile flashpoints in the world. Claimed by both India and Pakistan, the region has been the source of repeated wars, border skirmishes, and ongoing unrest. Any action taken here risks rapid escalation into a wider conflict, potentially drawing in allies and destabilizing the region."
 Start_A_Border_Conflict:0 "Star A Border War"
 Implementation_Of_The_Curch_Demands:0 "Implement the Church’s Demands"
 Implementation_Of_The_Curch_Demands_desc:0 "The Orthodox Church has made its expectations clear. If we are to secure its full backing, we must act decisively and align state policy with its vision. Failure to do so risks losing a key pillar of legitimacy, while success will ensure its continued support."
 Mandetory_Church_Attendance_Onece_A_Year:0 "Mandatory Church Attendance"
 Mandetory_Church_Attendance_Onece_A_Year_desc:0 "To reinforce faith and unity, citizens will be required to attend church at least once a year. This measure strengthens the role of religion in daily life and signals our commitment to traditional values."
 Christian_Teachings_In_Schools:0 "Christian Teachings in Schools"
 Christian_Teachings_In_Schools_desc:0 "Education must reflect the moral and spiritual foundation of the nation. By introducing Christian teachings into schools, we ensure that future generations are raised with discipline, faith, and a clear sense of identity."
 Ban_Homosexuality:0 "Ban Homosexuality"
 Ban_Homosexuality_desc:0 "In line with traditional values and the expectations of the Orthodox Church, laws will be enacted to prohibit homosexuality. This policy is presented as a step toward moral order and societal stability."
 SOV_Support_From_The_Curch:0 "Deal With Kirill"
 SOV_Support_From_The_Curch_desc:0 "After the recent upheaval, our position remains uncertain and many question the new order. To strengthen our legitimacy, we have approached the Orthodox Church and its leadership, seeking their backing. If we are willing to meet their demands, they may provide the moral authority and public support needed to stabilize our rule."
 SOV_Root_Out_Muslim_Opposition:0 "Muslim Opposition"
 SOV_Root_Out_Muslim_Opposition_desc:0 ""
 Battle_Rebels:0 "Battle Rebels In §Y[From.GetName]§!"
 Peace_Out_Chineese_Perspective:0 "Propose Peace to Russia"
 Peace_Out_Chineese_Perspective_desc:0 "With the war developing in our favour, we can offer Russia a settlement to end the conflict and secure recognition of our gains in Outer Manchuria."
 Peace_Out_Russian_Perspective:0 "Propose Peace to China"
 Peace_Out_Russian_Perspective_desc:0 "Our forces hold the advantage in Manchuria, we can propose a settlement to China in exchange for formal recognition of our control over the region."
 Russo_Chineese_War:0 "Russo-Chinese War"
 Russo_Chineese_War_desc:0 "Open conflict has erupted between Russia and China over control of Manchuria and surrounding Far Eastern territories. What began as border tensions has escalated into a full-scale war, with both sides committing significant military forces to the region."
 SOV_Demand_Ortodox_Churches_Submit:0 "Demand Ortodox Churches Submit"
 SOV_Demand_Church_Submission:0 "Demand The Submission of §Y[FROM.GetNonIdeologyName]§!"
 SOV_Demand_Hagia_Sofia:0 "Demand The §YHagia Sofia§!"
 SOV_Demand_Hagia_Sofia_desc:0 "With Anatolia under our controll we will take over the city of Istanbul and it's crown jewl Hagia Sofia"
