 PER_Boost_Hardliners:0 "Boost The §iHardliner§! Faction"
 PER_Reform_The_Beurecracy:0 "Reform The Beurecracy"
 PER_Transitional_Government_Decisions:0 "The Transitional Government"
 PER_Transitional_Government_Decisions_desc:0 "The Islamic Republic has collapsed. A transitional government now struggles to hold the nation together.\n\n§mMonarchists§!:\nOnce loyal to the Shah, they seek to restore the monarchy and reclaim influence over the country.\n\n§2Democrats§!:\nEmerging from the pro-reform and pro-republic movements, they aim to establish a representative government.\n\n§eCommunists§!:\nLong suppressed under the Shah and the Islamic Republic, they now seek to expand their revolutionary influence.\n\n§mMonarchist infuence§!: [GetMonarchistLevel]\n§2Democratic infuence§!: [GetDemocraticLevel]\n§eCommunist infuence§!: [GetCommunistLevel]"
