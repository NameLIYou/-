l_simp_chinese:
 SOV_military_exercice:0 "Military Build Up on the Ukrinian Border"
 SOV_military_exercice_desc:0 "Our forces gather on the Ukrainian border, cloaked under the guise of military exercises. But the world knowsthis is the calm before the storm. The machine of war prepares to roll forward, and Ukraine's fate is sealed."
 SOV_recognize_the_separatist_republics:0 "Recognize the Separatist Republic"
 SOV_recognize_the_separatist_republics_desc:0 "The people of Donetsk and Luhansk have fought for their independence for years. Now, we will give them the recognition they deserve, formalizing their status as independent republics under Russia's protective hand."
 SOV_plan_the_invasion:0 "Plan the Invasion"
 SOV_plan_the_invasion_desc:0 "Plans are drawn, strategies set, and forces in place. The time to act is near. We shall strike swiftly and decisively, breaking the will of Ukraine before they can even mount a defense."
 SOV_launch_the_special_operation:0 "Launch The Special Military Operation"
 SOV_launch_the_special_operation_desc:0 "The operation begins. With precision and overwhelming force, we invade, catching the enemy off guard and pushing through their lines with brutal efficiency. There is no turning back now."
 SOV_Success:0 "Victory in Ukraine"
 SOV_Success_desc:0 "Victory has been achieved. Ukraine is broken, and we stand in control of its fate. Our forces have triumphed, and the once defiant nation is now a shadow under the Russian flag."
 SOV_Triumphant_Blitz:0 "Triumphant Blitz"
 SOV_Triumphant_Blitz_desc:0 "A swift, unrelenting attack has shattered Ukraine's defenses. The speed of our victory is unmatched, and the enemy crumbles beneath the weight of our forces. We are unstoppable."
 SOV_Reorganize_Ukraine:0 "Reorganize Ukraine"
 SOV_Reorganize_Ukraine_desc:0 "With Ukraine in our grasp, we begin the painful process of restructuring its shattered state. The old regime is gone, and in its place, we will establish a new order, one that answers to Moscow."
 SOV_progress:0 "Gains in Ukraine"
 SOV_progress_desc:0 "Our forces continue to advance, carving through Ukraine's defenses. Though resistance persists but with every passing day, victory draws closer."
 SOV_mobalization_order:0 "Mobilisation Order"
 SOV_mobalization_order_desc:0 "The call to arms has been made, and every eligable citicen is at rist of conscription. Yet, the orders will not be welcomed resistance grows, and discontent spreads like wildfire. This will be an unpopular decision, one that will see many resent the cost of war. But the Motherland demands sacrifice, and there is no turning back."
 SOV_failure:0 "Defeat in Ukraine"
 SOV_failure_desc:0 "The operation has failed. Our forces have faltered, and our ambitions lay in ruins. Ukraine stands defiant, and our enemies grow bolder by the day. The dreams of a quick victory are gone."
 SOV_humiliaton_in_defeat:0 "Humiliation in Defeat"
 SOV_humiliaton_in_defeat_desc:0 "We have suffered a crushing defeat. Our retreat is marked by disgrace, and the world watches as we stagger back in humiliation. Russia has been brought low, and our enemies gloat."
 SOV_question_the_leadership:0 "The Man at the Helm"
 SOV_question_the_leadership_desc:0 "Putin’s aura of invincibility has shattered. The defeat in Ukraine has exposed his regime’s weaknesses, and now, even those closest to him turn away. The siloviki whisper, the oligarchs plot, and the people seethe. With no way to restore control, the Kremlin is thrown into chaos, and the inevitable happensVladimir Putin is ousted. But with power up for grabs, Russia’s future is anything but certain."
 SOV_law_agains_protests:0 "War Censorship Laws"
 SOV_law_agains_protests_desc:0 "The voices of dissent grow louder, and they must be silenced. We will enact stringent laws to quash any opposition to the war and ensure that no voice weakens the resolve of the nation."
 SOV_secure_power:0 "Consolidate Power"
 SOV_secure_power_desc:0 "To maintain control in this fractured time, the state must enforce its will with ironclad authority. Surveillance permeates every corner of society, dissent is crushed before it can spread, and the threat of punishment looms over all. The people may fear, but they obey, for in this new Russia, power is absolute, and any challenge to it will be swiftly extinguished."
 SOV_Annexation_Treaty:0 "Organize Occupied Ukraine"
 SOV_Annexation_Treaty_desc:0 "We have to reorganize our occupied territorris. The region now belongs to Russia, forever to be ruled from Moscow."
 SOV_A_Growing_Economy_Under_Sanctions:0 "A Growing Economy Under Sanctions"
 SOV_A_Growing_Economy_Under_Sanctions_desc:0 "Even as the world attempts to strangle us with sanctions, our economy grows stronger. Resourcefulness and resilience fuel our industries, and we thrive despite the odds. The West may try to weaken us, but we stand defiantprosperity in the face of adversity."
 SOV_knock_off_brands:0 "Domestic Alternatives"
 SOV_knock_off_brands_desc:0 "With Western sanctions cutting off access to global consumer brands, our domestic producers have stepped up sort of. From 'Pipsi' to 'Adibas', a wave of locally produced substitutes is flooding the shelves. It may not be glamorous, but it's ours and it gets the job done."
 SOV_Sanctioned_Economy:0 "Choked by Sanctions"
 SOV_Sanctioned_Economy_desc:0 "The noose of economic sanctions tightens with every passing day. Cut off from international trade and investment, our industries falter and the people grow restless. Without decisive action, this pressure could cripple the nation."
 SOV_Kickstart_Our_Wepon_Production:0 "Kickstart Wepon Production"
 SOV_Kickstart_Our_Wepon_Production_desc:0 "Kickstart Wepon Production"
 SOV_legalize_political_parties:0 "Opening Up The Political Sphere"
 SOV_legalize_political_parties_desc:0 "For decades, Russia’s political landscape has been tightly controlled. Now, for the first time in generations, true opposition parties will be allowed to operate freely. A new era beginsbut not everyone welcomes it."
 SOV_unleash_the_campaigns:0 "The Campaign Storm"
 SOV_unleash_the_campaigns_desc:0 "With political parties now legal, the streets fill with slogans, rallies, and debates. Reformists call for democracy, nationalists demand strength, and the communists promise a return to order. The battle for Russia’s soul has begun."
 SOV_the_election_of_a_lifetime:0 "The Duma Elections"
 SOV_the_election_of_a_lifetime_desc:0 "Millions of Russians head to the polls in a historic election. For the first time in decades, the Duma is free from Putin's grip. This election will decide whether Russia moves towards reform or returns to the old regime."
 SOV_the_duma_asserts_control:0 "The Duma Seizes Power"
 SOV_the_duma_asserts_control_desc:0 "For decades, the Duma has been crushed under Putin’s iron fist. Since the 1990s, it has struggled for relevance. Now, with Putin gone, it asserts itself as the rightful power in Russia, vowing to guide the country toward a more democratic futureor risk sinking into more chaos."
 SOV_democratic_coalition:0 "§3Coalition of Democrats§!"
 SOV_democratic_coalition_desc:0 "With the Communist Party holding the plurality, a coalition of democratic forces has been formed to steer Russia away from authoritarianism. Tensions are high as these unlikely partners must navigate their differences to hold the fragile coalition together."
 SOV_new_constitution:0 "A New Constitution"
 SOV_new_constitution_desc:0 "Russia stands at a crossroads. With the old regime in ruins, the nation must rebuild its legal and political foundations. The new constitution will reflect the future of Russiawhether it embraces democracy or adopts a more authoritarian, Marxist approach. The path forward is uncertain, and the choices made here will define Russia's future for generations to come."
 SOV_Liberals:0 "The Center"
 SOV_Liberals_desc:0 "The Center have formed a coalition with promises to alligne Russia more with Europe"
 SOV_Social_Democrats:0 "The Left"
 SOV_Social_Democrats_desc:0 "The Left have formed a coalition. The plans for the coalition include building Russia into a prospering social democracy"
 SOV_Conservatives:0 "The Right"
 SOV_Conservatives_desc:0 "The Right have formed a coalition and aim to focus on Russias Economy"
 SOV_fighting_the_oligarchs:0 "Fighting the Oligarchs"
 SOV_fighting_the_oligarchs_desc:0 "The oligarchs have exploited Russia for too long, hoarding wealth and power while the people suffer. If we are to build a true democracy, their influence must be dismantled once and for all."
 SOV_freedom_of_speech:0 "Strenghten Freedom Of Speech"
 SOV_freedom_of_speech_desc:0 "After regaining our democracy and fall of the Putin regime we have gained our freedom of speech back, this core institution has to be strenghtened in order to keep our democracy."
 SOV_Siberia_infrastructure:0 "Building Siberian Infrastructure"
 SOV_Siberia_infrastructure_desc:0 "Decades of corruption and mismanagement have left our infrastructure crumbling. We must invest in roads, railways, and digital networks to support economic growth and improve the lives of our citizens."
 SOV_navalnys_vision:0 "Navalny's Vision for Russia"
 SOV_navalnys_vision_desc:0 "Alexei Navalny has been at the forefront of Russia's democratic revolution. His vision for a free and just Russia is one where corruption is eradicated, the rule of law is upheld, and the voice of the people is heard. Under his leadership, we can achieve a truly democratic, social Russia."
 SOV_navals_anti_corruption_campaign:0 "Anti Corruption Campaign"
 SOV_navals_anti_corruption_campaign_desc:0 "Alexei Navalny has been the champion of fighting corruption in Russia. By exposing the ties between politicians and oligarchs, he has shown the country the depths of the corruption plaguing the nation. It is time to put an end to it once and for all."
 SOV_national_health_program:0 "National Health Program"
 SOV_national_health_program_desc:0 "A healthy population is the cornerstone of a prosperous society. We will invest in universal healthcare to ensure that every Russian citizen has access to medical care, no matter their background or income."
 SOV_backroom_deals_with_oligarchs:0 "Backroom Deals with the Oligarchs"
 SOV_backroom_deals_with_oligarchs_desc:0 "To ensure stability and maintain economic power, we must strike a deal with the oligarchs. In exchange for their loyalty, we will grant them greater influence over key sectors of the economy, securing their support for the state’s long term vision."
 SOV_natural_resources_exploitation:0 "Exploitation of Natural Resources"
 SOV_natural_resources_exploitation_desc:0 "Russia is rich in natural resources, including vast oil reserves, gas, and minerals. By fully exploiting these resources, we will boost our economy, increase energy exports, and secure our place as an energy superpower on the global stage."
 SOV_national_economic_boost:0 "National Economic Boom"
 SOV_national_economic_boost_desc:0 "With our strategic investments, control over key sectors, and expansion into neighboring regions, Russia is entering an era of unprecedented economic growth. By harnessing our vast natural resources, modernizing infrastructure, and securing a dominant position in global markets, we will become the undisputed economic powerhouse of Eastern Europe."
 SOV_rejoin_the_world_community:0 "Rejoin the World Community"
 SOV_rejoin_the_world_community_desc:0 "After years of isolation and strife, Russia must now rebuild its international reputation. Rejoining the world community will not only heal the wounds of the past but also open the doors for economic aid, diplomatic alliances, and security guarantees. However, old rivals may not easily forget Russia’s recent history, and our re entry will be met with both hope and skepticism."
 SOV_communist_plurality:0 "§RMarxist President§!"
 SOV_communist_plurality_desc:0 "In a stunning victory, the Communists have secured the plurality in the Duma. The ruling elite is shaken, and the stage is set for a new era of Soviet revival. Yet, the nation’s future remains uncertain."
 SOV_remember_the_union:0 "Remember the Union"
 SOV_remember_the_union_desc:0 "The Soviet Union once united us in friendship and workers' power. Its collapse and our defeat in Ukraine have left deep scars. It’s time to remember what was lost and understand why the USSR fell."
 SOV_29th_congress_of_the_communist_party:0 "§R29th Congress of the Communist Party§!"
 SOV_29th_congress_of_the_communist_party_desc:0 "The Duma is irrelevant, a relic of bourgeois politics but we have used it to our advantage. Our Communist MPs have paved the way for true power. Now, they are summoned to the 29th Party Congress, where the fate of our movement will be decided. A new General Secretary will be chosen, and with them, the future of the revolution."
 SOV_Re_Itterate_The_Territorrial_Integerity_Of_Russia:0 "Reiterate Russia's Territorial Integrity"
 SOV_Re_Itterate_The_Territorrial_Integerity_Of_Russia_desc:0 "The chaos following the coup has encouraged foreign powers to question Russia's ability to defend its territory. We must make it unmistakably clear that Kaliningrad remains Russian territory and that any attempt to seize it will be met with resistance."
 SOV_Strenghten_The_Army:0 "Strenghten the Army"
 SOV_Strenghten_The_Army_desc:0 "Victory demands more than bravery, it demands strength in numbers, discipline in command, and steel in the field. With the world watching and threats looming on all fronts, we must reinforce our military structure, modernize our divisions, and ensure that every soldier of the Motherland stands ready for the next challenge."
 SOV_Strategic_focus:0 "Back on the world stage"
 SOV_Strategic_focus_desc:0 "With Ukraine subdued and the West forced to acknowledge our dominance, it is time to look beyond the immediate battlefield. Russia stands at the crossroads of continents  a power not confined to one sphere. From Europe’s crumbling alliances to the restless Middle East and the rising empires of Asia, the world is ripe with opportunity. It is now up to us to decide: where will the Bear strike next?"
 SOV_Europe:0 "Focus on Europe"
 SOV_Europe_desc:0 "Europe is fractured divided by arrogance, decaying alliances, and false ideals. With NATO exposed and the European Union paralyzed, a power vacuum looms in the East. Russia must step forward not just as a neighbor, but as the force that redefines the continent's balance. Through influence, pressure, and strength, we shall ensure that the future of Europe is written in Cyrillic."
 SOV_South:0 "Focus on the South"
 SOV_South_desc:0 "To our south lies a region in constant flux with unstable regimes, proxy wars, and vast energy reserves waiting to be controlled. From the turbulent Caucasus to the oil rich Middle East, our influence must spread like wildfire. With the West distracted and regional powers fractured, Russia has the chance to become the unchallenged arbiter of the South."
 SOV_Asia:0 "Focus on Asia"
 SOV_Asia_desc:0 "As the Western world clings to its crumbling order, the future is being forged in the East. Asia is a continent of rising giants, ancient rivalries, and untapped power. Russia must secure its eastern frontier, dominate Central Asia, and stake its claim in the Pacific sphere. From Beijing to Delhi, from the Steppes to the Sea of Japan  the Bear watches, and the East shall feel its presence."
 SOV_Union_State:0 "The Union State"
 SOV_Union_State_desc:0 "The dream of a united Slavic and post Soviet power is no longer a fading echo. The time has come to rebuild what was torn apart, to forge a new empire where the former Soviet states will stand together as one. Through strength, unity, and mutual interests, the Union State shall rise, driven by Russian leadership, military might, and a shared destiny."
 SOV_Moldova:0 "The Moldovan Question"
 SOV_Moldova_desc:0 "Moldova has long been a battleground of influence, caught between East and West, its fate hanging in the balance. Now, the time has come for us to decide its future."
 SOV_Union_State_Integrate:0 "Integrate Belarus"
 SOV_Union_State_Integrate_desc:0 "With Minsk firmly under our controll, the next step remains to make Belarus truly a part of the motherland"
 SOV_Control_Inflation:0 "Stabilize the Ruble"
 SOV_Control_Inflation_desc:0 "With the cost of war and sanctions mounting, inflation has begun to erode the purchasing power of ordinary Russians. It is imperative that we take decisive steps to control price surges, stabilize the ruble, and restore confidence in our economic stewardship."
 SOV_Expand_Ural_Industry:0 "Expand Industry in the Urals"
 SOV_Expand_Ural_Industry_desc:0 "The Ural region has long served as the industrial heartland of Russia, safely nestled behind natural defenses. By investing in its factories and infrastructure, we can secure our production lines far from prying Western eyes and build a wartime economy that endures."
 SOV_Trade_With_China:0 "Strengthen Ties with China"
 SOV_Trade_With_China_desc:0 "As Western sanctions tighten, our partnership with China becomes ever more critical. Expanding trade routes, energy deals, and technological cooperation with Beijing will help stabilize our economy and secure vital imports."
 SOV_Work_Imigration:0 "Workforce Immigration Drive"
 SOV_Work_Imigration_desc:0 "With the domestic population under strain and entire sectors facing labor shortages, we must open our borders selectively to skilled and semi skilled workers from friendly nations. A new wave of foreign labor will help sustain our industrial and infrastructural development."
 SOV_Expand_Naval_Base_Murmansk:0 "Expand the Murmansk Naval Base"
 SOV_Expand_Naval_Base_Murmansk_desc:0 "Murmansk remains one of our most strategically vital ports, offering year round access to the Arctic and Atlantic. Expanding its naval facilities will strengthen our northern fleet and enhance our ability to project power in the region."
 SOV_Authority_Over_Commerce:0 "Strengthen Control Over Commerce"
 SOV_Authority_Over_Commerce_desc:0 "To ensure the stability of our economy, we must take decisive control over trade and commerce. By centralizing authority, regulating imports and exports, and overseeing key industries, we can secure our resources and maintain economic power."
 SOV_Renew_Immigration_Drive:0 "Renew Immigration Drive"
 SOV_Renew_Immigration_Drive_desc:0 "In the aftermath of conflict, the revitalization of our workforce is crucial. By encouraging immigration from neighboring regions, we can bolster our labor force, accelerate industrial development, and strengthen the nation."
 SOV_Expand_Moscow_Industry:0 "Expand Moscow Industry"
 SOV_Expand_Moscow_Industry_desc:0 "Moscow, as the heart of our nation, must be transformed into an industrial powerhouse. By expanding key factories, improving infrastructure, and boosting technological research, we will cement our capital's position as the engine of our economic resurgence."
 SOV_Diplomatic_Focuse:0 "Diplomatic Focus"
 SOV_Diplomatic_Focuse_desc:0 "We are a wast country and need to focus on all all parts of the world"
 SOV_Wagner_Rebelion:0 "Wagner Rebellion"
 SOV_Wagner_Rebelion_desc:0 "The Kremlin has betrayed its own warriors, using them and discarding them. Prigozhin will no longer stay silent. Moscow is rotting from the inside and now, we march to end the corruption and hold the traitors accountable."
 SOV_Russia_Air_Force:0 "Modernize the Air Force"
 SOV_Russia_Air_Force_desc:0 "To secure dominance over our vast skies and project power beyond our borders, the Russian Air Force must be brought into the 21st century. Upgraded aircraft, improved logistics, and new doctrines will ensure our air superiority in any future conflict."
 SOV_Special_Forces:0 "Expand Special Forces"
 SOV_Special_Forces_desc:0 "In modern warfare, small elite units can achieve what armies cannot. We will expand and equip our special forces to strike swiftly, operate deep behind enemy lines, and carry out high risk missions that conventional forces cannot handle. The future of asymmetric warfare belongs to them."
 SOV_Increase_Military_Budget:0 "Increase the Military Budget"
 SOV_Increase_Military_Budget_desc:0 "In the face of growing threats and mounting geopolitical pressure, the time has come to significantly expand our defense spending. By allocating more resources to the armed forces, we will strengthen our military industrial base and ensure our readiness for any conflict ahead."
 SOV_Integrate_Back_Ukraine:0 "Ukraine No More"
 SOV_Integrate_Back_Ukraine_desc:0 "Ukraine has stabilized under our firm leadership. The time has come to formally reintegrate this artificial state back into the Russian sphere as it always should have been."
 SOV_Military_Agression_Against_The_Baltics:0 "Crush the Baltic States"
 SOV_Military_Agression_Against_The_Baltics_desc:0 "The so called 'Baltic States' have long been a thorn in our side tiny nations clinging to Western delusions of sovereignty and freedom, propped up by foreign influence. Their militaries are weak, their governments corrupt, and their people misled. It is time to end the charade. Through decisive military action, we will restore order and reassert Russian dominance over this historic frontier."
 SOV_Spread_Russian_Propaganda_In_The_Baltics:0 "Flood the Baltics with Russian Propaganda"
 SOV_Spread_Russian_Propaganda_In_The_Baltics_desc:0 "The Baltic populations have been brainwashed by decades of Western lies, NATO rhetoric, and anti Russian hysteria. It is time to pierce their bubble of misinformation. Through television, radio, internet campaigns, and well placed agents, we will awaken the Russian speaking minorities and sow doubt in the hearts of the rest."
 SOV_Bring_Back_The_Traitor_Slavs:0 "Crush The Traitorous Slavs"
 SOV_Bring_Back_The_Traitor_Slavs_desc:0 "Poland once a brotherly Slavic nation has long since sold its soul to the West. Hiding behind NATO and EU slogans, it defies its roots and history. But no amount of Western posturing can change geography or blood. We will expose their false independence, destabilize their regime, and, when the time is right, bring them back into the rightful sphere of Slavic unity under our leadership."
 SOV_Ethnic_Russians_In_Kazakstan:0 "Liberate Ethnic Russians in Kazakhstan"
 SOV_Ethnic_Russians_In_Kazakstan_desc:0 "Kazakhstan's betrayal of the Russian sphere will not go unchallenged. Ethnic Russians suffer under an increasingly hostile and nationalist regime that forgets the debt it owes to our shared Soviet legacy. We will not sit idly by as our people are treated as second class citizens. The time has come to raise our voice, to assert our influence, and if necessary to use force to secure the future of ethnic Russians in the region."
 SOV_Georgian_Breakaway_States:0 "Reassert Control Over The Breakaway Regions"
 SOV_Georgian_Breakaway_States_desc:0 "The self governing regions of Abkhazia and South Ossetia were never truly sovereign. They exist only through our protection and owe their continued survival to our support. It is time to take the next step. Through political maneuvers or direct action, we will bring these territories back into our direct sphere of control. Their fate is no longer a question only a matter of timing."
 SOV_Finish_What_Begun_In_2008:0 "Finish What We Began in 2008"
 SOV_Finish_What_Begun_In_2008_desc:0 "The Georgian aggression in 2008 was answered decisively, but incompletely. Our influence remains limited, and the West continues to meddle in Tbilisi. It is time to conclude what was left unfinished. Georgia must be taught a final lesson, and their reckless ambition brought to heel once and for all. This time, there will be no half measures."
 SOV_Honor_The_Troops:0 "Honor The Troops"
 SOV_Honor_The_Troops_desc:0 "Public ceremonies are held to recognize military personnel involved in the campaign. The state emphasizes discipline, service, and the role of the armed forces in achieving victory."
 SOV_Stamp_Out_Anti_Putin_Voices:0 "Stamp Out Anti Putin Voices"
 SOV_Stamp_Out_Anti_Putin_Voices_desc:0 "Security agencies expand efforts to restrict organized opposition and limit public criticism of the government. Media oversight and legal pressure are increased."
 SOV_Nuclear_Test:0 "Open Air Nuclear Test"
 SOV_Nuclear_Test_desc:0 "A scheduled nuclear test is carried out at a designated test site to confirm system readiness and reinforce strategic deterrence."
 SOV_Visit_Kiev:0 "Tour Novorossiya"
 SOV_Visit_Kiev_desc:0 "Officials travel through newly controlled territories to assess administrative control and demonstrate central government presence in the region."
 SOV_periphery:0 "The Periphery"
 SOV_periphery_desc:0 "Our attension should shifts toward regions outside the close political and economic centers around us."
 SOV_CSTO:0 "The CSTO"
 SOV_CSTO_desc:0 "The [SOV.GetFactionName] was meant to be our answer to NATO, a union of post Soviet states bound by defense and cooperation. For too long, however, it has been dormant, toothless, and ignored. We will now breathe new life into the [SOV.GetFactionName]."
 SOV_Closer_Ties_With_Iran:0 "Closer Ties With Iran"
 SOV_Closer_Ties_With_Iran_desc:0 "In a world increasingly divided, Iran stands as a valuable partner against Western hegemony. By strengthening our economic, military, and strategic cooperation with Tehran, we can ensure mutual support on the global stage, expand our influence in the Middle East, and undermine American interests in the region."
 SOV_Closer_Ties_With_Syr:0 "Closer Ties With Syria"
 SOV_Closer_Ties_With_Syr_desc:0 "Syria has long been a loyal ally in the Middle East. By deepening our political and military cooperation with Damascus, we can secure strategic access to the region, project power into the Mediterranean, and reinforce our position as a global counterweight to Western influence."
 SOV_Merge_The_Alliance_With_China:0 "Merge the Alliance With China"
 SOV_Merge_The_Alliance_With_China_desc:0 "With our shared opposition to Western hegemony and aligned geopolitical interests, merging our alliance with the People's Republic of China is the next logical step. A unified front between Moscow and Beijing will shift the global balance of power and present an unbreakable bloc across Eurasia."
 SOV_Closer_Ties_With_Syr_alt:0 "Reconnect With the New Syrian Government"
 SOV_Closer_Ties_With_Syr_alt_desc:0 "With the departure of Bashar al Assad, Syria has entered a new political era. While the landscape may have shifted, our interests in the region remain unchanged. It is imperative that we establish channels of dialogue and cooperation with the new leadership to ensure continued influence and safeguard our strategic foothold in the Middle East."
 SOV_Absorb_Leftist_Parites:0 "Absorb Leftist Parites"
 SOV_Absorb_Leftist_Parites_desc:0 "Absorb Leftist Parites"
 SOV_Revive_The_Sleeping_Union:0 "Revive The §RUnion§!"
 SOV_Revive_The_Sleeping_Union_desc:0 "Revive The Union"
 SOV_Democratic_Centralism:0 "Democratic Centralism"
 SOV_Democratic_Centralism_desc:0 "We reaffirm the principle of democratic centralism. The system that balances open debate with unified action. This focus strengthens party discipline and streamlines decision making to ensure the Soviet Union moves forward as one."
 SOV_General_Secretarys_Office:0 "Office of the General Secretary"
 SOV_General_Secretarys_Office_desc:0 "The Office of the General Secretary consolidates political power and coordinates the USSR’s domestic and foreign policies. It serves as the command center for our strategic initiatives, enabling decisive leadership on the world stage."
 SOV_Iranian_Azerbajan:0 "Reclaim Iranian Azerbaijan"
 SOV_Iranian_Azerbajan_desc:0 "Iranian Azerbaijan, once under Russian control before the First World War and briefly again in 1946, remains a region of strategic and cultural importance. With instability brewing in the region, now is the time to reassert our historical claim and bring it back into our sphere of influence."
 SOV_Sway_Turkey:0 "Sway Turkey"
 SOV_Sway_Turkey_desc:0 "Russia and Turkey share a long and complex history. From Russian control over key Turkish regions before the First World War to our influence over the Straits in 1946, our paths have often crossed in contention and cooperation. Now, with shifting global dynamics, we have the opportunity to sway Turkey to our side. Whether through diplomatic pressure or shared interests, we will attempt to pull Turkey away from NATO  and perhaps even into the CSTO. At the very least, we aim to gain military access or cooperation that can serve our strategic interests."
 SOV_Azerbajan:0 "March on Baku"
 SOV_Azerbajan_desc:0 "Azerbaijan was once an integral part of the Soviet Union, and its energy rich lands remain vital to our strategic interests. With instability on the rise and the geopolitical climate shifting, now is the time to act. By asserting our power over Baku, we can re establish control over the Caucasus and send a clear message: the Russian bear does not forget its former dominion."
 SOV_Turkmenistani_Allies:0 "Turkmenistani Allies"
 SOV_Turkmenistani_Allies_desc:0 "Unlike many of its neighbors, Turkmenistan never embraced democracy after the fall of the Soviet Union. It remained under authoritarian rule, with strongman politics defining its leadership for decades. This continuity provides an opportunityan ideological and strategic bridge we can exploit. By strengthening our influence in Ashgabat, we can reinforce our presence in Central Asia and ensure that Turkmenistan remains firmly aligned with Moscow."
 SOV_Demand_Kazach_Subjugation:0 "Subjugate Kazakstan"
 SOV_Demand_Kazach_Subjugation_desc:0 "Kazakhstan's independence was tolerated during the chaos of the early 1990s, but that tolerance has now expired. With our renewed strength and strategic need for control over Central Asia, it is time to remind Astana of its place. We will offer them a choice: peaceful integration into our sphere as a subordinate allyor face the consequences of defiance."
 SOV_Integrate_Kazakstan:0 "Reincorporate Kazakhstan"
 SOV_Integrate_Kazakstan_desc:0 "Kazakhstan's independence was tolerated during the chaos of the early 1990s, but that tolerance has now expired. With our renewed strength and strategic need for control over Central Asia, it is time to remind Astana of its place. We will offer them a choice: peaceful integration into our sphere as a subordinate allyor face the consequences of defiance."
 SOV_Uzbeck_Invasion:0 "Invasion of Uzbekistan"
 SOV_Uzbeck_Invasion_desc:0 "Following years of unrest and instability, Russia moves to bring Uzbekistan back under its control. The campaign aims to restore order, secure vital resources, and unify Central Asia under one banner."
 SOV_Integrate_The_CSTO_Members_In_Central_Asia:0 "Unifying CSTO Members in Central Asia"
 SOV_Integrate_The_CSTO_Members_In_Central_Asia_desc:0 "The Russian Federation seeks to strengthen its influence by fully integrating the CSTO member states in Central Asia, fostering closer military and economic ties to secure the region's stability and strategic importance."
 SOV_Greater_Russian_Federation:0 "The Greater Russian Dream"
 SOV_Greater_Russian_Federation_desc:0 "A bold vision to restore and unify the Russian lands under one powerful state, reclaiming influence over former territories and securing Russia’s rightful place on the world stage."
 SOV_Rebuild_The_KGB:0 "Rebuild the KGB"
 SOV_Rebuild_The_KGB_desc:0 "The days of chaos and subversion must end. By reviving the Committee for State Security, we will ensure absolute loyalty to the Party, suppress dissent, and root out all who would threaten the reborn Soviet Union. No enemy of the people will escape our watchful gaze."
 SOV_Soviet_Restoration:0 "Rename Cities"
 SOV_Soviet_Restoration_desc:0 "The names of our cities must reflect the ideals of the new socialist era. We will erase the remnants of the capitalist past and restore the proud Soviet names that once inspired loyalty and unity across the Union."
 SOV_Workers_Economy_Plan:0 "Workers' Economy Plan"
 SOV_Workers_Economy_Plan_desc:0 "The revival of the Soviet Union demands an economy built to serve the people, not private profit. Through centralized planning, state ownership of key industries, and the mobilization of our labor force, we will ensure that every factory, every farm, and every workshop contributes to the prosperity of the working class."
 SOV_5_Year_Plan:0 "Five Year Plan"
 SOV_5_Year_Plan_desc:0 "Following the traditions of our Soviet forebears, we will launch an ambitious Five Year Plan to transform our industry, agriculture, and infrastructure. Every citizen will have a role to play, every resource will be allocated with precision, and every achievement will bring us closer to a self sufficient socialist state."
 SOV_Industrialization:0 "Heavy Industry Drive"
 SOV_Industrialization_desc:0 "To secure the foundation of our socialist economy, we must embark on a massive program of heavy industrial development. Steel mills, machine plants, and arms factories will rise across the nation, ensuring that the reborn Soviet Union has the strength to defend itself and the capacity to project power abroad."
 SOV_Take_Over_Gazprom:0 "Take Over Gazprom"
 SOV_Take_Over_Gazprom_desc:0 "Gazprom, a vital pillar of our nation's energy sector, must be brought fully under state control. By reclaiming this strategic asset from capitalist hands, we will ensure the energy wealth fuels the prosperity and strength of the Soviet Union rather than lining the pockets of private interests."
 SOV_Allow_Private_Corporations:0 "Allow Private Corporations"
 SOV_Allow_Private_Corporations_desc:0 "While the Party leads the economy, limited private corporations will be permitted to operate under strict regulation. This pragmatic approach aims to stimulate innovation and efficiency without sacrificing socialist principles or state control."
 SOV_Red_Self_Sufficiency:0 "Red Self Sufficiency"
 SOV_Red_Self_Sufficiency_desc:0 "In the face of imperialist sanctions and blockades, we will build a self reliant economy that needs no external support. Through collective effort and resourceful planning, the Soviet Union will stand strong and independent, a beacon of socialist resilience."
 SOV_Join_China:0 "Align with China"
 SOV_Join_China_desc:0 "With the Soviet Union restored to prominence, the time has come to strengthen ties with the People’s Republic of China. By formally joining the Shanghai Cooperation Organization, we can secure a powerful Eurasian bloc to counter Western influence and expand our strategic reach."
 SOV_We_Lead:0 "Moscow Leads"
 SOV_We_Lead_desc:0 "Rather than following China’s lead, the Soviet Union will take charge in shaping the future of Eurasia. By establishing the Moscow Accords, we can unite our allies under our vision, ensuring Moscow remains the beating heart of the new world order."
 SOV_Focus_On_Western_Capitalists:0 "Focus on Western Capitalists"
 SOV_Focus_On_Western_Capitalists_desc:0 "The time has come to confront the exploitative capitalist regimes of the West. By prioritizing aggressive economic and political measures, we will undermine their influence and safeguard the revolution from imperialist threats."
 SOV_Real_Communism_First:0 "Real Communism First"
 SOV_Real_Communism_First_desc:0 "Our revolution must be pure and untainted by revisionism. We will no longer tolerate the betrayals of 'communist' regimes like China and North Korea. By confronting these false comrades, the Soviet Union will reclaim the true path to proletarian victory."
 SOV_Attack_Norther_Central_Asia:0 "Reclaim Northern Central Asia"
 SOV_Attack_Norther_Central_Asia_desc:0 "To secure our borders and restore Soviet influence, we must take decisive military action against the nationalist regimes in Kazakhstan and Uzbekistan. Reclaiming these lands will strengthen our strategic position in Central Asia and send a clear message to any who challenge Moscow’s authority."
 SOV_Attack_Southern_Central_Asia:0 "Secure Southern Central Asia"
 SOV_Attack_Southern_Central_Asia_desc:0 "To ensure stability along our southern frontier, we must bring the nations of southern Central Asia under Soviet control. Military intervention in this region will secure vital resources and fortify our influence against external powers."
 SOV_Red_Belarus:0 "Red Belarus"
 SOV_Red_Belarus_desc:0 "With the rebirth of Soviet power, Belarus shall once again be firmly integrated into the red fold. No longer a borderland between East and West, Minsk will serve as a loyal outpost of the restored Union, ensuring that the Belarusian people march under the hammer and sickle once more."
 SOV_The_Russian_Factory:0 "The World's Factory"
 SOV_The_Russian_Factory_desc:0 "With the worst of the sanctions crisis behind us, we now stand at a crossroads. By focusing on domestic industrial expansion and self reliance, we can transform Russia into a manufacturing powerhouse. Though costly and demanding, this path would reduce our dependence on foreign markets and secure long term economic resilience."
 SOV_A_Military_Russia:0 "Economic Preparation For Totalen Krieg"
 SOV_A_Military_Russia_desc:0 "Having endured the strain of sanctions, the state now turns decisively toward militarization. Civilian industry will be subordinated to the needs of the armed forces, as factories, research, and resources are redirected toward sustaining a permanent war footing. Though this path will place heavy burdens on the population."
 SOV_A_Resource_Russia:0 "A Resource Russia"
 SOV_A_Resource_Russia_desc:0 "With sanctions behind us, we now focus on leveraging Russia’s vast natural wealth. By expanding extraction of oil, gas, minerals, and other key resources, we can fuel both industry and the state’s ambitions. This path prioritizes raw materials over consumer needs, ensuring economic growth through the exploitation of our land’s riches while strengthening our global bargaining power."
 SOV_Or_Maybe_Not:0 "Or Maybe Not..."
 SOV_Or_Maybe_Not_desc:0 "We should halt the march before it goes too far. Concessions can be extracted without risking total collapse. By stepping back now, we preserve our strength and live to fight another day."
 SOV_Expand_The_Rebellion:0 "Expand The Rebellion"
 SOV_Expand_The_Rebellion_desc:0 "We should press forward and broaden the uprising. The weakness of the state is clear, and others will rally if we act decisively. By continuing the advance, we transform a mutiny into a struggle for control of the nation itself."
 SOV_A_Military_With_A_State:0 "A Military With A State"
 SOV_A_Military_With_A_State_desc:0 "We should seize control and impose order through strength. Political authority has failed, and only discipline and force can restore stability. The state must be reshaped to serve those willing to defend it."
 SOV_Meet_With_Kiril:0 "Meeting with Kirill"
 SOV_Meet_With_Kiril_desc:0 "After our coup, many parts of Russia are still uncertain about our rule, and Prigozin seeks ways to strengthen legitimacy. A meeting is arranged with Patriarch Kiril to discuss the role of the Orthodox Church in stabilizing the country. The Church can lend its support in exchange for greater influence in society, or use the situation to expand its own authority over the state."
 SOV_Revive_Nationalism:0 "Revive National Pride"
 SOV_Revive_Nationalism_desc:0 "After years of uncertainty and division, the nation must be brought together under a renewed sense of purpose. By strengthening national identity, promoting unity, and restoring pride in our history and traditions, we can solidify our authority and ensure the people stand firmly behind the state."
 SOV_Attack_The_Perifery:0 "Attack the Periphery"
 SOV_Attack_The_Perifery_desc:0 "With central authority shaken, several regions have drifted out of our control and now act on their own terms. This fragmentation cannot be allowed to continue. These territories must be brought back into line, whether through pressure or direct force, to restore unity and reassert our dominance over the periphery."
 SOV_Secure_The_Support_Of_The_Army:0 "Secure the Support of the Army"
 SOV_Secure_The_Support_Of_The_Army_desc:0 "After the recent upheaval, loyalty within the armed forces cannot be taken for granted. Many officers remain uncertain about the new order, and divisions within the ranks could prove dangerous. We must secure their support through incentives, restructuring, and a clear chain of command, ensuring the military stands firmly behind the state."
 SOV_Proffessional_Army:0 "A Professional Army"
 SOV_Proffessional_Army_desc:0 "The era of mass conscription has left the military bloated, inefficient, and unreliable. To ensure true loyalty and effectiveness, we must transition toward a smaller, fully professional force. By relying on trained and dedicated soldiers rather than unwilling conscripts, we can build an army that is disciplined, capable, and firmly under our control."
 SOV_Secure_The_Support_Of_Governors:0 "Secure the Support of Governors"
 SOV_Secure_The_Support_Of_Governors_desc:0 "After the recent upheaval, the risk of a new parade of independences is no longer unthinkable. In the final years of the Soviet Union, republics declared sovereignty one after another, leading to collapse. Regional governors now hold that same balance, and their loyalty must be secured to prevent fragmentation."
 SOV_Invest_In_Rural_Russia:0 "Invest in Rural Russia"
 SOV_Invest_In_Rural_Russia_desc:0 "Large parts of rural Russia have been neglected for years, left behind by development and economic growth. By investing in infrastructure, agriculture, and local industry, we can strengthen these regions, improve living standards, and ensure their loyalty to the state."
 SOV_Praise_Leader:0 "Praise [ROOT.GetLeader]"
 SOV_Praise_Leader_desc:0 "Following reforms in the army and renewed investment in rural regions, public confidence in the leadership begins to recover. These measures help secure broader support among the population, reducing unrest and strengthening the position of [ROOT.GetLeader] across the country."
 SOV_An_Ever_Expanding_Russia:0 "An Ever Expanding Russia"
 SOV_An_Ever_Expanding_Russia_desc:0 "Our attention should turn to the international stage. Russia has never been a static power, and its history has been defined by expansion, influence, and the assertion of strength beyond its borders. Now, with renewed confidence, the state prepares to reassert itself in regions long considered within its natural sphere, setting the foundation for future expansion."
 SOV_Revive_The_Orthodox_Spirit:0 "Revive the Orthodox Spirit"
 SOV_Revive_The_Orthodox_Spirit_desc:0 "After years of instability and ideological division, society remains fragmented and uncertain. The Orthodox Church is positioned as a key pillar of renewal, restoring moral direction and traditional values. By strengthening religious influence in public life, education, and culture, the state can rebuild unity through faith and discipline."
 SOV_Make_The_Other_Churches_Fall_Under_Us:0 "Bring Foreign Orthodox Churches to Heel"
 SOV_Make_The_Other_Churches_Fall_Under_Us_desc:0 "Several Orthodox churches outside our borders have drifted away from Moscow’s spiritual authority and now act independently, some even aligning with hostile foreign interests. These institutions are seen as betraying the unity of Orthodoxy. They must be pressured, isolated, or brought back under a single faithful authority aligned with the Russian Orthodox tradition."
 SOV_The_First_Orthodox_Crusade:0 "The First Orthodox Crusade"
 SOV_The_First_Orthodox_Crusade_desc:0 "With the spiritual authority of the state restored, faith is no longer confined within borders. A new mission emerges to defend and expand Orthodoxy against hostile influence and fragmented churches abroad. This marks the beginning of a broader struggle where religion and state act together to assert their place in the world."
 SOV_Mongolia:0 "Subjugate The Steps of Asia"
 SOV_Mongolia_desc:0 "Mongolia was under both soviet and the tsar. It's time Mongolia once again submit to Moscow"
 SOV_Back_In_Afganistan:0 "Back Into Afganistan"
 SOV_Back_In_Afganistan_desc:0 "Back in 1989 our troops withdrew from Afganistan in humiliation. However a stronger and more undified Russia once again eyes up the mountains of Afganistan and the geographic position it has"
 SOV_Industrial_Program:0 "Industrial Program In [From.GetName]"