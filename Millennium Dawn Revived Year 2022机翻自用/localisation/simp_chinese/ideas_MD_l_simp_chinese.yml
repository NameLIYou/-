 hutu_tutsi_tensions_desc:0 "The Hutu and the Tutsi are two separate ethnic groups living in the border regions between the Democratic Republic of the Congo and Tanzania, especially in the two small countries Burundi and Rwanda. Burundi is dominated by the Tutsi and committed a genocide against the Hutu in 1972, whereas Rwanda is dominated by the Hutu and had thousands of Tutsis slaughtered by Hutu militias in 1994.\n\nThese two ethnic groups just seem to not get along, but have been forced into the same countries by the European-created colonial borders."
 idea_eu_member:0 "European Union Member"
 idea_eu_member_desc:0 "[ROOT.GetName] is a member of the European Union.\n\n\n\n\n\n£GFX_EU_Building \n\n\n\n"
 idea_eu_sanctions:0 "EU Sanctions"
 idea_eu_sanctions_desc:0 "[ROOT.GetName] is target of coordinated economic and political sanctions by the member states of the European Union."
 idea_focus_equal_workforce:0 "Equal Workforce"
 idea_focus_equal_workforce_desc:0 "[ROOT.GetName] has made significant efforts to get its female population into the national workforce and into all sorts of employment. This greatly benefits the economy, as it basically doubles the available manpower - or... womanpower."
 idea_focus_male_workforce:0 "Male Workforce"
 idea_focus_male_workforce_desc:0 "[ROOT.GetName] has undertaken efforts to lock its female population out of the workforce. This will greatly hurt its economy, especially compared to competitors that took opposing steps, but it will benefit their population count."
