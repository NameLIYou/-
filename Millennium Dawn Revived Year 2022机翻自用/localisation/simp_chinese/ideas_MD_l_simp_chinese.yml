 visegrad_group_member:0 "Visegrad Group Member"
 visegrad_group_member_desc:0 "[ROOT.GetNonIdeologyNameDef] is a member of the Visegrad Group, a political alliance between [POL.GetNonIdeologyName], [CZE.GetNonIdeologyNameDef], [SLO.GetNonIdeologyNameDef] and [HUN.GetNonIdeologyNameDef]."
 worker_strikes_1:0 "Worker Strikes"
 worker_strikes_1_desc:0 "There is some unrest among the workforce of [ROOT.GetNonIdeologyNameDef]."
 worker_strikes_2:0 "Considerable Worker Strikes"
 worker_strikes_2_desc:0 "Busses, trains, planes and taxis are not moving much in [ROOT.GetNonIdeologyNameDef]. Only some factories are running. The workforce is disgruntled."
 worker_strikes_3:0 "Major Worker Strikes"
 worker_strikes_3_desc:0 "There are situations where people don't want to work to make a political point. There is a major political point being made in [ROOT.GetNonIdeologyNameDef]."
 worker_strikes_4:0 "Disastrous Worker Strikes"
 worker_strikes_4_desc:0 "The national economy is on the verge of collapse. The government does not seem to be able to get its people to work."
 ZIM_disgruntled_veterans:0 "Disgruntled Veterans"
 ZIM_disgruntled_veterans_desc:0 "Zimbabwe has issues with keeping her disgruntled former troops of the Rhodesian Bush War against the Rhodesian and South African Apartheid states happy. These soldiers, mostly black militiamen of the former ZANU forces, are often unemployed and frustrated and their anger is often materialized as heavy violence against the white minority and against blacks that speak out in favor of amicable race relations."
 idea_united_nations_sanctions:0 "UN Sanctions"
 idea_united_nations_sanctions_desc:0 "[ROOT.GetNonIdeologyNameDef] is target of coordinated economic and political sanctions by the members of the United Nations Security Council."
 SOV_Closer_Relations_With_China:0 "Sino-Russian Trade Deal"
 SOV_Closer_Relations_With_China_desc:0 "Bejing and Moscow have signed a trade deal"
 SWE_leftist_frerver:0 "Leftist fervor"
 SWE_leftist_frerver_desc:0 "The status quo is not working and the Swedes know it."
 SWE_Communist_Propaganda_on_the_Internet:0 "Communist Propaganda On The Internet"
 SWE_Communist_Propaganda_on_the_Internet_desc:0 "We are spreading our message on the internet further and with more success then ever !"
 SWE_Carl_XVI_Gustaf:0 "Carl XVI Gustaf"
 SWE_Carl_XVI_Gustaf_desc:0 "\n\n\n\n\n\n£GFX_Karl_Gustaf \n\n\n\n\n\n"
 SWE_Communist_President:0 "People’s President - Nooshi Dadgostar"
 SWE_Communist_President_desc:0 "In a move to build bridges and lend legitimacy to the new regime, Nooshi Dadgostar has been appointed President of the People's Republic. Though not a communist herself, her leadership of the Left Party and broad appeal among progressives make her a unifying figure in this transitional period. Her presidency symbolizes a break from authoritarianism and a step toward a more inclusive socialist future."
 SWE_Crumbeling_Welfare_State:0 "Crumbling Welfare State"
 SWE_Crumbeling_Welfare_State_desc:0 "Once the pride of Sweden, the welfare state is now buckling under the weight of rising costs, an aging population, and an overwhelmed public sector. Years of political indecision and increased demand have left healthcare, education, and social services stretched to their limits. Public trust is waning, and the very foundation of Sweden’s postwar social model is beginning to fracture."
 SWE_Martial_Law:0 "Martial Law"
 SWE_Communism_Banned:0 "Communism Banned"
 SWE_Martial_Law_2:0 "Continued Martial Law"
 SWE_Martial_Law_desc:0 "After the communist coup and the amrys seazure of power the junta has instituted martial law to secure the streets"
 SWE_Nya_Stormaktstiden:0 "Nya Stormaktstiden"
 SWE_Nya_Stormaktstiden_desc:0 "Sweden once again stands in the spotlight, no longer is Sweden a neglected country in northern Europe, but a country not worth messing with"
 SWE_Monarchist_Propaganda:0 "Swedish Monarchist Propaganda"
 SWE_Monarchist_Propaganda_desc:0 "Sweden is influencing our politics"
 SWE_Enabeling_Act:0 "The Enabling Act"
 SWE_Enabeling_Act_desc:0 "This law grants sweeping powers to the executive, bypassing parliamentary oversight. Under the guise of national emergency, Stefan Jacobsson now governs with unchecked authority."
 SWE_Conscription:0 "Conscription"
 SWE_Conscription_desc:0 "Back in the early - modern period the swedish army used to smash the armies of Russia, Poland and Denmark. This was thanks to our conscription. With conscription reintroduced we are once again on the path to greatness"
 SWE_army_looking_outwards:0 "Expansionist Army"
 SWE_Imigrant_riots:0 "Imigration Problem"
 SWE_Investments_in_the_army:0 "Investing In The Army"
 SWE_Investments_in_the_army_desc:0 "We have finally begun to invest in our army"
 5_year_plan:0 "5-Year Plan"
 SWE_Centralization_Idea:0 "State Centralization"
 SWE_Centralization_Idea_desc:0 "We have opted for a more centralized style of government"
 SWE_De_Centralization_Idea:0 "State De-Centralization"
 SWE_De_Centralization_Idea_desc:0 "We have opted for a more de-centralized form of government, with much local power given to lower administrative levels"
 SWE_Rejuvinated_Welfare_State:0 "Rejuvinated Welfare State"
 SWE_Rejuvinated_Welfare_State_desc:0 "No longer is our welfare state threathened by neo-liberalism and cuts. our people will prosper"
 SWE_Chineese_troops:0 "Adopt The Chinese Labour Model"
 SWE_Chineese_troops_desc:0 "To build socialism with Swedish characteristics, we must learn from the most successful example of communist economic transformation: China. By adopting their labour organization strategies and industrial discipline, we can modernize our economy while preserving party control. Efficiency, productivity, and ideological unity will guide the Swedish worker into a new red era."
 SWE_Chineese_Economic_System:0 "The Chinese Economic System"
 SWE_Chineese_Economic_System_desc:0 "Sweden must evolve beyond outdated Marxist orthodoxy. The Chinese model offers a pragmatic path—market mechanisms under firm party control. By merging planned development with controlled capitalism, we can generate rapid growth while ensuring the Communist Party remains the guiding force of the economy. The People's Market is open for business."
 UKR_experts_in_drone_warfare2:0 "Ukrainian Drones Dominating the Skies"
 UKR_experts_in_drone_warfare2_desc:0 "We are losing tanks and men to devestating Ukrainian drone strikes. Offensives are becoming more risky and dangerous."
 UKR_experts_in_drone_warfare:0 "Ukrainian Drones Dominating the Skies"
 UKR_experts_in_drone_warfare_desc:0 "We are losing tanks and men to devestating Ukrainian drone strikes. Offensives are becoming more risky and dangerous."
