 idea_focus_generic_motorized_focus:0 "Vehicle Production Focus"
 idea_focus_generic_motorized_focus_desc:0 "[ROOT.GetNonIdeologyNameDef] has, through several business and government reforms, managed to maximize factory output of civilian vehicles."
 idea_focus_generic_education_reform:0 "Education Reform"
 idea_focus_generic_education_reform_desc:0 "With an Education Reform, [ROOT.GetNonIdeologyNameDef] has managed to train scientists and scholars at higher numbers and with more proficiency. Their national and private research projects are now notably more likely to succeed."
 idea_focus_generic_census_reform:0 "Census Reform"
 idea_focus_generic_census_reform_desc:0 "By renovating the national census system, [ROOT.GetNonIdeologyNameDef] has made its recruitment stations better at choosing valid candidates for combat operations and army deployments. If new guidelines are put to use, this might increase the manpower base for this country's army."
 idea_focus_generic_public_service_investment:0 "Public Service Investment"
 idea_focus_generic_public_service_investment_desc:0 "[ROOT.GetNonIdeologyNameDef] has vastly improved its public administration and service sector while also boosting the efficiency of its consumer goods output. This might lead to more industrial capacity being directed in the direction the government wishes for."
 idea_focus_generic_encouraged_private_research:0 "Private Research Support"
 idea_focus_generic_encouraged_private_research_desc:0 "By loosening barriers on research literature and experimental laboratories, [ROOT.GetNonIdeologyNameDef] has managed to pull in huge amounts of scientific interest from private businesses. This frees up government resources that were used for purely civilian means and that can now be used to support the plans of military and national industrial committees."
 idea_focus_generic_individual_freedom:0 "§3Democratic§! Allignment"
 idea_focus_generic_individual_freedom_desc:0 "[ROOT.GetNonIdeologyNameDef] has shown determination to improve the situation of the individual against the government, to assure basic civil and economic rights. This will likely improve the position of democratic parties."
 idea_focus_generic_national_strength:0 "§nAnti-Democratic§! Allignment"
 idea_focus_generic_national_strength_desc:0 "[ROOT.GetNonIdeologyNameDef] is determined to stomp thoughts and ideals of personal freedom and small government. The administration has shown no remorse when it comes to oppression and silencing of opposition forces. Democracy is unlikely to flourish."
 idea_focus_generic_path_of_order:0 "§nPath of Order§!"
 idea_focus_generic_path_of_order_desc:0 "[ROOT.GetNonIdeologyNameDef] has determined that its path should be the path of order. Freedom and Equality are overrated. Those who lack freedom get prosperity from above, and those who lack equality are protected from harm. States of order value military presence, strong state parties and pay little attention to good treatment of their opposition."
 idea_focus_generic_path_of_equality:0 "§ePath of Equality§!"
 idea_focus_generic_path_of_equality_desc:0 "[ROOT.GetNonIdeologyNameDef] has determined that its path should be the path of equality. Freedom of the individual is exchanged for the progress of the collective. Militarism and Nationalism and the Order that is supposed to come with it are denounced, but seen as necessary evils for the world to achieve equality."
 idea_focus_generic_path_of_liberty:0 "Path of Liberty"
 idea_focus_generic_path_of_liberty_desc:0 "[ROOT.GetNonIdeologyNameDef] has determined that its path should be the path of liberty. Equality of a collective means hindering the individual in their potential and order means stealing from the population just to limit it further. Nations of Freedom are even ready to shrink their governments in size to assure that individualism is protected."
 idea_focus_generic_reactionary_doctrine:0 "§rReactionary§! Doctrine"
 idea_focus_generic_reactionary_doctrine_desc:0 ""
 idea_focus_generic_capitalist_doctrine:0 "§lClassical Liberal§! Doctrine"
 idea_focus_generic_capitalist_doctrine_desc:0 ""
 idea_focus_generic_progressive_doctrine:0 "§pProgressive§! Doctrine"
 idea_focus_generic_progressive_doctrine_desc:0 ""
 idea_focus_generic_royal_doctrine:0 "§mMonarchist§! Doctrine"
 idea_focus_generic_royal_doctrine_desc:0 ""
 idea_focus_generic_social_democrat_doctrine:0 "§SSocial Democratic§! Doctrine"
 idea_focus_generic_social_democrat_doctrine_desc:0 ""
 idea_focus_generic_conservative_doctrine:0 "§cConservative§! Doctrine"
 idea_focus_generic_conservative_doctrine_desc:0 "[ROOT.GetNonIdeologyNameDef] has found a certain level of happiness when it comes to the status quo. It has become political fashion to both oppose political steps forward and backwards."
 idea_focus_generic_liberal_doctrine:0 "§sSocial Liberal§! Doctrine"
 idea_focus_generic_liberal_doctrine_desc:0 "[ROOT.GetNonIdeologyNameDef] has adopted the common understanding that trying to control others is an universal evil that has to be avoided. [ROOT.GetNonIdeologyNameDef] has adopted a streak of liberal mannerisms and schools of thought."
 idea_focus_generic_leftist_doctrine:0 "§dSocialist§! Doctrine"
 idea_focus_generic_leftist_doctrine_desc:0 "While firmly believing in democracy, [ROOT.GetNonIdeologyNameDef] has shown discomfort with global capitalism and the unequal distribution of wealth. Their democratic consensus is on the left wing."
 idea_focus_generic_marxist_doctrine:0 "§eCommunist§! Doctrine"
 idea_focus_generic_marxist_doctrine_desc:0 "[ROOT.GetNonIdeologyNameDef] has embraced marxist ideals and began teaching communism to its youth in a highly positive light. Communist movements are likely to grow stronger and to unite against the government."
 idea_focus_generic_neo_fascist_doctrine:0 "§fFascist§! Doctrine"
 idea_focus_generic_neo_fascist_doctrine_desc:0 "[ROOT.GetNonIdeologyNameDef] is experiencing a revival of racial supremacist movements and military expansionists, generally grouped together as 'fascists'. It is only a matter of time until one of these parties will take the lead and become a serious political force."
 idea_focus_generic_nationalist_doctrine:0 "§nNationalism§! Doctrine"
 idea_focus_generic_nationalist_doctrine_desc:0 "[ROOT.GetNonIdeologyNameDef] has begun cherishing its national history and traditions. A serious opposition to democratic and communist ideals has formed around several autocratic movements. One of these movements like will step forward to become a political threat to its opponents."
 idea_focus_generic_path_of_allah:0 "§iIslamist§! Doctrine"
 idea_focus_generic_path_of_allah_desc:0 "[ROOT.GetNonIdeologyNameDef] has pledged itself to classical interpretations of shariah law, the islamic law code. Islamist movements are likely to rise up and unite against the government."
