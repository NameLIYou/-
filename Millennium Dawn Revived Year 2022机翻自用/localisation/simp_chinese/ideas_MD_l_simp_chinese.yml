 UKR_a_nato_standard_army3:0 "Fully Integrated NATO Training"
 UKR_military_anti_corruption_drive:0 "Military Anti-Corruption Drive"
 UKR_Oligarchic_Control:0 "Oligarchic Stranglehold Over The Economy"
 UKR_Oligarchic_Control_desc:0 "Corruption has become deeply embedded within the state apparatus. From local administrations to national institutions, bribery, nepotism, and opaque dealings undermine efficiency and public trust. Reform is difficult, as those benefiting from the system resist any meaningful change."
 UKR_Oligarchic_Control_2:0 "Oligarchic Control Over The Economy"
 UKR_Oligarchic_Control_2_desc:0 "Corruption has become deeply embedded within the state apparatus. From local administrations to national institutions, bribery, nepotism, and opaque dealings undermine efficiency and public trust. Reform is difficult, as those benefiting from the system resist any meaningful change."
 UKR_corrupt_courts:0 "Politicized and Corrupt Courts"
 UKR_corrupt_courts_desc:0 "The judiciary, meant to uphold justice, has instead become a tool for personal and political gain. Judges are influenced by oligarchs and officials, verdicts are bought and sold, and the rule of law is inconsistently applied. Without reform, legal institutions will continue to erode the nation's stability."
 UKR_boost_military_industry:0 "Boost Military Industry"
 UKR_boost_consumer_industry:0 "Boost Consumer Industry"
 UKR_western_ambitions:0 "Western Ambitions"
 UKR_int_legion:0 "International Legion"
 UKR_offensive_modifier:0 "Ukrainian Offensive"
 GER_Large_Imigrant_Waves:0 "Large Imigration Waves"
 GER_Large_Imigrant_Waves_desc:0 "Germany is once again absorbing large numbers of newcomers in a short span of time. Municipalities struggle to find housing, schools are overcrowded, and local administrations are stretched thin. While some immigrants are willing to work and integrate, the speed of arrivals has sparked political tension and fueled debates over identity, welfare, and the limits of state capacity."
 GER_Controlled_Immigration:0 "Controlled Immigration"
 GER_Controlled_Immigration_desc:0 "The government has introduced stricter immigration controls while maintaining regulated pathways for skilled workers and humanitarian cases. Supporters argue it protects social stability and public services, while critics warn it may damage Germany's image as an open society."
 GER_Integration_Funding:0 "Increased Funding For Integration"
 GER_Growing_Support_of_Communism:0 "Growing Support For Communism"
 GER_Energy_Crisis:0 "Energy Crisis"
 GER_Energy_Crisis_desc:0 "Cheap and reliable energy was the backbone of Germany’s industrial model. That foundation is now cracking. Gas prices have exploded, power intensive industries face production cuts, and emergency measures are discussed behind closed doors. What was once an economic strength has become a strategic weakness, forcing Berlin to rethink its energy policy under pressure."
 GER_Energy_Crisis_2:0 "Releaved Energy Crisis"
 GER_Energy_Crisis_2_desc:0 "Cheap and reliable energy was the backbone of Germany’s industrial model. That foundation is now cracking. Gas prices have exploded, power intensive industries face production cuts, and emergency measures are discussed behind closed doors. What was once an economic strength has become a strategic weakness, forcing Berlin to rethink its energy policy under pressure."
 FRA_Monarchist_propaganda:0 "French Monarchist Propaganda"
 FRA_Monarchist_propaganda_desc:0 "§RHaving More Than 40% Monarchist Support Will Trigger A Civil War§!"
 FRA_Brother_In_Arms_idea:0 "Brothers In Arms"
 FRA_Brother_In_Arms_idea_desc:0 "Our two countries have finally at least united under a single banner"
 SWE_Bank_Nationalizations:0 "Bank Nationalization"
 SWE_Bank_Nationalizations_desc:0 "The banks had huge wealth, now the wealth will make the people of Sweden prosper"
 SWE_Communist_Propaganda:0 "Swedish Communist Propaganda"
 SWE_Communist_Propaganda_desc:0 "§RHaving More Than 35% Communist Support Will Give Sweden The Opportunity to Install A Loyalist Government§!"
 SWE_Winter_Tactics:0 "Mastered Winter Tactics"
 SWE_Kill_The_Bear:0 "Kill The Bear"
 SOV_Russian_Popaganda:0 "Russia is sponsoring Pro-Kremlin propaganda in our country"
 SOV_Russian_Investment_In_CSTO:0 "CSTO investment in [FROM.GetName]"
 SOV_Russian_Investment_In_CSTO_desc:0 "CSTO investment in [ROOT.GetNameDef] will strengthen our economic ties, bolster regional stability, and ensure mutual defense against external threats."
 idea_focus_PRC_Worlds_Factory:0 "Chinese Production"
 idea_focus_PRC_Worlds_Factory_desc:0 "China has cemented its place as the workshop of the world. Decades of infrastructure development, low labor costs, and strategic planning have made Chinese industry a global cornerstone. With sprawling megafactories and supply chains that reach every continent, China can produce anything at scale and fast."
 SWE_Faith_Is_On_Our_Side:0 "Faith is On Our Side"
 SWE_High_Public_Opposition:0 "Widespread Public Resistance"
 SWE_High_Public_Opposition_desc:0 "Despite the Islamist regime’s victory, large segments of the population remain deeply opposed to the new order. Protests and underground resistance movements grow daily, fueled by fear, resentment, and a longing for the Sweden that once was."
 Shia_Economy:0 "Sharia Economic Policy"
 SWE_Fundementalist_Sharia_Law:0 "Fundamentalist Sharia Law"
 SWE_Fundementalist_Sharia_Law_desc:0 "A strict interpretation of Islamic law has been imposed, affecting nearly all aspects of Swedish society. Personal freedoms are curtailed, scientific research is de-emphasized in favor of dogma, and gender roles are rigidly enforced. While national unity may increase among supporters, the system alienates many and leads to unrest."
 SWE_Moderated_Sharia_Law:0 "Moderated Sharia Law"
 SWE_Male_Only_Schools:0 "Male Only Schools"
 SWE_Taliban_Wepons:0 "Taliban Wepons"
 SWE_Taliban_Wepons_desc:0 "The Taliban has given us their secrets for wepon production"
 SWE_Hijab:0 "§RHijab Mandetory§!"
 SWE_Moderated_Sharia_Law_1:0 "Laxed Enforcement Of Sharia Law"
 SWE_Moderated_Sharia_Law_desc:0 "A Laxed version of Sharia law has been integrated into the legal system, balancing religious principles with the necessities of a modern state. While certain civil liberties remain limited and military recruitment is affected, the government enjoys moderate stability and legitimacy among traditionalist communities."
 SWE_Muslim_Army:0 "A Muslim Army"
 SWE_Muslim_Army_desc:0 "We must create an army to defend the homeland"
 SWE_Muslim_Army_1:0 "Fast Army Training"
 SWE_Muslim_Army_1_desc:0 "We must create an army to defend the homeland"
 SWE_Muslim_Army_2:0 "Defensive Army"
 SWE_Muslim_Army_2_desc:0 "We must create an army to defend the homeland"
 SWE_Arabization_idea:0 "Arabization Program"
 SWE_Arabization_idea_desc:0 "The government has embarked on an ambitious project to reshape Swedish society around Arabic language, culture, and customs. This sudden shift has caused widespread confusion, administrative chaos, and resistance from native institutions. While it may lay the foundation for a unified Islamist identity in the long term, the short-term disruption is severe."
 SWE_Halal_Food_Production_ideas:0 "The Taste Of Halal Food"
 SWE_Adivosr_Cost:0 "Christians In Government"
 SWE_By_Blood_Alone:0 "Only with blood Are We able te bring the world under our controll"
 UKR_Ukrainian_Army:0 "Ukrainian Armed Forces"
 UKR_Ukrainian_Army_1:0 "Ukrainian Armed Forces"
 UKR_Repair_Factories:0 "Effective Emergency Services"
 UKR_Repair_Factories_desc:0 "Our emergency response teams and engineering units have been reorganized for rapid deployment. By streamlining logistics and repair protocols, we can restore damaged infrastructure and factories faster than ever before, keeping our war effort running under fire."
 UKR_Truck_And_Trains:0 "Truck And Train Production"
 UKR_Truck_And_Trains_desc:0 "To sustain our war effort, we are focusing on the mass production of military trucks and railway logistics. This investment will ensure our troops and supplies move quickly and efficiently across the front."
 SOV_Open_Political_Climate:0 "Open Political Climate"
 SOV_Open_Political_Climate_desc:0 "Recent reforms have led to a more open and diverse political environment. While tensions remain, the population is beginning to feel the effects of increased civil freedom and political debate."
 SOV_Repaire_The_Road:0 "Fix Our Broken Roads"
 SOV_Repaire_The_Road_desc:0 "Years of neglect and conflict have left our infrastructure in disrepair. By committing resources to rebuilding our road network, we can restore mobility and improve national cohesion."
 SOV_Health_Programs:0 "Robust Healthcare"
 SOV_Health_Programs_desc:0 "Investing in national health programs improves the well-being of our citizens, reduces long-term costs, and boosts the overall strength and stability of our workforce."
 SOV_Recource_Extraction:0 "Recource Extraction"
 SOV_Recource_Extraction_desc:0 "Our vast natural resources remain underutilized. Expanding extraction efforts will increase industrial output and strengthen our economic independence."
 SOV_Recource_Extraction_2:0 "Economic Boom"
 SOV_Recource_Extraction_2_desc:0 "With our extraction sector fully operational, the economy is surging. Jobs are being created, industry is expanding, and our strategic position grows stronger each day."
 SWE_Imigrant_Tensions:0 "Imigrant Tensions"
 SWE_Imigrant_Tensions_desc:0 "Growing cultural and economic strains are beginning to show within society."
