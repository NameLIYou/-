 SWE_Imigrant_Tensions_1_desc:0 "Social efforts have reduced tensions, but challenges remain."
 SWE_Renewable_Energy_Investment:0 "Renewable Energy Subsidies"
 SWE_Renewable_Energy_Investment_desc:0 "Public investments are driving the transition toward green energy."
 SWE_Recovering_Welfare_State:0 "Recovering Welfare State"
 SWE_Recovering_Welfare_State_desc:0 "Steps are being taken to rebuild a safety net for all citizens."
 SWE_Imigrant_Tensions_Market_Based:0 "Educated Imigrants Prioritized"
 SWE_Imigrant_Tensions_Market_Based_desc:0 "A merit-based system gives priority to skilled newcomers."
 SWE_Imigrant_Tensions_Market_Based_Better:0 "Imigration Under Control"
 SWE_Imigrant_Tensions_Market_Based_Better_desc:0 "Stricter policies have stabilized migration flows."
 SWE_Market_Liberalization:0 "Market Liberalization"
 SWE_Market_Liberalization_desc:0 "Deregulation and competition are unlocking economic potential."
 SWE_Privatized_Welfare_Idea:0 "Privatized Welfare"
 SWE_Privatized_Welfare_Idea_desc:0 "Private actors now play a major role in delivering social services."
 SWE_Deportations:0 "Deportations"
 SWE_Deportations_desc:0 "Authorities are actively removing those without legal status."
 SWE_Middle_Class_Tax_Cut:0 "Middle Class Tax Cuts"
 SWE_Middle_Class_Tax_Cut_desc:0 "Tax relief has been granted to ease the burden on working families."
 SWE_Undemocratic_State:0 "Undemocratic State"
 SWE_Undemocratic_State_desc:0 "Democracy has been sidelined in favor of centralized authority and firm control."
 SWE_volunteer_effort:0 "Swedish Volunteers"
 SWE_volunteer_effort_desc:0 "Swedish citizens are taking up arms abroad, fighting for causes beyond our borders."
 SWE_NATO_DOCTRINE:0 "§3Nato Doctrines§!"
 SWE_NATO_DOCTRINE_desc:0 "We are adopting NATO's battle-tested doctrines to modernize and align our forces."
 SWE_Fortress:0 "Fortress Sweden"
 SWE_Fortress_desc:0 "We are turning Sweden into a hardened stronghold, ready to repel any threat."
 SWE_Sweden_Stands_Alone:0 "Sweden Stands Alone"
 SWE_Sweden_Stands_Alone_desc:0 "Without allies, we must rely solely on ourselves for defense and survival."
 SWE_Sweden_Stands_Alone_1:0 "Rearming Sweden"
 SWE_Sweden_Stands_Alone_1_desc:0 "The military is being rapidly rearmed to meet the growing threat."
 SWE_Sweden_Stands_Alone_2:0 "Big Military Budget"
 SWE_Sweden_Stands_Alone_2_desc:0 "A massive increase in military spending is reshaping our defense priorities."
 SWE_Armed_Neutrality_Ideas:0 "Armed Neutrality"
 SWE_Armed_Neutrality_Ideas_desc:0 "Neutral in diplomacy, strong in defense. We will not be an easy target."
 SWE_Establish_Nordic_Bank:0 "A Nordic Bank"
 SWE_Establish_Nordic_Bank_desc:0 "Creating a shared financial institution to stabilize and grow the Nordic economy."
 USA_Constitution:0 "The Constitution"
 USA_Constitution_desc:0 "The backbone of our democracy and the rulebook for our republic. \n\n\n\n\n\n£GFX_ConstitutionAmerica \n\n\n\n"
 USA_Gun_Culture:0 "American Gun Culture"
 USA_Gun_Culture_desc:0 "Widespread firearm ownership is a key part of American identity and politics.\n\n\n\n\n\n£GFX_USA_gun_culture \n\n\n\n"
 USA_Gun_Culture_Reformed:0 "Reformed Gun Laws"
 USA_Gun_Culture_Reformed_desc:0 "Widespread firearm ownership is a key part of American identity\n\n\n\n\n\n£GFX_USA_gun_culture \n\n\n\n"
 USA_Rising_Inflation_Biden_Presidnet:0 "Rising Inflation"
 USA_Rising_Inflation_Biden_Presidnet_2:0 "Explosive Inflation"
 idea_USA_Reseach_Funding:0 "CHIPS Act"
 USA_Biden_Years:0 "The Biden Years, §22021-2025§!"
 USA_Biden_Years_desc:0 "The previous administration left behind an economy shaped by heavy federal spending, large infrastructure projects, and direct state involvement in industry. Though poorly managed and ideologically driven, much of this investment is already underway \n\n\n\n\n\n£GFX_Biden_Years \n\n\n\n"
 idea_USA_Congress_Republicans_Bad:0 "§RRepublican§! Majority in Congress"
 idea_USA_Congress_Republicans_Bad_desc:0 "With a Democratic President facing a Republican-controlled Congress, partisan gridlock stalls government progress and frustrates Democratic goals."
 idea_USA_Congress_Republicans_Good:0 "§RRepublican§! Majority in Congress"
 idea_USA_Congress_Republicans_Good_desc:0 "With a Republican President and Congress united, legislative efforts move quickly, strengthening the party’s control and agenda."
 idea_Congress_Democrats_Bad:0 "§3Democratic§! Majority in Congress"
 idea_Congress_Democrats_Bad_desc:0 "A Republican President governs under a Democratic-controlled Congress, hindering Republican initiatives and fostering political deadlock."
 idea_Congress_Democrats_Good:0 "§3Democratic§! Majority in Congress"
 idea_Congress_Democrats_Good_desc:0 "With Democrats controlling both the Presidency and Congress, coordinated policymaking fuels the party’s vision and consolidates power"
 idea_USA_Jobs_Act:0 "Infrastructure Investment and Jobs Act"
 idea_USA_Jobs_Act_desc:0 "A sweeping investment plan to rebuild America’s aging infrastructure, create millions of jobs, and strengthen the nation’s economy for the long term."
 USA_Green_Energy:0 "Green Industry"
 USA_Green_Energy_desc:0 "A national initiative to boost clean energy innovation, reduce emissions, and support the development of sustainable industries."
 idea_USA_FEMA_Funding:0 "Increased FEMA Funding"
 idea_USA_FEMA_Funding_desc:0 "Enhanced funding to the Federal Emergency Management Agency, improving disaster response, recovery infrastructure, and preparedness efforts."
 idea_USA_Made_In_America_Act:0 "Made In America Act"
 idea_USA_Made_In_America_Act_desc:0 "An act mandating federal procurement of domestically produced goods, encouraging American manufacturing and job growth."
 SWE_Riksbank:0 "Riksbank Policy"
 SWE_Riksbank_desc:0 "Sweden's central bank sets forward-looking monetary policy to ensure financial stability and steady economic growth."
 SWE_Sakerhetspolicen:0 "Säkerhetspolisen"
 SWE_Sakerhetspolicen_desc:0 "Sweden’s national security service plays a key role in counterintelligence, terrorism prevention, and upholding internal security."
 idea_USA_Bringing_Back_Union:0 "Encourage Unionizing"
 idea_USA_Bringing_Back_Union_desc:0 "Policies designed to empower labor unions, protect collective bargaining rights,  and restore the strength of the American working class."
 SOV_Democratic_Constitution:0 "Democratic Constitution"
 SOV_Democratic_Constitution_desc:0 "A new foundational charter signaling Russia’s turn toward democracy, civil liberties, and accountable governance after decades of centralized rule."
 SOV_Soviet_Constitution:0 "Soviet Constitution"
 SOV_Soviet_Constitution_desc:0 "A new constitution reaffirming the principles of socialism and the leadership of the Communist Party, guiding Russia toward a socialist future."
 SOV_Soviet_Nostalgia:0 "Nostalgia For The Union"
 SOV_Soviet_Nostalgia_desc:0 "Though the Soviet Union is no more, its memory lives on in the hearts of millions. Across the nation, statues of Lenin still stand, and tales of past glory echo in schools, factories, and homes. The yearning for unity, stability, and power has begun to shape public opinion and influence political currents once thought buried."
 SOV_Soviet_present:0 "Soviet Union Reborn"
 SOV_KGB:0 "The KGB"
 Gazprom:0 "Gazprom"
 Eskom:0 "Eskom"
 SOV_Hevy_Industry_Drive:0 "Hevy Industry Drive"
 SOV_Government_Controlled_Corporations:0 "Government Controlled Corporations"
 SAF_Rolling_Blackouts:0 "Rolling Blackouts"
 SAF_Rolling_Blackouts_desc:0 "Eskom, the state power utility, is plagued by corruption, debt, and crumbling infrastructure. The result is rolling blackouts known locally as 'load shedding' which cripple industry, frustrate citizens, and undermine trust in the government."
 SAF_Rampant_Corruption:0 "Rampant Corruption"
 SAF_Rampant_Corruption_desc:0 "Decades of state capture, patronage networks, and unchecked graft have hollowed out South Africa’s institutions. Every attempt at reform is undermined by entrenched interests, leaving the state bloated, inefficient, and mistrusted by its own people."
 SAF_Convoy_Production:0 "South African Convoy Production"
 SAF_Convoy_Production_desc:0 "South Africa’s long coastline and vital trade routes make convoy construction an urgent necessity. By dedicating resources to shipyards and transport capacity, we can ensure the steady flow of goods, men, and equipment to and from the Cape."
 SAF_New_Industrial_Plan:0 "New Industrial Plan"
 SAF_New_Industrial_Plan_desc:0 "South Africa stands at a crossroads between its resource wealth and industrial underdevelopment. A new comprehensive plan must be laid out to expand factories, modernize infrastructure, and unlock the nation’s economic potential for the challenges ahead."
 SAF_South_African_Wepons:0 "South African Wepons"
 SAF_Exposed_Corruption_2:0 "Exposed Corruption"
 SAF_Exposed_Corruption_2_desc:0 "Decades of state capture, patronage networks, and unchecked graft have hollowed out South Africa’s institutions. Every attempt at reform is undermined by entrenched interests, leaving the state bloated, inefficient, and mistrusted by its own people."
 SAF_Herlewing_van_Afrikaans:0 "Herlewing van Afrikaans"
 SAF_Herlewing_van_Afrikaans_desc:0 "Afrikaans has long stood as a symbol of cultural identity and resistance. Now, with renewed pride, efforts are underway to revive its use in education, politics, and society at large. This revival is both a cultural statement and a political one, challenging the dominance of English and reshaping South Africa’s future"
 SAF_Herlewing_van_Afrikaans2:0 "Herlewing van Afrikaans"
 SAF_Herlewing_van_Afrikaans2_desc:0 "Afrikaans has long stood as a symbol of cultural identity and resistance. Now, with renewed pride, efforts are underway to revive its use in education, politics, and society at large. This revival is both a cultural statement and a political one, challenging the dominance of English and reshaping South Africa’s future."
 SAF_Elder_Council:0 "Elder Council"
 SAF_Elder_Council_desc:0 "A council of respected tribal elders is formed to advise the monarchy. Their guidance helps bridge traditional authority with the needs of the modern state, ensuring the Zulu royal family maintains legitimacy among the people."
 SAF_Elder_Council_2:0 "Endorsed Elder Council"
 SAF_Elder_Council_2_desc:0 "The Elder Council receives official recognition from both the monarchy and the national government. Their endorsement strengthens the authority of the king and solidifies the foundation of the restored Zulu monarchy."
 SAF_Black_Nationalism:0 "Black Nationalism"
 SAF_Black_Nationalism_desc:0 "A powerful wave of black nationalist sentiment has taken hold of South Africa. It emphasizes unity among the black majority, reclaiming land and resources from perceived colonial structures, and elevating indigenous culture and identity above all others. While it inspires passion and a sense of purpose, it also risks deepening divisions within the nation and straining relations abroad."
 SAF_Apartheid_Laws:0 "Apartheid Laws"
 SAF_Apartheid_Laws_desc:0 "The system of Apartheid enforces strict racial segregation, granting privileges to the white minority while disenfranchising the majority. While this ensures control and stability for the ruling class, it provokes widespread resistance at home and condemnation abroad, isolating South Africa from much of the international community."
 SAF_Apartheid_Laws_2:0 "Apartheid Laws"
 SAF_Apartheid_Laws_2_desc:0 "The system of Apartheid enforces strict racial segregation, granting privileges to the white minority while disenfranchising the majority. While this ensures control and stability for the ruling class, it provokes widespread resistance at home and condemnation abroad, isolating South Africa from much of the international community."
 SAF_Controlled_Media:0 "Controlled Media"
 SAF_Controlled_Media_desc:0 "Through state pressure, intimidation, and propaganda, independent journalism has been silenced and the media brought under government control. While this allows for easier narrative shaping, it comes at the cost of transparency and international credibility."
 SAF_We_Stand_Alone:0 "Alone In Africa"
 SAF_De_Centralized_Armed_Forces:0 "De-Centralize the Armed Forces"
 SAF_De_Centralized_Armed_Forces_desc:0 "Regional commanders and local militias are given greater autonomy, allowing for rapid response but reducing overall coordination across the military."
 SAF_Centralized_Armed_Forces:0 "Centralize the Armed Forces"
 SAF_Centralized_Armed_Forces_desc:0 "All military units will be placed under a unified command, ensuring discipline, coordination, and strategic control across the entire Afrikaner state."
 SAF_Zulu_Traditions:0 "Zulu Traditions"
 SAF_Zulu_Traditions_2:0 "Zulu Traditions"
 SAF_Centralization_Of_Power_In_The_King:0 "Centralized Power With The King"
 SAF_Local_Powersharing:0 "Local Armies"
 SAF_All_Collectivization:0 "Collectivist State"
 SAF_Red_Army:0 "African Liberation Army"
 PER_Low_Popular_Support:0 "Low Popular Support"
 PER_Low_Popular_Support_desc:0 "Public faith in the government has reached a historic low. Years of economic hardship, corruption, and political repression have eroded the regime’s legitimacy. Protests erupt across the nation, fueled by disillusionment and anger. Whether Islamist or reformist, those in power find themselves ruling a restless and skeptical population."
 PER_Economy_Under_Sanction:0 "Economy Under Sanction"
 PER_Economy_Under_Sanction_desc:0 "Years of crippling international sanctions have left Iran’s economy battered and isolated. Inflation soars, foreign investment is scarce, and vital industries struggle to function without access to global markets. Smuggling networks, corruption, and black-market trade have become essential to survival. Despite government promises of resistance and self-sufficiency, the weight of sanctions continues to crush the nation’s potential."
 PER_Mahsa_Amini_Protests:0 "Anti-Government Protest"
 PER_Iranian_Trains:0 "We have boosed train production"
 PER_Reformist_Agenda:0 "The Reformist Agenda"
 PER_Reformist_Agenda_desc:0 "The government seeks to modernize Iran both politically through careful maneuvering within the confines of the Islamic Republic"
 PER_Reformist_Legislature:0 "The Reformist Legislature"
 PER_Reformist_Legislature_desc:0 "The government seeks to modernize Iran both politically through careful maneuvering within the confines of the Islamic Republic"
 PER_Iranian_Generals_Bribed:0 "Bribes to Generals"
 PER_Iranian_Generals_Bribed_desc:0 "To ensure the loyalty of the armed forces and prevent potential dissent, key military officials have been discreetly compensated. These payments may stabilize the situation for now, but they risk deepening corruption and eroding trust in the reformist government’s integrity."
 SYR_Victor_of_the_civil_war:0 "Victors Of The Civil War"
 SYR_Victor_of_the_civil_war_desc:0 "We have trimuphed in the civil war"
 PER_Communist_Protest:0 "Marxist Trade Union Strike"
 PER_Reclaiming_Iranian_Identity:0 "Remembering Past Glory"
 PER_Reclaiming_Iranian_Identity_desc:0 "Iran was once a regional power"
 PER_Reclaiming_Iranian_Identity_2:0 "Reclaiming Our Old Empire"
 PER_Reclaiming_Iranian_Identity_2_desc:0 "We are reclaiming lands inhabited by our culture"
 PER_Imperial_Army_Of_Iran:0 "Imperial Army Of Iran"
 PER_Imperial_Army_Of_Iran_desc:0 "The Shah restores the armed forces as the backbone of imperial authority, loyal to the crown and ready to defend Iran’s sovereignty."
 PER_Imperial_Army_Of_Iran_2:0 "Improved Imperial Army Of Iran"
 PER_Imperial_Army_Of_Iran_2_desc:0 "With modern training and renewed discipline, the Imperial Army stands as a professional and formidable force in the region."
 PER_American_Investment:0 "American Investment"
 PER_American_Investment_desc:0 "Western capital and expertise flow into Iran, accelerating modernization while tying the empire closer to Washington."
 PER_METO_ARMY:0 "Middle Eastern United Army"
 PER_METO_ARMY_Desc:0 "United We Stand-Divived We Fall"
 PER_Pro_Iranian_Propaganda:0 "Pro-Iranian Propaganda"
 PER_Pro_Iranian_Propaganda_desc:0 "The Iranian regime has ramped up its propaganda campaign abroad, spreading anti-U.S. and anti-Israeli messages. Through rallies, demonstrations, and media influence, these efforts aim to bolster support for Iran’s ideology, destabilize opposing governments, and expand the regime’s regional influence."
 PER_Iranian_Military_Industrial_Complex_1:0 " "
 PER_Iranian_Military_Industrial_Complex_2:0 " "
 PRK_Hereditary_Dictatorship:0 "Hereditary Dictatorship"
 PRK_Hereditary_Dictatorship_desc:0 "To the outside world, the Democratic People's Republic of Korea appears frozen in time and sealed off, isolated, and ruled by a system long thought extinct. Power is inherited through blood, justified by ideology, and enforced through total control of society. Under the doctrine of Juche, the state rejects all foreign influence and demands absolute loyalty, creating a closed world of surveillance, indoctrination, and manufactured truth. What was once envisioned as revolutionary self-reliance has instead become a living warning a system resembling the darkest predictions of totalitarian rule, sustained by isolation and fear rather than progress.\n\n\n\n\n\n£PRK_Hereditary_State \n\n\n\n"
 PRK_Sanctioned_Command_Economy:0 "A Sanctioned Command Economy"
 PRK_Sanctioned_Command_Economy_desc:0 "Decades of international sanctions and rigid central planning have left the economy isolated and inefficient. While the state can direct resources toward strategic priorities, chronic shortages, outdated infrastructure, and limited trade continue to undermine productivity. \n\n\n\n\n\n\n\n£GFX_PRK_Sanctions \n\n\n\n"
 PRK_Sanctioned_Command_Economy_2:0 "A Sanctioned Command Economy"
 PRK_Sanctioned_Command_Economy_2_desc:0 "Decades of international sanctions and rigid central planning have left the economy isolated and inefficient. While the state can direct resources toward strategic priorities, chronic shortages, outdated infrastructure, and limited trade continue to undermine productivity.\n\n\n\n\n\n\n\n£GFX_PRK_Sanctions \n\n\n\n"
 PRK_Sanctioned_Command_Economy_3:0 "A Sanctioned Command Economy"
 PRK_Sanctioned_Command_Economy_3_desc:0 "Decades of international sanctions and rigid central planning have left the economy isolated and inefficient. While the state can direct resources toward strategic priorities, chronic shortages, outdated infrastructure, and limited trade continue to undermine productivity.\n\n\n\n\n\n\n\n£GFX_PRK_Sanctions \n\n\n\n"
 PRK_Sanctioned_Command_Economy_4:0 "A Sanctioned Command Economy"
 PRK_Sanctioned_Command_Economy_4_desc:0 "Decades of international sanctions and rigid central planning have left the economy isolated and inefficient. While the state can direct resources toward strategic priorities, chronic shortages, outdated infrastructure, and limited trade continue to undermine productivity.\n\n\n\n\n\n\n\n£GFX_PRK_Sanctions \n\n\n\n"
 PRK_Sanctioned_Command_Economy_5:0 "A Command Economy"
 PRK_Sanctioned_Command_Economy_5_desc:0 "Decades of poor management and rigid central planning have left our economy inefficient. While the state can direct resources toward strategic priorities, chronic shortages, outdated infrastructure, and limited trade continue to undermine productivity."
 PRK_Command_Economy:0 "A Functioning Command Economy"
 PRK_Command_Economy_desc:0 "We must maintain a strict command economy despite international sanctions. Factories, farms, and ministries operate under full state control. Every effort ensures production, self-reliance, and the survival of our nation."
 PRK_Allowe_Private_Enterprice:0 "Allow Private Enterprise"
 PRK_Allowe_Private_Enterprice_desc:0 "We must permit limited private businesses to strengthen the economy and improve living standards. Entrepreneurs and workers operate under Party guidance. Every enterprise contributes to the self-reliance and prosperity of our nation."
 PRK_Military_First_State:0 "Military-First State"
 PRK_Military_First_State_desc:0 "The Korean People's Army consumes a vast share of the nation’s resources. Civilian needs are routinely sacrificed to maintain one of the world’s largest standing armies, ensuring deterrence and regime survival at the cost of economic development.\n\n\n\n\n\n\n\n£PRK_Army \n\n\n\n"
 PRK_Military_First_State_2:0 "Korean Liberation Army"
 PRK_Military_First_State_2_desc:0 "The Korean People's Army consumes a vast share of the nation’s resources. Civilian needs are routinely sacrificed to maintain one of the world’s largest standing armies, ensuring deterrence and regime survival at the cost of economic development.\n\n\n\n\n\n\n\n£PRK_Army \n\n\n\n"
 PRK_Trust_In_The_System:0 "Trust in the System"
 PRK_Trust_In_The_System_desc:0 "Order is maintained not through debate, but through confidence in established authority. Citizens are reminded that the system has endured famine, isolation, and war, and that survival itself is proof of its correctness. Loyalty is framed as common sense, and stability as the reward for compliance."
 PRK_Trust_In_The_System_2:0 "Trust in the System"
 PRK_Trust_In_The_System_2_desc:0 "Order is maintained not through debate, but through confidence in established authority. Citizens are reminded that the system has endured famine, isolation, and war, and that survival itself is proof of its correctness. Loyalty is framed as common sense, and stability as the reward for compliance."
 PRK_Covering_Up_Failure:0 "Sloppy Cover-Up"
 PRK_Covering_Up_Failure_desc:0 "The recent missile test did not go as planned, but Party officials are quickly scrambling to cover up the failure. Rumors are quietly suppressed, reports rewritten, and blame shifted to minor technical errors. The Supreme Leader’s authority must remain unchallenged, yet the mishandling risks undermining confidence within the military and the population."
 PRK_The_Peoples_Salvation_Junta:0 "The People's Salvation Junta"
 PRK_The_Peoples_Salvation_Junta_desc:0 "The Korean People's Army has assumed direct control of the state under the banner of national salvation. The junta claims to act in the name of stability, security, and survival, presenting itself as a temporary guardian of the revolution. In reality, political power is now concentrated entirely in military hands."
 Chollima_Steel_Complex:0 "Chollima Steel Complex"
 PRK_Print_More_Won:0 "Print More Won"
 PRK_Print_More_Won_desc:0 "We must increase the issuance of the won to fund state programs and military needs. The Central Bank acts under direct Party supervision to stabilize production and supply. Though risky, this measure keeps the state functioning under pressure."
 PRK_Mining_Ministry:0 "Ministry of Mining"
 PRK_Mining_Ministry_desc:0 "We must expand and centralize mining operations to extract every resource our land can provide. The Ministry oversees coal, iron, and rare materials vital to industry and the military. Every ton mined strengthens our self-reliance and endurance under sanctions."
 PRK_Investing_In_Fortification:0 "Build The Great Wall Of Korea"
 PRK_Investing_In_Fortification_desc:0 "We must strengthen our defenses along the Demilitarized Zone to deter aggression from the South. Concrete, steel, and manpower are poured into bunkers, tunnels, and fortified positions. Every fortification ensures the security and survival of our nation."
 PRK_Repressing_Protestors:0 "Repressing Protestors"
 PRK_Repressing_Protestors_desc:0 "Any dissent against the new leadership is swiftly and ruthlessly crushed. Demonstrations are met with arrests, intimidation, and force to ensure order. The people learn quickly that rebellion carries a heavy cost, and obedience is the path to survival."
 PRK_Juche_Dismantled:0 "Juche Dismantled"
 PRK_Juche_Dismantled_desc:0 "The rigid ideology of Juche has been formally abandoned. North Korea seeks to reconstruct its society and governance, opening the door to new economic policies, foreign relations, and social reforms."
 PRK_Kim_il_Sung:0 "The Eternal President"
 PRK_Kim_il_Sung_desc:0 "Despite recent upheavals, the leadership has chosen to preserve the Kim family’s legacy. The ruling dynasty remains the symbol of national unity and the guiding force of the state."
 PRK_Internet_Censorship:0 "Controlled Information Space"
 PRK_Internet_Censorship_desc:0 "We maintain strict control over digital communications to protect national security and ideological unity. All online activity is monitored and filtered through state-approved systems, ensuring that hostile foreign influence cannot undermine discipline, morale, or social stability."
 PRK_Anti_Corruption_Drive:0 "Crackdown on Corruption"
 PRK_Anti_Corruption_Drive_desc:0 "We are purging corruption from every level of government and the military to strengthen discipline and ensure loyalty. By rooting out those who abuse their positions, we protect the state, consolidate power, and guarantee that the revolution’s goals are pursued without compromise."
 PRK_Ukrainian_Voulenteers:0 "International Revolutionary Volunteers"
 PRK_Ukrainian_Voulenteers_desc:0 "We authorize the deployment of selected personnel abroad under the banner of international solidarity. By sending volunteers to foreign battlefields, we gain valuable combat experience, strengthen strategic partnerships, and demonstrate our commitment to confronting hostile forces beyond our borders."
 PRK_Nuclear_Program:0 "Korean Nuclear Program"
 PRK_Nuclear_Program_desc:0 "We continue the development of our nuclear forces to guarantee the survival of the state and the security of the nation. Faced with hostile encirclement and constant threats, a credible nuclear deterrent ensures that no enemy can impose its will upon us. This program stands as the ultimate safeguard of sovereignty and independence."
 PRK_Nuclear_Program_2:0 "We continue the development of our nuclear forces to guarantee the survival of the state and the security of the nation. Faced with hostile encirclement and constant threats, a credible nuclear deterrent ensures that no enemy can impose its will upon us. This program stands as the ultimate safeguard of sovereignty and independence."
 PRK_Train_Production:0 "Centralized Rail Production"
 PRK_Train_Production_desc:0 "We prioritize the mass production and maintenance of railway equipment to sustain industry, logistics, and military mobilization. By expanding domestic train manufacturing under centralized control, we ensure that troops, resources, and supplies move efficiently across the republic, even under conditions of blockade or war."
 PRK_Infantry_Equipment_Focus:0 "Infantry Equipment Focus"
 PRK_Infantry_Equipment_Focus_desc:0 "We concentrate our industrial and military resources on equipping the infantry, the backbone of our armed forces. By prioritizing small arms, protective gear, and battlefield supplies, we ensure that every soldier is prepared to fight, endure, and prevail under even the harshest conditions."
 PRK_Artilery_Focus:0 "Artillery Equipment Focus"
 PRK_Artilery_Focus_desc:0 "We expand and modernize our artillery forces to dominate the battlefield through overwhelming firepower. Long-range guns, rocket systems, and massed bombardment form the core of our doctrine, allowing us to break enemy defenses before decisive advances are made."
 PRK_Alone_We_Are_Strongest:0 "Alone, We Are Strongest"
 PRK_Alone_We_Are_Strongest_desc:0 "We rely on our own strength, discipline, and unity rather than the promises of foreign powers. Through self-reliance and national determination, we prove that independence is our greatest weapon and that no external force is necessary for our survival."
 PRK_Alone_We_Are_Strongest_2:0 "Alone, We Are Strongest"
 PRK_Alone_We_Are_Strongest_2_desc:0 "We rely on our own strength, discipline, and unity rather than the promises of foreign powers. Through self-reliance and national determination, we prove that independence is our greatest weapon and that no external force is necessary for our survival."
 PRK_Alone_We_Are_Strongest_3:0 "Alone, We Are Strongest"
 PRK_Alone_We_Are_Strongest_3_desc:0 "We rely on our own strength, discipline, and unity rather than the promises of foreign powers. Through self-reliance and national determination, we prove that independence is our greatest weapon and that no external force is necessary for our survival."
 GER_Die_Linke_Government:0 "Die Linke Government"
 GER_Die_Linke_Government_desc:0 "For the first time in history, Die Linke has formed an government"
 PER_Nuclear_Situation:0 "Red Lines"
 SOV_Russian_Military_Industrial_Complex:0 "Russian Military Industrial Complex"
 SOV_Russian_Military_Industrial_Complex_desc:0 "The backbone of our military strength lies in a vast and deeply entrenched network of state enterprises, defense contractors, and research institutions. Though often plagued by inefficiency and corruption, this complex remains capable of sustaining prolonged conflict and rapidly expanding production when needed. With proper investment and reform, it could once again become a cornerstone of Russian power."
 SOV_Ruble_Inflation:0 "Ruble Inflation"
 SOV_Ruble_Inflation_desc:0 "In an effort to cope with the weight of international sanctions, the state has resorted to expanding the money supply. While this provides short-term relief, it fuels rising inflation, weakens purchasing power, and risks long-term economic instability."
 SOV_Russia_As_The_Worlds_Factory:0 "Russia as The World's Factory"
 SOV_Russia_As_The_Worlds_Factory_desc:0 "Having weathered the sanctions crisis, Russia now seeks to assert itself as a global industrial powerhouse. By modernizing factories, expanding production, and exporting goods worldwide, we can strengthen our economy, increase influence, and demonstrate that Russian industry is a cornerstone of the global market."
 SOV_Russian_War_Economy:0 "The Russian War Economy"
 SOV_Russian_War_Economy_desc:0 "With sanctions behind us, Russia turns decisively toward militarization. Civilian industry is subordinated to the needs of the armed forces, as factories, research, and resources are redirected to sustain a permanent war footing. Though this approach places heavy burdens on the population, it ensures that Russia remains a formidable military power in a hostile world."
 SOV_Turning_The_Earth_Upside_Down:0 "Turning the Earth Upside Down"
 SOV_Turning_The_Earth_Upside_Down_desc:0 "To overcome sanctions and secure economic dominance, Russia now turns to its vast natural wealth. Mines, oil fields, forests, and rivers will be exploited to their fullest, ensuring the state’s coffers are filled. While this path prioritizes raw resources over civilian needs, it will fuel industry, military power, and our influence across the world."
 PER_Strenghtened_Clergy:0 "The Assembly of Expert"
 PER_Strenghtened_Clergy_desc:0 "The Assembly of Expertsl is the deliberative body of Iran empowered to appoint, supervise, and discharge the Supreme Leader of Iran. The assembly consists of 88 members who are directly elected by the public to serve eight-year terms"
 SOV_Disloyalties_In_The_Military:0 "Disloyalties in the Military"
 SOV_Disloyalties_In_The_Military_desc:0 "The armed forces are no longer as unified as they appear on paper. Units hesitate to obey orders, commanders question loyalties, and some openly sympathize with rogue formations. The state’s control over its own military is weakening at a dangerous moment."
 SOV_Military_Loyal_To_Pregozin:0 "Military Loyal to Prigozhin"
 SOV_Military_Loyal_To_Pregozin_desc:0 "The military now serves a single command structure under Prigozhin. The army is no longer divided. It's Pregozins cornerstone to power"
 SOV_Ortodox_Church_Supportive:0 "Orthodox Church Supportive"
 SOV_Ortodox_Church_Supportive_desc:0 "The demands of the Orthodox Church have been met, and in return it lends its full support to the state. Religious authorities reinforce legitimacy, promote unity, and help stabilize society during a time of uncertainty."
 SOV_Ortodox_Church_Discrunteled:0 "Orthodox Church Discontent"
 SOV_Ortodox_Church_Discrunteled_desc:0 "The leadership has failed to meet the expectations of the Orthodox Church. As a result, relations have soured, weakening legitimacy and allowing dissatisfaction to spread among the faithful."
 SOV_Rising_National_Pride:0 "Rising National Pride"
 SOV_Rising_National_Pride_desc:0 "A renewed sense of national pride begins to take hold. Through messaging, symbolism, and a focus on shared identity, the population is encouraged to rally behind the state and look forward with confidence."
 SOV_A_Professional_Army:0 "A Professional Army"
 SOV_A_Professional_Army_desc:0 "The era of mass mobilization is behind us. The state now turns toward a highly trained, well-equipped, and disciplined professional force. By investing in quality over quantity, our armed forces will become more effective on the modern battlefield, capable of rapid deployment and superior coordination. However, this shift reduces the pool of available manpower, making every soldier more valuable than ever."
 SOV_Cursader:0 "Crusade"
 SOV_Cursader_desc:0 "Russia is going on a crusade"
 SOV_Democracy_Protests:0 "Pro-Democracy Protests"
 SOV_Democracy_Protests_desc:0 "The streets have filled with Russians demanding an end to authoritarian rule and the establishment of genuine democratic government. Demonstrations continue to spread despite attempts by the authorities to restore order."
 HAM_special_assault_units:0 "Special Assault Units"
 HAM_special_assault_units_desc:0 "Hamas has moved towards a more 'professionalized' army, consisting of proper special forces brigades rather than standalone militants"
