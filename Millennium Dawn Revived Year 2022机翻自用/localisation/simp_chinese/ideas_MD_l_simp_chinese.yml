 UKR_catastrophic_economic_situation_3:0 "Recovering Economy"
 UKR_Democratic_Restructuring:0 "Democratic Restructuring"
 UKR_Liberal_Constitution:0 "Liberal Constitution"
 UKR_Liberal_Constitution_desc:0 "The new Ukrainian constitution is built on liberal principles"
 UKR_Conservative_Constitution:0 "Conservative Constitution"
 UKR_Conservative_Constitution_desc:0 "The new Ukrainian constitution is built on conservative principles"
 UKR_surprise_invasion:0 "Surprise Invasion"
 UKR_a_nato_standard_army:0 "NATO Standard Training"
