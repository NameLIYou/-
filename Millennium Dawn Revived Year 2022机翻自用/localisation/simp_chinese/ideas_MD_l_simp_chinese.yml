 idea_focus_PRC_china_dream:0 "Our Dream"
 idea_focus_PRC_china_dream_desc:0 "Nationalist forces control the Chinese government, promoting militant patriotism and calling for China to take its place as Asia's sole superpower."
 idea_focus_PRC_china_dream2:0 "Our Dream"
 idea_focus_PRC_china_dream2_desc:0 "Nationalist forces control the Chinese government, promoting militant patriotism and calling for China to take its place as Asia's sole superpower."
 idea_focus_PRC_core_interests:0 "Core Interests"
 idea_focus_PRC_core_interests_desc:0 "The People's Republic must secure its core national interests in order to rise to greatness."
 idea_focus_PRC_democracy:0 "Jade Spring"
 idea_focus_PRC_democracy_desc:0 "The People's Republic of China is being swept by a pro-democracy, anti-corruption movement known as the Jade Spring, ushering in unprecedented political change."
 idea_focus_PRC_economic_liberalization:0 "Economic Liberalization"
 idea_focus_PRC_educational_exchanges:0 "Educational Exchanges"
 idea_focus_PRC_free_markets:0 "Free Markets"
 idea_focus_PRC_new_republic:0 "The New Republic"
 idea_focus_PRC_new_republic_desc:0 "After centuries of hardship and tribulation, China stands united under true democracy! Long live the New Chinese Republic!"
 idea_focus_PRC_patriotic_broadcasts:0 "Patriotic Broadcasts"
 idea_focus_PRC_restored_republic:0 "Restored Republic"
 idea_focus_PRC_restored_republic_desc:0 "We have inaugurated a new democratic system in the tradition of Sun Yat-Sen, the father of Chinese Democracy. Long live the Third Republic!"
 idea_focus_PRC_serve_people:0 "To Serve The People!"
 idea_focus_PRC_serve_people_desc:0 "Once the motto of the Party, the Chinese People call on the leadership to return to Communist Principles adn Embrace the teachings of Chairman Mao once again."
 idea_focus_PRC_Worlds_Factory2:0 "Chinese Production"
 idea_focus_PRC_Worlds_Factory2_desc:0 "China has cemented its place as the workshop of the world. Decades of infrastructure development, low labor costs, and strategic planning have made Chinese industry a global cornerstone. With sprawling megafactories and supply chains that reach every continent, China can produce anything at scale and fast."
 idea_focus_PRC_Worlds_Factory3:0 "Chinese Production"
 idea_focus_PRC_Worlds_Factory3_desc:0 "China has cemented its place as the workshop of the world. Decades of infrastructure development, low labor costs, and strategic planning have made Chinese industry a global cornerstone. With sprawling megafactories and supply chains that reach every continent, China can produce anything at scale and fast."
 idea_focus_PRC_Worlds_Factory4:0 "Chinese Production"
 idea_focus_PRC_Worlds_Factory4_desc:0 "China has cemented its place as the workshop of the world. Decades of infrastructure development, low labor costs, and strategic planning have made Chinese industry a global cornerstone. With sprawling megafactories and supply chains that reach every continent, China can produce anything at scale and fast."
