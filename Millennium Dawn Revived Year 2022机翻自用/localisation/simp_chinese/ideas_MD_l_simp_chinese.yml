 idea_focus_PRC_vehicle_production:0 "Vehicle Production Focus"
 chinese_debt:0 "In Debt to China"
 chinese_birth_rates:0 "Aftermath of the 2 Child Policy"
 chinese_birth_rates_desc:0 "In the wake of the 1, 2, and 3 Child Policy, efforts to reduce population size, we are now looking towards a potential population crisis, with birth rates remaining low despite the lifts on the bans."
 pakistan_financial_reliance:0 "Financial Reliance on China"
 chinese_invasion_plans:0 "Chinese Invasion Plans"
 idea_GER_german_legacy:0 "German Legacy"
 idea_GER_german_legacy_desc:0 "Germany has survived both the vicious influences of fascism and communism. The German people have become deeply connected with the ideals of liberal democracy and are unlikely to accept tyranny once again."
 idea_HLS_holy_see:0 "The Holy See"
 idea_HLS_holy_see_desc:0 "Vatican City is the center of catholicism, with a population hand-selected by the pope and his advisers. There is no way that his country is ever ruled by anyone but the pope."
 ISR_Jewish_State:0 "The Jewish State"
 ISR_Jewish_State_desc:0 "Forged in the aftermath of centuries of persecution and displacement, Israel stands as a homeland for the Jewish people. Yet its existence remains contested, surrounded by regional tensions and persistent security threats. Vigilance, unity, and resilience are essential for its survival."
 ISR_army_modifier:0 "The Israel Defense Forces"
 idea_JAP_emperor_akihito:0 "Emperor Akihito"
 idea_JAP_emperor_akihito_desc:0 "His imperial highness Akihito, son of Hirohito, is the Emperor of Japan. He, though he holds no real power, is a source of great happiness and calmness for the Japanese people. He stands for what connects the Empire of old with the Republic of now. He stands for what connects the veterans of the wars Japan faced with the young people who have no idea of such things."
 idea_mrt_referendum:0 "Constitutional Referendum"
 idea_mrt_referendum_desc:0 "The Mauritanian Constitutional Referendum of 2017 established greater powers for the President and National Assembly, including abolition of the Senate."
 idea_PRC_chinese_socialism:0 "Socialism with Chinese Characteristics"
 idea_PRC_chinese_socialism_desc:0 "China has worked on polishing classical communist teachings and to make them actually applicable to the modern world. Jiang Zemin has laid the foundation of Socialism with Chinese Characteristics, which is a teaching of maoist ideals that allows for capitalism to run freely in certain areas of the country, like Shanghai or Beijing."
 idea_RAJ_south_asian_tiger:0 "The Tiger of South Asia"
 idea_RAJ_south_asian_tiger_desc:0 "India, birthplace of hinduism, one of of the greatest nations on earth, has finally recovered from centuries of colonialism and endless hardship. Let the enemies of India know that there is a tiger on the prowl - perhaps not visible, but definitely dangerous."
 SOV_State_Propaganda:0 "Outlandish State Propaganda"
 SOV_State_Propaganda_desc:0 "The regime has a total monopoly on the media and frame any issue in our favour, swaying the political sphere. However many of our people are perfectly capable of seeing trough it. \n\n\n\n\n\n£GFX_SOV_First_Channel \n\n\n\n"
 idea_SWE_king_charles_xvi:0 "King Carl XVI Gustaf"
 idea_SWE_king_charles_xvi_desc:0 "King Carl XVI is the king of Sweden and therefore the head of state. He took power in 1973 when his grandfather Gustav VI Adolf passed away. He is the seventh regent of the Bernadotte House and the seventy-fourth king of Sweden."
 idea_united_nations_security_council_member:0 "Permanent UNSC Member"
 idea_united_nations_security_council_member_desc:0 "[ROOT.GetNonIdeologyNameDef] has a permanent seat on the Security Council of the United Nations.\n\n\n\n\n\n£GFX_Un_Security_Council \n\n\n\n"
 idea_united_nations_NP_security_council_member:0 "Non-permanent UNSC Member"
 idea_united_nations_NP_security_council_member_desc:0 "[ROOT.GetNonIdeologyNameDef] has been elected to the United Nations Security Council for a two-year term."
 idea_USA_political_establishment: "Political Establishment"
 idea_USA_political_establishment_desc: "Since times immemorial, the voting system employed by American democracy has constrained American voters to only two parties: The big one that is in power and the big one that is not. Republicans and Democrats are indefinitely in a stalemate, not allowing for any other party to flourish.\n\n\n\n\n\n£GFX_USA_establishment \n\n\n\n"
 idea_USA_drone_program:0 "Drone Program"
 idea_USA_drone_program_desc:0 "The United States Air Force has decided that conventional aircraft are too expensive and losing their pilots too costly to justify a continuation of old aerial warfare. Predator Drones should be the new focus of the United States Air Force."
 idea_USA_united_republic:0 "The United Republic"
 idea_USA_united_republic_desc:0 "With the Tenth Amendment revoked and the country reunited, the power of the Federal Government is now absolute. The giant has truly awoken."
 idea_USA_new_education_program:0 "New Education Program"
 idea_USA_new_education_program_desc:0 "The United States has made significant investments in the Research and Public Education Sector. This should improve its standing in the world of science, will however hinder its economic growth."
 ideological_defense:0 "Ideological Defense"
 infrastructure_project:0 "Infrastructure Project"
 infrastructure_project2:0 "Infrastructure Project"
 infrastructure_project3:0 "Infrastructure Project"
 islamic_sectarian_conflicts:0 "Islamic Sectarian Conflicts"
 islamic_sectarian_conflicts_desc:0 "Islam is divided into many sects, but three main groups have established themselves: Sunni (88% of global muslims), Shia (10% of global muslims) and Kharijite/Ibadi (about 1% of global muslims). These groups have several doctrinal disputes, but especially the rivalry between sunnis and shiites has, over the centuries, given ground to conflict again and again and again, be it either genuine theological disputes or just an alibi for territorial conflict or ethnic violence.\n\n[ROOT.GetNonIdeologyNameDef] holds both significant sunni and shiite populations, leading to a deep distrust from either side in the other - be it in places of worship, in government positions or areas of everyday public life."
 ITA_buona_scuola_research:0 "School Subsidies"
 ITA_bureaucratic_reforms_research:0 "Bureaucratic Reforms"
 ITA_corruption:0 "Corruption"
 ITA_corruption_desc:0 "The Italian political system is far less stable and unbiased than comparable European systems. Cronyism and nepotism are huge problems in local administration, the judiciary and even the federal government."
 ITA_economic_reforms_research:0 "Economic Reforms"
 ITA_education_reforms_research:0 "Education Reforms"
 ITA_european_logistics_goods:0 "New Logistics"
 ITA_european_logistics_ideology_focus:0 "European Logistics"
 ITA_going_fascist1:0 "Drift towards Authoritharianism"
 ITA_going_fascist1_desc:0 "Our country is drifting towards Authoritharianism"
 ITA_going_fascist2:0 "Drift towards Fascism"
 ITA_going_fascist2_desc:0 "Our country is drifting towards Fascism"
 ITA_going_monarchist:0 "Drift towards Monarchism"
 ITA_going_monarchist_desc:0 "Our country is drifting towards Monarchism"
 ITA_going_democratic:0 "Drift towards Democracy"
 ITA_going_democratic_desc:0 "Our country is drifting towards Democracy"
 ITA_mafia:0 "The Mafia"
 ITA_mafia_desc:0 "Organized crime is an immense problem in Italy. Especially in the south of the country, local businesses are threatened and pushed around by the mafia, which also bribes officials and threatens the police and prosecutors that try to hunt the criminals down."
 ITA_north_miracle_industry:0 "North Italian Industries"
 ITA_north_miracle_industry_desc:0 "The rapid expansion of the industrial complex in Northern Italy after the war resulted into the Italian Economic Miracle, which transformed Italy from a poor, mainly rural, nation into a major industrial power"
 ITA_parliament_dismantled:0 "Parliament Dismantled"
 ITA_parliament_dismantled_desc:0 "There is no need for a Parliament now that the Savoy dinasty has been restablished. We need to dismantle it to ensure the Absolute rule of our King"
 ITA_kingdom_restored:0 "Restoration of the Savoy Dinasty"
 ITA_kingdom_restored_desc:0 "The Savoy dinasty has been restablished. Italy is now a Kingdom once again"
 ITA_new_march_on_rome:0 "Return of Fascism"
 ITA_southern_question:0 "The Stubborn South"
 ITA_southern_question_desc:0 "Southern Italy has always been stubborn towards the Savoy dinasty. Back when Italy was united, the Expediction of the Thousand committed an 'act of conquest' in southerners opinion, and therefore they are now opposing our King"
 ITA_migrants_from_africa:0 "Illegal Immigration from Africa"
 ITA_migrants_from_africa_encouraged:0 "Immigration from Northern Africa encouraged"
 ITA_migrants_from_africa_limited:0 "Immigration from Africa discouraged"
 ITA_restore_the_currency_idea:0 "Restored the Currency"
 ITA_reactionary_influence:0 "Italian support to Reactionary Party"
 ITA_italy_first_development:0 "Italian Development"
 ITA_quality_army:0 "Army of Quality"
 ITA_quantity_army:0 "Army of Quantity"
 ITA_national_research_bonus:0 "National Research"
 ITA_mafia_curtailed:0 "The Mafia Curtailed"
 ITA_mafia_curtailed_desc:0 "Organized crime is an immense problem in Italy. Especially in the south of the country, local businesses are threatened and pushed around by the mafia, which also bribes officials and threatens the police and prosecutors that try to hunt the criminals down. However, the Italian state has began fighting back the Mafia, and their power is now lowered"
 ITA_mafia_sabotages_industry:0 "Mafia Sabotages Industries"
 ITA_mafia_sabotages_military:0 "Mafia Sabotages Military"
