 SOV_corrupt_oligarchy:0 "Corrupt Oligarchy"
 SOV_corrupt_oligarchy_desc:0 "\n\n\n\n\n\n£GFX_SOV_Oligarchs \n\n\n\n"
 SOV_Western_Sanction:0 "Strong Western Sanctions"
 SOV_Western_Sanction_desc:0 "After our special military operation NATO and the EU have laid historic sanctions on us, paralizing our economy."
 SOV_Western_Sanction_2:0 "Coping With Sanctions"
 SOV_Western_Sanction_2_desc:0 "Following our special military operation, NATO and the European Union have imposed historic sanctions aimed at crippling our economy. While the initial shock was severe, recent measures have brought relative stability to the ruble and allowed us to begin adjusting to this new reality. The road ahead remains difficult, but we are no longer in freefall."
 SOV_Central_Asian_Imigration:0 "Central Asian Immigration"
 SOV_Central_Asian_Imigration_desc:0 "As labor shortages and demographic decline intensify, Russia has increasingly turned to immigration from Central Asia to fill the gaps. Workers from countries such as Uzbekistan, Tajikistan, and Kyrgyzstan are arriving in growing numbers, supporting construction, industry, and logistics. While this influx helps sustain economic activity, it also raises social and political challenges at home."
 SOV_corrupt_oligarchy_purge:0 "Cleansing the Oligarchic Virus"
 SOV_corrupt_oligarchy_purge_desc:0 "For decades, the oligarchy has been a parasite feeding off the Russian state — hoarding wealth, corrupting politics, and undermining national sovereignty. Now, at last, the regime has moved to excise this cancer. The process is painful: economic disruptions, elite resistance, and internal uncertainty. But in time, a leaner and stronger Russia will emerge from the ashes of oligarchic decay."
 SOV_Surprise_Invasion:0 "Surprise Invasion"
 SOV_Surprise_Invasion_desc:0 "With our forces launching a rapid and unexpected assault, we have caught our enemies off guard. Our troops advance with overwhelming momentum, securing key strategic positions before the enemy can mount an effective resistance. However, this advantage will not last forever—our forces must press forward before the initial shock wears off."
 SOV_Victory_In_Ukraine:0 "Bliz Victory In Ukraine"
 SOV_Victory_In_Ukraine_desc:0 "With Ukraine firmly under our control, our strategic objectives have been achieved. The Russian Armed Forces stand victorious, and our administration is swiftly reorganizing the region to ensure stability and integration. This triumph cements Russia’s dominance in the region and sends a clear message to the world about our strength and determination."
 SOV_Modern_Day_Police_State:0 "Modern Day Police State"
 SOV_Modern_Day_Police_State_desc:0 "Under the watchful eye of an all-powerful state, every movement, every word, and every thought is scrutinized. The streets are filled with surveillance, and the government controls the narrative through fear and intimidation. Privacy is a thing of the past; the people live under constant vigilance, where dissent is met with swift retribution. In this new Russia, the state reigns supreme, and personal freedoms are a distant memory."
 SOV_Reformed_Army:0 "Reformed Conscript Army"
 SOV_Reformed_Army_desc:0 "We hade reformed our armed forces to be a more formidable enemy"
 steel_production_bonus:0 "Steel Production Bonus"
 SWE_lucrative_dlc_policy:0 "Lucrative DLC Policy"
 SWE_lucrative_dlc_policy_desc:0 "The Swedish government is making a fortune by financing state propaganda video games that have made it an important practice to look vital gameplay features behind paywalls, gaining great funds from gamers to fund the Swedish war machine."
 swiss_political_system:0 "Political System of Switzerland"
 swiss_political_system_desc:0 "Switzerland has a very unique political system and is the only country in the world that can rightfully call itself a 'semi-direct democracy'. Citizens can change the constitution per referendum, can veto laws per referendum, can even pass laws per referendum.\nThis has implications for politicians however: Because the people make the policies either way, the Swiss coalition system has to include as many forces as possible. The four big parties of Switzerland, SVP, FDP, CVP and SP, are constantly in government together - this makes national elections in Switzerland more or less useless - as the people rule not through their representatives, but through referendums."
 the_euro:0 "The Euro"
 the_euro_desc:0 "[ROOT.GetName] uses the Euro as its currency. While the national bank has thus given up control over its national currency, the economy is likely to profit from larger and more easily accessable markets.\n\n\n\n\n\n£GFX_Euro \n\n\n\n"
