 EST_communist_party_banned:0 "Communist Party Banned"
 EST_communist_party_banned_desc:0 "The Communist Party Of Estonia has been banned since 1990. Estonia's population is generally opposed to communism due to the memories of the USSR's rule in Estonia."
 EST_russian_minority:0 "Russian Minority"
 EST_russian_minority_desc:0 "The Russians are the second largest ethnic group in Estonia, making up around 25% of the population. Some of them demand closer ties to russia while some of the estonians fervently oppose them. This ethnic tension may very well lead to riots. It may also be used by Russia for a possible annexation on Ida-Virumaa."
 FIN_king_donatus:0 "King Donatus of Finland"
 FIN_king_donatus_desc:0 "When the Finnish government restored the throne of the German-born Kings of Finland, Donatus was chosen to become the constitutional monarch of the Finnish people. Initially unpopular, Donatus, who now lives in Helsinki, is working hard to learn Finnish and still earns money through his job as an economist, very much presenting himself as a monarch of the people. His dedication and genuine happiness are slowly winning the Finnish people over."
 FIN_Stubb:0 "Alexander Stubb"
 FIN_Stubb_desc:0 "Alexander Stubb, Finland’s 13th President, is a long-time figure in Finnish politics. Coming from the National Coalition Party, he’s known for his confident energy, fluent languages, and firm belief in Europe and international cooperation. Before his presidency, Stubb served as Prime Minister and Foreign Minister, always carrying the image of a modern, outward-looking Finn. \n\n\n\n\n\n\n\n£GFX_AlexanderStubb \n\n\n\n\n\n"
 FIN_Niinisto:0 "Sauli Niinistö"
 FIN_Niinisto_desc:0 "Sauli Niinistö, Finland’s 12th President, is a man of calm authority and traditional values. A member of the National Coalition Party, he guided Finland through uncertain years with his steady hand and quiet diplomacy. Due to the constitution, he cannot run for a third term in 2024, marking the end of an era for Finnish leadership. \n\n\n\n\n\n\n\n£GFX_SauliNiinisto \n\n\n\n\n\n"
 FIN_Haavisto:0 "Pekka Haavisto"
 FIN_Haavisto_desc:0 "Pekka Haavisto has been a familiar voice in Finnish politics for decades. A Green League veteran, diplomat, and idealist, Haavisto’s career has been shaped by peace negotiations, climate work, and his calm, thoughtful style. For many, he represents Finland’s open, progressive side one looking outward with compassion and reason. \n\n\n\n\n\n\n\n£GFX_PekkaHaavisto \n\n\n\n\n\n"
 FIN_Jussi_Halla-aho:0 "Jussi Halla-Aho"
 FIN_Jussi_Halla-aho_desc:0 "Jussi Halla-Aho rose from the blogosphere to become one of Finland’s most talked-about political figures. Leading the Finns Party through turbulent years, he built his reputation on nationalism, sharp words, and criticism of mass immigration. To his supporters, he speaks truth without fear — to others, he’s a polarizing symbol of modern populism. \n\n\n\n\n\n\n\n£GFX_JussiHallaAho \n\n\n\n\n\n"
