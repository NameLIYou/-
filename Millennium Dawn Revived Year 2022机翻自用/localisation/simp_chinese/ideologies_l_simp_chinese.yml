 islamist_ideology_desc:0 "§YIslamism§! is a political ideology that seeks to organize the state and society according to the principles of Islam. While its interpretations vary widely, Islamists generally believe that religion should play a central role in government, law, and public life rather than being confined solely to private worship.\n\n Modern Islamism emerged during the §Y19th and 20th centuries§! as Muslim intellectuals and political movements sought to respond to colonialism, secularization, and the decline of traditional Islamic empires. Different movements developed their own interpretations, ranging from democratic participation within an Islamic framework to the establishment of states governed entirely by religious law.\n\nAt its core, Islamism emphasizes the preservation of §YIslamic values§!, social morality, and the unity of the Muslim community. While all Islamist movements share these broad principles, they differ significantly in how they believe an Islamic state should be governed."
 nationalist_ideology_desc:0 "§YNationalism§! is a political ideology centered on the interests, identity, and sovereignty of the nation. Nationalists believe that each nation should remain politically independent, culturally unified, and protected from external influence.\n\nThe ideology developed during the §Y18th and 19th centuries§!, particularly following the French Revolution, as people increasingly identified themselves as members of nations rather than subjects of dynasties or empires. Nationalism played a major role in the formation of modern nation states and numerous independence movements around the world.\n\nWhile nationalist movements differ greatly in their political beliefs, they generally advocate strong national institutions, secure borders, and policies that place the interests of the nation above those of foreign powers or international organizations."
 monarchist_ideology_desc:0 "§YMonarchism§! is the belief that the state should be led by a hereditary monarch such as a king, queen, emperor, or similar sovereign. Monarchists regard the monarchy as a symbol of national continuity, legitimacy, and stability.\n\nFor much of recorded history, monarchy was the dominant form of government across Europe, Asia, Africa, and the Middle East. Although many monarchies gradually adopted constitutional systems during the §Y19th and 20th centuries§!, others retained significant royal authority.\n\nMonarchism emphasizes respect for historical institutions, national traditions, and established authority. Individual monarchist movements differ considerably in how much political power they believe the monarch should possess."
 reactionary_ideology_desc:0 "§YReactionarism m§! seeks to preserve or restore traditional institutions, values, and social structures that are believed to have been weakened by political or cultural change. Reactionaries are generally skeptical of rapid reform and often advocate reversing recent developments that they believe have harmed society.\n\nReactionary movements emerged as a response to the sweeping political and social transformations brought about by the §YFrench Revolution§! and later waves of liberalism, socialism, and nationalism. Throughout history they have taken many different forms depending on national traditions and circumstances.\n\nAlthough reactionary movements vary widely, they are generally united by their emphasis on §Ytradition§!, §Yauthority§!, and social continuity over revolutionary or rapid political change."
 conservative_ideology_desc:0 "§YConservatism§! is a political philosophy that values stability, tradition, and gradual change rather than rapid political or social transformation. Conservatives generally support established institutions, the rule of law, and responsible government while accepting reforms they consider necessary and practical.\n\nModern conservatism developed during the late §Y18th century§! in response to the political upheaval of the French Revolution. Since then it has evolved into one of the world's most influential political traditions, adapting to different national cultures while maintaining its emphasis on continuity and stability.\n\nAlthough conservative parties differ between countries, they commonly promote personal responsibility, national identity, private property, and the preservation of long-standing institutions."
 communism_ideology_desc:0 "§YCommunism§! is a revolutionary socialist ideology that seeks to establish a classless and stateless society through collective ownership of the means of production. Communists argue that capitalism inevitably produces exploitation and inequality that can only be overcome through fundamental social transformation.\n\nCommunist theory was developed during the §Y19th century§! by Karl Marx and Friedrich Engels before becoming the foundation of revolutionary movements across the world during the 20th century. Communist states adopted different political and economic systems while sharing the goal of building a socialist society.\n\nCommunism emphasizes collective ownership, economic planning, international solidarity among workers, and the eventual abolition of social classes."
 islamic_republican:0 "Islamic Republicanism"
 islamic_republican_desc:0 "§YIslamism§! is a political ideology that seeks to organize the state and society according to the principles of Islam. While its interpretations vary widely, Islamists generally believe that religion should play a central role in government, law, and public life rather than being confined solely to private worship.\n\nModern Islamism emerged during the §Y19th and 20th centuries§! as Muslim intellectuals and political movements sought to respond to colonialism, secularization, and the decline of traditional Islamic empires. Different movements developed their own interpretations, ranging from democratic participation within an Islamic framework to the establishment of states governed entirely by religious law.\n\nAt its core, Islamism emphasizes the preservation of §YIslamic values§!, social morality, and the unity of the Muslim community. While all Islamist movements share these broad principles, they differ significantly in how they believe an Islamic state should be governed."
 islamic_republican_subideology_desc:0 "§YIslamic Republicanism§! is a branch of Islamism that combines republican government with the belief that public institutions should be guided by Islamic principles. Supporters argue that elected governments, constitutions, and representative assemblies can coexist with Islamic law, provided legislation remains consistent with the moral teachings of Islam.\n\nThe ideology developed during the §Y20th century§! as reformist Muslim thinkers sought alternatives to both secular nationalism and hereditary monarchy. Rather than rejecting democratic institutions outright, Islamic Republicans attempted to reconcile popular sovereignty with religious authority, often advocating constitutional government rooted in Islamic values.\n\nIslamic Republicanism emphasizes §Yconstitutional government§!, political participation, and the preservation of Islamic morality. While accepting elections and representative institutions, it maintains that the legitimacy of the state ultimately rests upon adherence to Islamic principles rather than purely secular law."
 islamic_authoritarian:0 "Sharia Dictatorship"
 islamic_authoritarian_desc:0 "§YIslamism§! is a political ideology that seeks to organize the state and society according to the principles of Islam. While its interpretations vary widely, Islamists generally believe that religion should play a central role in government, law, and public life rather than being confined solely to private worship.\n\nModern Islamism emerged during the §Y19th and 20th centuries§! as Muslim intellectuals and political movements sought to respond to colonialism, secularization, and the decline of traditional Islamic empires. Different movements developed their own interpretations, ranging from democratic participation within an Islamic framework to the establishment of states governed entirely by religious law.\n\nAt its core, Islamism emphasizes the preservation of §YIslamic values§!, social morality, and the unity of the Muslim community. While all Islamist movements share these broad principles, they differ significantly in how they believe an Islamic state should be governed."
 islamic_authoritarian_subideology_desc:0 "§YSharia Dictatorship§! is an authoritarian branch of Islamism that seeks to place both political and religious authority in the hands of a single ruler or governing elite. It rejects liberal democracy, arguing that divine law is superior to the will of elected institutions and that the state has a duty to enforce religious obligations throughout society.\n\nModern authoritarian Islamist movements emerged during the §Y20th century§! in response to political instability, colonialism, and dissatisfaction with secular governments. Their supporters argued that only a strong centralized state could restore order, defend Islamic identity, and fully implement religious law.\n\nSharia Dictatorship emphasizes §Yreligious authority§!, centralized power, and strict enforcement of Islamic law. Individual liberties are generally considered secondary to maintaining social order, religious discipline, and the unity of the Muslim community."
 shia_democracy:0 "Shia Democracy"
 shia_democracy_desc:0 "§YIslamism§! is a political ideology that seeks to organize the state and society according to the principles of Islam. While its interpretations vary widely, Islamists generally believe that religion should play a central role in government, law, and public life rather than being confined solely to private worship.\n\nModern Islamism emerged during the §Y19th and 20th centuries§! as Muslim intellectuals and political movements sought to respond to colonialism, secularization, and the decline of traditional Islamic empires. Different movements developed their own interpretations, ranging from democratic participation within an Islamic framework to the establishment of states governed entirely by religious law.\n\nAt its core, Islamism emphasizes the preservation of §YIslamic values§!, social morality, and the unity of the Muslim community. While all Islamist movements share these broad principles, they differ significantly in how they believe an Islamic state should be governed."
 shia_democracy_subideology_desc:0 "§YShia Democracy§! is a branch of Islamism rooted in the religious traditions of Shia Islam while supporting representative government and constitutional institutions. Its supporters argue that democratic participation and Islamic teachings are compatible, provided political authority remains guided by religious ethics and the principles of justice found within Shia thought.\n\nThe ideology gained greater prominence during the §Ylate 20th century§!, particularly following debates within Shia political movements over the relationship between religious leadership, constitutional government, and popular sovereignty. Different movements have interpreted these ideas in different ways, producing both democratic and more clerically guided systems.\n\nShia Democracy emphasizes §Ypopular participation§!, social justice, and moral government while seeking to preserve the religious traditions and identity of Shia Islam within a constitutional political order."
 islamic_democrat:0 "Islamic Democracy"
 islamic_democrat_desc:0 "§YIslamism§! is a political ideology that seeks to organize the state and society according to the principles of Islam. While its interpretations vary widely, Islamists generally believe that religion should play a central role in government, law, and public life rather than being confined solely to private worship.\n\nModern Islamism emerged during the §Y19th and 20th centuries§! as Muslim intellectuals and political movements sought to respond to colonialism, secularization, and the decline of traditional Islamic empires. Different movements developed their own interpretations, ranging from democratic participation within an Islamic framework to the establishment of states governed entirely by religious law.\n\nAt its core, Islamism emphasizes the preservation of §YIslamic values§!, social morality, and the unity of the Muslim community. While all Islamist movements share these broad principles, they differ significantly in how they believe an Islamic state should be governed."
 islamic_democrat_subideology_desc:0 "§YIslamic Democracy§! is a moderate branch of Islamism that seeks to reconcile democratic government with Islamic values. Supporters believe that elections, constitutional government, and civil institutions can function within an Islamic society without abandoning the moral and ethical principles of the faith.\n\nThe ideology emerged during the §Ylate 20th century§! as Islamist parties increasingly participated in democratic politics across the Muslim world. Rather than advocating revolutionary change, many Islamic Democrats favored gradual political reform, constitutionalism, and cooperation within existing democratic institutions while promoting a greater role for religion in public life.\n\nIslamic Democracy emphasizes §Yconstitutional rule§!, political pluralism, and Islamic morality. It seeks to balance democratic legitimacy with religious tradition, arguing that popular government and Islamic principles can strengthen rather than contradict one another."
 fascist_ideology:0 "Classical Fascism"
 fascist_ideology_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 fascist_ideology_subideology_desc:0 "§YClassical Fascism§! is the original form of fascist political thought, advocating an authoritarian state that places the interests of the nation above those of the individual. It promotes national unity, centralized authority, militarism, and the belief that society should be organized under a single disciplined government capable of overcoming internal division and external threats.\n\nThe ideology originated in §YItaly after World War I§! under Benito Mussolini, who argued that liberal democracy and class conflict had weakened the nation. Fascism presented itself as a revolutionary alternative to both capitalism and communism, seeking to unite all social classes through a powerful state dedicated to national renewal and expansion.\n\nClassical Fascists believe that individual rights are secondary to the needs of the nation and that strong leadership is essential for political stability and national greatness. The ideology is defined by its commitment to §Yauthoritarian rule§!, §Ynational unity§!, and a state that directs society toward collective strength and purpose."
 black_supremacist:0 "Black Supremacy"
 black_supremacist_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 black_supremacist_subideology_desc:0 "§YBlack Supremacy§! is a racial nationalist ideology that argues people of African descent should establish political, cultural, or territorial dominance in order to secure their survival and self determination. While most Black nationalist movements have historically focused on equality or self government, Black supremacist currents advocate the superiority of Black peoples and the creation of states or societies organized around that belief.\n\nThe ideology emerged during the §Y20th century§! in response to colonialism, segregation, racial discrimination, and white supremacist rule. Although it has remained a fringe movement, it has occasionally appeared within revolutionary groups, separatist organizations, and extremist political movements that viewed racial separation or dominance as the only path to justice.\n\nSupporters generally advocate the creation of an ethnically defined state, strict racial separation, and government policies intended to secure the political and cultural dominance of Black populations. While different movements vary considerably, they are united by their emphasis on §Yracial identity§!, §Yseparatism§!, and collective solidarity."
 national_socialist:0 "National Socialism"
 national_socialist_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 national_socialist_subideology_desc:0 "§YNational Socialism§! is a totalitarian political ideology that combines extreme nationalism, racial ideology, and authoritarian rule under a single party and leader. It rejects liberal democracy, communism, and political pluralism while promoting a state organized around the perceived interests of a superior national or racial community.\n\nThe ideology was developed in §YGermany during the 1920s and 1930s§! under Adolf Hitler and the National Socialist German Workers' Party. It became the governing ideology of Nazi Germany, leading to aggressive territorial expansion, systematic political repression, and the Holocaust during the Second World War. Following Germany's defeat in 1945, National Socialism was outlawed throughout much of Europe and remains one of history's most widely condemned political ideologies.\n\nSupporters historically promoted a centralized one party state, racial hierarchy, militarization, and expansionism. National Socialism is defined by its commitment to §Yracial supremacy§!, §Ytotalitarian government§!, and absolute loyalty to the nation and its leader."
 falangist:0 "Falangism"
 falangist_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 falangist_subideology_desc:0 "§YFalangism§! is an authoritarian nationalist ideology that combines corporatism, Catholic social thought, and strong national unity under a centralized state. It rejects both liberal democracy and revolutionary socialism, arguing that society should be organized through cooperation between social classes rather than class conflict.\n\nThe ideology originated in §YSpain during the 1930s§! with the founding of the Falange Española by José Antonio Primo de Rivera. During the Spanish Civil War, Falangism became closely associated with Francisco Franco's Nationalist movement, although Franco later blended it with monarchist, conservative, and military traditions into a broader authoritarian system.\n\nFalangists advocate a disciplined national community built upon religion, patriotism, and service to the state. The ideology emphasizes §YCatholic values§!, §Ycorporatist economics§!, and national solidarity above individual or partisan interests."
 rexist:0 "Rexism"
 rexist_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 rexist_subideology_desc:0 "§YRexism§! is an authoritarian Catholic nationalist ideology that combines religious traditionalism with strong centralized government and corporatist economics. It rejects liberal democracy and parliamentary politics, arguing that society should instead be guided by moral authority, national unity, and Christian principles.\n\nThe movement emerged in §YBelgium during the 1930s§! under the leadership of Léon Degrelle. Originally founded as a conservative Catholic reform movement, Rexism gradually adopted increasingly authoritarian and fascist positions while drawing inspiration from developments in Italy and Germany. During the Second World War, the movement collaborated with Nazi Germany, leading to its political collapse after Belgium's liberation.\n\nRexist ideology promotes a disciplined Christian society, strong executive leadership, and cooperation between social classes. It is defined by its emphasis on §YCatholic traditionalism§!, §Yauthoritarian government§!, and national renewal through moral and political unity."
 warlordism:0 "Warlordism"
 warlordism_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 warlordism_subideology_desc:0 "§YWarlordism§! is a political system in which power is exercised primarily through military force by regional commanders rather than stable civilian institutions. Loyalty is directed toward individual leaders, armed factions, or personal networks instead of a unified national government, with political authority often depending upon military strength rather than constitutional legitimacy.\n\nWarlordism has appeared throughout history during periods of §Ystate collapse§!, civil war, or weak central authority. One of the best known examples was China during the early twentieth century, where competing military governors controlled large territories following the fall of the Qing Dynasty. Similar systems have emerged in numerous countries experiencing prolonged instability or conflict.\n\nSupporters of warlord rule often justify their authority through promises of security, order, and local stability in the absence of an effective national government. Warlordism is characterized by §Ypersonal rule§!, §Ymilitary dominance§!, and decentralized political authority maintained through armed power."
 christian_theocracy:0 "Christian Theocracy"
 christian_theocracy_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 christian_theocracy_subideology_desc:0 "§YChristian Theocracy§! is a political ideology that seeks to organize the state according to Christian doctrine, believing that civil authority should be guided by religious law and moral teachings derived from the Bible. Supporters argue that government should actively uphold Christian values and that political legitimacy is strengthened when rulers govern in accordance with God's will.\n\nThe idea of Christian government dates back to the §Ylate Roman Empire§! and the Middle Ages, when rulers often claimed divine authority and the Church exercised significant influence over political life. Throughout history, various kingdoms, principalities, and religious states have sought to place Christian teachings at the center of legislation and public administration, though the balance between church and state has varied considerably.\n\nChristian Theocrats advocate a government that protects traditional Christian morality, promotes religious values in public life, and derives its authority from both the state and the teachings of Christianity. The ideology is defined by its emphasis on §Yreligious authority§!, §YChristian morality§!, and governance guided by biblical principles."
 juche:0 "Juche"
 juche_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 juche_subideology_desc:0 "§YJuche§! is a political ideology centered on national self reliance, strong centralized leadership, and the belief that the state must remain politically, economically, and militarily independent from foreign influence. It teaches that the nation should determine its own destiny through unity, discipline, and complete loyalty to its leadership.\n\nDeveloped in §YNorth Korea during the 1950s§! under Kim Il Sung, Juche gradually replaced orthodox Marxism Leninism as the country's guiding ideology. While retaining socialist institutions, it placed increasing emphasis on nationalism, self sufficiency, and the supreme role of the leader. Over time, Juche evolved into a distinct political doctrine closely tied to the Kim family's rule and the unique historical circumstances of the Korean Peninsula.\n\nSupporters believe that only a unified nation led by a strong and independent state can resist foreign domination and preserve national sovereignty. Juche is defined by its emphasis on §Yself reliance§!, §Ynational independence§!, and unwavering loyalty to the state and its leadership."
 integralist:0 "Integralism"
 integralist_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 integralist_subideology_desc:0 "§YIntegralism§! is a political ideology that seeks to unify state authority and religious doctrine into a single coherent system, where political legitimacy is derived from the moral and spiritual order of society. It rejects liberalism, secular governance, and pluralism, arguing that the state must actively uphold and enforce a unified moral framework rooted in religious tradition.\n\nThe ideology developed primarily within §YCatholic political thought during the 19th and early 20th centuries§!, particularly in response to secularization, revolutions, and the decline of traditional monarchies. Integralists argued that separating religion from politics weakened both institutions and led to moral and social decay. In various forms, it influenced movements in Europe and Latin America that sought stronger alignment between church authority and state power.\n\nIntegralists advocate a hierarchical society guided by religious principles, where the state protects and promotes a unified moral order. The ideology is defined by its emphasis on §Yreligious unity§!, §Yauthoritarian moral governance§!, and the subordination of political life to spiritual authority."
 afrikaans_nationalism:0 "Afrikaans Nationalism"
 afrikaans_nationalism_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 afrikaans_nationalism_subideology_desc:0 "§YAfrikaans Nationalism§! is a political ideology that emerged among Afrikaner communities in §YSouth Africa§! during the late 19th and early 20th centuries. It emphasizes the preservation of Afrikaans language, culture, and identity, shaped by a history of colonial conflict, frontier settlement, and later political struggle within a multi-ethnic society.\n\nDuring the §Y20th century§!, Afrikaner nationalist movements became increasingly organized in response to British imperial influence and domestic political competition. These movements sought greater autonomy and later political control, culminating in the establishment of policies designed to secure Afrikaner dominance within the state. Over time, elements of the ideology became associated with rigid systems of racial segregation and state enforcement of ethnic hierarchy.\n\nSupporters view Afrikaner nationalism as a defense of cultural survival and national self determination in a diverse society. The ideology is defined by its emphasis on §Ynational identity§!, §Ycultural preservation§!, and the political unity of the Afrikaner people within the state."
 ultranationalist:0 "Ultranationalism"
 ultranationalist_desc:0 "§YFascism§! is an authoritarian and ultranationalist political ideology that places the nation above the individual and seeks to unite society under a strong centralized state. It promotes national strength, military power, social discipline, and loyalty to a single leader or ruling movement.\n\nFascism emerged in the aftermath of §YWorld War I§!, first taking power in Italy under Benito Mussolini before spreading to other countries in different forms. While individual fascist movements varied in their goals and rhetoric, they generally rejected liberal democracy, political pluralism, and class conflict in favor of national unity directed by the state.\n\nSupporters believe that a strong and disciplined government is essential to securing the nation's future. Although fascist movements differ considerably, they are united by their emphasis on §Yauthority§!, §Ynationalism§!, and the supremacy of the state."
 ultranationalist_subideology_desc:0 "§YUltranationalism§! is a radical form of nationalism that places the nation above all other political, cultural, and moral considerations. It promotes an intense sense of national identity, often combined with expansionist ambitions, strict social unity, and the rejection of foreign influence or internal diversity.\n\nThe ideology developed in the §Ylate 19th and early 20th centuries§!, alongside the rise of mass politics, imperial competition, and heightened international tensions. In many countries, ultranationalist movements grew out of nationalist currents that became more radical in response to war, perceived humiliation, or rapid social change.\n\nUltranationalists typically advocate for a highly centralized state, strong military capability, and the unification of society under a shared national purpose. The ideology is defined by its emphasis on §Ynational supremacy§!, §Ymilitarized unity§!, and the prioritization of the nation’s interests above all others."
 national_democrat:0 "National Democracy"
 national_democrat_desc:0 "§YNationalism§! is a political ideology centered on the interests, identity, and sovereignty of the nation. Nationalists believe that each nation should remain politically independent, culturally unified, and protected from external influence.\n\nThe ideology developed during the §Y18th and 19th centuries§!, particularly following the French Revolution, as people increasingly identified themselves as members of nations rather than subjects of dynasties or empires. Nationalism played a major role in the formation of modern nation states and numerous independence movements around the world.\n\nWhile nationalist movements differ greatly in their political beliefs, they generally advocate strong national institutions, secure borders, and policies that place the interests of the nation above those of foreign powers or international organizations."
 national_democrat_subideology_desc:0 "§YNational Democracy§! is a political ideology that combines nationalist principles with democratic or semi democratic institutions, placing strong emphasis on national sovereignty, cultural unity, and the political representation of the nation’s dominant identity group. It argues that democracy should serve national interests first, rather than abstract universal principles or external obligations.\n\nThe ideology developed in the §Ylate 19th and early 20th centuries§!, alongside the rise of mass politics and the transformation of nationalism into organized political movements. In many countries, nationalist parties adopted democratic frameworks while maintaining strong emphasis on cultural cohesion, state authority, and resistance to foreign influence or internal fragmentation.\n\nSupporters of National Democracy believe that political systems should reflect the historical identity and unity of the nation while still maintaining electoral legitimacy. The ideology is defined by its emphasis on §Ynational sovereignty§!, §Ycultural unity§!, and democratic institutions directed toward national preservation."
 proto_fascist:0 "Proto Fascism"
 proto_fascist_desc:0 "§YNationalism§! is a political ideology centered on the interests, identity, and sovereignty of the nation. Nationalists believe that each nation should remain politically independent, culturally unified, and protected from external influence.\n\nThe ideology developed during the §Y18th and 19th centuries§!, particularly following the French Revolution, as people increasingly identified themselves as members of nations rather than subjects of dynasties or empires. Nationalism played a major role in the formation of modern nation states and numerous independence movements around the world.\n\nWhile nationalist movements differ greatly in their political beliefs, they generally advocate strong national institutions, secure borders, and policies that place the interests of the nation above those of foreign powers or international organizations."
 proto_fascist_subideology_desc:0 "§YProto Fascism§! refers to early political movements and ideological currents that contained elements later associated with fascism, but developed before fascism became a fully formed ideology. These movements often combined strong nationalism, authoritarian tendencies, and a focus on national unity in response to perceived political and social instability.\n\nThe roots of proto fascist thought can be traced to the §Ylate 19th and early 20th centuries§!, when rapid industrialization, mass politics, and international tensions challenged traditional political systems. In this period, various nationalist, syndicalist, and authoritarian movements began experimenting with ideas such as mass mobilization, strong executive power, and rejection of liberal parliamentary systems.\n\nProto fascist movements did not share a unified doctrine, but they are often seen as transitional forces that helped shape later fascist ideologies. They are defined by their emphasis on §Ynational revival§!, §Yauthoritarian order§!, and the search for political systems capable of overcoming perceived national decline."
 autocrat:0 "Autocrat"
 autocrat_desc:0 "§YNationalism§! is a political ideology centered on the interests, identity, and sovereignty of the nation. Nationalists believe that each nation should remain politically independent, culturally unified, and protected from external influence.\n\nThe ideology developed during the §Y18th and 19th centuries§!, particularly following the French Revolution, as people increasingly identified themselves as members of nations rather than subjects of dynasties or empires. Nationalism played a major role in the formation of modern nation states and numerous independence movements around the world.\n\nWhile nationalist movements differ greatly in their political beliefs, they generally advocate strong national institutions, secure borders, and policies that place the interests of the nation above those of foreign powers or international organizations."
 autocrat_subideology_desc:0 "§YAutocracy§! is a political system in which power is concentrated in the hands of a single ruler or a small governing elite, with limited or no meaningful constraints from legislatures, constitutions, or electoral institutions. Authority is maintained through centralized control of the state, bureaucracy, and security forces.\n\nAutocratic rule has existed throughout §Yhuman political history§!, from ancient empires and absolute monarchies to modern centralized regimes. It often emerges in periods of crisis, instability, or institutional weakness, where leaders justify the concentration of power as necessary to restore order, enforce unity, or accelerate national development.\n\nWhile autocratic systems vary widely in ideology and structure, they share a common reliance on centralized authority and hierarchical governance. The ideology is defined by its emphasis on §Ycentralized power§!, §Ypolitical control§!, and the prioritization of state stability over political pluralism."
 military_junta:0 "Military Dictatorship"
 military_junta_desc:0 "§YNationalism§! is a political ideology centered on the interests, identity, and sovereignty of the nation. Nationalists believe that each nation should remain politically independent, culturally unified, and protected from external influence.\n\nThe ideology developed during the §Y18th and 19th centuries§!, particularly following the French Revolution, as people increasingly identified themselves as members of nations rather than subjects of dynasties or empires. Nationalism played a major role in the formation of modern nation states and numerous independence movements around the world.\n\nWhile nationalist movements differ greatly in their political beliefs, they generally advocate strong national institutions, secure borders, and policies that place the interests of the nation above those of foreign powers or international organizations."
 military_junta_subideology_desc:0 "§YMilitary Junta§! is a form of government in which political power is held directly by the armed forces, typically following a coup d’état or during periods of state collapse. Authority is exercised by senior military officers who govern through hierarchical command structures rather than elected civilian institutions.\n\nMilitary juntas have appeared repeatedly throughout §Ymodern history§!, particularly in states facing civil unrest, economic crisis, or institutional breakdown. In many cases, the military justifies its intervention as a temporary measure to restore order, eliminate corruption, or protect national stability. Some regimes later institutionalize military rule into long term authoritarian systems.\n\nAlthough their structures differ, military juntas share a reliance on discipline, centralized command, and the armed forces as the core governing institution. The ideology is defined by its emphasis on §Ymilitary authority§!, §Ystate security§!, and direct control of government by the armed forces."
 pannationalist:0 "Pan-Nationalist"
 pannationalist_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 pannationalist_subideology_desc:0 "§YPan-Nationalism§! is a reactionary ideology that seeks to extend national identity beyond existing state borders into a wider cultural or civilizational framework. It rejects fragmentation of related peoples and supports political unity based on shared heritage.\n\nIt developed during the §Y19th and early 20th centuries§! alongside nationalist and imperial movements, often emerging in periods of political decline or external pressure.\n\nIt emphasizes §Ycultural unity§!, §Yhistorical continuity§!, and the belief that divided nations are stronger when unified under a shared identity."
 counter_progressive_democrat:0 "Counter Progressive"
 counter_progressive_democrat_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 counter_progressive_democrat_subideology_desc:0 "§YCounter-Progressivism§! is a reactionary democratic ideology that seeks to halt or reverse modern social and political reforms seen as disruptive to traditional structures.\n\nIt emerged during the §Ylate 19th and 20th centuries§! as societies underwent rapid industrial, cultural, and political change.\n\nIt emphasizes §Yinstitutional stability§!, §Ytraditional values§!, and resistance to rapid reform."
 jd_vance_populism:0 "National Populism"
 jd_vance_populism_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 jd_vance_populism_subideology_desc:0 "§YNational Populism§! combines cultural traditionalism with economic nationalism and anti-elite sentiment.\n\nIt developed in the §Ylate 20th and early 21st centuries§! in response to globalization, deindustrialization, and political distrust.\n\nIt emphasizes §Ynational sovereignty§!, §Ycultural identity§!, and §Yeconomic protectionism§!."
 rfk_jr_populism:0 "Anti-Establishment"
 rfk_jr_populism_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 rfk_jr_populism_subideology_desc:0 "§YAnti-Establishment Populism§! is defined by distrust of political, corporate, and institutional power.\n\nIt grew in the §Ylate 20th century§! as confidence in governments and institutions declined.\n\nIt emphasizes §Ydecentralization§!, §Ycivil liberties§!, and opposition to concentrated authority."
 national_conservative:0 "National Conservatism"
 national_conservative_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 national_conservative_subideology_desc:0 "§YNational Conservatism§! seeks to preserve national identity, cultural tradition, and social cohesion through strong state institutions.\n\nIt developed in the modern era as a response to globalization and cultural liberalization.\n\nIt emphasizes §Ynational identity§!, §Ytradition§!, and §Ysocial stability§!."
 oligarchist:0 "Oligarchism"
 oligarchist_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 oligarchist_subideology_desc:0 "§YOligarchism§! is a political ideology in which power is concentrated within a small elite group composed of wealthy individuals, influential families, or entrenched political and economic networks. It prioritizes stability and governance through established hierarchies rather than broad democratic participation.\n\nHistorically, oligarchic systems have emerged in periods where economic inequality and institutional consolidation allowed elite groups to dominate political decision-making. These structures often developed within monarchies, republics, or hybrid systems where formal institutions existed but real power remained limited to a narrow circle.\n\nOligarchism emphasizes §Yelite rule§!, §Yeconomic concentration§!, and §Yinstitutional control§!, favoring continuity and predictability over mass political participation."
 authoritarian_democrat:0 "Authoritarian Democracy"
 authoritarian_democrat_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 authoritarian_democrat_subideology_desc:0 "§YAuthoritarian Democracy§! is a political system in which formal democratic institutions such as elections, parliaments, and constitutions exist, but real political power is heavily concentrated within a strong executive authority. It blends elements of electoral legitimacy with centralized control over the state apparatus.\n\nHistorically, such systems have emerged in states undergoing political instability, modernization pressures, or post-conflict reconstruction, where governments maintain electoral structures while limiting opposition influence and restricting full political pluralism.\n\nAuthoritarian Democracy emphasizes §Ystate stability§!, §Ycontrolled political participation§!, and §Yexecutive authority§!, prioritizing order and continuity over full democratic competition."
 MAGA_Republicans:0 "Trumpism"
 MAGA_Republicans_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 MAGA_Republicans_subideology_desc:0 "§YTrumpism§! is a 21st century American populist-nationalist political movement centered around the leadership style, political brand, and electoral coalition built by §YDonald Trump§!.\n\nIt emerged prominently in the §Y2010s§! and continued into the §Y2020s§!, reshaping the Republican Party around themes of political outsider identity, media confrontation, and direct mass communication through modern platforms such as social media and televised rallies.\n\nIn practice, Trumpism emphasizes §Yexecutive dominance§!, §Yeconomic nationalism§!, and §Yanti-establishment politics§!, combining traditional conservative positions with a populist approach that challenges institutional norms, bureaucratic authority, and international commitments perceived as limiting national sovereignty."
 managed_democracy:0 "Managed Democracy"
 managed_democracy_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 managed_democracy_subideology_desc:0 "§YManaged Democracy§! is a political system in which democratic institutions such as elections and parties formally exist, but political competition is carefully guided, regulated, or constrained by a dominant ruling establishment.\n\nIn the §Y21st century§!, variants of managed democracy have been discussed in relation to states that maintain electoral legitimacy while limiting opposition influence through legal frameworks, media control, or institutional dominance.\n\nIt emphasizes §Ycontrolled political pluralism§!, §Ystate stability§!, and §Yguided governance§!, balancing electoral participation with strong centralized oversight of political outcomes."
 military_led_democracy:0 "Military-led Democracy"
 military_led_democracy_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 military_led_democracy_subideology_desc:0 "§YMilitary-led Democracy§! is a political system in which civilian democratic institutions formally exist, but the military retains decisive influence over national politics, either openly or behind the scenes.\n\nIt often develops in states with strong armed forces, weak civilian institutions, or histories of coups and internal instability, particularly during the §Y20th and 21st centuries§!.\n\nIt emphasizes §Ymilitary oversight§!, §Yconditional democracy§!, and §Ynational stability§!, where elected governments operate under the implicit authority or veto power of the armed forces."
 right_wing_populist:0 "Right Wing Populism"
 right_wing_populist_desc:0 "§YReactionarism§! is a political ideology that seeks to preserve or restore traditional institutions, cultural values, and established social hierarchies. Reactionaries believe that many modern political and social developments have weakened the stability of society and that a return to proven traditions is necessary to restore order.\n\nThe ideology emerged as a response to the §YFrench Revolution§! and the rapid political, social, and economic changes of the §Y18th and 19th centuries§!. Throughout history, reactionary movements have opposed revolutionary change, radical reform, and ideologies they viewed as threats to national identity, religion, or social stability.\n\nWhile reactionary movements differ in their specific beliefs, they generally advocate strong authority, respect for tradition, national identity, and gradual or limited political change. They place stability, social order, and continuity above rapid reform or ideological experimentation."
 right_wing_populist_subideology_desc:0 "§YRight-Wing Populism§! is a political ideology that combines cultural conservatism, economic nationalism, and strong anti-elite rhetoric directed against established political institutions.\n\nIt developed in the late §Y20th and early 21st centuries§! as a response to globalization, immigration, deindustrialization, and declining trust in traditional political parties.\n\nIt emphasizes §Ynational identity§!, §Yborder control§!, and §Yanti-establishment politics§!, presenting itself as a defense of the ordinary citizen against political and cultural elites."
 absolute_monarchist:0 "Absolute Monarchy"
 absolute_monarchist_desc:0 "§YMonarchism§! is a political ideology that places sovereignty and national unity in the institution of the monarchy. Monarchists believe that a king, queen, emperor, or other hereditary ruler provides legitimacy, continuity, and stability that cannot easily be achieved through elected governments alone.\n\nThe ideology has shaped states for much of §Yrecorded history§!, with monarchies governing civilizations across Europe, Asia, Africa, and the Middle East. Although many monarchies gradually adopted constitutional systems during the §Y19th and 20th centuries§!, others retained or sought to restore stronger royal authority in response to political instability or revolutionary movements.\n\nWhile monarchist movements differ in the powers they believe a monarch should possess, they generally support respect for tradition, national continuity, and the preservation of long established institutions. They view the Crown as a symbol of the nation's history, identity, and unity."
 absolute_monarchist_subideology_desc:0 "§YAbsolute Monarchy§! is a political system in which sovereign authority is concentrated in the hands of a hereditary monarch who holds supreme power over the state. The monarch serves as the ultimate source of law, governance, and national unity, with limited or no constitutional constraints on royal authority.\n\nHistorically, absolute monarchies were the dominant form of government across much of the world until the §Y18th and 19th centuries§!, when revolutions and constitutional reforms began to limit royal power. However, in some states, absolutist structures persisted or were restored in response to instability, external threats, or revolutionary upheaval.\n\nIt emphasizes §Ycentralized authority§!, §Ydynastic legitimacy§!, and §Ynational continuity§!, viewing the monarch as the embodiment of the state and its historical identity."
 pope:0 "Papal Faction"
 pope_desc:0 "§YMonarchism§! is a political ideology that places sovereignty and national unity in the institution of the monarchy. Monarchists believe that a king, queen, emperor, or other hereditary ruler provides legitimacy, continuity, and stability that cannot easily be achieved through elected governments alone.\n\nThe ideology has shaped states for much of §Yrecorded history§!, with monarchies governing civilizations across Europe, Asia, Africa, and the Middle East. Although many monarchies gradually adopted constitutional systems during the §Y19th and 20th centuries§!, others retained or sought to restore stronger royal authority in response to political instability or revolutionary movements.\n\nWhile monarchist movements differ in the powers they believe a monarch should possess, they generally support respect for tradition, national continuity, and the preservation of long established institutions. They view the Crown as a symbol of the nation's history, identity, and unity."
 pope_subideology_desc:0 "The §YPapal Faction§! represents a form of the Papal Faction rooted in the sovereignty and continuity of the §YHoly See§! as both a spiritual authority and a territorial state. Unlike broader Papalist movements that seek to expand ecclesiastical influence into secular governance, Vatican-aligned doctrine emphasizes the preservation of an independent, neutral, and diplomatically protected Church-state centered in Rome.\n\nEmerging from the settlement of the §YLateran Treaties§! and the formal recognition of Vatican City as a sovereign entity in the §Y20th century§!, this ideology is defined by its insistence on strict political neutrality in interstate conflict, while simultaneously maintaining moral authority over global Catholic populations. The Vatican is viewed not as a nation among others, but as a supra-national institution whose legitimacy transcends traditional state systems.\n\nIn practice, Vatican-aligned governance prioritizes diplomatic mediation, religious continuity, and institutional preservation of the Church. It rejects both revolutionary secularism and militant clerical expansionism, instead upholding a doctrine of spiritual sovereignty insulated from worldly power struggles while quietly exerting influence through faith, diplomacy, and tradition."
 semi_constitutional_monarchist:0 "Executive Monarchy"
 semi_constitutional_monarchist_desc:0 "§YMonarchism§! is a political ideology that places sovereignty and national unity in the institution of the monarchy. Monarchists believe that a king, queen, emperor, or other hereditary ruler provides legitimacy, continuity, and stability that cannot easily be achieved through elected governments alone.\n\nThe ideology has shaped states for much of §Yrecorded history§!, with monarchies governing civilizations across Europe, Asia, Africa, and the Middle East. Although many monarchies gradually adopted constitutional systems during the §Y19th and 20th centuries§!, others retained or sought to restore stronger royal authority in response to political instability or revolutionary movements.\n\nWhile monarchist movements differ in the powers they believe a monarch should possess, they generally support respect for tradition, national continuity, and the preservation of long established institutions. They view the Crown as a symbol of the nation's history, identity, and unity."
 semi_constitutional_monarchist_subideology_desc:0 "The §YExecutive Monarchy§! represents a constitutional evolution of monarchist governance in which the Crown retains direct authority over the executive functions of the state while legislative power is partially delegated to elected or advisory bodies. Rather than a purely ceremonial role, the monarch remains an active centre of political decision-making, particularly in matters of security, foreign policy, and national stability.\n\nThis system developed most prominently during the §Y19th and early 20th centuries§!, as traditional absolutist monarchies faced increasing pressure from liberal revolutions, parliamentary movements, and industrial-era political reform. In response, several dynasties adopted hybrid structures designed to preserve royal authority while incorporating limited representative institutions to prevent outright collapse of the old order.\n\nSupporters of Executive Monarchy argue that it provides a necessary balance between continuity and adaptability, preventing both the instability of pure democracy and the rigidity of absolute rule. Critics, however, view it as an unstable compromise in which competing centers of authority risk producing constitutional tension. Despite this, the model persists wherever monarchs retain significant influence over the machinery of government while operating within a partially codified constitutional framework."
 constitutionalist:0 "Constitutionalism"
 constitutionalist_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 constitutionalist_subideology_desc:0 "The §YConstitutionalist§! tradition is a political doctrine centred on the belief that sovereign authority must be defined, limited, and legitimised through a codified constitutional framework. Rather than concentrating power in a single ruler or revolutionary body, Constitutionalists argue that the state derives its legitimacy from a structured balance of institutions governed by law rather than personal authority.\n\nEmerging in the aftermath of the §Yearly modern constitutional revolutions§!, particularly those of the §Y18th and 19th centuries§!, constitutionalism developed as a response to both absolutist monarchy and revolutionary instability. Early constitutional thinkers sought to prevent arbitrary rule by binding governments—whether royal or republican—to clearly defined legal constraints and representative mechanisms.\n\nModern Constitutionalists emphasise the supremacy of law, institutional accountability, and the separation of powers. While they may differ in their preferred form of government, they share the conviction that political authority must always be conditional, regulated, and subject to a higher legal order that transcends individual leaders or transient majorities."
 christian_democrat:0 "Christian Democracy"
 christian_democrat_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 christian_democrat_subideology_desc:0 "§YChristian Democracy§! is a political tradition that seeks to apply Christian social teaching to modern governance, balancing individual liberty with social responsibility and a commitment to human dignity. It rejects both unrestrained market liberalism and revolutionary collectivism, instead advocating a mediated form of capitalism shaped by moral obligation and social welfare.\n\nEmerging in the late §Y19th century§! and gaining prominence in the aftermath of the §YSecond World War§!, Christian Democratic movements developed primarily in response to industrialisation, secularisation, and the political instability of Europe’s interwar period. Rooted in Catholic social doctrine and later broadened to include wider Christian traditions, the ideology sought to rebuild fractured societies through compromise, institutional stability, and social cohesion.\n\nChristian Democrats emphasise subsidiarity, the protection of family and community structures, and cooperation between social classes. While supportive of democratic governance and market economies, they argue that both must be tempered by ethical responsibility and the need to preserve social harmony. The result is a pragmatic centrist tradition that frames politics as a moral obligation to sustain both freedom and solidarity."
 fiscal_conservative:0 "Fiscal Conservatism"
 fiscal_conservative_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 fiscal_conservative_subideology_desc:0 "§YFiscal Conservatism§! is an economic and administrative doctrine which prioritises balanced budgets, restrained public spending, and long-term financial stability as the foundation of state power. It holds that the credibility of government rests not in the scale of its intervention, but in its capacity to manage resources prudently and avoid unsustainable debt or inflationary policy.\n\nDeveloping most clearly within §Y19th century§! parliamentary systems and later refined during the fiscal crises of the §Y20th century§!, fiscal conservatism emerged as a response to rapid industrial expansion, welfare state growth, and the increasing financial demands of modern governance. Its advocates argued that states which overextend themselves economically inevitably weaken their own sovereignty and political legitimacy.\n\nModern fiscal conservatives emphasise disciplined taxation, efficient administration, and the reduction of structural deficits. While not inherently opposed to state intervention, they insist that any government programme must be economically sustainable and justified by measurable long-term benefit. In this view, financial restraint is not merely an economic preference, but a necessary condition for national stability and political independence."
 gaullist:0 "Gaullism"
 gaullist_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 gaullist_subideology_desc:0 "§YGaullism§! is a political tradition rooted in the belief that national sovereignty, state authority, and democratic legitimacy must be unified under a strong executive capable of transcending party division and ideological fragmentation. It emphasises the independence of the state, the centrality of national unity, and the necessity of decisive leadership in moments of crisis.\n\nEmerging from the leadership of §YCharles de Gaulle§! during the §YSecond World War§! and the subsequent reconstruction of France, Gaullism developed as a response to both the collapse of the Third Republic and the perceived instability of parliamentary systems. It sought to restore national dignity through a strengthened presidency, institutional stability, and a rejection of foreign dependence in matters of defence and diplomacy.\n\nIn its modern form, Gaullism combines elements of constitutional governance, social conservatism, and strategic state intervention in the economy. It rejects ideological extremes on both left and right, instead promoting a pragmatic vision of politics centred on national interest, sovereignty, and the enduring continuity of the state above partisan conflict."
 constitutional_monarchist:0 "Constitutional Monarchism"
 constitutional_monarchist_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 constitutional_monarchist_subideology_desc:0 "§YConstitutional Monarchism§! is a political system in which executive authority is shared between a hereditary monarch and codified representative institutions, with the Crown acting as a symbol of continuity while its powers are constrained and defined by law. Unlike absolute or executive monarchies, sovereignty is formally distributed through constitutional mechanisms that regulate both royal authority and parliamentary governance.\n\nThis model emerged most prominently in the §Y18th and 19th centuries§!, as traditional monarchies across Europe adapted to revolutionary pressures and demands for representation. Rather than abolishing the Crown, reform movements sought to preserve dynastic legitimacy while embedding it within constitutional frameworks that limited arbitrary rule and institutionalised political participation.\n\nSupporters of Constitutional Monarchism argue that it provides a stable synthesis of tradition and accountability, combining the historical legitimacy of the monarchy with the adaptability of representative government. Critics, however, view it as a delicate balance that depends heavily on political culture and restraint. Despite this, it remains one of the most enduring forms of governance in modern political history."
 right_wing_conservative:0 "Right Wing Conservative"
 right_wing_conservative_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 right_wing_conservative_subideology_desc:0 "§YRight Wing Conservatism§! is a political tradition that prioritises the defence of established hierarchies, national identity, and cultural continuity through a firm commitment to order, authority, and institutional strength. While accepting limited reform when necessary, it views rapid social change as a direct threat to stability and cohesion.\n\nEmerging from the broader conservative reaction to the §YFrench Revolution§! and later intensified through the political and social upheavals of the §Y19th and 20th centuries§!, this strand of conservatism developed in opposition to both revolutionary radicalism and liberal attempts to decentralise traditional authority. It places particular emphasis on the preservation of national character, the authority of the state, and the continuity of long-established social structures.\n\nModern right-wing conservatives advocate strong law enforcement, controlled immigration, and the reinforcement of cultural norms perceived as foundational to national unity. While operating within democratic or constitutional frameworks in many cases, they maintain that political stability ultimately depends on respect for hierarchy, tradition, and disciplined governance rather than expansive social transformation."
 British_Conservatism:0 "British Conservatism"
 British_Conservatism_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 British_Conservatism_subideology_desc:0 "§YBritish Conservatism§! is a political tradition rooted in the gradual evolution of institutions, pragmatic governance, and the preservation of constitutional continuity through precedent rather than abstraction. It emphasises stability, incremental reform, and the legitimacy of long-standing political and legal conventions.\n\nShaped by the §Yevolution of the British constitutional system§! rather than a single founding moment, British Conservatism developed through parliamentary compromise, aristocratic reform, and the adaptation of monarchical authority into a constitutional framework. Unlike revolutionary ideologies, it rejects abrupt systemic change in favour of organic development shaped by history, custom, and institutional experience.\n\nModern British Conservatives stress the importance of the §Yrule of law§!, national unity, and the continuity of parliamentary democracy under established institutions such as the Crown and Westminster system. While diverse in economic and social outlook, the tradition is unified by a belief that political stability is best achieved through inherited institutions refined slowly over time, rather than rebuilt through ideological rupture."
 conservative_liberalism:0 "Conservative Liberalism"
 conservative_liberalism_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 conservative_liberalism_subideology_desc:0 "§YConservative Liberalism§! is a political tradition that seeks to reconcile individual liberty with institutional stability, combining classical liberal commitments to constitutional rights, private property, and civil freedoms with a conservative emphasis on order, gradual reform, and respect for established authority.\n\nEmerging in the §Y19th century§! amid the expansion of parliamentary systems and the decline of absolutist rule, conservative liberalism developed as a moderating force between revolutionary liberalism and traditional conservatism. Its advocates supported constitutional government and market economies while warning against excessive democratization or rapid social restructuring that might undermine political stability.\n\nIn its modern form, conservative liberalism emphasises the rule of law, economic freedom, and limited but effective government, balanced by a recognition that institutions, cultural continuity, and national cohesion are essential to sustaining a free society. It represents a pragmatic centrist-right tradition that values both liberty and order, seeking equilibrium between change and continuity rather than ideological extremes."
 Republicans:0 "Old School Republicans"
 Republicans_desc:0 "§YConservatism§! is a political ideology that seeks to preserve established institutions, traditions, and social order while accepting gradual and pragmatic reform when necessary. Conservatives believe that stable government, the rule of law, and respect for national customs provide the strongest foundation for a prosperous society.\n\nThe ideology emerged in response to the §YFrench Revolution§! during the late §Y18th century§!, as thinkers argued that rapid political upheaval and radical change often produced instability and conflict. Since then, conservatism has evolved into many different traditions while maintaining its emphasis on continuity, responsibility, and gradual progress.\n\nWhile conservative movements differ in their economic and social policies, they generally support strong institutions, private property, national identity, and cautious reform. Conservatives view society as something that should be improved over time rather than fundamentally transformed through revolutionary change."
 Republicans_subideology_desc:0 "§YOld School Republicans§! represent the establishment wing of American conservatism, rooted in institutional continuity, procedural governance, and a firm belief in the stabilising role of long-standing political norms. Rather than ideological confrontation, this tradition emphasises legislative discipline, incremental reform, and the preservation of constitutional process as the foundation of effective government.\n\nEmerging from the post-§YWorld War II§! Republican establishment and solidified during the late §Y20th century§!, this school of thought was shaped by Cold War internationalism, pro-business economic policy, and a commitment to maintaining American leadership through alliances and global engagement. Figures associated with this tradition prioritised Senate authority, judicial restraint, and bipartisan compromise as essential tools of governance.\n\nModern Old School Republicans advocate free-market economics, strong national defence, and fiscal conservatism, while generally supporting a stable international order and predictable institutional decision-making. They view political disruption and ideological populism as threats to governmental function, preferring managed stability within established constitutional and party frameworks."
 libertarian:0 "Libertarian"
 libertarian_desc:0 "§YClassical Liberalism§! is a political ideology centered on individual liberty, private property, free markets, and limited government. Classical Liberals believe that personal freedom, voluntary exchange, and the rule of law provide the strongest foundation for a prosperous and stable society.\n\nThe ideology emerged during the §YAge of Enlightenment§! in the §Y17th and 18th centuries§!, influenced by thinkers such as John Locke, Adam Smith, and John Stuart Mill. It challenged absolute monarchy and mercantilism, advocating constitutional government, civil liberties, and economic freedom. Classical Liberalism became one of the defining political philosophies behind many modern democratic states.\n\nWhile Classical Liberal movements differ in their approach to social and economic issues, they generally support free enterprise, individual rights, limited state intervention, and equality before the law. They view government primarily as a protector of liberty rather than a manager of society."
 libertarian_subideology_desc:0 "§YLibertarianism§! is a political tradition that places individual liberty as the highest political value, advocating for the minimisation of state authority in both economic and personal life. It argues that voluntary association, private property, and free exchange between individuals are sufficient to organise society without extensive governmental oversight.\n\nWhile its intellectual roots can be traced to the §Yclassical liberal§! thinkers of the §Y17th and 18th centuries§!, modern libertarianism developed more clearly in the §Y20th century§! as a response to the expansion of welfare states, regulatory economies, and centralized bureaucratic governance. It draws heavily from traditions of anti-authoritarian liberalism, economic laissez-faire theory, and individualist political philosophy.\n\nLibertarians generally advocate for free markets, strong protections for civil liberties, and strict limits on state power, often favouring decentralisation or voluntary forms of governance where possible. While varying in scope and radicalism, the tradition is unified by the belief that political authority should be reduced to the minimum necessary to protect life, liberty, and property."
 market_liberal_ideology:0 "Classical Liberalism"
 market_liberal_ideology_desc:0 "§YClassical Liberalism§! is a political ideology centered on individual liberty, private property, free markets, and limited government. Classical Liberals believe that personal freedom, voluntary exchange, and the rule of law provide the strongest foundation for a prosperous and stable society.\n\nThe ideology emerged during the §YAge of Enlightenment§! in the §Y17th and 18th centuries§!, influenced by thinkers such as John Locke, Adam Smith, and John Stuart Mill. It challenged absolute monarchy and mercantilism, advocating constitutional government, civil liberties, and economic freedom. Classical Liberalism became one of the defining political philosophies behind many modern democratic states.\n\nWhile Classical Liberal movements differ in their approach to social and economic issues, they generally support free enterprise, individual rights, limited state intervention, and equality before the law. They view government primarily as a protector of liberty rather than a manager of society."
 market_liberal_ideology_subideology_desc:0 "§YClassical Liberalism§! is a political and economic tradition centred on individual liberty, private property, free markets, and constitutional limits on state power. It holds that voluntary exchange between free individuals, protected by the rule of law, forms the most stable and productive basis for society.\n\nEmerging during the §YAge of Enlightenment§! in the §Y17th and 18th centuries§!, classical liberalism was shaped by thinkers such as John Locke, Adam Smith, and later John Stuart Mill. It developed in opposition to absolutist monarchy, mercantilist economics, and inherited privilege, advocating instead for constitutional government, civil liberties, and economic freedom as universal principles.\n\nIn its modern form, classical liberalism continues to emphasise free enterprise, legal equality, and limited government intervention in both economic and personal affairs. While interpretations vary, its core belief remains that the role of the state should be restricted primarily to protecting rights, enforcing contracts, and preserving a framework in which individual initiative can flourish."
 big_tent:0 "Big Tent"
 big_tent_desc:0 "§YClassical Liberalism§! is a political ideology centered on individual liberty, private property, free markets, and limited government. Classical Liberals believe that personal freedom, voluntary exchange, and the rule of law provide the strongest foundation for a prosperous and stable society.\n\nThe ideology emerged during the §YAge of Enlightenment§! in the §Y17th and 18th centuries§!, influenced by thinkers such as John Locke, Adam Smith, and John Stuart Mill. It challenged absolute monarchy and mercantilism, advocating constitutional government, civil liberties, and economic freedom. Classical Liberalism became one of the defining political philosophies behind many modern democratic states.\n\nWhile Classical Liberal movements differ in their approach to social and economic issues, they generally support free enterprise, individual rights, limited state intervention, and equality before the law. They view government primarily as a protector of liberty rather than a manager of society."
 big_tent_subideology_desc:0 "§YBig Tent Politics§! is a pragmatic political approach defined less by a fixed ideological doctrine and more by the strategic inclusion of diverse factions, interests, and viewpoints within a single governing coalition or party structure. It prioritises electoral viability and institutional control over strict ideological consistency.\n\nEmerging prominently in the §Y20th century§! within modern mass political systems, big tent movements developed as parties expanded beyond narrow class, regional, or ideological bases in order to secure broad electoral coalitions. This approach became especially prevalent in systems where governing success depended on balancing competing economic, cultural, and regional interests under a unified political banner.\n\nBig tent movements typically emphasise compromise, adaptability, and internal pluralism, allowing for significant ideological variation among members as long as core governing objectives are maintained. While critics argue this dilutes ideological coherence, supporters view it as a necessary adaptation to complex modern societies, where effective governance requires coalition-building across traditional political divides."
 centrist:0 "Centrism"
 centrist_desc:0 "§YSocial Liberalism§! is a broad political tradition that emphasizes the protection of §Yindividual liberty§!, §Ycivil rights§!, and §Ydemocratic institutions§! while recognizing that the state has a responsibility to promote equal opportunity and social welfare. Rather than viewing government as an obstacle, social liberals believe it should actively protect freedom by ensuring access to education, healthcare, justice, and economic opportunity.\n\nThe ideology emerged during the §Ylate nineteenth and early twentieth centuries§! as classical liberalism adapted to the challenges of industrialization, urbanization, and growing social inequality. While preserving support for private enterprise and representative democracy, social liberalism accepted that limited government intervention could strengthen rather than weaken individual freedom.\n\nSocial liberals generally support a §Ymixed economy§!, constitutional government, an independent judiciary, free elections, and the protection of minority rights. They value gradual reform, international cooperation, scientific progress, and the expansion of civil liberties while seeking to balance economic prosperity with social responsibility."
 centrist_subideology_desc:0 "§YCentrism§! is a political approach defined by pragmatism, balance, and the rejection of ideological extremes in favour of moderate, case-by-case governance. Rather than adhering to a fixed doctrinal framework, centrists prioritise practical solutions that preserve stability while incorporating selective reforms where necessary.\n\nEmerging as a distinct political tendency within §Ymodern parliamentary systems§!, centrism developed as parties and states increasingly faced complex economic, social, and geopolitical challenges that could not be effectively addressed through rigid ideological positions alone. It gained particular prominence in periods of coalition governance, where compromise between competing factions became essential for political stability.\n\nCentrist movements typically support representative democracy, a mixed economy, and the rule of law, while emphasising fiscal responsibility, institutional continuity, and incremental reform. They seek to mediate between left and right-wing positions, viewing effective governance not as the victory of one ideology over another, but as the maintenance of equilibrium within a diverse and evolving society."
 moderate:0 "Third Way"
 moderate_desc:0 "§YSocial Liberalism§! is a broad political tradition that emphasizes the protection of §Yindividual liberty§!, §Ycivil rights§!, and §Ydemocratic institutions§! while recognizing that the state has a responsibility to promote equal opportunity and social welfare. Rather than viewing government as an obstacle, social liberals believe it should actively protect freedom by ensuring access to education, healthcare, justice, and economic opportunity.\n\nThe ideology emerged during the §Ylate nineteenth and early twentieth centuries§! as classical liberalism adapted to the challenges of industrialization, urbanization, and growing social inequality. While preserving support for private enterprise and representative democracy, social liberalism accepted that limited government intervention could strengthen rather than weaken individual freedom.\n\nSocial liberals generally support a §Ymixed economy§!, constitutional government, an independent judiciary, free elections, and the protection of minority rights. They value gradual reform, international cooperation, scientific progress, and the expansion of civil liberties while seeking to balance economic prosperity with social responsibility."
 moderate_subideology_desc:0 "§YThird Way§! is a political approach that seeks to reconcile elements of market-based economics with social democratic principles, presenting itself as a pragmatic alternative to traditional left–right ideological divisions. It emphasises modernisation, efficiency, and adaptability in governance, often framing itself as a response to the limitations of both unregulated capitalism and expansive welfare statism.\n\nEmerging prominently in the §Ylate 20th century§!, particularly in the context of post-industrial economic change and the restructuring of Western welfare states, the Third Way was adopted by several centrist and centre-left governments seeking to adapt older ideological frameworks to globalisation, technological transformation, and fiscal constraint. It promoted reforms that combined market flexibility with targeted social protection.\n\nThird Way politics typically support a mixed economy, investment in education and skills, and welfare systems focused on activation rather than dependency. While maintaining commitment to democratic institutions and social cohesion, it emphasises personal responsibility, economic competitiveness, and the modernisation of the state as a facilitator rather than a direct provider of economic outcomes."
 liberalist:0 "Liberalism"
 liberalist_desc:0 "§YSocial Liberalism§! is a broad political tradition that emphasizes the protection of §Yindividual liberty§!, §Ycivil rights§!, and §Ydemocratic institutions§! while recognizing that the state has a responsibility to promote equal opportunity and social welfare. Rather than viewing government as an obstacle, social liberals believe it should actively protect freedom by ensuring access to education, healthcare, justice, and economic opportunity.\n\nThe ideology emerged during the §Ylate nineteenth and early twentieth centuries§! as classical liberalism adapted to the challenges of industrialization, urbanization, and growing social inequality. While preserving support for private enterprise and representative democracy, social liberalism accepted that limited government intervention could strengthen rather than weaken individual freedom.\n\nSocial liberals generally support a §Ymixed economy§!, constitutional government, an independent judiciary, free elections, and the protection of minority rights. They value gradual reform, international cooperation, scientific progress, and the expansion of civil liberties while seeking to balance economic prosperity with social responsibility."
 liberalist_subideology_desc:0 "§YLiberalism§! is a political tradition centred on individual liberty, constitutional government, the rule of law, and the protection of civil and political rights. It asserts that legitimate authority derives from the consent of the governed and that the primary purpose of the state is to safeguard freedom rather than direct the social or economic order.\n\nEmerging from the §YEnlightenment§! and the political revolutions of the §Y17th and 18th centuries§!, liberalism developed in opposition to absolutist monarchy, inherited privilege, and arbitrary rule. Early liberal thinkers advocated constitutional limits on power, representative institutions, and the protection of individual rights as universal principles of governance.\n\nIn its modern form, liberalism encompasses a wide range of interpretations but remains unified by its commitment to democratic governance, legal equality, and personal autonomy. While differing on the scope of government intervention in economic and social affairs, liberals generally support open societies, free expression, and institutional safeguards designed to prevent the concentration of unchecked power."
 scientific_technocracy:0 "Scientific Technocracy"
 scientific_technocracy_desc:0 "§YSocial Liberalism§! is a broad political tradition that emphasizes the protection of §Yindividual liberty§!, §Ycivil rights§!, and §Ydemocratic institutions§! while recognizing that the state has a responsibility to promote equal opportunity and social welfare. Rather than viewing government as an obstacle, social liberals believe it should actively protect freedom by ensuring access to education, healthcare, justice, and economic opportunity.\n\nThe ideology emerged during the §Ylate nineteenth and early twentieth centuries§! as classical liberalism adapted to the challenges of industrialization, urbanization, and growing social inequality. While preserving support for private enterprise and representative democracy, social liberalism accepted that limited government intervention could strengthen rather than weaken individual freedom.\n\nSocial liberals generally support a §Ymixed economy§!, constitutional government, an independent judiciary, free elections, and the protection of minority rights. They value gradual reform, international cooperation, scientific progress, and the expansion of civil liberties while seeking to balance economic prosperity with social responsibility."
 scientific_technocracy_subideology_desc:0 "§YScientific Technocracy§! in the context of §Y21st-century democratic governance§! is a political approach that seeks to ground statecraft in empirical analysis, computational modelling, and expert-driven decision-making. It treats government less as a battlefield of ideology and more as a system of measurable inputs and outputs, where policy is judged by performance, predictability, and demonstrable outcomes.\n\nEmerging alongside advances in §Ydata science§!, §Yclimate modelling§!, artificial intelligence, and large-scale statistical forecasting, this tradition gained political influence during periods of complex global crises where conventional partisan frameworks struggled to produce coherent long-term solutions. In this environment, scientific institutions, advisory councils, and technical agencies became increasingly central to policymaking.\n\nAssociated in the public imagination with scientifically prominent figures and institutions in the §YUnited States§! and other advanced democracies, including space agencies, research universities, and global scientific panels, Scientific Technocracy frames governance as an extension of rational inquiry. Supporters argue it enables long-term planning and evidence-based reform, while critics caution that it risks reducing democratic choice to technical administration and expert consensus."
 Democrat:0 "Neoliberal Democrats"
 Democrat_desc:0 "§YSocial Liberalism§! is a broad political tradition that emphasizes the protection of §Yindividual liberty§!, §Ycivil rights§!, and §Ydemocratic institutions§! while recognizing that the state has a responsibility to promote equal opportunity and social welfare. Rather than viewing government as an obstacle, social liberals believe it should actively protect freedom by ensuring access to education, healthcare, justice, and economic opportunity.\n\nThe ideology emerged during the §Ylate nineteenth and early twentieth centuries§! as classical liberalism adapted to the challenges of industrialization, urbanization, and growing social inequality. While preserving support for private enterprise and representative democracy, social liberalism accepted that limited government intervention could strengthen rather than weaken individual freedom.\n\nSocial liberals generally support a §Ymixed economy§!, constitutional government, an independent judiciary, free elections, and the protection of minority rights. They value gradual reform, international cooperation, scientific progress, and the expansion of civil liberties while seeking to balance economic prosperity with social responsibility."
 Democrat_subideology_desc:0 "§YNeoliberal Democrats§! represent a dominant governing current within §YSocial Liberalism§! in the §YUnited States§! during the late 20th and early 21st centuries. While retaining formal commitments to civil rights, democratic institutions, and regulated capitalism, this faction is defined by its acceptance of market-driven economic structures and its reliance on private-sector partnership as a central tool of governance.\n\nEmerging from the political realignments of the §Ylate Cold War and post-Cold War era§!, Neoliberal Democrats rose to prominence through the §YClinton administration§! and were further shaped by globalization, deindustrialization, and the expansion of international trade systems. Their policy approach prioritises fiscal pragmatism, financial sector integration, and incremental social reform, balancing welfare provision with economic competitiveness in global markets.\n\nIn the §Y2020s§!, this tradition remains closely associated with establishment Democratic leadership and institutional governance strategies that emphasise stability, coalition-building, and continuity within existing economic frameworks. Supporters view it as pragmatic adaptation to global economic realities, while critics argue it entrenches corporate influence and constrains more transformative social and economic reform."
 radicalist:0 "Radicalism"
 radicalist_desc:0 "§YSocial Liberalism§! is a broad political tradition that emphasizes the protection of §Yindividual liberty§!, §Ycivil rights§!, and §Ydemocratic institutions§! while recognizing that the state has a responsibility to promote equal opportunity and social welfare. Rather than viewing government as an obstacle, social liberals believe it should actively protect freedom by ensuring access to education, healthcare, justice, and economic opportunity.\n\nThe ideology emerged during the §Ylate nineteenth and early twentieth centuries§! as classical liberalism adapted to the challenges of industrialization, urbanization, and growing social inequality. While preserving support for private enterprise and representative democracy, social liberalism accepted that limited government intervention could strengthen rather than weaken individual freedom.\n\nSocial liberals generally support a §Ymixed economy§!, constitutional government, an independent judiciary, free elections, and the protection of minority rights. They value gradual reform, international cooperation, scientific progress, and the expansion of civil liberties while seeking to balance economic prosperity with social responsibility."
 radicalist_subideology_desc:0 "§YRadicalism§! is an upcoming political current defined by its belief that democratic systems must periodically remake their own foundations in order to remain legitimate. Rather than treating institutional stability as an end in itself, it argues that entrenched power, bureaucratic inertia, and economic concentration can gradually hollow out the promise of equality unless actively confronted through structural reform.\n\nShaped by successive waves of §Yreform movements§!, from early suffrage campaigns to modern anti-corruption and civil rights struggles, Radicalism carries forward a tradition of pushing liberal systems beyond their established limits. It tends to gain momentum in moments when existing institutions are perceived as unresponsive to public demands or unable to adapt to rapid social and economic change.\n\nIn its emerging 21st-century form, it advocates for sweeping electoral reform, stronger constraints on concentrated wealth and influence, and expanded mechanisms of democratic accountability. Supporters present it as a necessary renewal of democratic life, while critics warn that its pace of change risks destabilizing institutions in the pursuit of rapid systemic correction."
 nordic_social_democracy:0 "Nordic Social Democracy"
 nordic_social_democracy_desc:0 "§YSocial Democracy§! is a political ideology that seeks to combine a §Ycapitalist economy§! with a strong §Ywelfare state§!, extensive labor protections, and democratic governance. Social democrats believe that markets can generate prosperity, but that government has a responsibility to reduce inequality, protect workers, and ensure that all citizens have access to essential public services.\n\nThe ideology emerged from the §Ylabor movement§! of the late nineteenth and early twentieth centuries. While originally sharing roots with socialism, social democracy gradually embraced parliamentary democracy and market economics, abandoning revolutionary politics in favor of gradual reform through elections and legislation.\n\nSocial democrats generally support a §Ymixed economy§!, progressive taxation, universal healthcare, public education, strong trade unions, and social insurance. They seek to balance economic growth with social justice, believing that democracy, cooperation, and public investment create a more stable, prosperous, and equitable society."
 nordic_social_democracy_subideology_desc:0 "§YNordic Social Democracy§! is an upcoming regional model of social democratic governance defined by its emphasis on high-trust institutions, collective bargaining, and a comprehensive welfare state integrated with a competitive market economy. It seeks not to replace capitalism, but to discipline and structure it through strong social compacts between the state, employers, and organized labor.\n\nDeveloped in the §YNordic countries§! throughout the §Y20th century§!, this model was shaped by small, export-oriented economies that required both global competitiveness and internal social cohesion. Through decades of negotiation between labor unions, employer federations, and parliamentary governments, it produced systems characterized by wage coordination, universal welfare provision, and extensive public services funded through high but broadly accepted taxation.\n\nIn its modern 21st-century form, Nordic Social Democracy emphasizes adaptability to globalization, technological transition, and demographic change while preserving its core commitment to equality, social trust, and institutional consensus. Supporters view it as a stable synthesis of efficiency and solidarity, while critics argue it depends heavily on unique historical conditions that are difficult to replicate elsewhere."
 social_democrat_ideology:0 "Social Democracy"
 social_democrat_ideology_desc:0 "§YSocial Democracy§! is a political ideology that seeks to combine a §Ycapitalist economy§! with a strong §Ywelfare state§!, extensive labor protections, and democratic governance. Social democrats believe that markets can generate prosperity, but that government has a responsibility to reduce inequality, protect workers, and ensure that all citizens have access to essential public services.\n\nThe ideology emerged from the §Ylabor movement§! of the late nineteenth and early twentieth centuries. While originally sharing roots with socialism, social democracy gradually embraced parliamentary democracy and market economics, abandoning revolutionary politics in favor of gradual reform through elections and legislation.\n\nSocial democrats generally support a §Ymixed economy§!, progressive taxation, universal healthcare, public education, strong trade unions, and social insurance. They seek to balance economic growth with social justice, believing that democracy, cooperation, and public investment create a more stable, prosperous, and equitable society."
 social_democrat_ideology_subideology_desc:0 "§YSocial Democracy§! is a long-established governing tradition that seeks to sustain a §Ymarket-based economy§! while embedding it within strong public institutions designed to reduce inequality, protect workers, and guarantee universal access to essential services. It is defined by the belief that capitalism can be maintained only if it is continuously regulated and socially corrected through democratic decision-making.\n\nEvolving out of the §Yindustrial labour movements of the late 19th and early 20th centuries§!, Social Democracy gradually moved from its revolutionary origins toward parliamentary reformism, becoming a defining feature of many modern democratic systems. In this process, it accepted market economies as durable structures, while insisting that collective bargaining, progressive taxation, and public investment are necessary to preserve social stability and fairness.\n\nIn its modern 21st-century form, Social Democracy is shaped by globalisation, deindustrialisation, and fiscal constraint, resulting in a pragmatic balance between welfare provision and economic competitiveness. Supporters view it as a stabilising framework that preserves social cohesion within capitalism, while critics argue it has become constrained by managerial governance and weakened in its capacity for deeper structural change."
 left_wing_nationalist:0 "Left-Wing Populism"
 left_wing_nationalist_desc:0 "§YSocial Democracy§! is a political ideology that seeks to combine a §Ycapitalist economy§! with a strong §Ywelfare state§!, extensive labor protections, and democratic governance. Social democrats believe that markets can generate prosperity, but that government has a responsibility to reduce inequality, protect workers, and ensure that all citizens have access to essential public services.\n\nThe ideology emerged from the §Ylabor movement§! of the late nineteenth and early twentieth centuries. While originally sharing roots with socialism, social democracy gradually embraced parliamentary democracy and market economics, abandoning revolutionary politics in favor of gradual reform through elections and legislation.\n\nSocial democrats generally support a §Ymixed economy§!, progressive taxation, universal healthcare, public education, strong trade unions, and social insurance. They seek to balance economic growth with social justice, believing that democracy, cooperation, and public investment create a more stable, prosperous, and equitable society."
 left_wing_nationalist_subideology_desc:0 "§YLeft-Wing Populism§! is a political current that frames society as divided between the §Yordinary people§! and entrenched economic and political elites, arguing that democratic power has been captured by corporate interests, financial institutions, and established political networks. It seeks to restore political authority to the popular majority while advancing redistributive economic policies.\n\nEmerging in the §Ylate 20th and early 21st centuries§!, it developed in response to deindustrialisation, widening inequality, financial crises, and declining trust in traditional party systems. It gained traction in both established democracies and transitional political systems where voters felt excluded from decision-making processes despite formal democratic institutions.\n\nIn its modern form, Left-Wing Populism combines demands for expanded social welfare, stronger labor protections, and public ownership of strategic sectors with a confrontational style of politics that emphasises anti-elite rhetoric and mass mobilisation. Supporters view it as a democratic corrective to concentrated power, while critics argue it can oversimplify complex governance challenges into moralised conflict narratives."
 Progressive_Democrats:0 "Progressive Democrats"
 Progressive_Democrats_desc:0 "§YSocial Democracy§! is a political ideology that seeks to combine a §Ycapitalist economy§! with a strong §Ywelfare state§!, extensive labor protections, and democratic governance. Social democrats believe that markets can generate prosperity, but that government has a responsibility to reduce inequality, protect workers, and ensure that all citizens have access to essential public services.\n\nThe ideology emerged from the §Ylabor movement§! of the late nineteenth and early twentieth centuries. While originally sharing roots with socialism, social democracy gradually embraced parliamentary democracy and market economics, abandoning revolutionary politics in favor of gradual reform through elections and legislation.\n\nSocial democrats generally support a §Ymixed economy§!, progressive taxation, universal healthcare, public education, strong trade unions, and social insurance. They seek to balance economic growth with social justice, believing that democracy, cooperation, and public investment create a more stable, prosperous, and equitable society."
 Progressive_Democrats_subideology_desc:0 "§YProgressive Democrats§! is an upcoming current within modern American politics that pushes beyond traditional §YSocial Democratic§! frameworks toward more expansive economic redistribution, structural reform, and confrontation with concentrated wealth and political influence. It emphasizes the belief that democratic institutions must actively correct systemic inequality rather than merely regulate it.\n\nEmerging prominently in the §Yearly 21st century United States§!, this movement draws momentum from urban progressive coalitions, labor revitalization efforts, and electoral insurgencies within established party structures. It is associated with figures such as §YBernie Sanders§!, §YElizabeth Warren§!, and newer left-leaning urban representatives, who advocate for policies like universal healthcare expansion, tuition-free higher education, stronger labor rights, and aggressive antitrust enforcement.\n\nIn its modern form, Progressive Democrats frame politics as a struggle between democratic majorities and entrenched economic power, arguing that concentrated corporate influence undermines both equality and effective governance. Supporters view it as a necessary democratic correction to neoliberal governance, while critics argue it risks overexpanding the state and disrupting market-driven economic stability."
 labor_ideology:0 "Laborism"
 labor_ideology_desc:0 "§YSocial Democracy§! is a political ideology that seeks to combine a §Ycapitalist economy§! with a strong §Ywelfare state§!, extensive labor protections, and democratic governance. Social democrats believe that markets can generate prosperity, but that government has a responsibility to reduce inequality, protect workers, and ensure that all citizens have access to essential public services.\n\nThe ideology emerged from the §Ylabor movement§! of the late nineteenth and early twentieth centuries. While originally sharing roots with socialism, social democracy gradually embraced parliamentary democracy and market economics, abandoning revolutionary politics in favor of gradual reform through elections and legislation.\n\nSocial democrats generally support a §Ymixed economy§!, progressive taxation, universal healthcare, public education, strong trade unions, and social insurance. They seek to balance economic growth with social justice, believing that democracy, cooperation, and public investment create a more stable, prosperous, and equitable society."
 labor_ideology_subideology_desc:0 "§YLaborism§! is an upcoming political tradition rooted in the organised labour movements of industrial societies, defined by the belief that working people should possess direct and institutional influence over the economic and political systems that shape their lives. It prioritises collective bargaining, workplace democracy, and the protection of employment as the foundation of social stability.\n\nEmerging from the §Ytrade union movements of the 19th and early 20th centuries§!, Laborism developed as workers’ organisations transitioned from industrial resistance into formal political representation within parliamentary systems. In countries such as the §YUnited Kingdom§! and other advanced democracies, it became closely associated with mass-membership parties built around union affiliation and working-class identity.\n\nIn its modern 21st-century form, Laborism adapts to deindustrialised and service-based economies while maintaining its core emphasis on labour rights, wage security, and social protection. Supporters see it as the political voice of working people within democratic capitalism, while critics argue it is challenged by declining union density and the fragmentation of traditional industrial labour."
 green:0 "Green Politics"
 green_desc:0 "§YProgressivism§! is a political ideology that seeks to reform society through democratic institutions, scientific advancement, and social progress. Progressives believe that governments should actively address inequality, expand civil rights, and modernize public institutions to meet the changing needs of society. They generally view reform as a continuous process rather than preserving existing political or economic arrangements.\n\nThe ideology emerged during the §YProgressive Era§! of the late nineteenth and early twentieth centuries, building upon earlier liberal and reformist traditions. As industrialization transformed society, progressives advocated for labor protections, expanded democracy, consumer rights, public education, and government oversight to address the social and economic challenges of rapid modernization.\n\nProgressives generally support a §Ymixed economy§!, environmental protection, scientific research, civil liberties, social equality, and effective public institutions. They seek to balance economic development with social responsibility, believing that democratic reform, innovation, and evidence-based policy can improve both individual opportunity and the well-being of society."
 green_subideology_desc:0 "§YGreen Politics§! is an upcoming political current focused on environmental limits, ecological sustainability, and the restructuring of economic and social systems to operate within the constraints of the natural world. It holds that long-term political stability depends on aligning human development with ecological balance, treating climate, biodiversity, and resource management as core issues of governance rather than secondary policy concerns.\n\nEmerging in the §Ylate 20th century§! from environmental movements, anti-nuclear activism, and conservationist traditions, Green Politics developed into formal political organisations as industrial pollution, climate change, and resource depletion became central public issues. In many modern democracies, it has become a distinct electoral force, particularly among urban, younger, and highly educated populations concerned with long-term sustainability.\n\nIn its contemporary 21st-century form, Green Politics advocates for rapid decarbonisation, renewable energy transition, sustainable urban planning, and stronger environmental regulation across all sectors of the economy. Supporters frame it as an existential response to ecological crisis, while critics argue it can impose high regulatory and economic costs on industrial development and national competitiveness."
 progressive_ideology:0 "Progressivism"
 progressive_ideology_desc:0 "§YProgressivism§! is a political ideology that seeks to reform society through democratic institutions, scientific advancement, and social progress. Progressives believe that governments should actively address inequality, expand civil rights, and modernize public institutions to meet the changing needs of society. They generally view reform as a continuous process rather than preserving existing political or economic arrangements.\n\nThe ideology emerged during the §YProgressive Era§! of the late nineteenth and early twentieth centuries, building upon earlier liberal and reformist traditions. As industrialization transformed society, progressives advocated for labor protections, expanded democracy, consumer rights, public education, and government oversight to address the social and economic challenges of rapid modernization.\n\nProgressives generally support a §Ymixed economy§!, environmental protection, scientific research, civil liberties, social equality, and effective public institutions. They seek to balance economic development with social responsibility, believing that democratic reform, innovation, and evidence-based policy can improve both individual opportunity and the well-being of society."
 progressive_ideology_subideology_desc:0 "§YProgressivism§! is a political tradition defined by its commitment to continuous reform of democratic institutions in response to social, technological, and economic change. Rather than preserving political arrangements as fixed structures, it treats governance as an adaptive process in which laws, rights, and institutions must evolve alongside society.\n\nEmerging from the §YProgressive Era of the late 19th and early 20th centuries§!, it was shaped by industrialisation, urbanisation, and the expansion of mass politics, when reformers sought to address the excesses of early industrial capitalism through regulation, public oversight, and expanded democratic participation. These early foundations established a lasting belief in expertise, institutional reform, and the capacity of government to solve complex collective problems.\n\nIn its modern 21st-century form, Progressivism emphasizes evidence-based policymaking, civil rights expansion, anti-corruption measures, regulatory oversight of large economic actors, and institutional modernisation. Supporters view it as a pragmatic engine of democratic improvement, while critics argue it can expand bureaucratic authority and rely heavily on technocratic decision-making."
 progressive_socialist:0 "Progressive Socialism"
 progressive_socialist_desc:0 "§YProgressivism§! is a political ideology that seeks to reform society through democratic institutions, scientific advancement, and social progress. Progressives believe that governments should actively address inequality, expand civil rights, and modernize public institutions to meet the changing needs of society. They generally view reform as a continuous process rather than preserving existing political or economic arrangements.\n\nThe ideology emerged during the §YProgressive Era§! of the late nineteenth and early twentieth centuries, building upon earlier liberal and reformist traditions. As industrialization transformed society, progressives advocated for labor protections, expanded democracy, consumer rights, public education, and government oversight to address the social and economic challenges of rapid modernization.\n\nProgressives generally support a §Ymixed economy§!, environmental protection, scientific research, civil liberties, social equality, and effective public institutions. They seek to balance economic development with social responsibility, believing that democratic reform, innovation, and evidence-based policy can improve both individual opportunity and the well-being of society."
 progressive_socialist_subideology_desc:0 "§YProgressive Socialism§! is a political current that seeks to advance socialist objectives through sustained democratic reform, emphasizing the gradual restructuring of economic and social systems within existing parliamentary frameworks. It prioritises expanding public ownership, strengthening labor institutions, and building comprehensive welfare systems while maintaining electoral legitimacy as the primary mechanism of change.\n\nEmerging from the §Yorganised labour and socialist reform movements of the late 19th and early 20th centuries§!, it developed as socialist parties integrated into mass democratic politics, increasingly focusing on municipal governance, welfare expansion, and legislative gains within capitalist economies. This tradition often operated within coalition politics, balancing ideological goals with pragmatic governance.\n\nIn its modern form, Progressive Socialism advocates for robust trade unions, strategic nationalisation or public control of key industries, universal public services, and strong redistributive policies. Supporters see it as a democratic pathway toward socialist transformation, while critics argue it remains constrained by existing capitalist structures and political compromise."
 democratic_socialist_ideology:0 "Democratic Socialism"
 democratic_socialist_ideology_desc:0 "§YSocialism§! is a political ideology that advocates for the §Ycollective or public ownership§! of the means of production and the organization of the economy to serve society as a whole rather than private profit. Socialists believe that economic inequality created by capitalism can be reduced through democratic control of major industries, expanded workers' rights, and greater social ownership of economic resources.\n\nThe ideology emerged during the §YIndustrial Revolution§! in response to poor working conditions, rapid industrialization, and growing inequality. Throughout the nineteenth and twentieth centuries, socialism developed into many different schools of thought, ranging from democratic reformers seeking gradual change to revolutionary movements calling for the complete transformation of society.\n\nSocialists generally support a §Yplanned or mixed economy§!, universal public services, strong labor protections, public ownership of key industries, and broad social welfare programs. While methods differ between movements, socialism seeks to build a society where economic resources are distributed more equally and production is organized to meet the needs of the community."
 democratic_socialist_ideology_subideology_desc:0 "§YDemocratic Socialism§! is a political tradition that seeks to extend democratic principles beyond the political sphere into the structure of the economy itself, arguing that meaningful democracy requires collective control over key economic decisions. It distinguishes itself by insisting that social ownership and redistribution must be achieved through electoral and constitutional means rather than revolutionary rupture.\n\nEmerging from §Ylate 19th and early 20th century socialist movements§!, it developed as reformist currents within socialism gradually committed themselves to parliamentary participation and mass electoral politics. In the post-war period, it became associated with parties and movements that built welfare states while maintaining capitalist market structures under strong regulation and public sector expansion.\n\nIn its modern form, Democratic Socialism advocates for expansive public services, strengthened labor institutions, public or cooperative ownership of strategic industries, and robust social safety nets designed to reduce inequality and economic insecurity. Supporters view it as the democratic realisation of socialist principles within modern pluralistic societies, while critics argue it risks inefficiency and excessive state expansion."
 progressive_socialism:0 "Progressive Socialism"
 progressive_socialism_desc:0 "§YSocialism§! is a political ideology that advocates for the §Ycollective or public ownership§! of the means of production and the organization of the economy to serve society as a whole rather than private profit. Socialists believe that economic inequality created by capitalism can be reduced through democratic control of major industries, expanded workers' rights, and greater social ownership of economic resources.\n\nThe ideology emerged during the §YIndustrial Revolution§! in response to poor working conditions, rapid industrialization, and growing inequality. Throughout the nineteenth and twentieth centuries, socialism developed into many different schools of thought, ranging from democratic reformers seeking gradual change to revolutionary movements calling for the complete transformation of society.\n\nSocialists generally support a §Yplanned or mixed economy§!, universal public services, strong labor protections, public ownership of key industries, and broad social welfare programs. While methods differ between movements, socialism seeks to build a society where economic resources are distributed more equally and production is organized to meet the needs of the community."
 progressive_socialism_subideology_desc:0 "§YProgressive Socialism§! is a political tradition that blends socialist economic principles with a reform-oriented approach to governance, emphasizing the use of democratic institutions to steadily expand public ownership, labor rights, and social welfare. It seeks to transform economic structures through incremental but continuous policy change rather than abrupt systemic rupture.\n\nEmerging from the §Ylabor and reform movements of the late 19th and early 20th centuries§!, it developed as socialist parties and trade unions engaged with parliamentary systems, gradually shifting from revolutionary rhetoric toward practical legislative gains. In many contexts, it became associated with municipal socialism, welfare expansion, and state-led modernization projects aimed at improving living and working conditions.\n\nIn its modern form, Progressive Socialism supports strong labor unions, expanded public services, strategic public ownership in key sectors, progressive taxation, and regulatory oversight of private capital. Supporters view it as a realistic pathway toward socialist goals within democratic systems, while critics argue it can blur the line between reformist social democracy and full socialist transformation."
 revolutionary_socialist:0 "Revolutionary Socialism"
 revolutionary_socialist_desc:0 "§YSocialism§! is a political ideology that advocates for the §Ycollective or public ownership§! of the means of production and the organization of the economy to serve society as a whole rather than private profit. Socialists believe that economic inequality created by capitalism can be reduced through democratic control of major industries, expanded workers' rights, and greater social ownership of economic resources.\n\nThe ideology emerged during the §YIndustrial Revolution§! in response to poor working conditions, rapid industrialization, and growing inequality. Throughout the nineteenth and twentieth centuries, socialism developed into many different schools of thought, ranging from democratic reformers seeking gradual change to revolutionary movements calling for the complete transformation of society.\n\nSocialists generally support a §Yplanned or mixed economy§!, universal public services, strong labor protections, public ownership of key industries, and broad social welfare programs. While methods differ between movements, socialism seeks to build a society where economic resources are distributed more equally and production is organized to meet the needs of the community."
 revolutionary_socialist_subideology_desc:0 "§YRevolutionary Socialism§! is a political current that holds that capitalist systems cannot be fundamentally reformed through gradual legislation alone, and instead require a decisive break in political and economic structures to establish a new social order based on collective ownership and worker control. It views existing state institutions as deeply shaped by class power, and therefore insufficient as instruments of transformative change without radical reconstitution.\n\nEmerging from the §Yearly socialist and labour movements of the 19th century§!, it was shaped by industrial unrest, revolutionary theory, and the failures of early reform efforts to address entrenched inequality and exploitation. Throughout the 20th century, it became associated with movements that sought to replace parliamentary capitalism with systems of planned economy and mass political mobilisation.\n\nIn its modern form, Revolutionary Socialism encompasses a range of tendencies unified by the belief in systemic rupture rather than incremental reform, advocating for the reorganisation of production, redistribution of property, and restructuring of state authority in favour of collective control. Supporters view it as the only viable path to overcoming structural inequality, while critics argue it risks instability and authoritarian outcomes during periods of transition."
 left_peronist:0 "Peronism"
 left_peronist_desc:0 "§YSocialism§! is a political ideology that advocates for the §Ycollective or public ownership§! of the means of production and the organization of the economy to serve society as a whole rather than private profit. Socialists believe that economic inequality created by capitalism can be reduced through democratic control of major industries, expanded workers' rights, and greater social ownership of economic resources.\n\nThe ideology emerged during the §YIndustrial Revolution§! in response to poor working conditions, rapid industrialization, and growing inequality. Throughout the nineteenth and twentieth centuries, socialism developed into many different schools of thought, ranging from democratic reformers seeking gradual change to revolutionary movements calling for the complete transformation of society.\n\nSocialists generally support a §Yplanned or mixed economy§!, universal public services, strong labor protections, public ownership of key industries, and broad social welfare programs. While methods differ between movements, socialism seeks to build a society where economic resources are distributed more equally and production is organized to meet the needs of the community."
 left_peronist_subideology_desc:0 "§YPeronism§! is a broad political movement centred on the principles of social justice, economic sovereignty, and national unity, rejecting rigid ideological divisions in favour of a pragmatic approach that places the interests of the nation and its working population above partisan doctrine. It views the state as the primary mediator between labour, capital, and society, seeking cooperation rather than class conflict while preserving national independence.\n\nEmerging in the §Ymid-20th century§! under the leadership of §YJuan Perón§!, the movement transformed organised labour into a central pillar of political life and expanded workers' rights, welfare programmes, and state involvement in strategic sectors of the economy. Peronism developed into a uniquely adaptable tradition, encompassing diverse political currents while remaining united by its emphasis on popular legitimacy and national development.\n\nIts left-wing current places greater emphasis on wealth redistribution, expanded public ownership, labour empowerment, and social equality, often advocating stronger state intervention to address economic disparities. Supporters view it as a uniquely national path toward social justice and economic independence, while critics argue its ideological flexibility and personalist traditions can blur coherent policy and institutional accountability."
 authoritarian_socialist:0 "Authoritarian Socialism"
 authoritarian_socialist_desc:0 "§YSocialism§! is a political ideology that advocates for the §Ycollective or public ownership§! of the means of production and the organization of the economy to serve society as a whole rather than private profit. Socialists believe that economic inequality created by capitalism can be reduced through democratic control of major industries, expanded workers' rights, and greater social ownership of economic resources.\n\nThe ideology emerged during the §YIndustrial Revolution§! in response to poor working conditions, rapid industrialization, and growing inequality. Throughout the nineteenth and twentieth centuries, socialism developed into many different schools of thought, ranging from democratic reformers seeking gradual change to revolutionary movements calling for the complete transformation of society.\n\nSocialists generally support a §Yplanned or mixed economy§!, universal public services, strong labor protections, public ownership of key industries, and broad social welfare programs. While methods differ between movements, socialism seeks to build a society where economic resources are distributed more equally and production is organized to meet the needs of the community."
 authoritarian_socialist_subideology_desc:0 "§YAuthoritarian Socialism§! is a political current that seeks to establish collective ownership of the economy through a highly centralised state structure, where political authority is concentrated in order to direct rapid economic transformation and enforce systemic restructuring. It prioritises planning capacity, industrial coordination, and state control over production as necessary tools for achieving socialist objectives.\n\nEmerging in the §Yearly 20th century§! amid revolutions, civil conflicts, and state-building crises, it developed in contexts where socialist movements gained power under conditions of instability, external pressure, or institutional collapse. In these environments, centralised governance was often justified as a means of defending the revolution and accelerating economic modernisation.\n\nIn its modern form, Authoritarian Socialism emphasises state-directed economic planning, extensive public ownership, and disciplined administrative control over political and economic life. Supporters argue it enables rapid transformation and national development under difficult conditions, while critics contend it concentrates power excessively and restricts political pluralism in the name of economic equality."
 left_wing_nationalism:0 "Left-Wing Nationalism"
 left_wing_nationalism_desc:0 "§YSocialism§! is a political ideology that advocates for the §Ycollective or public ownership§! of the means of production and the organization of the economy to serve society as a whole rather than private profit. Socialists believe that economic inequality created by capitalism can be reduced through democratic control of major industries, expanded workers' rights, and greater social ownership of economic resources.\n\nThe ideology emerged during the §YIndustrial Revolution§! in response to poor working conditions, rapid industrialization, and growing inequality. Throughout the nineteenth and twentieth centuries, socialism developed into many different schools of thought, ranging from democratic reformers seeking gradual change to revolutionary movements calling for the complete transformation of society.\n\nSocialists generally support a §Yplanned or mixed economy§!, universal public services, strong labor protections, public ownership of key industries, and broad social welfare programs. While methods differ between movements, socialism seeks to build a society where economic resources are distributed more equally and production is organized to meet the needs of the community."
 left_wing_nationalism_subideology_desc:0 "§YLeft-Wing Nationalism§! is a political current that combines socialist economic principles with a strong emphasis on national sovereignty, cultural self-determination, and collective identity. It argues that genuine social and economic equality can only be achieved when a nation is free from external economic dependence and able to control its own strategic resources and industrial base.\n\nEmerging from §Yanti-colonial liberation movements§!, §Ylabor-based independence struggles§!, and §Yearly 20th-century revolutionary nationalist currents§!, it developed in regions where socialist organising became intertwined with resistance to imperial rule and foreign economic domination. In these contexts, national liberation and social transformation were often seen as inseparable goals.\n\nIn its modern form, Left-Wing Nationalism advocates for public ownership of key industries, strong labor protections, and redistributive economic policy alongside policies aimed at protecting domestic sovereignty, regulating global capital flows, and preserving national economic independence. Supporters view it as a synthesis of social justice and self-determination, while critics argue it can blur the line between emancipatory politics and exclusionary nationalism."
 bolivarianist:0 "Bolivarianism"
 bolivarianist_desc:0 "§YSocialism§! is a political ideology that advocates for the §Ycollective or public ownership§! of the means of production and the organization of the economy to serve society as a whole rather than private profit. Socialists believe that economic inequality created by capitalism can be reduced through democratic control of major industries, expanded workers' rights, and greater social ownership of economic resources.\n\nThe ideology emerged during the §YIndustrial Revolution§! in response to poor working conditions, rapid industrialization, and growing inequality. Throughout the nineteenth and twentieth centuries, socialism developed into many different schools of thought, ranging from democratic reformers seeking gradual change to revolutionary movements calling for the complete transformation of society.\n\nSocialists generally support a §Yplanned or mixed economy§!, universal public services, strong labor protections, public ownership of key industries, and broad social welfare programs. While methods differ between movements, socialism seeks to build a society where economic resources are distributed more equally and production is organized to meet the needs of the community."
 bolivarianist_subideology_desc:0 "§YBolivarianism§! is a political current that blends socialist economic principles with a strong emphasis on national sovereignty, anti-imperialism, and regional integration, drawing ideological inspiration from the legacy of §YSimón Bolívar§!. It frames political struggle as both a social question of inequality and a geopolitical question of independence from external influence.\n\nEmerging most prominently in §YLatin America during the late 20th and early 21st centuries§!, Bolivarianism developed in response to economic instability, structural inequality, and perceived foreign intervention in domestic affairs. It became associated with mass electoral movements that sought to reassert state control over natural resources while expanding social welfare and political participation.\n\nIn its modern form, Bolivarianism advocates for redistributive economic policies, nationalisation of key industries, and expansive social programs alongside strong executive authority and regional diplomatic cooperation. Supporters view it as a path toward sovereignty and social justice, while critics argue it concentrates power in the executive and creates economic dependency on state-controlled sectors."
 marxist:0 "Marxism-Leninist"
 marxist_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 marxist_subideology_desc:0 "§YMarxism-Leninism§! is a political current that interprets socialist transformation through the framework of a disciplined revolutionary party, centralized state power, and the strategic use of state authority to restructure the economy and eliminate class-based exploitation. It holds that capitalism cannot be overcome through gradual reform alone, but requires the organised seizure and transformation of political power.\n\nEmerging in the §Yearly 20th century§! from the synthesis of §YKarl Marx’s theory§! and §YVladimir Lenin’s revolutionary practice§!, it developed in response to the perceived limitations of parliamentary socialism and the pressures of imperial competition, war, and state collapse. It became the guiding doctrine of several revolutionary states, shaping governance systems across Europe, Asia, and beyond.\n\nIn its modern ideological framing, Marxism-Leninism emphasises state-led economic planning, collective ownership of productive assets, and the central role of a vanguard party in directing political and economic development. Supporters view it as a necessary instrument for defending and advancing socialist transformation, while critics argue it concentrates authority excessively and restricts political pluralism in the pursuit of systemic change."
 leninist:0 "Leninism"
 leninist_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 leninist_subideology_desc:0 "§YLeninism§! is a political current that emphasises the role of a disciplined revolutionary vanguard in guiding the transition from capitalist society to a socialist state. It argues that spontaneous political movements alone are insufficient to overcome entrenched class structures, and that coordinated organisation, strategic leadership, and centralized decision-making are necessary to achieve and defend revolutionary change.\n\nEmerging in the §Yearly 20th century§! through the political thought and practice of §YVladimir Lenin§!, it developed in the context of imperial rivalry, industrial unrest, and state collapse. Leninism reinterpreted Marxist theory to address the conditions of semi-industrial and agrarian societies, placing particular importance on party organisation, revolutionary timing, and the seizure of state power as a prerequisite for systemic transformation.\n\nIn its modern conceptual form, Leninism is associated with strong party structures, centralised political authority during transitional periods, and state-directed economic planning aimed at restructuring ownership and production. Supporters view it as a pragmatic method for achieving socialist objectives under hostile conditions, while critics argue it concentrates political power in narrowly defined institutions and limits pluralism during and after revolutionary transition."
 stalinist:0 "Stalinism"
 stalinist_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 stalinist_subideology_desc:0 "§YStalinism§! is a political current that emphasizes rapid industrialisation, centralized economic planning, and strict consolidation of state authority as necessary instruments for building and defending a socialist system under conditions of external pressure and internal instability. It prioritises state capacity and administrative discipline as the foundation for transforming a largely agrarian or war-torn society into an industrialised planned economy.\n\nEmerging in the §Yearly 20th century§! under the leadership of §YJoseph Stalin§!, it developed as the Soviet state underwent accelerated industrial growth, collectivisation of agriculture, and intense geopolitical confrontation. Stalinism became associated with a model of governance in which economic planning, political control, and security structures were tightly integrated to enforce state objectives and manage rapid transformation.\n\nIn its modern ideological framing, Stalinism is associated with highly centralised governance, comprehensive state planning of economic activity, and prioritisation of industrial and military development. Supporters argue it enabled rapid modernisation and state survival in hostile conditions, while critics contend it concentrates power excessively and suppresses political pluralism in pursuit of strategic goals."
 maoist:0 "Neo-Maoism"
 maoist_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 maoist_subideology_desc:0 "§YNeo-Maoism§! is a political current that adapts Maoist revolutionary theory to contemporary conditions, emphasizing prolonged mass mobilisation, rural and urban dual-strategy organising, and sustained political struggle against entrenched elite structures. It frames revolution not as a single event, but as an ongoing process of social transformation rooted in continuous participation by the population.\n\nEmerging from §Y20th-century Maoist movements§! and later reinterpreted by post-industrial and developing-world revolutionary groups, Neo-Maoism draws on the legacy of §YMao Zedong’s§! emphasis on mass line politics, agrarian mobilisation, and the strategic importance of decentralised revolutionary bases. In modern reinterpretations, it is often adapted to urban inequality, informal labour, and globalised economic structures.\n\nIn its contemporary form, Neo-Maoism advocates for sustained mass organising, strong ideological education, and the restructuring of political and economic systems through continuous revolutionary pressure rather than conventional parliamentary pathways. Supporters view it as a flexible framework for resisting entrenched inequality, while critics argue it risks perpetuating permanent mobilisation politics and undermining stable institutional governance."
 anarchist:0 "Anarchism"
 anarchist_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 anarchist_subideology_desc:0 "§YAnarchism§! is a political current that rejects hierarchical authority in all its forms, arguing that coercive institutions such as the state, centralized bureaucracy, and concentrated capital are inherently incompatible with genuine social freedom. It envisions a society organized through voluntary association, mutual aid, and decentralized forms of collective decision-making.\n\nEmerging in the §Y19th century§! alongside early socialist and labour movements, Anarchism developed through the writings and activism of thinkers and organisers who challenged both capitalist exploitation and authoritarian interpretations of socialism. It played a significant role in labour struggles, revolutionary movements, and anti-authoritarian uprisings across Europe and beyond.\n\nIn its modern form, Anarchism encompasses a range of tendencies unified by skepticism toward centralized power and emphasis on horizontal organisation, direct action, and grassroots self-management. Supporters view it as the most consistent expression of political freedom and equality, while critics argue it struggles to maintain stability and large-scale coordination without formal institutions of authority."
 anarcho_communist:0 "Anarcho-Communism"
 anarcho_communist_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 anarcho_communist_subideology_desc:0 "§YAnarcho-Communism§! is a political current that seeks to establish a stateless and classless society based on collective ownership of the means of production, voluntary cooperation, and the abolition of hierarchical authority in both political and economic life. It rejects both capitalist markets and centralized state socialism in favour of decentralized, directly managed communal organisation.\n\nEmerging in the §Ylate 19th century§! from the intersection of anarchist theory and communist economic thought, it developed through revolutionary movements and labour struggles that emphasised both social equality and anti-authoritarian principles. Thinkers such as §YPeter Kropotkin§! were central in articulating its vision of mutual aid and federated communes as the basis of post-capitalist society.\n\nIn its modern form, Anarcho-Communism advocates for federations of self-managed communities, workplace collectives, and cooperative distribution systems organised through voluntary coordination rather than state planning. Supporters see it as the most complete synthesis of freedom and equality, while critics argue it faces persistent challenges in coordination, defence, and large-scale economic organisation."
 anarcho_syndycalist:0 "Anarchism"
 anarcho_syndycalist_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 anarcho_syndycalist_subideology_desc:0 "§YAnarcho-Syndicalism§! is a political current that seeks to replace both the state and capitalist ownership with a society organised through democratically controlled trade unions and worker federations. It holds that labour, as the foundation of all production, should directly manage economic life through decentralised, bottom-up coordination rather than hierarchical authority.\n\nEmerging in the §Yearly 20th century§! within European and Latin American labour movements, it developed through industrial strikes, revolutionary unionism, and mass worker organising. It gained particular influence in periods of intense labour conflict, where syndicates were seen not only as tools of resistance but as the building blocks of a future post-capitalist society.\n\nIn its modern form, Anarcho-Syndicalism advocates for workplace democracy, general strikes as a political tool, and federations of self-managed unions coordinating production and distribution. Supporters view it as a practical route to worker self-emancipation and economic democracy, while critics argue it may struggle with long-term coordination and large-scale economic planning without central authority."
 socialism_with_ccp:0 "Socialism with Chinese Characteristics"
 socialism_with_ccp_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 socialism_with_ccp_subideology_desc:0 "§YSocialism with Chinese Characteristics§! is a political current that integrates state-led socialist development goals with market mechanisms and gradual economic liberalisation under the continued leadership of a centralized ruling party. It prioritises long-term national development, industrial modernisation, and political stability while maintaining formal commitment to socialist principles and public ownership in key strategic sectors.\n\nEmerging from §Ylate 20th-century reforms in the People’s Republic of China§!, it developed as a pragmatic response to the limitations of rigid central planning and the need to accelerate economic growth in a rapidly globalising world. Under this model, market activity is permitted and encouraged within defined boundaries, while the state retains decisive control over strategic industries, finance, and long-term planning.\n\nIn its modern form, it emphasises state-guided capitalism, infrastructure-driven development, and strong administrative capacity to direct economic transformation. Supporters view it as a successful synthesis of socialist governance and market efficiency, while critics argue it concentrates political power and blurs the distinction between socialist planning and state-managed capitalism."
 trotskyist:0 "Trotskyism"
 trotskyist_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 trotskyist_subideology_desc:0 "§YTrotskyism§! is a political current that emphasises permanent revolution, arguing that socialist transformation cannot be confined within national borders and must develop through continuous international struggle against capitalist systems. It rejects the notion that socialism can be securely built in isolation, insisting instead on global revolutionary coordination as a prerequisite for long-term success.\n\nEmerging from the §Yearly 20th-century ideological disputes within the Soviet revolutionary movement§!, it developed around the theories of §YLeon Trotsky§!, particularly his critique of bureaucratic consolidation and his emphasis on internationalism over national state-building. Trotskyism became associated with opposition movements that challenged established communist leaderships and advocated for a return to revolutionary dynamism.\n\nIn its modern form, Trotskyism advocates for international working-class solidarity, democratic control within socialist organisations, and continuous revolutionary activity across national boundaries. Supporters view it as a corrective to bureaucratic stagnation within socialist states, while critics argue it can underestimate the practical constraints of governance and long-term state stability."
 xi_china:0 "State Authoritarianism"
 xi_china_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers' organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 xi_china_subideology_desc:0 "§YState Authoritarianism§! is a political current that concentrates political authority within a highly centralised party-state structure, prioritising national cohesion, long-term strategic planning, and administrative control over economic and social development. It emphasises political stability and institutional discipline as prerequisites for sustained modernisation and national strength.\n\nEmerging from §Ylate 20th and early 21st-century state reforms in China§!, it developed through a period of rapid industrialisation, global economic integration, and internal structural transformation. In this model, the state maintains decisive authority over strategic sectors, ideological direction, and key governance institutions while selectively utilising market mechanisms to support productivity and innovation.\n\nIn its contemporary form, State Authoritarianism is associated with strong central leadership, extensive bureaucratic capacity, and long-term national planning frameworks focused on technological advancement, infrastructure expansion, and geopolitical influence. Supporters view it as an effective model for achieving rapid development and state capacity, while critics argue it restricts political pluralism and concentrates power within a narrowly defined governing elite."
 syndicalism:0 "Syndicalism"
 syndicalism_desc:0 "§YCommunism§! is a political ideology that advocates for the abolition of §Yprivate ownership of the means of production§! and the creation of a §Yclassless, stateless society§! where wealth and resources are owned collectively. Communists believe that capitalism inevitably produces inequality, exploitation, and class conflict, and that these conditions can only be overcome through the replacement of the capitalist system with collective ownership and economic planning.\n\nThe ideology emerged during the §Ynineteenth century§!, most notably through the writings of Karl Marx and Friedrich Engels. During the twentieth century, communist movements came to power across much of Europe, Asia, and elsewhere, developing into a wide range of political systems and interpretations while remaining rooted in the goal of replacing capitalism with a socialist society leading ultimately to communism.\n\nCommunists generally support a §Yplanned economy§!, collective ownership of major industries, strong workers'organizations, universal public services, and the elimination of economic classes. While communist movements differ greatly in their methods and institutions, they share the objective of organizing society around collective ownership and social equality rather than private profit."
 syndicalism_subideology_desc:0 "§YSyndicalism§! is a political current that places organised labour unions at the centre of both economic and political life, arguing that workers should directly control production through federations of trade organisations. It rejects parliamentary mediation as the primary route to change, instead emphasising industrial action and workplace organisation as the foundation of systemic transformation.\n\nEmerging in the §Ylate 19th and early 20th centuries§!, Syndicalism developed within rapidly industrialising societies where expanding labour movements sought more direct control over working conditions and economic decision-making. It became closely associated with mass strikes, general strike theory, and the idea that workers’ organisations could evolve into the administrative structure of a post-capitalist society.\n\nIn its modern form, Syndicalism advocates for decentralised worker-run industries, coordinated through national or regional union federations, with production decisions made at the level of those directly engaged in labour. Supporters view it as a practical expression of economic democracy, while critics argue it struggles to maintain coordination and long-term strategic planning without centralised institutions."
