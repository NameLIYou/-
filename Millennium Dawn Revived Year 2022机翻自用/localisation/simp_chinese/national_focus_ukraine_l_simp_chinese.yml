l_simp_chinese:
 UKR_operation_spider_web_focus:0 "蛛网行动"
 UKR_operation_spider_web_focus_desc:0 "是时候将战火引向俄罗斯本土。只要战争局限在乌克兰境内，俄罗斯民众就会觉得战争十分遥远。若将战火带到俄罗斯本土，他们就将切身感受到战争带来的后果。"
 UKR_experts_in_drone_warfare_focus:0 "无人机作战专家"
 UKR_experts_in_drone_warfare_focus_desc:0 "有个点子，把炸弹绑在无人机上，飞过去撞向坦克，轰隆！——直接毁掉价值一百万美元的装备！而我们只花了一千美元。简直绝妙！"
 UKR_celebrate_heros_of_old:0 "追忆昔日英雄"
 UKR_celebrate_heros_of_old_desc:0 "我们民族的篇章由那些为自由而战的先辈书写。致敬过往的英雄，能够凝聚精神，支撑我们当下的抗争。"
 UKR_celebrate_ukrainian_culture:0 "弘扬乌克兰文化"
 UKR_celebrate_ukrainian_culture_desc:0 "乌克兰拥有璀璨丰厚的文化。理所当然，我们应当在国内外自豪地宣扬它。"
 UKR_stepan_bandera:0 "斯捷潘·班德拉"
 UKR_stepan_bandera_desc:0 "斯捷潘·班德拉象征着为乌克兰独立展开的绝不妥协的斗争。他的名字在许多人心中唤起强烈的爱国情怀。"
 UKR_symon_petlura:0 "西蒙·彼得留拉"
 UKR_symon_petlura_desc:0 "20世纪初，西蒙·彼得留拉为自由且主权完整的乌克兰奔走。缅怀他的功绩，我们便能联结起这一象征独立的精神符号。"
 UKR_factories_for_consumers:0 "消费品工厂"
 UKR_factories_for_consumers_desc:0 "为维持民众士气与社会稳定，我们必须发展消费品生产，保障全体乌克兰人的物资供给。"
 UKR_factories_for_consumers_2:0 "消费品工厂Ⅱ"
 UKR_factories_for_consumers_2_desc:0 "我们将继续扩张消费品工业，为本国公民带来稳定与繁荣。"
 UKR_factories_for_consumers_3:0 "消费品工厂Ⅲ"
 UKR_factories_for_consumers_3_desc:0 "消费品产业蓬勃发展，乌克兰人民终能享受经济增长与社会稳定带来的果实。"
 UKR_factories_for_military:0 "军工工厂"
 UKR_factories_for_military_desc:0 "火力决定我们的存亡。我们将扩张军工产业，为英勇的守卫者配备制胜装备。"
 UKR_factories_for_military_2:0 "军工工厂Ⅱ"
 UKR_factories_for_military_2_desc:0 "我们的国防工业实力持续增长。每一座新建工厂，都意味着前线能获得更多武器、弹药与补给。"
 UKR_factories_for_military_3:0 "军工工厂Ⅲ"
 UKR_factories_for_military_3_desc:0 "军工产业满负荷运转，乌克兰如今足以支撑长期军事行动，保障自身战略独立。"
 UKR_a_nation_fixed:0 "浴火新生的国家"
 UKR_a_nation_fixed_desc:0 "我们终于根除腐败，重建民众对国家机构的信任。乌克兰已然做好准备，作为一个公平正义的国家走向繁荣。"
 UKR_reach_out:0 "主动外交联络"
 UKR_reach_out_desc:0 "我们将与海外盟友及伙伴展开外交接触。团结与协作是我们求得生存的关键。"
 UKR_western_ambitions:0 "向西求索"
 UKR_western_ambitions_desc:0 "我们的未来属于西方。我们将深化与欧洲及自由世界在政治、经济、军事层面的一体化进程。"
 UKR_national_defense_university:0 "国防大学"
 UKR_national_defense_university_desc:0 "投资建设基辅国防大学，让我们的武装力量由训练有素、纪律严明的军官指挥，以应对现代战争的种种挑战。"
 UKR_educate:0 "爱国主义教育"
 UKR_educate_desc:0 "我们要教导青年珍视祖国，铭记为乌克兰的自由所做出的牺牲。"
 UKR_southern_thrust:0 "南向攻势"
 UKR_southern_thrust_desc:0 "南部地区关乎国家存亡。我们将集中力量收复沿海领土，重获黑海出海口。"
 UKR_northern_thrust:0 "北向攻势"
 UKR_northern_thrust_desc:0 "我们必须将目光投向北方，解放仍被占领的土地。乌克兰的每一寸国土都将被收复。"
 UKR_into_crimea:0 "进军克里米亚"
 UKR_into_crimea_desc:0 "时机终于到来。我们将收复克里米亚，让当地人民重新回归乌克兰的旗帜之下。"
 UKR_kursk:0 "库尔斯克方向"
 UKR_kursk_desc:0 "我军向库尔斯克推进——完成具有历史象征意义的逆转。乌克兰将战火深深燃入俄罗斯领土。"
 UKR_most_battlehardened:0 "身经百战的军队"
 UKR_most_battlehardened_desc:0 "曾直面超级大国，历经1945年以来欧洲规模最大的战争，我军已然成为全世界作战经验最丰富、实力强悍的军队之一。"
 UKR_reunite_moldova:0 "助力摩尔多瓦统一"
 UKR_reunite_moldova_desc:0 "协助摩尔多瓦完成统一，能够巩固我们的南部侧翼，削弱俄罗斯在该地区的影响力。"
 UKR_buy_leapords:0 "采购豹式坦克"
 UKR_buy_leapords_desc:0 "我们将向德国求取先进的豹式坦克，增强装甲师作战能力。"
 UKR_buy_bradleys:0 "采购布雷德利步战车"
 UKR_buy_bradleys_desc:0 "美制布雷德利步兵战车将大幅提升我军机械化作战能力。我们必须促成这批装备交付。"
 UKR_buy_abrams:0 "采购艾布拉姆斯坦克"
 UKR_buy_abrams_desc:0 "我们将与美国展开谈判，购入西方武库中战力顶尖的艾布拉姆斯坦克。"
 UKR_western_business:0 "引入西方资本"
 UKR_western_business_desc:0 "我们邀请西方企业与投资者来到乌克兰，推动现代化建设、创造就业岗位、拉动经济增长。"
 UKR_fix_our_roads:0 "修缮道路"
 UKR_fix_our_roads_desc:0 "国内大量乡村与地区道路老旧破损。修缮道路既能提振经济，也能提升机动能力。"
 UKR_stabilize_the_front:0 "稳固战线"
 UKR_stabilize_the_front_desc:0 "我们的首要任务是不惜一切代价阻挡敌军推进，稳住我方防御阵线。"
 combating_corruption:0 "打击腐败"
 combating_corruption_desc:0 "想要加入欧盟、构筑更加公平的未来，就必须铲除长期祸害本国的腐败顽疾。"
 UKR_judicial_reform:0 "司法改革"
 UKR_judicial_reform_desc:0 "健全的民主离不开公正独立的司法体系。我们将改革法院，重塑民众对司法的信任。"
 UKR_deepen_EU_integration:0 "深化欧盟一体化"
 UKR_deepen_EU_integration_desc:0 "一步一步向欧洲靠拢。通过深化政治与经济对接，乌克兰终将在欧盟诸国之中取得属于自己的席位。"
 join_eu:0 "加入欧洲联盟"
 join_eu_desc:0 "数十年来，乌克兰一直怀揣着加入欧洲大家庭的梦想。如今民主制度得到巩固，各项改革落地完成，这份梦想终于能够化为现实。"
 join_nato:0 "加入北约"
 join_nato_desc:0 "为震慑俄罗斯未来可能发起的侵略，保障本国人民安全，我们将正式加入北大西洋公约组织。"
 UKR_international_legion:0 "国际军团"
 UKR_international_legion_desc:0 "来自世界各地的志愿人员前来捍卫我们的民主。我们将把他们编为国际军团，与乌克兰士兵并肩作战。"
 UKR_victory:0 "战胜俄罗斯"
 UKR_victory_desc:0 "我们完成了不可能的伟业。冲破重重险阻击败俄罗斯，彻底挣脱莫斯科施加的枷锁。"
 UKR_lessons_of_war:0 "战争的经验教训"
 UKR_lessons_of_war_desc:0 "保卫祖国的历程带给我们无比宝贵的经验。我们精通现代战争，锻造出新一代经验丰富、应变灵活的士兵。"
 UKR_collaberate_with_free_russia:0 "自由俄罗斯军团"
 UKR_collaberate_with_free_russia_desc:0 "大批反抗普京暴政的俄罗斯勇士选择为自由而战。我们将把他们组建为自由俄罗斯军团，与乌克兰并肩作战。"
 UKR_wartime_factories:0 "战时工厂"
 UKR_wartime_factories_desc:0 "想要赢得战争就需要武器。想要武器，就必须自主生产。每一座新工厂，都让我们距离胜利更进一步。"
 UKR_deploy_national_guard:0 "部署国民警卫队"
 UKR_deploy_national_guard_desc:0 "国家正处在危机时刻。必须部署国民警卫队守卫城市、坚守防线，不惜一切代价保卫乌克兰。"
 UKR_the_invasion_begins:0 "入侵降临"
 UKR_the_invasion_begins_desc:0 "入侵已经开始。举国上下团结一致抵抗敌人，誓要守护乌克兰的每一寸土地。"
 UKR_Request_foreign_aid:0 "§3荣耀§! §Y乌克兰!§!"
 UKR_Request_foreign_aid_desc:0 "往昔，我们的祖先曾以寡敌众并取得胜利。如今战火来袭，泽连斯基总统呼吁自由世界再次为自由的捍卫者提供武器。我们绝不会默默接受失败。手握外国援助的武器，心怀先辈传承的意志，乌克兰必将屹立不倒。荣耀归于乌克兰！"
 UKR_leave:0 "§R任由乌克兰走向毁灭§!"
 UKR_leave_desc:0 "局势已经彻底失控，首都濒临陷落，泽连斯基总统做出了艰难的抉择，逃离本国。"
 UKR_accept_the_inevitable:0 "接受既定现实"
 UKR_accept_the_inevitable_desc:0 "城市化为废墟，军队土崩瓦解，国际援助摇摇欲坠。我们必须认清眼前的现实。继续战争只会带来更深重的苦难。我们将放下身段，提出和谈，保全国家残存的根基。"
 UKR_Emergency_Presidency:0 "§g满目疮痍的国度§!"
 UKR_Emergency_Presidency_desc:0 "俄罗斯速胜，强制和约签署之后，乌克兰仅剩下西部地区。基辅陷落，国家机构分崩离析，前总统彼得·波罗申科受命组建临时应急政府。"
 UKR_Destroyed_But_Still_Democratic:0 "国土残破，民主不灭"
 UKR_Destroyed_But_Still_Democratic_desc:0 "尽管大部分国土沦为废墟，外族占领的阴霾笼罩全国，但民主的火种仍在西乌克兰延续。直面绝望与威权的重压，我们依旧举行选举，重申人民的意志。国家机构饱受摧残，但我们对民主的信念坚不可摧。"
 UKR_Empowerd_President:0 "总统权力强化"
 UKR_Empowerd_President_desc:0 "国家饱受摧残，仅存西乌克兰领土处于我方控制之下。许多人认为当下不宜举行选举。我们需要一位强大果决的领导人带领国家走出混乱。我们将暂时中止民主流程，授予总统特殊权力，用以稳定国家秩序，应对未来重重挑战。"
 UKR_Third_Times_the_Charm:0 "三番角逐终登场"
 UKR_Third_Times_the_Charm_desc:0 "乌克兰山河破碎，民主制度岌岌可危，尤利娅·季莫申科重返政坛，再度角逐总统宝座。"
 UKR_Military_Candidat:0 "军人候选人"
 UKR_Military_Candidat_desc:0 "政客们互相推诿罪责、争论重建方案之时，有一人自战败的废墟之中脱颖而出，同时获得士兵与民众的信任——瓦列里·扎卢日内将军。他受人敬重、恪守纪律，不被政治博弈裹挟，为国家带来强盛、稳定与安全的愿景。临时大选临近，他正式参选。"
 UKR_Begin_Economic_Recovery:0 "开启经济复苏"
 UKR_Begin_Economic_Recovery_desc:0 "长年动荡与冲突让本国经济千疮百孔。是时候推行大刀阔斧的改革，吸引投资，重建工业与农业。优先振兴经济，为乌克兰繁荣稳定的未来打下根基。"
 UKR_Invest_In_Infrastructure:0 "重建立国根基"
 UKR_Invest_In_Infrastructure_desc:0 "现代化国家离不开完备的基础设施。道路、铁路与公用设施是商贸流转、军事后勤运转、国民安居乐业的命脉。大力投资基础设施，不仅可以刺激经济增长，还能提升国家韧性与互联互通水平。"
 UKR_Stimulate_The_Economy:0 "重启经济引擎"
 UKR_Stimulate_The_Economy_desc:0 "国家的生机离不开繁荣的经济。通过定向政府政策、对重点产业进行战略投资、扶持私营企业，我们推动经济高速增长，创造就业，提升全体乌克兰民众的生活水平。"
 UKR_Security_Guarantees:0 "谋求安全保障"
 UKR_Security_Guarantees_desc:0 "半数国土沦丧，入侵带来的伤痛历历在目，乌克兰必须阻止这一悲剧重演。季莫申科政府将展开外交行动，争取西方伙伴给出正式安全保证。"
 UKR_Rebuild_Our_Democracy:0 "§3重建民主制度§!"
 UKR_Rebuild_Our_Democracy_desc:0 "腹地沦陷，战争创伤尚未平复，许多人曾担忧乌克兰的民主将就此消亡。但在季莫申科的领导下，自由治理的国家机构正在恢复运转。议会重新召开会议，公民自由得到重申，腐败遭到肃清。民主熬过了战火，如今我们要让它变得比以往更加强大。"
 UKR_Defense_Through_Our_Allies:0 "依托盟友构建国防"
 UKR_Defense_Through_Our_Allies_desc:0 "乌克兰无法独自应对未来的威胁。虽然正式加入北约依旧存在政治阻力，但我们会深化与可靠伙伴的双边安全关系，强化军事合作、情报共享与武器输送。有强大盟友并肩，乌克兰再也不会孤立无援。"
 UKR_Constitutional_Amendments:0 "宪法修正案"
 UKR_Constitutional_Amendments_desc:0 "旧政府的垮台暴露了乌克兰民主体制深层的结构性缺陷。在季莫申科总统的主导下，一批宪法修正案被提上议程，强化文官管控，约束行政权力过度扩张，捍卫法治。"
 UKR_Turn_Aid_Into_Investment:0 "将援助转化为投资"
 UKR_Turn_Aid_Into_Investment_desc:0 "战败之后，大量外援涌入西乌克兰，但仅仅依靠援助无法维系一个国家。季莫申科政府推出大规模经济计划，把应急援助转变为长期投资。将资金投向基础设施、能源产业与私营企业，打造现代化、经济自立的乌克兰。"
 UKR_A_True_Part_Of_The_West:0 "真正融入西方世界"
 UKR_A_True_Part_Of_The_West_desc:0 "我们坚守民主价值观、推进经济改革、维护地区稳定的努力没有被无视。前期铺垫全部完成，乌克兰正式递交欧盟入盟申请。这不只是象征意义，更代表我们在经济、政治、文化层面回归欧洲大家庭。"
 UKR_The_General_Takes_Command:0 "将军执掌大权"
 UKR_The_General_Takes_Command_desc:0 "临时大选落下帷幕——人民选择了力量、稳定与秩序。瓦列里·扎卢日内将军就任总统，他并非传统政客，而是带领国家渡过生死危机的缔造者。文官机构满目疮痍，派系内斗声名扫地，扎卢日内执掌大权，重塑国家团结，从零开始重建乌克兰。"
 UKR_Fortress_Ukraine:0 "堡垒乌克兰"
 UKR_Fortress_Ukraine_desc:0 "战败的屈辱绝不能再度上演。我们要将西乌克兰改造为坚不可摧的堡垒，以钢筋混凝土与全民意志构筑屏障。加固边境防御、完善后勤保障、构建多层防线，任何未来的入侵者都将付出惨痛代价。这一次，乌克兰已然严阵以待。"
 UKR_Military_First:0 "全民武装的国度"
 UKR_Military_First_desc:0 "身处危机四伏的世界，国家安全高于一切。我们要把乌克兰打造为牢不可破的堡垒，将军事建设置于首位。从工业到教育，社会方方面面都要服务于同一个目标：打造一支强大守纪的武装力量，不惜一切代价捍卫国家主权。"
 UKR_Remember_Our_Lost_Brothers:0 "缅怀逝去的同胞"
 UKR_Remember_Our_Lost_Brothers_desc:0 "战争的伤痕刻骨铭心，深深烙印在整个民族心中。无数英勇儿女献出生命，守护我们的自由与未来。缅怀他们的牺牲是我们庄严的使命，让他们的事迹永世流传，激励后世。纪念他们的英勇，凝聚民族意志与团结。"
 UKR_Request_Remilitarization_of_Kyiv:0 "申请§R基辅重新军事化§!"
 UKR_Request_Remilitarization_of_Kyiv_desc:0 "旧条约条款致使本国首都基辅以及战略要地日托米尔地区处于非军事化状态。这项限制严重损害我国国防与主权。如今应当与俄罗斯联邦正式交涉，申请在上述领土全面恢复军事化，捍卫我们在本国国土之上自卫的权利。"
 UKR_Death_Or_Dishonor:0 "宁死毋辱"
 UKR_Death_Or_Dishonor_desc:0 "国土残缺，山河分裂，我们的同胞依旧生活在异族旗帜之下。外交呼吁与谨慎隐忍的时代已经结束。我们站在十字路口：要么万众一心，果断行动夺回本就属于我们的土地；要么就注定接受被奴役蒙受屈辱的未来。我们选择奋勇抗争，没有什么比祖国的统一与自由更加神圣。"
 UKR_Battle_The_Oligarchy:0 "对抗寡头集团"
 UKR_Battle_The_Oligarchy_desc:0 "长久以来，权势寡头带来的负面影响阻碍国家发展，他们手握巨额财富与人脉，操纵政治与经济谋求私利。此项国策标志着决定性的转折。我们将推行全方位改革"
 UKR_Battle_The_oligarchs:0 "对抗寡头集团"
 UKR_Battle_The_oligarchs_desc:0 "长久以来，权势寡头带来的负面影响阻碍国家发展，他们手握巨额财富与人脉，操纵政治与经济谋求私利。此项国策标志着决定性的转折。我们将推行全方位改革"
 UKR_Ukrainian_Armed_Forces:0 "§Y乌克兰武装力量§!"
 UKR_Ukrainian_Armed_Forces_desc:0 "乌克兰武装力量是国防的支柱。主权遭受威胁之际，我们必须现代化指挥体系，重整各旅编制，保证部队做好陆地、空中、海上多域作战准备。"
 UKR_Hard_Times:0 "艰难岁月"
 UKR_Hard_Times_desc:0 "乌克兰正处在最黑暗的时刻之一。经济承压，城市遭受威胁，民众意志备受考验。但只要团结一心、甘于牺牲，我们必将挺过难关，奋起反击。"
 UKR_Trucks_And_Trains:0 "战争机动运输"
 UKR_Trucks_And_Trains_desc:0 "后勤是一切战争行动的命脉。扩充卡车车队、提升铁路运力，保障前线部队获得坚守战线所需的武器、弹药与兵员补给。"
 UKR_Air_Defence:0 "守护城市"
 UKR_Air_Defence_desc:0 "敌军导弹与轰炸机威胁人口聚居地。我们必须投入资源建设防空系统，守护本国天空，保护城市免遭毁灭。"
 western_ambitions:0 "向西求索"
 western_ambitions_desc:0 "乌克兰处在"