 GATHERING_STORM_NAME:0 "地基崩裂"
 GATHERING_STORM_DESC：0 “世界正处于不确定的边缘。冷战后的平静已消退，取而代之的是日益严峻的挑战。中国影响力的增长、加深的政治分歧以及对长期民主规范信心的消退。随着旧有的确定性崩塌，前进的道路变得不明朗，全球力量的平衡悬而未决。”
 ENG_GATHERING_STORM_DESC：0 “英国正处于十字路口。脱欧持续带来的后果使国家陷入经济孤立和民粹主义抬头的困境。与美国的联盟，曾是英国外交政策的支柱，如今随着全球权力格局的变化而面临压力。与此同时，英国国内政治危机加剧，面临不满、经济不确定以及苏格兰争取独立的压力。”
 FRA_GATHERING_STORM_DESC：0 “法国正努力应对自己在日益分裂的欧洲中的定位。民粹主义的上升、经济停滞和日益加剧的社会动荡正威胁着法国共和国的稳定。随着欧洲面临内部危机，从难民危机到脱欧，法国在欧盟中的角色也受到质疑。法国政府必须决定是否能保持其在欧洲的传统领导地位，还是将迎来一个新的民族主义时代。”
 GER_GATHERING_STORM_DESC：0 “德国，作为欧洲的经济强国，正面临一个快速变化的世界。2020年代带来了新的挑战，尤其是气候变化和能源转型的压力。随着俄罗斯在乌克兰的战争扰乱了非洲大陆的能源安全，德国对俄罗斯天然气的依赖及其推动绿色能源转型的努力使其处于一个岌岌可危的境地。德国面临着在保持其作为欧盟核心角色的同时，在对俄罗斯的依赖之间取得微妙的挑战。”
 ITA_GATHERING_STORM_DESC：0 “意大利正面临经济增长缓慢、公共债务上升以及极右翼运动在欧洲日益增长的影响力。随着民粹主义的兴起，政治建制面临重大挑战。新冠疫情后的经济复苏依然脆弱，意大利必须决定是拥抱欧盟主导的改革，还是寻求一条更具民族主义色彩的新道路，这可能危及其在欧盟内的未来。”
 JAP_GATHERING_STORM_DESC：0 “随着中国影响力持续提升，日本作为全球经济领导者的地位正受到威胁。日本人口老龄化和经济停滞，正面临地区和全球变革带来的日益加剧的压力。此外，与中国因台湾海峡问题的紧张局势以及印太地区的军事扩张迫使日本重新考虑其和平主义立场。日本的未来可能依赖于重新思考其安全政策和战略联盟。”
 PRC_GATHERING_STORM_DESC：0 “中国崛起成为全球重要地位正在重塑国际秩序。在习近平主席的领导下，国家力图在经济、军事和外交上主导21世纪。然而，中国共产党面临挑战，从人口老龄化到国际社会对其人权记录和强硬外交政策的日益强烈反弹。全球密切关注中国在应对日益加剧的内部动荡以及美国及其盟友在印太地区日益增长的影响力的同时，扩大其“一带一路”倡议。”
 RAJ_GATHERING_STORM_DESC：0 “印度正处于成为全球超级大国的门槛上。凭借年轻且不断增长的人口、蓬勃发展的科技产业和强大的军队，印度有潜力重塑全球地缘政治格局。然而，其内部分裂因宗教和民族紧张而加剧，这对其稳定性构成挑战。随着与邻国巴基斯坦和中国的紧张局势加剧，印度的民主结构正受到考验。印度能否在管理这些威胁的同时，利用自身增长，并保持其作为亚洲领先大国的角色？”
 SOV_GATHERING_STORM_DESC：0 “在普京总统领导下的俄罗斯联邦，寻求在2020年代重新夺回其昔日的全球影响力。俄罗斯在乌克兰的军事行动重新点燃了与西方的紧张关系，使俄罗斯与北约和欧盟采取了更加对立的态度。在国内，政治反对派被镇压，经济制裁对俄罗斯经济造成沉重压力。然而，俄罗斯试图将自己作为西方制衡力量的野心依然强烈，尽管其与中国的关系日益紧张。”
 SWE_GATHERING_STORM_DESC：0 “瑞典长期以来一直是稳定与繁荣的典范，但2020年代带来了新的挑战。经济停滞、移民上升和日益加剧的政治极化威胁着瑞典曾经不可触碰的福利国家。随着与俄罗斯和北约的紧张关系加剧，该国的军事中立性日益受到质疑。瑞典必须思考，在适应快速变化的世界的同时，能否保持其传统社会模式。”
 USA_GATHERING_STORM_DESC：0 “美国，曾经无可争议的全球领导者，如今在2020年代面临重大挑战。中国的崛起、政治体系的分裂以及公众对机构信任的流失，震撼了美国政治格局。随着美国努力寻找统一的外交政策，其国内动荡也在不断加剧。美国将如何应对日益加剧的社会动荡、加剧的种族紧张局势，以及日益挑战其作为世界超级大国角色的全球秩序的要求？”
 SAF_GATHERING_STORM_DESC：0 “南非正处于十字路口。多年的腐败、不平等和经济停滞侵蚀了人们对政府的信心。轮流停电、高失业率和社会动荡困扰着全国，地区紧张局势持续加剧，极端主义运动也日益壮大。非国大依然掌权，但其权威脆弱。从民主改革派到激进共产主义者和阿非利卡民族主义者，政治派别都在为争取未来而布局。风暴正在聚集，南非的下一章充满不确定性。”
 PER_GATHERING_STORM_DESC：0 “伊斯兰共和国仍在多年制裁、抗议和地区孤立中挣扎，正处于十字路口。最高领袖阿里·哈梅内伊在努力平衡改革压力与强硬控制，而外国势力持续施加经济和政治压力。随着国内不稳定酝酿，国外紧张局势加剧，伊朗必须决定是改革、抵抗还是再次点燃该地区。”
 OTHER_GATHERING_STORM_DESC：0 “世界被20世纪的巨大战争和冲突塑造，如今带着过去的伤痕进入2020年代。气候变化、网络安全威胁、大流行病和政治极化只是人类面临的一些挑战。未来充满不确定性，世界必须为冲突、合作和深刻变革的新时代做好准备。”
