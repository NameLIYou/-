l_simp_chinese:
 BM_HISTORY_TITLE:0 "历史简介"
 GATHERING_STORM_NAME:0 "地基崩裂"
 GATHERING_STORM_DESC:0 "The world stands on the edge of uncertainty. The calm after the Cold War has faded, replaced by mounting challenges. China’s growing influence, deepening political divides, and fading faith in long-standing democratic norms. As old certainties crumble, the path forward is unclear, and the balance of global power hangs in the balance."
 ENG_GATHERING_STORM_DESC:0 "The United Kingdom is at a crossroads. The ongoing consequences of Brexit have left the country struggling with economic isolation and rising populism. The alliance with the United States, once a pillar of British foreign policy, is now under strain as global power dynamics shift. Meanwhile, the UK's domestic political crisis deepens as it contends with the pressures of discontent, economic uncertainty, and Scotland's push for independence."
 FRA_GATHERING_STORM_DESC:0 "France is grappling with its place in an increasingly fractured Europe. Rising populism, economic stagnation, and increasing social unrest are threatening to destabilize the French Republic. As Europe faces internal crises and from the refugee crisis to Brexit—France’s role in the EU is being questioned. The French government must decide whether it can maintain its traditional leadership in Europe, or if a new era of nationalism will take hold."
 GER_GATHERING_STORM_DESC:0 "Germany, Europe's economic powerhouse, is confronting a rapidly changing world. The 2020s bring new challenges especially the pressures of climate change and energy transformation. As Russia's war in Ukraine disrupts the continent's energy security, Germany’s reliance on Russian gas and its push toward green energy transformation have put it in a precarious position. Germany faces the delicate task of navigating its dependence on Russia while preserving its role as the heart of the European Union."
 ITA_GATHERING_STORM_DESC:0 "Italy finds itself struggling with slow economic growth, rising public debt, and the growing influence of far-right movements across Europe. The political establishment faces significant challenges as populism gains ground. The economic recovery from COVID-19 remains fragile, and Italy must decide whether to embrace EU-driven reform or seek a new, more nationalistic path, potentially endangering its future within the Union."
 JAP_GATHERING_STORM_DESC:0 "Japan’s position as a global economic leader is under threat as China’s influence continues to rise. Japan’s aging population and stagnating economy face mounting pressure from both regional and global shifts. In addition, the tensions with China over the Taiwan Strait and military expansion in the Indo-Pacific force Japan to reconsider its pacifist stance. Japan’s future may rely on rethinking its security policies and strategic alliances."
 PRC_GATHERING_STORM_DESC:0 "China’s rise to global prominence is reshaping the international order. Under President Xi Jinping’s leadership, the country seeks to dominate the 21st century economically, militarily, and diplomatically. Yet, the Chinese Communist Party faces challenges, from an aging population to increasing international pushback on its human rights record and assertive foreign policy. The world watches closely as China looks to expand its Belt and Road Initiative while managing growing internal unrest and the increasing influence of the U.S. and its allies in the Indo-Pacific."
 RAJ_GATHERING_STORM_DESC:0 "India stands at the precipice of becoming a global superpower. With a youthful, growing population, a thriving tech industry, and a strong military, India has the potential to reshape global geopolitics. However, its internal divisions is fueled by religious and ethnic tensions present challenges to its stability. As tensions rise with neighboring Pakistan and China, India’s democratic fabric is being tested. Can India harness its growth while managing these threats and maintaining its role as a leading power in Asia?"
 SOV_GATHERING_STORM_DESC:0 "The Russian Federation, under President Vladimir Putin, seeks to reclaim its former global influence in the 2020s. Russia's military actions in Ukraine have reignited tensions with the West, pushing Russia into a more adversarial stance with NATO and the European Union. Domestically, the political opposition is being crushed, and economic sanctions weigh heavily on Russia’s economy. However, Russia's ambitions to assert itself as a counterbalance to the West remain strong, even as its relationship with China becomes more critical."
 SWE_GATHERING_STORM_DESC:0 "Sweden has long been a model of stability and prosperity, but the 2020s bring new challenges. Economic stagnation, rising immigration, and growing political polarization threaten to undermine Sweden’s once untouchable welfare state. The country’s military neutrality is increasingly questioned, especially as tensions with Russia and NATO rise. Sweden must grapple with whether it can maintain its traditional social model while adapting to a world that is rapidly changing."
 USA_GATHERING_STORM_DESC:0 "The United States, once the undisputed global leader, now faces significant challenges in the 2020s. The rise of China, a fracturing political system, and the erosion of public trust in institutions have rocked the American political landscape. As the U.S. struggles to find a cohesive foreign policy, its domestic turmoil continues to grow. How will America handle rising social unrest, increased racial tensions, and the demands of a global order that increasingly challenges its role as the world's superpower?"
 SAF_GATHERING_STORM_DESC:0 "South Africa stands at a crossroads. Years of corruption, inequality, and economic stagnation have eroded faith in the government. Rolling blackouts, high unemployment, and social unrest plague the nation, while regional tensions simmer and extremist movements gain traction. The ANC remains in power, but its authority is fragile. Political factions — from democratic reformers to radical communists and Afrikaner nationalists are positioning themselves to seize the future. The storm is gathering, and South Africa’s next chapter is uncertain."
 PER_GATHERING_STORM_DESC:0 "Still reeling from years of sanctions, protests, and regional isolation, the Islamic Republic stands at a crossroads. Supreme Leader Ali Khamenei struggles to balance reformist pressures and hardline control, while foreign powers continue to exert economic and political pressure. With instability brewing at home and tensions rising abroad, Iran must decide whether to reform, resist, or ignite the region once again."
 OTHER_GATHERING_STORM_DESC:0 "The world, shaped by the 20th century’s great wars and conflicts, now enters the 2020s with the scars of its past. Climate change, cybersecurity threats, pandemics, and political polarization are only some of the challenges humanity faces. The future is uncertain, and the world must prepare for a new era of conflict, cooperation, and profound change."
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$"
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$$DESC|$\n$TRAITS_DESC|$"
 SPR_GATHERING_STORM_DESC:0 "Spain, after years of economic turmoil and political fragmentation, is facing a new era of uncertainty. The rise of populism and economic recovery from the COVID-19 pandemic have sparked intense debates on Spain’s future direction. Catalonia’s separatist movements continue to challenge national unity, while Spain tries to balance its EU membership with rising political instability. Spain faces a defining moment can it remain a key player in Europe while managing its internal divisions?"
 UKR_GATHERING_STORM_DESC:0 "Ukraine stands at a critical juncture in its history. After decades of struggling with corruption, political instability, and economic challenges, the Russian invasion of Ukraine in 2022 has brought the country to the forefront of global attention. Ukraine is now locked in a fierce struggle for its sovereignty and territorial integrity. The war with Russia has devastated the nation, but it has also sparked a new sense of unity and resilience among the Ukrainian people."
 PRK_GATHERING_STORM_DESC:0 "Born from the ruins of the Korean War and shaped by the Cold War, North Korea has survived against the odds through strict state control and ideology. The Democratic People's Republic of Korea operates like a real life example of 1984, with total surveillance, propaganda, and unquestioned loyalty demanded of its citizens. The regime faces constant tension with South Korea, which it considers an illegal state imposed by foreign powers. Despite economic hardship and international isolation, North Korea prioritizes military strength and national self reliance above all else."
 HAM_GATHERING_STORM_DESC:0 "Palestine stands at the crossroads of conflict and resistance. With Hamas firmly entrenched in Gaza and exerting growing influence over Palestinian politics, the region remains locked in a cycle of confrontation with Israel. Economic hardship, international isolation, and internal divisions between factions threaten to undermine any unified national strategy. As tensions flare and the prospect of open war looms, the leadership in Gaza must decide whether to pursue continued resistance, seek fragile unity with rival factions, or attempt to break free from isolation on the world stage."