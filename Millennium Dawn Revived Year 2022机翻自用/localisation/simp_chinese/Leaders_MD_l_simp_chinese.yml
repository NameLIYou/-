 KIM_JONG_UN_DESC:0 "Kim Jong Un was born on January 8, 1983, the youngest son of Kim Jong Il and the third member of the Kim dynasty to rule the Democratic People's Republic of Korea. Following his father's death in 2011, he rapidly consolidated power despite his young age, eliminating rivals and securing the loyalty of the Party and the Korean People's Army. Under his leadership, North Korea has expanded it's nuclear and missile programs."