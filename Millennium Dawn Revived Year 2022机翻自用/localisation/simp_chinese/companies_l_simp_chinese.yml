l_simp_chinese:
 bae_systems:0 "BAE系统公司"
 bae_systems_desc:0 "英国宇航电子系统是一家总部位于英国伦敦的全能军火企业。该公司虽主要深耕空战装备领域，但在陆战、海战以及网络空间军事技术方面同样拥有不俗实力。其知名产品包括阿尔维斯‑维克斯陆战装备、无敌级与伊丽莎白女王级航空母舰，以及BAe 146、BAe ATP、F‑35“闪电Ⅱ”战斗机，还有传奇的协和式客机。BAE系统公司是全球第二大军火企业。"
 nexter_desc:0 "奈克斯特是受法国国防部管控、由私人资本注资的法国军工集团。国营的GIAT工业因勒克莱尔坦克项目未能研发出能够抗衡艾布拉姆斯与豹2坦克的同级装备而陷入严重危机，此后奈克斯特应运而生。如今奈克斯特生产FAMAS步枪、APILAS反坦克火箭筒等知名步兵武器，继续量产勒克莱尔坦克、AMX‑30主战坦克、AMX‑10 RC轮式突击炮以及“凯撒”自行火炮。该企业与德国的KMW公司保持深度合作。"
 krauss_maffei_wegmann:0 "KMW"
 krauss_maffei_wegmann_desc:0 "克劳斯‑玛菲‑威格曼是一家总部坐落于巴伐利亚慕尼黑的德国军工有限责任公司。企业专注于陆战载具，核心招牌便是豹式坦克家族。该系列坦克不仅列装德国联邦国防军，也被世界多国军队所采用。除豹式坦克之外，其产品还包括ATF“野狗”装甲车、MARS火箭炮、AMPV多用途装甲车以及PzH‑2000自行榴弹炮。它与规模、业务领域相近的法国奈克斯特公司展开密切协作。"
 oto_melara:0 "奥托·梅莱拉"
 oto_melara_desc:0 "奥托·梅莱拉总部设于意大利拉斯佩齐亚，是一家军工制造企业。企业主业为舰载火炮，同时也涉足坦克研发制造。它研制过诸多军用装备，例如C‑1“公羊”主战坦克、OF‑40主战坦克、SIDAM‑25自行防空炮、“箭”式步兵战车、马林舰载武器系统、SCLAR‑H诱饵发射器等等。尽管在竞争激烈的欧洲市场处境略显艰难，但奥托·梅莱拉依旧具备强劲的经济实力。"
 mitsubishi:0 "三菱"
 mitsubishi_desc:0 "三菱虽以民用汽车业务为主，但自两次世界大战时期便设立军用载具生产部门。这家总部位于港区的企业主要制造坦克，产出过90式等日本主力坦克型号。在日本本土之外，三菱未能取得显著市场成果，其技术力量依旧主要用于为日本自卫队提供技术支持。"
 norinco:0 "北方工业"
 norinco_desc:0 "中国北方工业集团有限公司，简称北方工业，是总部设于中国北京的国有军工企业。业务涵盖弹药、火炮、战斗车辆等诸多品类。企业研发了从轻武器到主战坦克的大量装备，其中不少型号参考或借鉴西方设计；而近年推出的装备则拥有更多自主设计元素，例如QBZ‑95自动步枪与99式主战坦克。"
 cvrde:0 "CVRDE"
 cvrde_desc:0 "战斗车辆研发局是印度国防研究与发展组织下属科研机构，总部位于印度金奈。该机构尚未迎来自身发展巅峰，但已经完成M46坦克、国防研究与发展组织轻型坦克、BLT‑T‑72装甲架桥车等装备的研制工作。"
 uralvagonzavod:0 "乌拉尔机车车辆厂"
 uralvagonzavod_desc:0 "乌拉尔机车车辆厂是全球规模最大的坦克生产厂商，为部分国有持股的军工企业，坐落于下塔吉尔，始建于苏联时代。该厂先后研制T‑54A、T‑55、T‑62、T‑72、T‑90等坦克，直至今日仍为俄罗斯大批量生产坦克。"
 general_dynamics_land_systems:0 "通用动力陆战系统"
 general_dynamics_land_systems_desc:0 "通用动力陆战系统是美国弗吉尼亚州通用动力航空集团的陆战装备分部。通用动力虽以F‑16等喷气式战斗机闻名，但业务覆盖全部作战领域，是全球第五大防务承包商。"
 royal_navy:0 "皇家海军"
 royal_navy_desc:0 "皇家海军是英国武装力量的海军分支，主要基地位于英格兰南部朴茨茅斯。该海军时常为盟国海军以及英联邦前成员国海军提供协助。"
 la_royale:0 "法兰西皇家海军"
 la_royale_desc:0 "法国国家海军，有时被非正式称作“法兰西皇家海军”，是法兰西共和国的海上武装力量。法国时常派遣本国海军的承包商与理论专家，援助北非的前殖民地国家。"
 bundesmarine:0 "联邦德国海军"
 bundesmarine_desc:0 "德国海军，即联邦德国海军，是一支规模不大但富有创新能力的海岸防卫力量。德国对外军贸合作规模有限，不过该国能够研发颇具潜力的舰船原型，是十分优质的商业合作伙伴。"
 marina_militare:0 "意大利海军"
 marina_militare_desc:0 "意大利海军是意大利的海上军事力量，属于南欧实力最强的海军之一，常在地中海沿岸执行任务。意大利会向巴尔干半岛的盟友输出海军相关技术经验。"
 maritime_self_defense_force:0 "日本海上自卫队"
 maritime_self_defense_force_desc:0 "日本海上自卫队是西太平洋一支实力强劲的海上力量，在建造长航程高耐久舰船方面积累了深厚技术。日本常常同美国、韩国开展合作，以此制衡中国海军带来的威胁。"
 bharatiya_nau_sena:0 "印度海军"
 bharatiya_nau_sena_desc:0 "印度海军，梵语字面含义为“印度之海师”，是印度洋区域实力最强的海上武装力量，列装舰船与海军人员规模仍在持续扩张。"
 peoples_liberation_navy:0 "中国人民解放军海军"
 peoples_liberation_navy_desc:0 "中国人民解放军海军是各大国当中扩张速度最快的海军。中国在陆地与海洋层面均抱有宏大目标，一支强大海军是实现目标的重要基石。中国在海军装备发展领域与俄罗斯、朝鲜开展合作，也时常遭到日本与美国的敌视。"
 russian_navy:0 "俄罗斯海军"
 russian_navy_desc:0 "俄罗斯联邦海军是一支跨大洲的强大海上力量，但可用港口的数量与质量始终制约其发展。俄罗斯缺少实力强大的海军盟友，还要面对诸多实力优于自身的海上对手——或许引入新的承包商可以改变现状。"
 us_navy:0 "美国海军"
 us_navy_desc:0 "美国海军是全球经费最为充裕的军种。美国每年投入海军的经费轻松超过2000亿美元，已经高于其余所有国家全国军费的总和。美国海军拥有全世界最多的航空母舰，凭借庞大的武器储备与理论技术积淀，为全球诸多海上力量提供援助。"
 bae_systems_air:0 "BAE系统航空分部"
 bae_systems_air_desc:0 "英国宇航电子系统是一家总部位于英国伦敦的全能军火企业。作为全球规模最大的航空器制造商之一，BAE系统航空分部产出过F‑35战斗机、协和式客机等一众标志性航空器。"
 airbus:0 "空客"
 airbus_desc:0 "空中客车是总部设于法国图卢兹的民航飞机制造企业，在全球多地生产客运与军用飞机，产品销往海量客户。空客生产的宽体客机是航空工业的经典符号，A380便是人类有史以来体量最大的客机型号之一。"
 panavia:0 "帕纳维亚"
 panavia_desc:0 "帕纳维亚企业坐落于德国巴伐利亚哈尔贝格莫斯，是德、英、意三国联合组建的集团，为欧盟研发军用航空器，代表作便是帕纳维亚“狂风”战斗机。"
 leonardo_finmeccanica:0 "莱昂纳多‑芬梅卡尼卡"
 leonardo_finmeccanica_desc:0 "莱昂纳多‑芬梅卡尼卡总部设于意大利罗马，是意大利规模最大的航空器制造企业之一，专注防务与军用飞行器。意大利政府持有该企业三分之一股份。产品包括M‑346教练机、AW101直升机，甚至还有拉斐尔多用途后勤舱这类航天设备。"
 hindustan_aeronautics:0 "印度斯坦航空"
 hindustan_aeronautics_desc:0 "印度斯坦航空有限公司是印度国营企业，总部位于班加罗尔，业务聚焦军用航空装备。企业生产运输机、战斗机以及直升机，归印度国防部管辖，主要服务政府军事项目；同时也与不丹、孟加拉等周边国家存在合作。"
 mitsubishi_air:0 "三菱重工"
 mitsubishi_air_desc:0 "三菱是日本陆地与航空领域头部制造企业。旗下重工部门研发的航空器，大多针对太平洋海域的作战环境进行专门优化。"
 chengdu:0 "成飞集团"
 chengdu_desc:0 "成都飞机工业集团是一家军用飞机制造企业，1990年成立，总部位于中国四川省成都市。该企业研制过歼‑10、JF‑17等战机，在中国人民解放军空军内部的影响力正在不断提升。"
 mikoyan_gurevich:0 "米高扬"
 mikoyan_gurevich_desc:0 "米高扬‑格列维奇，常简称为米高扬，是人类历史上规模最大、最具标志性的飞机制造厂商之一。昔日米格战机与梅塞施密特战机沙场交锋，如今它则要同洛克希德·马丁这类企业同台竞技。米格‑29是米高扬最为知名的战斗机型号，当下企业正在开发其继任机型米格‑35。"
 lockheed_martin:0 "洛克希德·马丁"
 lockheed_martin_desc:0 "洛克希德·马丁总部位于马里兰州，是一家业务遍及全球的私人航空器制造企业，年营收可达500亿美元。产品主要供给美国各空军单位，代表装备为C‑130J“超级大力神”运输机。洛克希德·马丁同时谋求向航天领域拓展业务。"
